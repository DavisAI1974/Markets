name: BTC Collectors (durable)

# Runs BTC-USD spot collectors on Coinbase + Kraken AND BTC-USDT
# linear perp collector on Bybit, on GitHub's compute, independent
# of any local device. Persists bins to the `data/btc-bins` branch
# via force-push (cumulative state, no need for history).
#
# Schedule: every 6 hours. Each run collects for 5h50m, leaving ~10 min
# gap before next scheduled run. Public repo = unlimited minutes.
#
# Manual trigger via "Run workflow" button on Actions tab, or via API.
#
# Perp venue history: tried Binance USDT-M (fstream geo-blocked from
# GHA in practice — empty bins despite TLS reachability) and Kraken
# Futures v1 (only emits trade_snapshot on subscribe, no live trade
# updates — 99.5% empty bins). Both .py collectors are kept in the
# repo for reference but not executed in this workflow. Bybit V5 linear
# perp WS is the working venue (verified ~3-7 trade msgs/sec on BTC
# during normal hours, no geo restrictions on US/cloud egress).

on:
  schedule:
    - cron: '0 */6 * * *'   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Collection duration in seconds (default 5h50m=21000)'
        default: '21000'
        type: string
  push:
    branches:
      - claude/new-session-o3vnm
      - claude/continue-phase-2-pipeline-UFiGY
    paths:
      - '.github/workflows/btc_collectors_durable.yml'

permissions:
  contents: write

concurrency:
  group: btc-collectors
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # 5h55m, just under GitHub's 6hr hard limit

    steps:
      - name: Checkout code branch
        uses: actions/checkout@v4
        with:
          ref: claude/continue-phase-2-pipeline-UFiGY
          fetch-depth: 0   # need full history to access data branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet websockets numpy

      - name: Restore previous bins from data/btc-bins branch
        run: |
          # Bins are stored GZIPPED on the data branch (<f>.json.gz) so they stay under GitHub's
          # 100 MiB/file push limit (raw btc_coinbase_bins.json had grown to 103 MB -> every push
          # was rejected, stalling collection). Collectors still read/write raw .json locally;
          # we gunzip on restore and gzip on push. Falls back to legacy raw .json for the migration.
          if git ls-remote --exit-code --heads origin data/btc-bins > /dev/null 2>&1; then
            echo "[restore] data branch exists; fetching"
            git fetch origin data/btc-bins
            for f in btc_coinbase_bins btc_kraken_bins btc_bybit_perp_bins; do
              if git checkout origin/data/btc-bins -- "$f.json.gz" 2>/dev/null; then
                gunzip -f "$f.json.gz" && echo "[restore] $f from .gz"
              elif git checkout origin/data/btc-bins -- "$f.json" 2>/dev/null; then
                echo "[restore] $f from legacy raw .json (will migrate to .gz on push)"
              else
                echo "[restore] no prior $f on data branch yet"
              fi
            done
          else
            echo "[restore] data branch does not exist; first run, starting fresh"
          fi
          ls -la btc_*_bins.json 2>&1 || echo "[restore] no bins files present"

      - name: Connectivity check
        run: |
          curl -sS --max-time 5 -o /dev/null -w "Coinbase WS:    %{http_code}\n" https://ws-feed.exchange.coinbase.com/ || true
          curl -sS --max-time 5 -o /dev/null -w "Kraken spot WS: %{http_code}\n" https://ws.kraken.com/ || true
          curl -sS --max-time 5 -o /dev/null -w "Bybit linear:   %{http_code}\n" https://stream.bybit.com/ || true

      - name: Run BTC collectors in parallel
        timeout-minutes: 350
        run: |
          DURATION="${{ github.event.inputs.duration_seconds || '21000' }}"
          echo "[run] starting collectors for ${DURATION}s on $(date -u)"
          python coinbase_btcusd_collector.py --duration $DURATION --bins-path btc_coinbase_bins.json > /tmp/cb_btc.log 2>&1 &
          CB_PID=$!
          python kraken_btcusd_collector.py --duration $DURATION --bins-path btc_kraken_bins.json > /tmp/kr_btc.log 2>&1 &
          KR_PID=$!
          python bybit_btcusdt_perp_collector.py --duration $DURATION --bins-path btc_bybit_perp_bins.json > /tmp/by_btc_perp.log 2>&1 &
          BY_PID=$!
          echo "[run] CB PID=$CB_PID, KR PID=$KR_PID, BY-perp PID=$BY_PID"
          wait $CB_PID; CB_EXIT=$?
          wait $KR_PID; KR_EXIT=$?
          wait $BY_PID; BY_EXIT=$?
          echo "[run] CB exit=$CB_EXIT, KR exit=$KR_EXIT, BY-perp exit=$BY_EXIT"
          echo ""
          echo "=== Coinbase BTC log tail ==="
          tail -30 /tmp/cb_btc.log
          echo ""
          echo "=== Kraken BTC log tail ==="
          tail -30 /tmp/kr_btc.log
          echo ""
          echo "=== Bybit BTC-PERP log tail ==="
          tail -30 /tmp/by_btc_perp.log

      - name: Bin file stats
        if: always()
        run: |
          for f in btc_coinbase_bins.json btc_kraken_bins.json btc_bybit_perp_bins.json; do
            if [ -f "$f" ]; then
              SIZE=$(stat -c%s "$f")
              N_BINS=$(python -c "import json,sys; print(len(json.load(open(sys.argv[1]))))" "$f" 2>/dev/null || echo "?")
              echo "$f: $SIZE bytes, $N_BINS bins"
            fi
          done

      - name: Commit bins to data/btc-bins branch (force-push, history-less)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          mkdir -p /tmp/bins
          cp btc_coinbase_bins.json /tmp/bins/ 2>/dev/null || true
          cp btc_kraken_bins.json /tmp/bins/ 2>/dev/null || true
          cp btc_bybit_perp_bins.json /tmp/bins/ 2>/dev/null || true

          # Guardrail (anti-clobber): this step is `if: always()` and force-pushes,
          # so a crashed/partial collector run must NOT overwrite good cumulative
          # seconds. The durable pattern restores+appends, so a healthy file is
          # always >= the data-branch copy. If a fresh file regressed (fewer bins
          # than what's already on data/btc-bins), restore the data-branch copy so
          # the push preserves history instead of wiping it.
          # Data branch stores GZIPPED (<f>.json.gz); local files are raw .json.
          python - <<'PY'
          import json, subprocess, os, gzip
          BRANCH = "origin/data/btc-bins"
          FILES = ["btc_coinbase_bins.json", "btc_kraken_bins.json", "btc_bybit_perp_bins.json"]
          def count_raw(path):
              try:
                  with open(path) as f: return len(json.load(f))
              except Exception: return 0
          def old_branch(fn):
              # prefer gzipped copy; fall back to legacy raw for the migration run
              for ref in (fn + ".gz", fn):
                  try:
                      blob = subprocess.run(["git", "show", f"{BRANCH}:{ref}"],
                                            capture_output=True, check=True).stdout
                  except subprocess.CalledProcessError:
                      continue
                  try:
                      data = gzip.decompress(blob) if ref.endswith(".gz") else blob
                      return len(json.loads(data)), data
                  except Exception:
                      continue
              return 0, None
          for fn in FILES:
              newp = os.path.join("/tmp/bins", fn)
              new = count_raw(newp)
              old, data = old_branch(fn)
              if old and new < old:
                  with open(newp, "wb") as f: f.write(data)   # restore RAW (re-gzipped below)
                  print(f"[guardrail] {fn}: collected {new} bins < {old} on data branch "
                        f"-> RESTORED data-branch copy (no regression)")
              else:
                  print(f"[guardrail] {fn}: {new} bins (>= {old} on data branch) -> keep")
          PY

          # gzip each raw file -> <f>.json.gz (keeps pushes under GitHub's 100 MiB/file cap)
          for f in btc_coinbase_bins btc_kraken_bins btc_bybit_perp_bins; do
            [ -f "/tmp/bins/$f.json" ] && gzip -f "/tmp/bins/$f.json" && echo "[gzip] $f.json.gz $(stat -c%s /tmp/bins/$f.json.gz) bytes"
          done

          git checkout --orphan data/btc-bins-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/bins/*.json.gz . 2>/dev/null || true

          if ls *.json.gz > /dev/null 2>&1; then
            git add *.json.gz
            git commit -m "BTC bins update $(date -u +%Y-%m-%dT%H:%M:%SZ)" -m "Run: ${{ github.run_id }}"
            git push -f origin data/btc-bins-tmp:data/btc-bins
            echo "[commit] pushed gzipped bins to data/btc-bins"
          else
            echo "[commit] no bins to commit"
          fi

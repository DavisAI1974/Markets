name: NG Exhaustion Chain Phase2 Parallel Recurrence 20260818

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-chain-phase2-20260817
    paths:
      - research/ng_exhaustion_chain_phase2_parallel_agents_20260818.py
      - .github/workflows/ng_exhaustion_chain_phase2_parallel_recurrence_20260818.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASE_ID: '9281733364'
  BASE_SHA: f50eaf74a57654334691cbf5cce3b038443f6944a9c00eb5da6ca35b557802b1
  HELD_ID: '9281272840'
  HELD_SHA: 21577d01d45241264df714ab6ee5b95f6a774e1475e0d74a9454221fdfdde12e
  LINEAGE_ID: '9289929292'
  LINEAGE_SHA: a67caab9de6b183e8c102ebd73a7e542aa909e23f66575290563e40b056efd95
  RECONCILE_ID: '9306082330'
  RECONCILE_SHA: f17c130df029429bfbc35067d1cc9d16128ca4fb227dd37f3fb4fbb8bbaf8875

jobs:
  recurrence-agent:
    name: Recurrence agent - ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [pairings, extension, timing, investigator]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ng-exhaustion-chain-phase2-20260817
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install timing dependency
        run: python -m pip install --quiet numpy scikit-learn
      - name: Download and verify immutable source artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/in/base /tmp/in/held /tmp/in/lineage /tmp/in/reconcile
          get_artifact () {
            id="$1"; sha="$2"; zip="$3"; dest="$4"
            curl -L --fail --silent --show-error \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "${zip}"
            echo "${sha}  ${zip}" | sha256sum -c -
            unzip -q "${zip}" -d "${dest}"
          }
          get_artifact "${BASE_ID}" "${BASE_SHA}" /tmp/base.zip /tmp/in/base
          get_artifact "${HELD_ID}" "${HELD_SHA}" /tmp/held.zip /tmp/in/held
          get_artifact "${LINEAGE_ID}" "${LINEAGE_SHA}" /tmp/lineage.zip /tmp/in/lineage
          get_artifact "${RECONCILE_ID}" "${RECONCILE_SHA}" /tmp/reconcile.zip /tmp/in/reconcile
      - name: Run independent recurrence lane
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          python research/ng_exhaustion_chain_phase2_parallel_agents_20260818.py \
            --mode "${MODE}" \
            --base /tmp/in/base/NG_EXHAUSTION_CHAIN_CANONICAL_54W_BASE_20260817_EVENT_TABLE.jsonl.gz \
            --held /tmp/in/held/NG_EXHAUSTION_CHAIN_CANONICAL_HELD_WEEK_20260329_EVENT_TABLE.jsonl.gz \
            --base-lineage /tmp/in/lineage/NG_EXHAUSTION_CHAIN_PHASE1_LINEAGE_54W_20260817.instances.jsonl.gz \
            --held-lineage /tmp/in/reconcile/NG_EXHAUSTION_CHAIN_PHASE1_55W_RECONCILED_20260817_HELD_LINEAGE_INSTANCES.jsonl.gz \
            --summary /tmp/in/base/NG_EXHAUSTION_CHAIN_CANONICAL_54W_BASE_20260817_SUMMARY.json \
            --out "NG_EXHAUSTION_CHAIN_PHASE2_PARALLEL_${MODE^^}_20260818.json"
      - name: Verify no promotion boundary crossed
        env:
          MODE: ${{ matrix.mode }}
        run: |
          python - <<'PY'
          import glob,json
          p=glob.glob('NG_EXHAUSTION_CHAIN_PHASE2_PARALLEL_*_20260818.json')
          assert len(p)==1,p
          d=json.load(open(p[0]))
          assert d['status']=='PARALLEL_RECURRENCE_AGENT_COMPLETE'
          assert d['protected_mutations']['detector'] is False
          assert d['protected_mutations']['canonical_rows'] is False
          assert d['protected_mutations']['runway_clock'] is False
          assert d['protected_mutations']['permanent_frankie'] is False
          print(d['mode'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ng-exhaustion-phase2-recurrence-${{ matrix.mode }}-20260818
          path: NG_EXHAUSTION_CHAIN_PHASE2_PARALLEL_*_20260818.json
          if-no-files-found: error

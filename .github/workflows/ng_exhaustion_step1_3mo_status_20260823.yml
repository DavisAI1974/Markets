name: NG Exhaustion Step-1 Bounded Three-Month Status 20260823

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-step1-3mo-finalize-20260823
    paths:
      - .github/workflows/ng_exhaustion_step1_3mo_status_20260823.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      INSTANCE_ID: i-08cee7171c0a76a04
      CANDIDATE_SHA: 0d318335825b4a0e19a5a2881522f3da0374788e
      BRANCH: chatgpt/ng-exhaustion-step1-3mo-finalize-20260823
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Inspect exact three children read-only
        shell: bash
        run: |
          set -euo pipefail
          base="/mnt/markets/ng_exhaustion_step1_5y_20260822/$CANDIDATE_SHA"
          cat > /tmp/inspect.py <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          base=Path(os.environ['BASE'])
          segdir=base/'full'/'segments'
          candidate=os.environ['CANDIDATE_SHA']
          segments=['20210901_20211001','20211001_20211101','20211101_20211201']
          def fhash(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          def unit(name):
              p=subprocess.run(['systemctl','show',name,'--property=LoadState,ActiveState,SubState,MainPID','--no-pager'],capture_output=True,text=True)
              return {k:v for k,v in (line.split('=',1) for line in p.stdout.splitlines() if '=' in line)}
          children={}; common=None; all_ok=True
          for seg in segments:
              rp=segdir/f'{seg}.receipt.json'; sp=segdir/f'{seg}.seconds.jsonl.gz'
              row={'receipt_exists':rp.is_file(),'seconds_exists':sp.is_file(),'unit':unit(f'ng-exhaustion-step1-p3m-{seg}')}
              if rp.is_file():
                  try:
                      r=json.loads(rp.read_text())
                      body=dict(r); claimed=body.pop('receipt_sha256',None)
                      row.update({k:r.get(k) for k in ['status','receipt_sha256','source_manifest_sha256','source_scope','ruleset_sha256','engine_hashes','seconds_output','case_retention_policy','release_or_virgin_holdout_consumed','predictive_or_trading_experiment_run']})
                      row['receipt_self_hash_valid']=claimed==hashlib.sha256(json.dumps(body,sort_keys=True,separators=(',',':')).encode()).hexdigest()
                      common=r.get('engine_hashes') if common is None else common
                      row['engine_matches_first_child']=r.get('engine_hashes')==common
                  except Exception as exc:
                      row['receipt_parse_error']=f'{type(exc).__name__}: {exc}'
              if sp.is_file():
                  row['seconds_actual_gzip_sha256']=fhash(sp)
                  row['seconds_hash_valid']=(row.get('seconds_output') or {}).get('gzip_sha256')==row['seconds_actual_gzip_sha256']
              ok=(row.get('status')=='SEGMENT_COMPLETE' and row.get('receipt_self_hash_valid') is True and row.get('seconds_hash_valid') is True and row.get('engine_matches_first_child') is True and row.get('release_or_virgin_holdout_consumed') is False and row.get('predictive_or_trading_experiment_run') is False)
              row['complete_and_self_consistent']=bool(ok); all_ok=all_ok and bool(ok); children[seg]=row
          result={'schema':'NG_EXHAUSTION_STEP1_3MO_STATUS_V1_20260823','candidate_commit':candidate,'source_window':{'start':'2021-09-01','end_exclusive':'2021-12-01'},'exact_segments':segments,'segment_dir':str(segdir),'nproc':os.cpu_count(),'serial_controller':unit(f'ng-exhaustion-step1-{candidate[:12]}'),'children':children,'all_three_complete_and_self_consistent':all_ok,'common_child_engine_hashes':common,'raw_mbo_replayed':False,'frankie_launched':False}
          print(json.dumps(result,sort_keys=True))
          PY
          export BASE="$base"
          python - <<'PY'
          import json, os, shlex
          script=open('/tmp/inspect.py').read()
          cmd=f"BASE={shlex.quote(os.environ['BASE'])} CANDIDATE_SHA={shlex.quote(os.environ['CANDIDATE_SHA'])} python3 - <<'PYREMOTE'\n{script}\nPYREMOTE"
          json.dump({'commands':[cmd]},open('/tmp/params.json','w'))
          PY
          cid="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Read-only bounded Step-1 three-month status" --parameters file:///tmp/params.json --timeout-seconds 120 --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$cid" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' --output json > /tmp/result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('/tmp/result.json'))
          if r.get('Status')!='Success' or r.get('ResponseCode')!=0: raise SystemExit(r)
          lines=[x for x in r.get('StandardOutput','').splitlines() if x.strip().startswith('{')]
          if not lines: raise SystemExit(r)
          body=json.loads(lines[-1])
          Path('research/kalshi/NG_EXHAUSTION_STEP1_3MO_STATUS_20260823.json').write_text(json.dumps(body,indent=2,sort_keys=True)+'\n')
          PY

      - name: Retain status evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/kalshi/NG_EXHAUSTION_STEP1_3MO_STATUS_20260823.json
          git commit -m 'research: retain bounded Step-1 three-month status'
          git push origin HEAD:"$BRANCH"

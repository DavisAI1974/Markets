name: Frankie native knowledge refresh

on:
  pull_request:
    paths:
      - "research/kalshi/agents/frankie_native_raw_mbo_knowledge/**"
      - "research/kalshi/agents/frankie_native_raw_mbo_*20260828.md"
      - "research/kalshi/frankie_raw_mbo_benchmark/*POSITIVE*20260828.md"
      - "research/kalshi/frankie_raw_mbo_benchmark/ACLEAN_RT_ACTUAL_FRANKIE_*20260828.md"
      - "research/kalshi/frankie_raw_mbo_benchmark/native_frankie_knowledge_registry.py"
      - "research/kalshi/frankie_raw_mbo_benchmark/refresh_native_frankie_knowledge.py"
      - "research/kalshi/frankie_raw_mbo_benchmark/tests/test_native_frankie_knowledge_registry.py"
      - "research/kalshi/frankie_raw_mbo_benchmark/tests/test_refresh_native_frankie_knowledge.py"
      - ".github/workflows/frankie_native_knowledge_refresh_20260828.yml"
  push:
    branches:
      - "chatgpt/frankie-raw-mbo-benchmark-20260828"
    paths:
      - "research/kalshi/agents/frankie_native_raw_mbo_knowledge/**"
      - "research/kalshi/agents/frankie_native_raw_mbo_*20260828.md"
      - "research/kalshi/frankie_raw_mbo_benchmark/*POSITIVE*20260828.md"
      - "research/kalshi/frankie_raw_mbo_benchmark/ACLEAN_RT_ACTUAL_FRANKIE_*20260828.md"
      - "research/kalshi/frankie_raw_mbo_benchmark/native_frankie_knowledge_registry.py"
      - "research/kalshi/frankie_raw_mbo_benchmark/refresh_native_frankie_knowledge.py"
      - "research/kalshi/frankie_raw_mbo_benchmark/tests/test_native_frankie_knowledge_registry.py"
      - "research/kalshi/frankie_raw_mbo_benchmark/tests/test_refresh_native_frankie_knowledge.py"
      - ".github/workflows/frankie_native_knowledge_refresh_20260828.yml"
  workflow_dispatch:
    inputs:
      create_pull_request:
        description: "Regenerate knowledge and open a review PR when bytes change"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: frankie-native-knowledge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate deterministic knowledge
        run: |
          python research/kalshi/frankie_raw_mbo_benchmark/refresh_native_frankie_knowledge.py \
            --spec research/kalshi/agents/frankie_native_raw_mbo_knowledge/KNOWLEDGE_SOURCES_20260828.json \
            --repo-root . \
            --write

      - name: Validate generated knowledge and tests
        run: |
          python research/kalshi/frankie_raw_mbo_benchmark/refresh_native_frankie_knowledge.py \
            --spec research/kalshi/agents/frankie_native_raw_mbo_knowledge/KNOWLEDGE_SOURCES_20260828.json \
            --repo-root . \
            --check
          python -m unittest \
            research.kalshi.frankie_raw_mbo_benchmark.tests.test_native_frankie_knowledge_registry \
            research.kalshi.frankie_raw_mbo_benchmark.tests.test_refresh_native_frankie_knowledge \
            -v
          for profile in \
            RT_A_CLEAN_SECOND_PASS \
            RT_A_MEMORY_SECOND_PASS \
            FORECASTER_A_CLEAN_REVIEW \
            FORECASTER_A_MEMORY_REVIEW
          do
            python research/kalshi/frankie_raw_mbo_benchmark/native_frankie_knowledge_registry.py \
              --manifest research/kalshi/agents/frankie_native_raw_mbo_knowledge/KNOWLEDGE_MANIFEST_20260828.json \
              --repo-root . \
              --profile "$profile" \
              --bundle-out "/tmp/${profile}.md" \
              --receipt-out "/tmp/${profile}.json"
          done

      - name: Require committed generated bytes
        if: github.event_name != 'workflow_dispatch' || inputs.create_pull_request != true
        run: git diff --exit-code

  propose-refresh:
    if: github.event_name == 'workflow_dispatch' && inputs.create_pull_request == true
    needs: refresh-and-verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate deterministic knowledge
        run: |
          python research/kalshi/frankie_raw_mbo_benchmark/refresh_native_frankie_knowledge.py \
            --spec research/kalshi/agents/frankie_native_raw_mbo_knowledge/KNOWLEDGE_SOURCES_20260828.json \
            --repo-root . \
            --write

      - name: Create reviewed refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Knowledge is already current."
            exit 0
          fi
          branch="automation/frankie-knowledge-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add \
            research/kalshi/agents/frankie_native_raw_mbo_knowledge/A_CLEAN_POSITIVE_KNOWLEDGE_20260828.md \
            research/kalshi/agents/frankie_native_raw_mbo_knowledge/A_MEMORY_POSITIVE_KNOWLEDGE_20260828.md \
            research/kalshi/agents/frankie_native_raw_mbo_knowledge/KNOWLEDGE_MANIFEST_20260828.json
          git commit -m "docs: refresh Frankie native knowledge"
          git push origin "$branch"
          gh pr create \
            --base "chatgpt/frankie-raw-mbo-benchmark-20260828" \
            --head "$branch" \
            --title "docs: refresh Frankie native knowledge" \
            --body "Deterministic positive-knowledge capsule and manifest refresh. Review is required before promotion."

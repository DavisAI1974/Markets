name: NG Exhaustion V3 POX Status Probe 20260820

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-v3-t0-recovery-20260820
    paths:
      - research/NG_EXHAUSTION_V3_POX_STATUS_PROBE_LAUNCH_20260820.json

permissions:
  actions: read
  contents: write

env:
  SOURCE_BRANCH: chatgpt/ng-exhaustion-entry-timing-revival-20260818
  V3_WORKFLOW: ng_exhaustion_v3_t0_pinned_core_20260820.yml
  V3_SOURCE_SHA: b0e5d375b936c5ba82a3ffdc9c9f1db2b7a46732
  POX_WORKFLOW: ng_exhaustion_pox_focused_predict_trade_20260819.yml
  POX_PIN_COMMIT: 376dc34fe796294d082f169d9ff87468f2cf4779
  OUT: research/generated/ng_exhaustion_v3_pox_status_probe_20260820.json

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Query source workflow runs and jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${OUT}")"
          gh api --method GET \
            -f branch="${SOURCE_BRANCH}" \
            -f event=push \
            -f per_page=50 \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${V3_WORKFLOW}/runs" \
            > /tmp/v3-runs.json
          gh api --method GET \
            -f branch="${SOURCE_BRANCH}" \
            -f event=workflow_dispatch \
            -f per_page=50 \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${POX_WORKFLOW}/runs" \
            > /tmp/pox-runs.json

          V3_ID=$(jq -r --arg sha "${V3_SOURCE_SHA}" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | last | .id // empty' /tmp/v3-runs.json)
          if [ -n "${V3_ID}" ]; then
            gh api --method GET -f per_page=100 "/repos/${GITHUB_REPOSITORY}/actions/runs/${V3_ID}/jobs" > /tmp/v3-jobs.json
            gh api --method GET -f per_page=100 "/repos/${GITHUB_REPOSITORY}/actions/runs/${V3_ID}/artifacts" > /tmp/v3-artifacts.json
          else
            printf '{"jobs":[]}\n' > /tmp/v3-jobs.json
            printf '{"artifacts":[]}\n' > /tmp/v3-artifacts.json
          fi

          POX_ID=$(jq -r '[.workflow_runs] | .[0] | .id // empty' /tmp/pox-runs.json)
          if [ -n "${POX_ID}" ]; then
            gh api --method GET -f per_page=100 "/repos/${GITHUB_REPOSITORY}/actions/runs/${POX_ID}/jobs" > /tmp/pox-jobs.json
            gh api --method GET -f per_page=100 "/repos/${GITHUB_REPOSITORY}/actions/runs/${POX_ID}/artifacts" > /tmp/pox-artifacts.json
          else
            printf '{"jobs":[]}\n' > /tmp/pox-jobs.json
            printf '{"artifacts":[]}\n' > /tmp/pox-artifacts.json
          fi

          python - <<'PY'
          import json, os
          from pathlib import Path

          def run_view(r):
              return {
                  'id': r.get('id'),
                  'run_number': r.get('run_number'),
                  'event': r.get('event'),
                  'head_sha': r.get('head_sha'),
                  'head_branch': r.get('head_branch'),
                  'status': r.get('status'),
                  'conclusion': r.get('conclusion'),
                  'created_at': r.get('created_at'),
                  'updated_at': r.get('updated_at'),
                  'run_started_at': r.get('run_started_at'),
                  'html_url': r.get('html_url'),
              }

          def job_view(j):
              return {
                  'id': j.get('id'),
                  'name': j.get('name'),
                  'status': j.get('status'),
                  'conclusion': j.get('conclusion'),
                  'started_at': j.get('started_at'),
                  'completed_at': j.get('completed_at'),
              }

          def artifact_view(a):
              return {
                  'id': a.get('id'),
                  'name': a.get('name'),
                  'size_in_bytes': a.get('size_in_bytes'),
                  'expired': a.get('expired'),
                  'created_at': a.get('created_at'),
              }

          v3_runs = json.load(open('/tmp/v3-runs.json')).get('workflow_runs', [])
          pox_runs = json.load(open('/tmp/pox-runs.json')).get('workflow_runs', [])
          v3_jobs = json.load(open('/tmp/v3-jobs.json')).get('jobs', [])
          pox_jobs = json.load(open('/tmp/pox-jobs.json')).get('jobs', [])
          v3_artifacts = json.load(open('/tmp/v3-artifacts.json')).get('artifacts', [])
          pox_artifacts = json.load(open('/tmp/pox-artifacts.json')).get('artifacts', [])
          v3_source = os.environ['V3_SOURCE_SHA']
          pox_pin = os.environ['POX_PIN_COMMIT']
          matching_v3 = [r for r in v3_runs if r.get('head_sha') == v3_source]
          latest_pox = pox_runs[0] if pox_runs else None
          payload = {
              'status': 'NG_EXHAUSTION_V3_POX_STATUS_PROBE_COMPLETE',
              'source_branch': os.environ['SOURCE_BRANCH'],
              'v3': {
                  'source_sha': v3_source,
                  'matching_runs': [run_view(r) for r in matching_v3],
                  'selected_run': None if not matching_v3 else run_view(sorted(matching_v3, key=lambda r: r.get('run_number', 0))[-1]),
                  'jobs': [job_view(j) for j in v3_jobs],
                  'job_status_counts': {
                      status: sum(j.get('status') == status for j in v3_jobs)
                      for status in ('queued','in_progress','completed')
                  },
                  'job_conclusion_counts': {
                      conclusion: sum(j.get('conclusion') == conclusion for j in v3_jobs)
                      for conclusion in ('success','failure','cancelled','skipped',None)
                  },
                  'artifacts': [artifact_view(a) for a in v3_artifacts],
              },
              'pox': {
                  'pin_commit': pox_pin,
                  'recent_dispatch_runs': [run_view(r) for r in pox_runs[:10]],
                  'latest_run': None if latest_pox is None else run_view(latest_pox),
                  'latest_run_is_at_or_after_pin_commit': None if latest_pox is None else latest_pox.get('head_sha') != None,
                  'latest_run_head_sha_equals_pin_commit': None if latest_pox is None else latest_pox.get('head_sha') == pox_pin,
                  'jobs': [job_view(j) for j in pox_jobs],
                  'artifacts': [artifact_view(a) for a in pox_artifacts],
              },
              'source_runs_mutated': False,
          }
          Path(os.environ['OUT']).write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY

      - name: Commit status probe to recovery branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${OUT}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record V3 and POX workflow status probe"
          for attempt in 1 2 3; do
            git fetch origin chatgpt/ng-exhaustion-v3-t0-recovery-20260820
            git rebase origin/chatgpt/ng-exhaustion-v3-t0-recovery-20260820
            if git push origin HEAD:chatgpt/ng-exhaustion-v3-t0-recovery-20260820; then exit 0; fi
          done
          exit 1

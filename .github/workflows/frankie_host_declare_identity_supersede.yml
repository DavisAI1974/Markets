name: Frankie declare a cycle identity supersede on the native host
# After a host code advance the cycle coordinator refuses 'cycle request identity changed' because
# the saved binding pins the code hash. This declares, for one cycle, that the OLD code hash may be
# superseded by the current one (the coordinator still refuses any other difference and archives
# the old binding). Receipt into the day directory. Dispatch only; inputs reach the shell through env.
on:
  workflow_dispatch:
    inputs:
      instance:
        description: 'Native host instance id'
        required: false
        default: 'i-0e90ee6110ef609aa'
      day:
        description: 'Day whose run directory holds the cycle store'
        required: false
        default: '20211003'
      run_root:
        description: 'Day pipeline RunRoot on the host'
        required: false
        default: 'C:/Codex/Frankie-BOSS-20260919/days'
      tools_root:
        description: 'Host tools checkout'
        required: false
        default: 'C:/tools/Frankie-20260919/Markets'
      python:
        description: 'Host actual-run interpreter'
        required: false
        default: 'C:/Codex/Frankie-BOSS-20260919/actual-host-python/Scripts/python.exe'
      cycle_index:
        description: 'Zero-padded cycle index whose binding is superseded'
        required: false
        default: '00'
      supersede_principal:
        description: "true: also declare that the cycle's saved principal attachment and intent may be superseded so its request is rendered again (the run-findings ledger enters the prompt; Greg, 2026-09-20)"
        required: false
        default: 'false'
      reason:
        description: 'Why (goes into the declaration and the receipt)'
        required: true
permissions:
  contents: read
jobs:
  declare:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97
      - name: Declare the identity supersede over SSM
        env:
          INSTANCE: ${{ inputs.instance }}
          DAY: ${{ inputs.day }}
          RUN_ROOT: ${{ inputs.run_root }}
          TOOLS_ROOT: ${{ inputs.tools_root }}
          HOST_PYTHON: ${{ inputs.python }}
          CYCLE_INDEX: ${{ inputs.cycle_index }}
          REASON: ${{ inputs.reason }}
          SUPERSEDE_PRINCIPAL: ${{ inputs.supersede_principal }}
        run: |
          python deploy/aws/ssm_run_ps1.py \
            --instance "$INSTANCE" --region us-east-2 \
            --script deploy/aws/host/frankie_host_declare_identity_supersede.ps1 \
            --set "Day=$DAY" \
            --set "RunRoot=$RUN_ROOT" \
            --set "ToolsRoot=$TOOLS_ROOT" \
            --set "Python=$HOST_PYTHON" \
            --set "CycleIndex=$CYCLE_INDEX" \
            --set "Reason=$REASON" \
            --set "SupersedePrincipal=$SUPERSEDE_PRINCIPAL" \
            --timeout 600 --comment "declare cycle identity supersede for day $DAY"

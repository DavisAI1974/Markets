name: NG Exhaustion Repair Probe 20250629

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-aftermath-20260817
    paths:
      - .github/workflows/ng_exhaustion_repair_probe_20250629.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Databento dependency
        run: python -m pip install --quiet databento boto3
      - name: Probe existing completed jobs and fallback cost only
        run: |
          set -euo pipefail
          PYTHONPATH=research/kalshi python - <<'PY'
          import json
          import databento_backfill as dbf
          c=dbf._client()
          matches=[]
          for j in c.batch.list_jobs():
              if str(j.get('dataset'))!='GLBX.MDP3' or str(j.get('schema'))!='mbp-10':
                  continue
              syms=j.get('symbols') or []
              syml=[str(x).upper() for x in (syms if isinstance(syms,(list,tuple)) else [syms])]
              if not any(s.startswith('NG') for s in syml):
                  continue
              st=str(j.get('start',''))[:10]
              en=str(j.get('end',''))[:10]
              # Anything spanning the missing UTC Sunday 2025-06-29 can be re-decoded without a new paid pull.
              if st and en and st <= '2025-06-29' and en > '2025-06-29':
                  matches.append({k:j.get(k) for k in ('id','state','dataset','schema','symbols','stype_in','start','end','created_at')})
          costs={}
          for sym in ('NG.v.0','NG.n.0'):
              try:
                  costs[sym]=float(c.metadata.get_cost(dataset='GLBX.MDP3',symbols=[sym],stype_in='continuous',schema='mbp-10',start='2025-06-29',end='2025-06-30'))
              except Exception as e:
                  costs[sym]={'error':f'{type(e).__name__}: {e}'}
          out={'status':'PROBE_ONLY_NO_NEW_PULL','missing_date':'20250629','matching_existing_jobs':matches,'matching_job_count':len(matches),'fallback_one_day_cost_estimates_usd':costs}
          open('NG_EXHAUSTION_REPAIR_PROBE_20250629.json','w').write(json.dumps(out,indent=2,default=str)+'\n')
          print(json.dumps(out,indent=2,default=str))
          PY
      - name: Upload repair probe
        uses: actions/upload-artifact@v4
        with:
          name: ng-exhaustion-repair-probe-20250629
          path: NG_EXHAUSTION_REPAIR_PROBE_20250629.json
          if-no-files-found: error

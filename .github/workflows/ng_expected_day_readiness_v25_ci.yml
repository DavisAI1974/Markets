name: NG expected-day readiness v25

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - "research/kalshi/ng_corpus_expected_day_contract.py"
      - "research/kalshi/ng_historical_refinement_readiness_v25.py"
      - "research/kalshi/ng_historical_refinement_executor_v21.py"
      - "research/kalshi/tests/test_ng_expected_day_readiness_v25.py"
      - ".github/workflows/ng_expected_day_readiness_v25_ci.yml"
  pull_request:
    paths:
      - "research/kalshi/ng_corpus_expected_day_contract.py"
      - "research/kalshi/ng_historical_refinement_readiness_v25.py"
      - "research/kalshi/ng_historical_refinement_executor_v21.py"
      - "research/kalshi/tests/test_ng_expected_day_readiness_v25.py"
      - ".github/workflows/ng_expected_day_readiness_v25_ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile expected-day chain
        run: |
          python -m py_compile \
            ng_corpus_expected_day_contract.py \
            ng_historical_refinement_readiness_v25.py \
            ng_historical_refinement_executor_v21.py \
            tests/test_ng_expected_day_readiness_v25.py
      - name: Run module self-tests
        run: |
          python ng_corpus_expected_day_contract.py selftest
          python ng_historical_refinement_readiness_v25.py --selftest
      - name: Run focused tests
        run: python -m pytest -q tests/test_ng_expected_day_readiness_v25.py
      - name: Verify permanent authority wall
        run: |
          python - <<'PY'
          import ng_corpus_expected_day_contract as gate
          value = gate.build_contract(gate._selftest_spec())
          assert value["actual_outcomes_used"] is False
          assert value["paid_live_data_assumed"] is False
          assert value["random_shuffle_used"] is False
          assert value["one_signal_authority_preserved"] is True
          assert value["blind_forecasts_immutable"] is True
          assert value["may_update_ng_brain"] is False
          assert value["execution_authority"] is False
          assert value["cme_event_contracts_mode"] == "SHADOW"
          assert value["brokerage_contract"] == "tastytrade_not_ibkr"
          assert value["options_lane_started"] is False
          PY

name: ONE-SHOT APPROVED - Step-1 V6 resize to r6i.2xlarge 20260828
on:
  push:
    branches: [chatgpt/frankie-october-aws-readonly-20260824]
    paths: [.github/workflows/ng_exhaustion_step1_v6_resize_r6i_2xlarge_20260828.yml]
permissions:
  contents: read
jobs:
  resize:
    if: ${{ contains(github.event.head_commit.message, '[APPROVED_STEP1_V6_RESIZE_R6I_2XLARGE_20260828]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_DEFAULT_REGION: us-east-2
      INSTANCE_ID: i-08cee7171c0a76a04
      VOLUME_ID: vol-05a0b1e56f8c16478
      SNAPSHOT_ID: snap-028afdc9066adab30
      ORIGINAL_TYPE: r6i.xlarge
      TARGET_TYPE: r6i.2xlarge
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Preflight preservation and identity
        shell: bash
        run: |
          set -euo pipefail
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"
          current="$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[0].Instances[0].InstanceType' --output text)"
          volume="$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[0].Instances[0].BlockDeviceMappings[0].Ebs.VolumeId' --output text)"
          test "$current" = "$ORIGINAL_TYPE"
          test "$volume" = "$VOLUME_ID"
          snap_state="$(aws ec2 describe-snapshots --snapshot-ids "$SNAPSHOT_ID" --query 'Snapshots[0].State' --output text)"
          test "$snap_state" = completed
          az="$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[0].Instances[0].Placement.AvailabilityZone' --output text)"
          offered="$(aws ec2 describe-instance-type-offerings --location-type availability-zone --filters Name=location,Values="$az" Name=instance-type,Values="$TARGET_TYPE" --query 'length(InstanceTypeOfferings)' --output text)"
          test "$offered" != 0
          mem="$(aws ec2 describe-instance-types --instance-types "$TARGET_TYPE" --query 'InstanceTypes[0].MemoryInfo.SizeInMiB' --output text)"
          vcpu="$(aws ec2 describe-instance-types --instance-types "$TARGET_TYPE" --query 'InstanceTypes[0].VCpuInfo.DefaultVCpus' --output text)"
          test "$mem" = 65536
          test "$vcpu" = 8
          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment 'Read-only exact Step-1 process gate before V6 resize' --parameters 'commands=["python3 -c '\''import os; target=\"research/ng_exhaustion_mbo_2day_full_mbo_step1_20260825.py\"; m=[]; [(m.append((n,a)) if a and os.path.basename(a[0]).startswith(\"python\") and any(x == target or x.endswith(\"/\"+target) for x in a[1:]) else None) for n in os.listdir(\"/proc\") if n.isdigit() for a in [[x.decode(\"utf-8\",\"replace\") for x in open(\"/proc/\"+n+\"/cmdline\",\"rb\").read().split(b\"\\0\") if x]]]; print(\"EXACT_STEP1_PROCESS_COUNT=\"+str(len(m))); raise SystemExit(1 if m else 0)'\''"]' --timeout-seconds 120 --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || true
          status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text)"
          rc="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query ResponseCode --output text)"
          out="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text)"
          echo "$out"
          test "$status" = Success
          test "$rc" = 0
          grep -qx 'EXACT_STEP1_PROCESS_COUNT=0' <<<"$out"
          echo V6_RESIZE_PREFLIGHT=PASS
      - name: Resize same EBS-backed instance with rollback
        shell: bash
        run: |
          set -euo pipefail
          aws ec2 stop-instances --instance-ids "$INSTANCE_ID" --output json
          aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
          if ! aws ec2 modify-instance-attribute --instance-id "$INSTANCE_ID" --instance-type "{\"Value\":\"$TARGET_TYPE\"}"; then
            aws ec2 start-instances --instance-ids "$INSTANCE_ID" --output json || true
            exit 1
          fi
          if ! aws ec2 start-instances --instance-ids "$INSTANCE_ID" --output json; then
            aws ec2 modify-instance-attribute --instance-id "$INSTANCE_ID" --instance-type "{\"Value\":\"$ORIGINAL_TYPE\"}" || true
            aws ec2 start-instances --instance-ids "$INSTANCE_ID" --output json || true
            exit 1
          fi
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          if ! aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"; then
            aws ec2 stop-instances --instance-ids "$INSTANCE_ID" --output json || true
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID" || true
            aws ec2 modify-instance-attribute --instance-id "$INSTANCE_ID" --instance-type "{\"Value\":\"$ORIGINAL_TYPE\"}" || true
            aws ec2 start-instances --instance-ids "$INSTANCE_ID" --output json || true
            exit 1
          fi
          final="$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[0].Instances[0].InstanceType' --output text)"
          volume="$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[0].Instances[0].BlockDeviceMappings[0].Ebs.VolumeId' --output text)"
          test "$final" = "$TARGET_TYPE"
          test "$volume" = "$VOLUME_ID"
          for poll in $(seq 1 90); do
            ping="$(aws ssm describe-instance-information --filters Key=InstanceIds,Values="$INSTANCE_ID" --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || true)"
            if [ "$ping" = Online ]; then break; fi
            sleep 5
          done
          test "$ping" = Online
          echo V6_RESIZE_R6I_2XLARGE=PASS

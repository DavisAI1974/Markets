name: NG Exhaustion V4 State Assembler Contract 20260820

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-entry-timing-revival-20260818
    paths:
      - research/kalshi/ng_exhaustion_v4_state_assembler.py
      - research/kalshi/tests/test_ng_exhaustion_v4_state_assembler.py
      - .github/workflows/ng_exhaustion_v4_state_assembler_contract_20260820.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pytest
      - name: Run state assembler adversarial tests
        run: |
          set +e
          python -m pytest -q research/kalshi/tests/test_ng_exhaustion_v4_state_assembler.py > /tmp/state_assembler.txt 2>&1
          code=$?
          echo "$code" > /tmp/state_assembler.code
          cat /tmp/state_assembler.txt
          exit 0
      - name: Write exact-SHA receipt
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          paths=[
            'research/kalshi/ng_exhaustion_v4_state_assembler.py',
            'research/kalshi/tests/test_ng_exhaustion_v4_state_assembler.py',
          ]
          code=int(Path('/tmp/state_assembler.code').read_text().strip()) if Path('/tmp/state_assembler.code').exists() else 999
          out={
            'schema':'NG_EXHAUSTION_V4_STATE_ASSEMBLER_RECEIPT_V1',
            'runner_commit':os.environ.get('GITHUB_SHA'),
            'tests_passed':code==0,
            'pytest_exit_code':code,
            'test_output':Path('/tmp/state_assembler.txt').read_text() if Path('/tmp/state_assembler.txt').exists() else 'pytest did not run',
            'files':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},
            'true_zero_distinct_from_missing':True,
            'future_backfill_prohibited':True,
            'stale_carry_missing_notyet_na_distinct':True,
            'state_movie_append_only':True,
            'v4_empirical_launch':False,
            'promotion_performed':False,
            'protected_mutation_performed':False,
          }
          text=json.dumps(out,indent=2,sort_keys=True)+'\n'
          Path('/tmp/state_assembler_receipt.json').write_text(text)
          Path('research/kalshi/NG_EXHAUSTION_V4_STATE_ASSEMBLER_RECEIPT_20260820.json').write_text(text)
          PY
      - name: Commit receipt safely
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch='chatgpt/ng-exhaustion-entry-timing-revival-20260818'
          path='research/kalshi/NG_EXHAUSTION_V4_STATE_ASSEMBLER_RECEIPT_20260820.json'
          for attempt in 1 2 3 4; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            cp /tmp/state_assembler_receipt.json "$path"
            git add "$path"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'research: record V4 state assembler verification'
            if git push origin HEAD:"$branch"; then exit 0; fi
          done
          exit 1

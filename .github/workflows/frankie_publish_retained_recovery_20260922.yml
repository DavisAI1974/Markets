name: Publish retained Monday recovery
on:
  push:
    branches: ['codex/trading-day-readiness-20260922']
    paths: ['.github/workflows/frankie_publish_retained_recovery_20260922.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97
      - run: python -m py_compile deploy/aws/box/frankie_box_publish_recovery.py deploy/aws/publish_retained_recovery_20260922.py
      - name: Publish existing computation with verified transport
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python deploy/aws/publish_retained_recovery_20260922.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: monday-recovered-source
          path: |
            source-boundary.json
            builder-checkpoint.c15.json
            completion.json
            recovery-receipt.json
            publication-receipt.json
            progress.jsonl

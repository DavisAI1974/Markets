name: NG Exhaustion Step-1 Receipt Count 20260823

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-entry-timing-revival-20260818
    paths:
      - .github/workflows/ng_exhaustion_step1_receipt_count_20260823.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      INSTANCE_ID: i-08cee7171c0a76a04
      CANDIDATE_SHA: 0d318335825b4a0e19a5a2881522f3da0374788e
    steps:
      - name: Count completed child receipts read-only
        shell: bash
        run: |
          set -euo pipefail
          base="/mnt/markets/ng_exhaustion_step1_5y_20260822/$CANDIDATE_SHA"
          python - "$base" <<'PY'
          import json
          import os
          import sys

          base = sys.argv[1]
          unit = f"ng-exhaustion-step1-{os.environ['CANDIDATE_SHA'][:12]}"
          command = f'''set -u
systemctl show {unit!r} --property=LoadState,ActiveState,SubState,MainPID --no-pager || true
python3 - <<'PYCOUNT'
import json
from pathlib import Path
base = Path({base!r})
segment_dir = base / 'preflight' / 'segments'
receipts = sorted(segment_dir.glob('*.receipt.json'))
print(f'COMPLETED_RECEIPT_FILE_COUNT={{len(receipts)}}')
segments = []
parse_errors = []
for path in receipts:
    try:
        body = json.loads(path.read_text(encoding='utf-8'))
    except Exception as exc:
        parse_errors.append((path.name, repr(exc)))
        continue
    segment = str(body.get('segment') or path.name.removesuffix('.receipt.json'))
    segments.append(segment)
    print('RECEIPT', segment, 'status=' + str(body.get('status')), 'sha=' + str(body.get('receipt_sha256')))
print('PARSED_RECEIPT_COUNT=' + str(len(segments)))
print('PARSE_ERROR_COUNT=' + str(len(parse_errors)))
print('COMPLETED_SEGMENTS=' + ','.join(segments))
for name, err in parse_errors:
    print('PARSE_ERROR', name, err)
heartbeat_files = sorted(segment_dir.glob('*.heartbeat.json'))
print('HEARTBEAT_FILE_COUNT=' + str(len(heartbeat_files)))
for path in heartbeat_files:
    try:
        body = json.loads(path.read_text(encoding='utf-8'))
        print('HEARTBEAT', str(body.get('segment') or path.name), 'status=' + str(body.get('status')), 'phase=' + str(body.get('phase')), 'heartbeat_utc=' + str(body.get('heartbeat_utc')))
    except Exception as exc:
        print('HEARTBEAT_PARSE_ERROR', path.name, repr(exc))
PYCOUNT
'''
          with open('/tmp/step1-receipt-count-ssm-parameters.json', 'w', encoding='utf-8') as handle:
              json.dump({'commands': [command]}, handle)
          PY
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Read-only Step-1 completed receipt count $CANDIDATE_SHA" \
            --parameters file:///tmp/step1-receipt-count-ssm-parameters.json \
            --timeout-seconds 120 \
            --query 'Command.CommandId' \
            --output text)"
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json

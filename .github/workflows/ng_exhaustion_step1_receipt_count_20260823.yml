name: NG Exhaustion Step-1 Receipt Count and Parallel Progress 20260824

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-entry-timing-revival-20260818
    paths:
      - .github/workflows/ng_exhaustion_step1_receipt_count_20260823.yml
  pull_request:
    branches:
      - chatgpt/ng-exhaustion-entry-timing-revival-20260818
    paths:
      - .github/probe-trigger-progress-20260824.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      INSTANCE_ID: i-08cee7171c0a76a04
      CANDIDATE_SHA: 0d318335825b4a0e19a5a2881522f3da0374788e
      BRANCH: chatgpt/ng-exhaustion-entry-timing-revival-20260818
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Read-only full-run receipt and per-segment progress probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, shlex
          candidate=os.environ['CANDIDATE_SHA']
          script=r'''
          import datetime as dt
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          candidate=os.environ['CANDIDATE_SHA']
          base=Path('/mnt/markets/ng_exhaustion_step1_5y_20260822')/candidate
          full=base/'full'
          manifest=json.loads((base/'repo/research/kalshi/NG_EXHAUSTION_MBO_5Y_CANONICAL_OBJECT_MANIFEST_20260822.json').read_text())
          prefix=manifest['prefix']
          targets=['20210901_20211001','20211001_20211101','20211101_20211201']

          def unit_state(unit):
              p=subprocess.run(['systemctl','show',unit,'--property=ActiveState,SubState,MainPID','--no-pager'],text=True,capture_output=True)
              out={}
              for line in p.stdout.splitlines():
                  if '=' in line:
                      k,v=line.split('=',1); out[k]=v
              return out

          def local_path(segment,obj):
              return full/'parallel_3mo'/segment/'stage'/Path(obj['key'][len(prefix):])

          rows=[]
          for segment in targets:
              unit=f'ng-exhaustion-step1-p3m-{segment}'
              state=unit_state(unit)
              try: pid=int(state.get('MainPID') or 0)
              except Exception: pid=0
              receipt=full/'segments'/f'{segment}.receipt.json'
              seconds=full/'segments'/f'{segment}.seconds.jsonl.gz'
              heartbeat=full/'segments'/f'{segment}.heartbeat.json'
              partial=full/'segments'/f'{segment}.seconds.jsonl.gz.partial'
              objs=[o for o in manifest['canonical_dbn_objects'] if o['segment']==segment]
              total_bytes=sum(int(o['bytes']) for o in objs)
              expected={str(local_path(segment,o).resolve()):(i,o) for i,o in enumerate(objs)}
              open_sources=[]
              if pid and Path(f'/proc/{pid}/fd').exists():
                  for fd in Path(f'/proc/{pid}/fd').iterdir():
                      try: target=os.readlink(fd).removesuffix(' (deleted)')
                      except OSError: continue
                      resolved=str(Path(target).resolve())
                      if resolved not in expected: continue
                      i,obj=expected[resolved]
                      pos=None
                      try:
                          m=re.search(r'^pos:\s*(\d+)',(Path(f'/proc/{pid}/fdinfo')/fd.name).read_text(),re.M)
                          if m: pos=int(m.group(1))
                      except Exception: pass
                      open_sources.append((i,obj,pos))
              open_sources.sort(key=lambda x:(x[0],x[2] if x[2] is not None else -1))
              current=open_sources[-1] if open_sources else None
              hb={}
              if heartbeat.exists():
                  try: hb=json.loads(heartbeat.read_text())
                  except Exception: hb={}
              complete=receipt.exists() and seconds.exists()
              if complete:
                  current_index=len(objs); current_date=None; key=None; pos=None; size=None; lower=upper=100.0
              elif current:
                  i,obj,pos=current
                  before=sum(int(o['bytes']) for o in objs[:i])
                  size=int(obj['bytes'])
                  lower=100.0*before/total_bytes if total_bytes else None
                  upper=100.0*(before+size)/total_bytes if total_bytes else None
                  current_index=i+1
                  key=obj['key']
                  m=re.search(r'(20\d{6})',Path(key).name)
                  current_date=m.group(1) if m else None
              else:
                  current_index=None; current_date=None; key=None; pos=None; size=None; lower=upper=None
              rows.append({
                  'segment':segment,
                  'unit_active_state':state.get('ActiveState'),
                  'unit_sub_state':state.get('SubState'),
                  'pid':pid,
                  'receipt_complete':complete,
                  'source_object_count':len(objs),
                  'current_object_index_1based':current_index,
                  'current_source_date':current_date,
                  'current_source_key':key,
                  'current_fd_position_bytes':pos,
                  'current_object_bytes':size,
                  'source_byte_progress_lower_pct':None if lower is None else round(lower,2),
                  'source_byte_progress_upper_pct':None if upper is None else round(upper,2),
                  'heartbeat_utc':hb.get('heartbeat_utc'),
                  'completed_event_groups':hb.get('completed_event_groups'),
                  'aggregated_seconds':hb.get('aggregated_seconds'),
                  'heartbeat_elapsed_seconds':hb.get('elapsed_seconds'),
                  'partial_output_bytes':partial.stat().st_size if partial.exists() else None,
              })
          receipts=[]
          for path in sorted((full/'segments').glob('*.receipt.json')):
              try:
                  body=json.loads(path.read_text())
                  receipts.append({'segment':body.get('segment'),'status':body.get('status'),'receipt_sha256':body.get('receipt_sha256')})
              except Exception as exc:
                  receipts.append({'file':path.name,'parse_error':repr(exc)})
          payload={
              'schema':'NG_EXHAUSTION_STEP1_PARALLEL_PROGRESS_PROBE_V2_20260824',
              'read_only':True,
              'observed_at_utc':dt.datetime.now(dt.timezone.utc).isoformat(),
              'full_receipts':receipts,
              'segments':rows,
          }
          print(json.dumps(payload,sort_keys=True))
          '''
          command='set -euo pipefail\nexport CANDIDATE_SHA='+shlex.quote(candidate)+'\npython3 - <<\'PYPROBE\'\n'+script+'\nPYPROBE'
          with open('/tmp/step1-progress-ssm-parameters.json','w',encoding='utf-8') as f:
              json.dump({'commands':[command]},f)
          PY
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Read-only Step-1 three-month progress $CANDIDATE_SHA" \
            --parameters file:///tmp/step1-progress-ssm-parameters.json \
            --timeout-seconds 120 \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json > /tmp/step1-progress-invocation.json
          cat /tmp/step1-progress-invocation.json
          python - <<'PY'
          import json
          from pathlib import Path
          invocation=json.loads(Path('/tmp/step1-progress-invocation.json').read_text())
          if invocation.get('Status') != 'Success' or invocation.get('ResponseCode') != 0:
              raise SystemExit(invocation)
          payload=json.loads(invocation.get('StandardOutput') or '{}')
          out=Path('research/kalshi/NG_EXHAUSTION_STEP1_PARALLEL_PROGRESS_LATEST_20260824.json')
          out.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(out.read_text())
          PY

      - name: Retain concise read-only progress observation
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/kalshi/NG_EXHAUSTION_STEP1_PARALLEL_PROGRESS_LATEST_20260824.json
          if git diff --cached --quiet; then
            echo 'No progress evidence change to commit.'
            exit 0
          fi
          git commit -m 'ops: retain Step-1 three-month progress observation'
          git push origin HEAD:"$BRANCH"

name: NG v38 all-stage runtime revalidation

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - research/kalshi/ng_v38_all_stage_runtime_revalidation_gate.py
      - research/kalshi/ng_v38_execution_runtime_revalidation_gate.py
      - research/kalshi/ng_historical_refinement_preflight_v32.py
      - research/kalshi/ng_historical_refinement_preflight_v33.py
      - research/kalshi/tests/test_ng_v38_all_stage_runtime_revalidation.py
      - .github/workflows/ng_v38_all_stage_runtime_revalidation_ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-stage-runtime-revalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest

      - name: Compile all-stage runtime boundary
        working-directory: research/kalshi
        run: |
          python -m py_compile \
            ng_v38_execution_runtime_revalidation_gate.py \
            ng_v38_all_stage_runtime_revalidation_gate.py \
            ng_historical_refinement_preflight_v32.py \
            ng_historical_refinement_preflight_v33.py \
            tests/test_ng_v38_all_stage_runtime_revalidation.py

      - name: Run focused all-stage runtime tests
        working-directory: research/kalshi
        run: pytest -q tests/test_ng_v38_all_stage_runtime_revalidation.py

      - name: Verify prefix coverage and permanent authority wall
        working-directory: research/kalshi
        run: |
          python - <<'PY'
          import inspect
          import ng_historical_refinement_preflight_v33 as preflight
          import ng_v38_all_stage_runtime_revalidation_gate as gate

          gate_text = inspect.getsource(gate)
          preflight_text = inspect.getsource(preflight)
          assert "_all_stage_script_sha256" in gate_text
          assert "historical_and_g15_prefix_scripts_rehashed" in gate_text
          assert "all_configured_stage_scripts_rehashed" in gate_text
          assert "runtime_revalidation_at_executor_delegation" in preflight_text
          assert "guarded_runner" in preflight_text
          text = gate_text + preflight_text
          assert '"cme_event_contracts_mode": "SHADOW"' in text
          assert '"brokerage_contract": "tastytrade_not_ibkr"' in text
          assert '"options_lane_started": False' in text
          assert '"may_update_ng_brain": False' in text
          assert '"random_shuffle_used": False' in text
          PY

name: NG Frankie Exhaustion Reveal 20260816

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-frankie-blind-20260816
    paths:
      - research/ng_exhaustion_frankie_reveal_20260816.py
      - .github/workflows/ng_frankie_reveal_20260816.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      BUCKET: bento-568968024170-us-east-2-an
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install --quiet numpy scipy scikit-learn databento
      - name: Download authoritative continuous MBP10 days
        run: |
          set -euo pipefail
          for d in 20250717 20250923 20250930 20251001; do
            aws s3 cp s3://${BUCKET}/nymex/nymex_cont/NG_${d}.jsonl.gz /tmp/NG_${d}.jsonl.gz --only-show-errors
            test -s /tmp/NG_${d}.jsonl.gz
          done
      - name: Download exact proven matching MBO where available
        run: |
          set -euo pipefail
          aws s3 cp s3://${BUCKET}/nymex/ng_mbo_ngv25/NG_20250923.dbn.zst /tmp/ng_mbo_ngv25_20250923.dbn.zst --only-show-errors
          aws s3 cp s3://${BUCKET}/nymex/ng_mbo_ngx25/NG_20250930.dbn.zst /tmp/ng_mbo_ngx25_20250930.dbn.zst --only-show-errors
          aws s3 cp s3://${BUCKET}/nymex/ng_mbo_ngx25/NG_20251001.dbn.zst /tmp/ng_mbo_ngx25_20251001.dbn.zst --only-show-errors
          test -s /tmp/ng_mbo_ngv25_20250923.dbn.zst
          test -s /tmp/ng_mbo_ngx25_20250930.dbn.zst
          test -s /tmp/ng_mbo_ngx25_20251001.dbn.zst
      - name: Build revealed 50 percent packet only
        run: |
          PYTHONPATH=research python research/ng_exhaustion_frankie_reveal_20260816.py \
            /tmp/NG_20250717.jsonl.gz \
            /tmp/NG_20250923.jsonl.gz \
            /tmp/NG_20250930.jsonl.gz \
            /tmp/NG_20251001.jsonl.gz
      - name: Prove no heldout answer file exists
        run: |
          test ! -e ng_frankie_holdout_answers.json
          test -s ng_frankie_reveal_records.json
          test -s ng_frankie_reveal_manifest.json
      - name: Upload reveal packet and frozen Frankie brain
        uses: actions/upload-artifact@v4
        with:
          name: ng-frankie-exhaustion-reveal-20260816
          path: |
            ng_frankie_reveal_records.json
            ng_frankie_reveal_manifest.json
            ng_frankie_reveal_prompt.txt
            research/kalshi/knowledge/ng_brain.json
          if-no-files-found: error

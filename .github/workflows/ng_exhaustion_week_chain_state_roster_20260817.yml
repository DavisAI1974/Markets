name: NG Exhaustion Week Chain State Roster 20260817

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-aftermath-20260817
    paths:
      - research/ng_exhaustion_week_chain_state_roster_20260817.py
      - .github/workflows/ng_exhaustion_week_chain_state_roster_20260817.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  roster_state:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      BUCKET: bento-568968024170-us-east-2-an
      V2_ARTIFACT_ID: '9278686522'
      V2_ARTIFACT_SHA256: '0357826f86ce9971688a467c41ea4c64c23eaaf2d22dc1f37fc39ce62c4f168a'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download exact frozen target identity table
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V2_ARTIFACT_ID}/zip" -o /tmp/v2.zip
          echo "${V2_ARTIFACT_SHA256}  /tmp/v2.zip" | sha256sum -c -
          mkdir -p /tmp/v2
          unzip -q /tmp/v2.zip NG_EXHAUSTION_AFTERMATH_VALIDATION_V2_20260817_EVENT_TABLE.jsonl.gz -d /tmp/v2
      - name: Download Sunday-through-Friday study weeks
        run: |
          set -euo pipefail
          mkdir -p /tmp/ngweeks
          required=(20250713 20250714 20250715 20250716 20250717 20250718 20250921 20250922 20250923 20250924 20250925 20250926 20250928 20250929 20250930 20251001 20251002 20251003)
          for d in "${required[@]}"; do
            mapfile -t keys < <(aws s3api list-objects-v2 --bucket "${BUCKET}" --prefix "nymex/nymex_cont/NG_${d}" --query 'Contents[].Key' --output text | tr '\t' '\n' | grep -E "^nymex/nymex_cont/NG_${d}(_[A-Za-z]{3})?\\.jsonl\\.gz$" || true)
            test "${#keys[@]}" -eq 1 || { echo "::error::NG raw day ${d} resolved ${#keys[@]} canonical objects"; exit 1; }
            base="$(basename "${keys[0]}")"; aws s3 cp "s3://${BUCKET}/${keys[0]}" "/tmp/ngweeks/${base}" --only-show-errors; test -s "/tmp/ngweeks/${base}"
          done
          find /tmp/ngweeks -type f -name 'NG_*.jsonl.gz' | sort > /tmp/raw_paths.txt
      - name: Build unlabeled roster with pre-t0 membership state
        run: |
          set -euo pipefail
          mapfile -t RAW < /tmp/raw_paths.txt
          PYTHONPATH=research python research/ng_exhaustion_week_chain_state_roster_20260817.py \
            --frozen-target-table /tmp/v2/NG_EXHAUSTION_AFTERMATH_VALIDATION_V2_20260817_EVENT_TABLE.jsonl.gz \
            --family-classifier research/FRANKIE_NG_PRE_FAMILY_CLASSIFIER_FROZEN_OPERATIONAL_20260817.json \
            "${RAW[@]}"
      - name: Upload chain prestate roster
        uses: actions/upload-artifact@v4
        with:
          name: ng-exhaustion-week-chain-state-roster-20260817
          path: |
            NG_EXHAUSTION_WEEK_CHAIN_STATE_ROSTER_20260817.json
            NG_EXHAUSTION_WEEK_CHAIN_STATE_ROSTER_20260817_EVENTS.jsonl.gz
          if-no-files-found: error

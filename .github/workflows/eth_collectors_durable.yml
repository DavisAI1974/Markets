name: ETH Collectors (durable)

# Runs ETH-USD spot collectors on Coinbase + Kraken AND ETH-USDT
# linear perp collector on Bybit, on GitHub's compute, independent
# of any local device. Persists bins to the `data/eth-bins` branch
# via force-push (cumulative state, no need for history).
#
# Schedule: every 6 hours. Each run collects for 5h50m, leaving ~10 min
# gap before next scheduled run. Public repo = unlimited minutes.
#
# Manual trigger via "Run workflow" button on Actions tab, or via API.
#
# Perp venue history: tried Binance USDT-M (fstream geo-blocked from
# GHA in practice — empty bins despite TLS reachability) and Kraken
# Futures v1 (only emits trade_snapshot on subscribe, no live trade
# updates — 99.5% empty bins). Both .py collectors are kept in the
# repo for reference but not executed in this workflow. Bybit V5 linear
# perp WS is the working venue (verified ~3-7 trade msgs/sec on BTC
# during normal hours, no geo restrictions on US/cloud egress).

on:
  schedule:
    - cron: '0 */6 * * *'   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Collection duration in seconds (default 5h50m=21000)'
        default: '21000'
        type: string
  push:
    branches:
      - claude/new-session-o3vnm
      - claude/continue-phase-2-pipeline-UFiGY
    paths:
      - '.github/workflows/eth_collectors_durable.yml'

permissions:
  contents: write

concurrency:
  group: eth-collectors
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # 5h55m, just under GitHub's 6hr hard limit

    steps:
      - name: Checkout code branch
        uses: actions/checkout@v4
        with:
          ref: claude/continue-phase-2-pipeline-UFiGY
          fetch-depth: 0   # need full history to access data branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet websockets numpy

      - name: Restore previous bins from data/eth-bins branch
        run: |
          if git ls-remote --exit-code --heads origin data/eth-bins > /dev/null 2>&1; then
            echo "[restore] data branch exists; fetching"
            git fetch origin data/eth-bins
            git checkout origin/data/eth-bins -- eth_coinbase_bins.json 2>/dev/null || echo "[restore] no eth_coinbase_bins.json on data branch yet"
            git checkout origin/data/eth-bins -- eth_kraken_bins.json 2>/dev/null || echo "[restore] no eth_kraken_bins.json on data branch yet"
            git checkout origin/data/eth-bins -- eth_bybit_perp_bins.json 2>/dev/null || echo "[restore] no eth_bybit_perp_bins.json on data branch yet"
          else
            echo "[restore] data branch does not exist; first run, starting fresh"
          fi
          ls -la eth_*_bins.json 2>&1 || echo "[restore] no bins files present"

      - name: Connectivity check
        run: |
          curl -sS --max-time 5 -o /dev/null -w "Coinbase WS:    %{http_code}\n" https://ws-feed.exchange.coinbase.com/ || true
          curl -sS --max-time 5 -o /dev/null -w "Kraken spot WS: %{http_code}\n" https://ws.kraken.com/ || true
          curl -sS --max-time 5 -o /dev/null -w "Bybit linear:   %{http_code}\n" https://stream.bybit.com/ || true

      - name: Run ETH collectors in parallel
        timeout-minutes: 350
        run: |
          DURATION="${{ github.event.inputs.duration_seconds || '21000' }}"
          echo "[run] starting collectors for ${DURATION}s on $(date -u)"
          python coinbase_eth_collector.py --duration $DURATION --bins-path eth_coinbase_bins.json > /tmp/cb_eth.log 2>&1 &
          CB_PID=$!
          python kraken_eth_collector.py --duration $DURATION --bins-path eth_kraken_bins.json > /tmp/kr_eth.log 2>&1 &
          KR_PID=$!
          python bybit_ethusdt_perp_collector.py --duration $DURATION --bins-path eth_bybit_perp_bins.json > /tmp/by_eth_perp.log 2>&1 &
          BY_PID=$!
          echo "[run] CB PID=$CB_PID, KR PID=$KR_PID, BY-perp PID=$BY_PID"
          wait $CB_PID; CB_EXIT=$?
          wait $KR_PID; KR_EXIT=$?
          wait $BY_PID; BY_EXIT=$?
          echo "[run] CB exit=$CB_EXIT, KR exit=$KR_EXIT, BY-perp exit=$BY_EXIT"
          echo ""
          echo "=== Coinbase ETH log tail ==="
          tail -30 /tmp/cb_eth.log
          echo ""
          echo "=== Kraken ETH log tail ==="
          tail -30 /tmp/kr_eth.log
          echo ""
          echo "=== Bybit ETH-PERP log tail ==="
          tail -30 /tmp/by_eth_perp.log

      - name: Bin file stats
        if: always()
        run: |
          for f in eth_coinbase_bins.json eth_kraken_bins.json eth_bybit_perp_bins.json; do
            if [ -f "$f" ]; then
              SIZE=$(stat -c%s "$f")
              N_BINS=$(python -c "import json,sys; print(len(json.load(open(sys.argv[1]))))" "$f" 2>/dev/null || echo "?")
              echo "$f: $SIZE bytes, $N_BINS bins"
            fi
          done

      - name: Commit bins to data/eth-bins branch (force-push, history-less)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          mkdir -p /tmp/bins
          cp eth_coinbase_bins.json /tmp/bins/ 2>/dev/null || true
          cp eth_kraken_bins.json /tmp/bins/ 2>/dev/null || true
          cp eth_bybit_perp_bins.json /tmp/bins/ 2>/dev/null || true

          # Guardrail (anti-clobber): this step is `if: always()` and force-pushes,
          # so a crashed/partial collector run must NOT overwrite good cumulative
          # seconds. The durable pattern restores+appends, so a healthy file is
          # always >= the data-branch copy. If a fresh file regressed (fewer bins
          # than what's already on data/eth-bins), restore the data-branch copy so
          # the push preserves history instead of wiping it.
          python - <<'PY'
          import json, subprocess, os
          BRANCH = "origin/data/eth-bins"
          FILES = ["eth_coinbase_bins.json", "eth_kraken_bins.json", "eth_bybit_perp_bins.json"]
          def count(path):
              try:
                  with open(path) as f: return len(json.load(f))
              except Exception: return 0
          def old_blob(fn):
              try:
                  return subprocess.run(["git", "show", f"{BRANCH}:{fn}"],
                                        capture_output=True, check=True).stdout
              except subprocess.CalledProcessError:
                  return None
          for fn in FILES:
              newp = os.path.join("/tmp/bins", fn)
              new = count(newp)
              blob = old_blob(fn)
              old = len(json.loads(blob)) if blob else 0
              if old and new < old:
                  with open(newp, "wb") as f: f.write(blob)
                  print(f"[guardrail] {fn}: collected {new} bins < {old} on data branch "
                        f"-> RESTORED data-branch copy (no regression)")
              else:
                  print(f"[guardrail] {fn}: {new} bins (>= {old} on data branch) -> keep")
          PY

          git checkout --orphan data/eth-bins-tmp
          git rm -rf . > /dev/null 2>&1 || true

          cp /tmp/bins/eth_coinbase_bins.json . 2>/dev/null || true
          cp /tmp/bins/eth_kraken_bins.json . 2>/dev/null || true
          cp /tmp/bins/eth_bybit_perp_bins.json . 2>/dev/null || true

          if [ -f eth_coinbase_bins.json ] || [ -f eth_kraken_bins.json ] || [ -f eth_bybit_perp_bins.json ]; then
            git add eth_coinbase_bins.json eth_kraken_bins.json eth_bybit_perp_bins.json 2>/dev/null || true
            git commit -m "ETH bins update $(date -u +%Y-%m-%dT%H:%M:%SZ)" -m "Run: ${{ github.run_id }}"
            git push -f origin data/eth-bins-tmp:data/eth-bins
            echo "[commit] pushed to data/eth-bins"
          else
            echo "[commit] no bins to commit"
          fi

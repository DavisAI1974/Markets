name: NG Exhaustion Two-Day Step-1 Diagnostic 20260824

on:
  push:
    branches:
      - chatgpt/frankie-october-aws-readonly-20260824
    paths:
      - research/kalshi/NG_EXHAUSTION_TWO_DAY_STEP1_LAUNCH_20260824.json

permissions:
  contents: read

concurrency:
  group: ng-exhaustion-two-day-step1-diagnostic-20260824
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: us-east-2
  INSTANCE_ID: i-08cee7171c0a76a04
  BUCKET: bento-568968024170-us-east-2-an
  CANDIDATE_SHA: 0d318335825b4a0e19a5a2881522f3da0374788e
  TARGET_SEGMENT: '20211001_20211101'
  WINDOW_START: '2021-10-04T00:00:00Z'
  WINDOW_END_EXCLUSIVE: '2021-10-06T00:00:00Z'
  EXPECTED_SECONDS_BYTES: '112852940'
  EXPECTED_SECONDS_SHA256: 93654eb5eaf24be6dc6821f422cdd7fc416e12778dcecd6c97150cbc34004f90
  EXPECTED_RECEIPT_FILE_SHA256: 80b6cf7199805cf40a0b16b139ee1aa8f705b884acf03856640df4054802f7ab
  EXPECTED_RECEIPT_SHA256: 4966dac8b25fee7acabf53f880a30155985bd5767ee222381f1188d4eecada3c
  EXPECTED_ADAPTER_SHA256: 5a18fe96bc5022a619536640a630209df1c85ec7b756f139ee412ef9a8d288db

jobs:
  run-two-day-step1:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate the literal launch contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          launch = json.loads(Path(
              "research/kalshi/NG_EXHAUSTION_TWO_DAY_STEP1_LAUNCH_20260824.json"
          ).read_text(encoding="utf-8"))
          required = {
              "schema": "NG_EXHAUSTION_TWO_DAY_STEP1_LAUNCH_V1_20260824",
              "confirmation": "RUN_EXACT_TWO_CONSECUTIVE_DAYS",
              "launch_revision": 4,
              "branch": "chatgpt/frankie-october-aws-readonly-20260824",
              "window_start": os.environ["WINDOW_START"],
              "window_end_exclusive": os.environ["WINDOW_END_EXCLUSIVE"],
              "validated_seconds_bytes": int(os.environ["EXPECTED_SECONDS_BYTES"]),
              "validated_seconds_sha256": os.environ["EXPECTED_SECONDS_SHA256"],
              "validated_receipt_file_sha256": os.environ["EXPECTED_RECEIPT_FILE_SHA256"],
              "validated_receipt_sha256": os.environ["EXPECTED_RECEIPT_SHA256"],
              "adapter_sha256": os.environ["EXPECTED_ADAPTER_SHA256"],
              "raw_mbo_replay": False,
              "compare_to_54_week_answers": False,
              "provider_or_frankie_calls": False,
              "production_mutation": False,
              "transfer_mode": "EXISTING_FROZEN_LAUNCH_PREFIX_STAGE_THEN_VERIFY_AND_PROMOTE",
              "validation_mode": "USER_AUTHORIZED_SELF_FIT_SELF_SCORE_DIAGNOSTIC_ACCEPTED",
          }
          if launch != required:
              raise SystemExit("TWO_DAY_LAUNCH_CONTRACT_DRIFT")
          adapter = Path("research/ng_exhaustion_mbo_2day_step1_finalize_20260824.py")
          actual = hashlib.sha256(adapter.read_bytes()).hexdigest()
          if actual != os.environ["EXPECTED_ADAPTER_SHA256"]:
              raise SystemExit("TWO_DAY_ADAPTER_HASH_DRIFT")
          print("TWO_DAY_LAUNCH_CONTRACT=PASS")
          PY

      - name: Run the focused adapter tests only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet \
            numpy==1.26.4 scipy==1.11.4 scikit-learn==1.4.2 matplotlib==3.8.4 \
            boto3==1.35.99 databento==0.81.0
          MPLCONFIGDIR=/tmp/matplotlib-two-day PYTHONPATH=research \
            python -m unittest -v \
              research/test_ng_exhaustion_mbo_2day_step1_finalize_20260824.py

      - name: Run exact two-day diagnostic on the existing validated AWS child
        shell: bash
        run: |
          set -euo pipefail
          result_prefix="nymex/ng_mbo_5y_v0/step1_census/two_day_diagnostic/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          worker_prefix="nymex/ng_mbo_5y_v0/step1_census/launches/${CANDIDATE_SHA}/full/two_day_diagnostic/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws s3 cp \
            research/ng_exhaustion_mbo_2day_step1_finalize_20260824.py \
            "s3://$BUCKET/$worker_prefix/input/ng_exhaustion_mbo_2day_step1_finalize_20260824.py" \
            --only-show-errors
          test "$(aws s3api head-object \
            --bucket "$BUCKET" \
            --key "$worker_prefix/input/ng_exhaustion_mbo_2day_step1_finalize_20260824.py" \
            --query ContentLength --output text)" -gt 0
          echo "WORKER_STAGING_ADAPTER=PASS"
          python - <<'PY'
          import json
          import os
          import shlex

          candidate = os.environ["CANDIDATE_SHA"]
          segment = os.environ["TARGET_SEGMENT"]
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          base = f"/mnt/markets/ng_exhaustion_step1_5y_20260822/{candidate}"
          run_root = f"/mnt/markets/ng_exhaustion_two_day_step1_20260824/{run_id}-{attempt}"
          result_prefix = (
              "nymex/ng_mbo_5y_v0/step1_census/two_day_diagnostic/runs/"
              f"{run_id}-{attempt}"
          )
          worker_prefix = (
              "nymex/ng_mbo_5y_v0/step1_census/launches/"
              f"{candidate}/full/two_day_diagnostic/runs/{run_id}-{attempt}"
          )
          remote = f'''set -euo pipefail
          base={shlex.quote(base)}
          run_root={shlex.quote(run_root)}
          segment={shlex.quote(segment)}
          bucket={shlex.quote(os.environ['BUCKET'])}
          result_prefix={shlex.quote(result_prefix)}
          worker_prefix={shlex.quote(worker_prefix)}
          export AWS_DEFAULT_REGION=us-east-2
          seconds="$base/full/segments/$segment.seconds.jsonl.gz"
          child_receipt="$base/full/segments/$segment.receipt.json"
          test -x "$base/venv/bin/python"
          test -f "$seconds"
          test -f "$child_receipt"
          test "$(stat -c %s "$seconds")" = {shlex.quote(os.environ['EXPECTED_SECONDS_BYTES'])}
          test "$(sha256sum "$seconds" | cut -d' ' -f1)" = {shlex.quote(os.environ['EXPECTED_SECONDS_SHA256'])}
          test "$(sha256sum "$child_receipt" | cut -d' ' -f1)" = {shlex.quote(os.environ['EXPECTED_RECEIPT_FILE_SHA256'])}
          test ! -e "$run_root"
          mkdir -p "$run_root"
          cp -a --reflink=auto "$base/repo" "$run_root/repo"
          aws s3 cp \
            "s3://$bucket/$worker_prefix/input/ng_exhaustion_mbo_2day_step1_finalize_20260824.py" \
            "$run_root/repo/research/ng_exhaustion_mbo_2day_step1_finalize_20260824.py" \
            --only-show-errors
          cd "$run_root/repo"
          test "$(sha256sum research/ng_exhaustion_mbo_2day_step1_finalize_20260824.py | cut -d' ' -f1)" = {shlex.quote(os.environ['EXPECTED_ADAPTER_SHA256'])}
          printf 'READY\n' | aws s3 cp - \
            "s3://$bucket/$worker_prefix/transfer/worker-read-write-probe.txt" \
            --only-show-errors
          test "$(aws s3 cp \
            "s3://$bucket/$worker_prefix/transfer/worker-read-write-probe.txt" - \
            --only-show-errors)" = READY
          echo WORKER_PREFIX_TRANSFER_PREFLIGHT=PASS
          MPLCONFIGDIR="$run_root/matplotlib" PYTHONPATH=research \
            /usr/bin/time -v -o "$run_root/resource.txt" \
            "$base/venv/bin/python" research/ng_exhaustion_mbo_2day_step1_finalize_20260824.py \
              --parent-manifest research/kalshi/NG_EXHAUSTION_MBO_5Y_CANONICAL_OBJECT_MANIFEST_20260822.json \
              --october-seconds "$seconds" \
              --october-receipt "$child_receipt" \
              --out-dir "$run_root/results" \
            | tee "$run_root/run.log"
          "$base/venv/bin/python" - "$run_root/results/STEP1_DUAL_CENSUS_RECEIPT.json" <<'PYREMOTE'
          import json
          import sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert receipt["status"] == "STEP1_DUAL_STRUCTURAL_CENSUS_COMPLETE_TWO_DAY_DIAGNOSTIC"
          assert receipt["source_window"]["start"] == "2021-10-04T00:00:00Z"
          assert receipt["source_window"]["end_exclusive"] == "2021-10-06T00:00:00Z"
          assert receipt["diagnostic_validation"]["d0_d5_population_claimable"] is True
          assert receipt["comparison_to_54w_answers_performed"] is False
          assert receipt["provider_llm_called"] is False
          assert receipt["frankie_launched"] is False
          assert receipt["child_output_reuse"]["raw_mbo_replayed"] is False
          print("TWO_DAY_STEP1_RECEIPT=PASS")
          print("TWO_DAY_STEP1_RECEIPT_SHA256=" + receipt["receipt_sha256"])
          print("TWO_DAY_EVENT_COUNTS=" + json.dumps(receipt["event_counts"], sort_keys=True))
          print("TWO_DAY_FAMILY_COUNTS=" + json.dumps(receipt["family_counts"], sort_keys=True))
          print("TWO_DAY_LEGACY_DEPTHS=" + json.dumps(receipt["legacy_population_summary"]["depth_histogram"], sort_keys=True))
          print("TWO_DAY_NATIVE_DEPTHS=" + json.dumps(receipt["native_population_summary"]["depth_histogram"], sort_keys=True))
          PYREMOTE
          cp "$run_root/resource.txt" "$run_root/results/RESOURCE_USAGE.txt"
          cp "$run_root/run.log" "$run_root/results/RUN.log"
          tar -C "$run_root/results" -czf "$run_root/results.tar.gz" .
          printf 'TWO_DAY_RESULTS_TAR_SHA256=%s\n' \
            "$(sha256sum "$run_root/results.tar.gz" | cut -d' ' -f1)"
          aws s3 cp "$run_root/results.tar.gz" \
            "s3://$bucket/$worker_prefix/transfer/results.tar.gz" \
            --only-show-errors
          printf 'TWO_DAY_WORKER_STAGING_PREFIX=s3://%s/%s/\n' "$bucket" "$worker_prefix"
          printf 'TWO_DAY_RESULT_S3_PREFIX=s3://%s/%s/\n' "$bucket" "$result_prefix"
          '''
          with open("/tmp/two-day-step1-params.json", "w", encoding="utf-8") as handle:
              json.dump({"commands": ["/bin/bash -lc " + shlex.quote(remote)]}, handle)
          PY

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Exact October 4-5 Step-1 diagnostic; reuse validated seconds" \
            --parameters file:///tmp/two-day-step1-params.json \
            --timeout-seconds 9000 \
            --query 'Command.CommandId' --output text)"
          echo "SSM_COMMAND_ID=$command_id"
          for attempt in $(seq 1 600); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac
            if [ $((attempt % 10)) -eq 0 ]; then
              echo "SSM_PROGRESS_STATUS=${status:-PENDING}"
            fi
            sleep 15
          done
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json > /tmp/two-day-step1-invocation.json
          python - <<'PY' | tee /tmp/two-day-step1-summary.txt
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/two-day-step1-invocation.json").read_text())
          print("WORKER_STATUS=" + str(result.get("Status")))
          print("WORKER_RESPONSE_CODE=" + str(result.get("ResponseCode")))
          output = str(result.get("StandardOutput") or "")
          for line in output.splitlines():
              if line.startswith("TWO_DAY_"):
                  print(line)
          if result.get("Status") != "Success" or result.get("ResponseCode") != 0:
              print(str(result.get("StandardError") or ""))
              raise SystemExit("TWO_DAY_STEP1_AWS_RUN_FAILED")
          if "TWO_DAY_STEP1_RECEIPT=PASS" not in output:
              raise SystemExit("TWO_DAY_STEP1_RECEIPT_NOT_PROVEN")
          PY

      - name: Retrieve and verify the complete result receipt
        shell: bash
        run: |
          set -euo pipefail
          prefix="nymex/ng_mbo_5y_v0/step1_census/two_day_diagnostic/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          worker_prefix="nymex/ng_mbo_5y_v0/step1_census/launches/${CANDIDATE_SHA}/full/two_day_diagnostic/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p /tmp/two-day-step1-evidence/results
          aws s3 cp \
            "s3://$BUCKET/$worker_prefix/transfer/results.tar.gz" \
            /tmp/two-day-step1-evidence/results.tar.gz \
            --only-show-errors
          tar -C /tmp/two-day-step1-evidence/results -xzf \
            /tmp/two-day-step1-evidence/results.tar.gz
          cp /tmp/two-day-step1-summary.txt /tmp/two-day-step1-evidence/RUN_SUMMARY.txt
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("/tmp/two-day-step1-evidence/results").resolve()
          archive = Path("/tmp/two-day-step1-evidence/results.tar.gz")
          summary_path = Path("/tmp/two-day-step1-evidence/RUN_SUMMARY.txt")
          summary = {}
          for line in summary_path.read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  summary[key] = value
          receipt = json.loads(Path(
              "/tmp/two-day-step1-evidence/results/STEP1_DUAL_CENSUS_RECEIPT.json"
          ).read_text())
          if receipt["status"] != "STEP1_DUAL_STRUCTURAL_CENSUS_COMPLETE_TWO_DAY_DIAGNOSTIC":
              raise SystemExit("DOWNLOADED_RECEIPT_STATUS_DRIFT")
          archive_sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          if archive_sha != summary.get("TWO_DAY_RESULTS_TAR_SHA256"):
              raise SystemExit("TWO_DAY_RESULT_ARCHIVE_HASH_DRIFT")
          claimed_receipt_sha = str(receipt.get("receipt_sha256") or "")
          if claimed_receipt_sha != summary.get("TWO_DAY_STEP1_RECEIPT_SHA256"):
              raise SystemExit("WORKER_AND_DOWNLOADED_RECEIPT_HASH_DRIFT")
          receipt_body = dict(receipt)
          receipt_body.pop("receipt_sha256", None)
          computed_receipt_sha = hashlib.sha256(json.dumps(
              receipt_body, sort_keys=True, separators=(",", ":")
          ).encode()).hexdigest()
          if claimed_receipt_sha != computed_receipt_sha:
              raise SystemExit("DOWNLOADED_RECEIPT_SELF_HASH_DRIFT")

          verified = {}
          def verify_artifacts(value):
              if isinstance(value, dict):
                  if {"relative_path", "bytes", "sha256"}.issubset(value):
                      relative = Path(str(value["relative_path"]))
                      if relative.is_absolute() or ".." in relative.parts:
                          raise SystemExit("RECEIPT_ARTIFACT_PATH_ESCAPE")
                      path = (root / relative).resolve()
                      if not path.is_relative_to(root) or not path.is_file():
                          raise SystemExit("RECEIPT_ARTIFACT_MISSING=" + str(relative))
                      actual_sha = hashlib.sha256(path.read_bytes()).hexdigest()
                      if path.stat().st_size != int(value["bytes"]):
                          raise SystemExit("RECEIPT_ARTIFACT_BYTE_DRIFT=" + str(relative))
                      if actual_sha != str(value["sha256"]):
                          raise SystemExit("RECEIPT_ARTIFACT_HASH_DRIFT=" + str(relative))
                      prior = verified.get(str(relative))
                      if prior is not None and prior != actual_sha:
                          raise SystemExit("RECEIPT_ARTIFACT_DUPLICATE_DRIFT=" + str(relative))
                      verified[str(relative)] = actual_sha
                  for child in value.values():
                      verify_artifacts(child)
              elif isinstance(value, list):
                  for child in value:
                      verify_artifacts(child)

          verify_artifacts(receipt)
          if len(verified) < 16:
              raise SystemExit("RECEIPT_ARTIFACT_MANIFEST_TOO_THIN")
          for required in (
              "TWO_DAY_SECONDS.jsonl.gz",
              "LEGACY_CONTROL_EVENTS.jsonl.gz",
              "V4_NATIVE_FULL_EVENTS.jsonl.gz",
              "LEGACY_CONTROL_POPULATION.jsonl.gz",
              "V4_NATIVE_FULL_POPULATION.jsonl.gz",
              "DUAL_CENSUS_CROSSWALK.jsonl.gz",
              "TWO_DAY_SOURCE_MANIFEST.json",
              "TWO_DAY_VALIDATION_BYPASS_RECEIPT.json",
          ):
              if required not in verified:
                  raise SystemExit("REQUIRED_TWO_DAY_ARTIFACT_UNRECEIPTED=" + required)

          completion = {
              "schema": "NG_EXHAUSTION_TWO_DAY_STEP1_COMPLETION_V1_20260824",
              "status": "COMPLETE_HASH_VERIFIED_BEFORE_PUBLICATION",
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "github_sha": os.environ["GITHUB_SHA"],
              "worker_staging_prefix": (
                  "nymex/ng_mbo_5y_v0/step1_census/launches/"
                  f"{os.environ['CANDIDATE_SHA']}/full/two_day_diagnostic/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
              ),
              "results_tar_sha256": archive_sha,
              "step1_receipt_sha256": claimed_receipt_sha,
              "verified_receipt_artifact_count": len(verified),
          }
          completion["completion_sha256"] = hashlib.sha256(json.dumps(
              completion, sort_keys=True, separators=(",", ":")
          ).encode()).hexdigest()
          Path("/tmp/two-day-step1-evidence/COMPLETION_RECEIPT.json").write_text(
              json.dumps(completion, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("DOWNLOADED_RECEIPT_AND_ARTIFACT_HASHES=PASS")
          print("VERIFIED_RECEIPT_ARTIFACT_COUNT=" + str(len(verified)))
          PY
          aws s3 cp research/ng_exhaustion_mbo_2day_step1_finalize_20260824.py \
            "s3://$BUCKET/$prefix/input/ng_exhaustion_mbo_2day_step1_finalize_20260824.py" \
            --only-show-errors
          aws s3 cp /tmp/two-day-step1-evidence/results \
            "s3://$BUCKET/$prefix/artifacts/" --recursive --only-show-errors
          aws s3 cp /tmp/two-day-step1-evidence/COMPLETION_RECEIPT.json \
            "s3://$BUCKET/$prefix/COMPLETE.json" --only-show-errors
          aws s3api head-object --bucket "$BUCKET" --key "$prefix/COMPLETE.json" \
            --output json > /tmp/two-day-step1-evidence/COMPLETION_OBJECT_HEAD.json
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$prefix/" \
            --output json > /tmp/two-day-step1-evidence/S3_OBJECT_INVENTORY.json
          python - <<'PY'
          import json
          from pathlib import Path
          inventory = json.loads(Path(
              "/tmp/two-day-step1-evidence/S3_OBJECT_INVENTORY.json"
          ).read_text())
          rows = inventory.get("Contents") or []
          if not rows or not any(str(row["Key"]).endswith("/COMPLETE.json") for row in rows):
              raise SystemExit("FINAL_COMPLETION_MARKER_MISSING")
          print("FINAL_PUBLICATION_MARKER=PASS")
          print("S3_RESULT_OBJECT_COUNT=" + str(len(rows)))
          print("S3_RESULT_TOTAL_BYTES=" + str(sum(int(x["Size"]) for x in rows)))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-day-step1-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/two-day-step1-evidence/
          if-no-files-found: warn
          retention-days: 30

name: AWS idle instance guard

# Stops any EC2 instance that has been idle for six hours, in every region we use, unless it is
# tagged KeepRunning=true. Scheduled workflows only run from the repository's default branch, so
# this file must live there. Manual dispatch runs a dry run unless "stop" is set to true.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      stop:
        description: Actually stop idle instances (false = report only)
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

concurrency:
  group: aws-idle-instance-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install boto3==1.42.23
      - name: Stop idle instances (KeepRunning=true is exempt)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: us-east-2
        run: |
          STOP_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.stop }}" = "true" ]; then STOP_FLAG="--stop"; fi
          python deploy/aws/idle_instance_guard.py --regions us-east-1 us-east-2 --idle-hours 6 --cpu-percent 5 $STOP_FLAG || echo "guard acted or would act; see report above"

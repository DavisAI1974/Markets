name: NG Corpus Quarantine Probe CI

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - research/kalshi/ng_corpus_quarantine_probe.py
      - research/kalshi/ng_corpus_quarantine_storage.py
      - research/kalshi/ng_corpus_identity_probe.py
      - research/kalshi/ng_corpus_materialization.py
      - research/kalshi/ng_corpus_inspection.py
      - research/kalshi/ng_historical_normalize.py
      - research/kalshi/tests/test_ng_corpus_quarantine_probe.py
      - .github/workflows/ng_corpus_quarantine_probe_ci.yml
  pull_request:
    paths:
      - research/kalshi/ng_corpus_quarantine_probe.py
      - research/kalshi/ng_corpus_quarantine_storage.py
      - research/kalshi/ng_corpus_identity_probe.py
      - research/kalshi/ng_corpus_materialization.py
      - research/kalshi/ng_corpus_inspection.py
      - research/kalshi/ng_historical_normalize.py
      - research/kalshi/tests/test_ng_corpus_quarantine_probe.py
      - .github/workflows/ng_corpus_quarantine_probe_ci.yml

permissions:
  contents: read

jobs:
  quarantine-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Compile exact corpus chain
        run: |
          python -m py_compile \
            research/kalshi/ng_corpus_coverage_audit.py \
            research/kalshi/ng_corpus_inspection.py \
            research/kalshi/ng_corpus_materialization.py \
            research/kalshi/ng_historical_normalize.py \
            research/kalshi/ng_corpus_quarantine_storage.py \
            research/kalshi/ng_corpus_identity_probe.py \
            research/kalshi/ng_corpus_quarantine_probe.py \
            research/kalshi/tests/test_ng_corpus_quarantine_probe.py
      - name: Run quarantine probe self-test
        working-directory: research/kalshi
        run: python ng_corpus_quarantine_probe.py --selftest
      - name: Run quarantine probe tests
        working-directory: research/kalshi
        run: pytest -q tests/test_ng_corpus_quarantine_probe.py

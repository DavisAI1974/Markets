name: NG inventory-finalized readiness v26 execution chain

on:
  push:
    paths:
      - "research/kalshi/ng_corpus_inventory_finalization_contract.py"
      - "research/kalshi/ng_historical_refinement_readiness_v26.py"
      - "research/kalshi/ng_historical_refinement_executor_v22.py"
      - "research/kalshi/ng_corpus_executor_plan_compiler_v21.py"
      - "research/kalshi/ng_corpus_executor_pipeline_arm_v21.py"
      - "research/kalshi/ng_historical_refinement_preflight_v22.py"
      - "research/kalshi/tests/test_ng_readiness_v26_execution_chain.py"
      - ".github/workflows/ng_readiness_v26_execution_chain_ci.yml"
  pull_request:
    paths:
      - "research/kalshi/ng_corpus_inventory_finalization_contract.py"
      - "research/kalshi/ng_historical_refinement_readiness_v26.py"
      - "research/kalshi/ng_historical_refinement_executor_v22.py"
      - "research/kalshi/ng_corpus_executor_plan_compiler_v21.py"
      - "research/kalshi/ng_corpus_executor_pipeline_arm_v21.py"
      - "research/kalshi/ng_historical_refinement_preflight_v22.py"
      - "research/kalshi/tests/test_ng_readiness_v26_execution_chain.py"
      - ".github/workflows/ng_readiness_v26_execution_chain_ci.yml"

jobs:
  inventory-finalized-execution-v26:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile readiness v26 execution chain
        run: |
          python -m py_compile \
            ng_corpus_inventory_finalization_contract.py \
            ng_historical_refinement_readiness_v26.py \
            ng_historical_refinement_executor_v22.py \
            ng_corpus_executor_plan_compiler_v21.py \
            ng_corpus_executor_pipeline_arm_v21.py \
            ng_historical_refinement_preflight_v22.py \
            tests/test_ng_readiness_v26_execution_chain.py
      - name: Run upstream self-tests
        run: |
          python ng_corpus_inventory_finalization_contract.py selftest
          python ng_historical_refinement_readiness_v26.py --selftest
      - name: Run focused execution tests
        run: python -m pytest -q tests/test_ng_readiness_v26_execution_chain.py
      - name: Verify finalization chronology and authority wall
        run: |
          python - <<'PY'
          import ng_corpus_executor_plan_compiler_v21 as compiler
          import ng_historical_refinement_executor_v22 as executor
          import ng_historical_refinement_readiness_v26 as readiness

          keys = [spec.key for spec in readiness.STAGES]
          assert keys[:4] == [
              "corpus_expected_day_contract",
              "corpus_inventory_finalization_contract",
              "corpus_s3_latest_version_resolution",
              "corpus_s3_inventory_capture",
          ]
          assert compiler.CONFIGURED_STAGES[:4] == tuple(keys[:4])
          assert executor.SUGGESTED_ENTRYPOINTS[
              "corpus_inventory_finalization_contract"
          ] == (
              "python",
              "ng_corpus_inventory_finalization_contract.py",
              "build",
          )
          receipt = {
              "actual_outcomes_used": False,
              "paid_live_data_assumed": False,
              "random_shuffle_used": False,
              "one_signal_authority_preserved": True,
              "blind_forecasts_immutable": True,
              "may_change_blind_forecast": False,
              "may_change_posterior": False,
              "may_update_ng_brain": False,
              "execution_authority": False,
              "cme_event_contracts_mode": "SHADOW",
              "brokerage_contract": "tastytrade_not_ibkr",
              "options_lane_started": False,
          }
          compiler._authority(receipt, label="CI authority wall")
          PY

name: NG Exhaustion Corpus Inventory 20260817

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-aftermath-20260817
    paths:
      - .github/workflows/ng_exhaustion_corpus_inventory_20260817.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      BUCKET: bento-568968024170-us-east-2-an
    steps:
      - uses: actions/checkout@v4
      - name: Inventory NYMEX prefixes and target-week objects
        run: |
          set -euo pipefail
          aws s3api list-objects-v2 --bucket "${BUCKET}" --prefix nymex/ --delimiter / --output json > nymex_prefixes.json
          aws s3 ls "s3://${BUCKET}/nymex/nymex_cont/" > nymex_cont_inventory.txt || true
          aws s3 ls "s3://${BUCKET}/nymex/" --recursive | \
            grep -E '2025071[3-8]|2025092[1-9]|20250930|2025100[1-3]' > nymex_target_week_matches.txt || true
          echo '=== PREFIXES ==='
          cat nymex_prefixes.json
          echo '=== NYMEX_CONT ==='
          cat nymex_cont_inventory.txt
          echo '=== TARGET-WEEK MATCHES ==='
          cat nymex_target_week_matches.txt
      - name: Upload corpus inventory
        uses: actions/upload-artifact@v4
        with:
          name: ng-exhaustion-corpus-inventory-20260817
          path: |
            nymex_prefixes.json
            nymex_cont_inventory.txt
            nymex_target_week_matches.txt
          if-no-files-found: error

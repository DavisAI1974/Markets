name: NG inventory finalization readiness v26

on:
  push:
    paths:
      - "research/kalshi/ng_corpus_inventory_finalization_contract.py"
      - "research/kalshi/ng_historical_refinement_readiness_v26.py"
      - "research/kalshi/ng_historical_refinement_executor_v22.py"
      - "research/kalshi/tests/test_ng_corpus_inventory_finalization_contract.py"
      - "research/kalshi/tests/test_ng_inventory_finalization_readiness_v26.py"
      - ".github/workflows/ng_inventory_finalization_readiness_v26_ci.yml"
  pull_request:
    paths:
      - "research/kalshi/ng_corpus_inventory_finalization_contract.py"
      - "research/kalshi/ng_historical_refinement_readiness_v26.py"
      - "research/kalshi/ng_historical_refinement_executor_v22.py"
      - "research/kalshi/tests/test_ng_corpus_inventory_finalization_contract.py"
      - "research/kalshi/tests/test_ng_inventory_finalization_readiness_v26.py"
      - ".github/workflows/ng_inventory_finalization_readiness_v26_ci.yml"

jobs:
  inventory-finalization-v26:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile finalization readiness chain
        run: |
          python -m py_compile \
            ng_corpus_inventory_finalization_contract.py \
            ng_historical_refinement_readiness_v26.py \
            ng_historical_refinement_executor_v22.py \
            tests/test_ng_corpus_inventory_finalization_contract.py \
            tests/test_ng_inventory_finalization_readiness_v26.py
      - name: Run self-tests
        run: |
          python ng_corpus_inventory_finalization_contract.py selftest
          python ng_historical_refinement_readiness_v26.py --selftest
      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/test_ng_corpus_inventory_finalization_contract.py \
            tests/test_ng_inventory_finalization_readiness_v26.py
      - name: Verify front-door chronology and authority wall
        run: |
          python - <<'PY'
          from pathlib import Path

          import ng_historical_refinement_executor_v22 as executor
          import ng_historical_refinement_readiness_v26 as readiness

          keys = [spec.key for spec in readiness.STAGES]
          assert keys[:4] == [
              "corpus_expected_day_contract",
              "corpus_inventory_finalization_contract",
              "corpus_s3_latest_version_resolution",
              "corpus_s3_inventory_capture",
          ]
          assert executor.SUGGESTED_ENTRYPOINTS[
              "corpus_inventory_finalization_contract"
          ] == (
              "python",
              "ng_corpus_inventory_finalization_contract.py",
              "build",
          )
          plan = executor.build_plan(
              Path("renders/ng_refine_s95"),
              Path("."),
          )
          assert plan["random_shuffle_used"] is False
          assert plan["blind_forecasts_immutable"] is True
          assert plan["may_update_ng_brain"] is False
          assert plan["execution_authority"] is False
          assert plan["cme_event_contracts_mode"] == "SHADOW"
          assert plan["brokerage_contract"] == "tastytrade_not_ibkr"
          assert plan["options_lane_started"] is False
          PY

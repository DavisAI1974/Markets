name: NG Definition Observation CI

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - research/kalshi/ng_definition_observation.py
      - research/kalshi/ng_definition_observation_support.py
      - research/kalshi/ng_corpus_inspection.py
      - research/kalshi/ng_historical_normalize.py
      - research/kalshi/tests/test_ng_definition_observation.py
      - .github/workflows/ng_definition_observation_ci.yml
  pull_request:
    paths:
      - research/kalshi/ng_definition_observation.py
      - research/kalshi/ng_definition_observation_support.py
      - research/kalshi/ng_corpus_inspection.py
      - research/kalshi/ng_historical_normalize.py
      - research/kalshi/tests/test_ng_definition_observation.py
      - .github/workflows/ng_definition_observation_ci.yml

permissions:
  contents: read

jobs:
  definition-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Compile definition observation chain
        run: |
          python -m py_compile \
            research/kalshi/ng_historical_normalize.py \
            research/kalshi/ng_corpus_inspection.py \
            research/kalshi/ng_definition_observation_support.py \
            research/kalshi/ng_definition_observation.py \
            research/kalshi/tests/test_ng_definition_observation.py
      - name: Run definition observation self-test
        working-directory: research/kalshi
        run: python ng_definition_observation.py --selftest
      - name: Run definition observation tests
        working-directory: research/kalshi
        run: pytest -q tests/test_ng_definition_observation.py

name: NG dual inspection readiness v16

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - research/kalshi/ng_historical_refinement_readiness_v16.py
      - research/kalshi/ng_historical_refinement_executor_v13.py
      - research/kalshi/ng_historical_refinement_preflight_v13.py
      - research/kalshi/ng_corpus_executor_plan_compiler_v12.py
      - research/kalshi/ng_corpus_executor_pipeline_arm_v12.py
      - research/kalshi/tests/test_ng_dual_inspection_readiness_v16.py
      - .github/workflows/ng_dual_inspection_readiness_v16_ci.yml
  workflow_dispatch:

jobs:
  dual-inspection-readiness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Compile dual-inspection chain
        run: |
          python -m py_compile \
            ng_historical_refinement_readiness_v15.py \
            ng_historical_refinement_readiness_v16.py \
            ng_historical_refinement_executor_v12.py \
            ng_historical_refinement_executor_v13.py \
            ng_historical_refinement_preflight_v12.py \
            ng_historical_refinement_preflight_v13.py \
            ng_corpus_executor_plan_compiler_v12.py \
            ng_corpus_executor_pipeline_arm_v12.py \
            tests/test_ng_dual_inspection_readiness_v16.py
      - name: Run readiness v16 self-test
        run: python ng_historical_refinement_readiness_v16.py --selftest
      - name: Run focused dual-inspection tests
        run: python -m pytest -q tests/test_ng_dual_inspection_readiness_v16.py
      - name: Verify exact artifact routing and authority wall
        run: |
          python - <<'PY'
          from pathlib import Path

          import ng_corpus_executor_pipeline_arm_v12 as arm
          import ng_corpus_executor_plan_compiler_v12 as compiler
          import ng_historical_refinement_executor_v13 as executor
          import ng_historical_refinement_preflight_v13 as preflight
          import ng_historical_refinement_readiness_v16 as readiness

          keys = [spec.key for spec in readiness.STAGES]
          expected = [
              "corpus_coverage",
              "corpus_definition_byte_binding",
              "target_slice_coverage",
              "basis_inventory_regeneration",
              "replay_catalog_export",
              "broad_corpus_scope",
              "broad_corpus_exact_overlap",
              "broad_corpus_exact_partition",
          ]
          assert keys[:8] == expected
          assert list(compiler.CONFIGURED_STAGES) == expected
          assert list(arm.ARMED_STAGES) == expected
          assert preflight.STAGE_ORDER == keys
          assert preflight.READINESS_CONTRACT == readiness.SCHEMA
          commands = compiler._commands(
              artifact_dir=Path("renders/ng_refine_s95"),
              inventory_receipt_path=Path("renders/ng_refine_s95/ng_corpus_inventory_plan_compiler.json"),
              broad_plan_path=Path("renders/ng_refine_s95/ng_corpus_inspection_plan.json"),
              slice_bundle_path=Path("renders/ng_refine_s95/ng_target_day_slice_bundle.json"),
              target_plan_path=Path("renders/ng_refine_s95/ng_target_day_inspection_plan.json"),
          )
          broad = " ".join(commands["corpus_coverage"])
          binding = " ".join(commands["corpus_definition_byte_binding"])
          target = " ".join(commands["target_slice_coverage"])
          basis = " ".join(commands["basis_inventory_regeneration"])
          replay = " ".join(commands["replay_catalog_export"])
          scope = " ".join(commands["broad_corpus_scope"])
          assert "ng_corpus_inspection_receipt.json" in broad
          assert "ng_corpus_inspection_receipt.json" in binding
          assert "ng_target_slice_inspection_receipt.json" not in binding
          assert "ng_target_slice_inspection_receipt.json" in target
          assert "ng_target_slice_inspection_receipt.json" in basis
          assert "ng_corpus_inspection_receipt.json" not in basis
          assert "ng_target_slice_catalog.json" in replay
          assert "ng_target_slice_coverage_audit.json" in replay
          assert "ng_corpus_inspection_receipt.json" in scope
          assert "ng_target_slice_inspection_receipt.json" not in scope
          fixture = readiness._linked_fixture_chain()["target_slice_coverage"]
          assert fixture["actual_outcomes_used"] is False
          assert fixture["paid_live_data_assumed"] is False
          assert fixture["random_shuffle_used"] is False
          assert fixture["one_signal_authority_preserved"] is True
          assert fixture["blind_forecasts_immutable"] is True
          assert fixture["may_update_ng_brain"] is False
          assert fixture["execution_authority"] is False
          assert fixture["cme_event_contracts_mode"] == "SHADOW"
          assert fixture["brokerage_contract"] == "tastytrade_not_ibkr"
          assert fixture["options_lane_started"] is False
          assert not any("option" in key.lower() for key in executor.SUGGESTED_ENTRYPOINTS)
          PY

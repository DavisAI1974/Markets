name: NG Live Verify and Start 20260820

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-entry-timing-revival-20260818
    paths:
      - '.github/workflows/ng_live_verify_start_20260820.yml'

permissions:
  contents: write

jobs:
  verify-start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      INSTANCE_ID: i-08cee7171c0a76a04
      RECEIPT: research/kalshi/NG_LIVE_HEALTH_RECEIPT_20260820.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ng-exhaustion-entry-timing-revival-20260818

      - name: Validate AWS credential binding
        id: aws
        shell: bash
        run: |
          set -euo pipefail
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v GitHub Actions secret is not available to this workflow"
              exit 2
            fi
          done
          aws sts get-caller-identity >/dev/null
          ping_status="$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)"
          echo "ssm_ping_status=$ping_status"
          test "$ping_status" = "Online"

      - name: Verify collector and start only if inactive
        id: remote
        shell: bash
        run: |
          set -u
          python - <<'PY'
          import json
          command = r'''set -eu
          ENV_FILE=/etc/markets/markets.env
          HEALTH=/var/lib/markets/ng_live/health.json
          if ! grep -Eq '^DATABENTO_API_KEY=db-[A-Za-z0-9_-]{10,}$' "$ENV_FILE" 2>/dev/null; then
            echo 'databento_key_on_instance=missing'
            exit 20
          fi
          before="$(systemctl is-active markets-ng-live.service 2>/dev/null || true)"
          echo "collector_before=$before"
          if [ "$before" != "active" ]; then
            systemctl enable --now markets-ng-live.service
          fi
          systemctl enable --now markets-ng-live-watchdog.timer
          for _ in $(seq 1 30); do
            if [ -s "$HEALTH" ]; then
              break
            fi
            sleep 2
          done
          systemctl is-active --quiet markets-ng-live.service
          python3 - <<'PYERR'
          import glob, json, os
          import databento as db
          errors = []
          paths = sorted(glob.glob('/var/lib/markets/ng_live/NG_live_*.dbn'), key=os.path.getmtime)[-3:]
          for path in paths:
              try:
                  store = db.DBNStore.from_file(path)
                  for rec in store:
                      if type(rec).__name__ != 'ErrorMsg':
                          continue
                      err = getattr(rec, 'err', None)
                      if isinstance(err, (bytes, bytearray)):
                          err = bytes(err).split(b'\x00', 1)[0].decode('utf-8', 'replace')
                      else:
                          err = str(err)
                      if err and err not in errors:
                          errors.append(err)
              except Exception as exc:
                  errors.append(f'DBN_DECODE_ERROR:{type(exc).__name__}:{exc}')
          print('gateway_errors=' + json.dumps(errors, sort_keys=True))
          PYERR
          python3 - <<'PY2'
          import json
          path = '/var/lib/markets/ng_live/health.json'
          p = json.load(open(path, encoding='utf-8'))
          safe = {
              'connection': p.get('connection'),
              'requested_symbol': p.get('requested_symbol'),
              'raw_symbol': p.get('raw_symbol'),
              'instrument_id': p.get('instrument_id'),
              'record_age_ms': p.get('record_age_ms'),
              'archive_bytes': p.get('archive_bytes'),
              'record_counts': p.get('record_counts'),
              'reconnect_count': p.get('reconnect_count'),
              'last_error': p.get('last_error'),
          }
          print('health=' + json.dumps(safe, sort_keys=True))
          age = p.get('record_age_ms')
          if p.get('connection') != 'live':
              raise SystemExit('collector health is not live')
          if age is None or float(age) > 120000:
              raise SystemExit(f'collector record_age_ms is stale: {age}')
          counts = p.get('record_counts') or {}
          if not any('Mbo' in str(k) for k in counts):
              raise SystemExit('collector is live but no MBO record type has been observed')
          PY2
          echo "collector_after=$(systemctl is-active markets-ng-live.service 2>/dev/null || true)"
          echo "watchdog_timer_after=$(systemctl is-active markets-ng-live-watchdog.timer 2>/dev/null || true)"
          '''
          with open('/tmp/ssm-params.json', 'w', encoding='utf-8') as f:
              json.dump({'commands': [command]}, f)
          PY

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'Verify/start Markets NG live MBO collector; decode gateway errors; no V4 activity' \
            --parameters file:///tmp/ssm-params.json \
            --query 'Command.CommandId' \
            --output text)" || exit 30
          echo "ssm_command_id=$command_id"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --output json > /tmp/ng-live-invocation.json || exit 31
          cat /tmp/ng-live-invocation.json
          status="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/ng-live-invocation.json'))['Status'])
          PY
          )"
          python - <<'PY'
          import datetime as dt, json, os
          inv = json.load(open('/tmp/ng-live-invocation.json', encoding='utf-8'))
          receipt = {
              'schema': 'NG_LIVE_HEALTH_RECEIPT_V1',
              'checked_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
              'instance_id': os.environ['INSTANCE_ID'],
              'source_commit': os.environ.get('GITHUB_SHA'),
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
              'ssm_status': inv.get('Status'),
              'stdout': inv.get('StandardOutputContent', ''),
              'stderr': inv.get('StandardErrorContent', ''),
              'secrets_exposed': False,
              'v4_activity': False,
          }
          os.makedirs(os.path.dirname(os.environ['RECEIPT']), exist_ok=True)
          with open(os.environ['RECEIPT'], 'w', encoding='utf-8') as f:
              json.dump(receipt, f, indent=2, sort_keys=True)
              f.write('\n')
          PY
          test "$status" = "Success"

      - name: Commit sanitized health receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$RECEIPT" ]; then
            echo "No receipt produced; remote step failed before an SSM invocation result was available."
            exit 0
          fi
          git config user.name "Markets Ops Bot"
          git config user.email "noreply@openai.com"
          git add "$RECEIPT"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ops: record sanitized NG live health receipt"
          git push origin HEAD:chatgpt/ng-exhaustion-entry-timing-revival-20260818

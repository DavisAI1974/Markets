name: G15 Replay Manifest Bridge CI

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - 'research/kalshi/ng_g15_replay_manifest_bridge.py'
      - 'research/kalshi/ng_g15_corpus_basis_gate.py'
      - 'research/kalshi/ng_historical_manifest.py'
      - 'research/kalshi/tests/test_ng_g15_replay_manifest_bridge.py'
      - 'research/kalshi/renders/ng_refine_s95/g15_mbo_l1_manifest.json'
      - '.github/workflows/ng_g15_replay_manifest_bridge_ci.yml'
  pull_request:
    paths:
      - 'research/kalshi/ng_g15_replay_manifest_bridge.py'
      - 'research/kalshi/ng_g15_corpus_basis_gate.py'
      - 'research/kalshi/ng_historical_manifest.py'
      - 'research/kalshi/tests/test_ng_g15_replay_manifest_bridge.py'
      - 'research/kalshi/renders/ng_refine_s95/g15_mbo_l1_manifest.json'
      - '.github/workflows/ng_g15_replay_manifest_bridge_ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile bridge contracts
        run: |
          python -m py_compile \
            research/kalshi/ng_g15_replay_manifest_bridge.py \
            research/kalshi/ng_g15_corpus_basis_gate.py \
            research/kalshi/ng_historical_manifest.py \
            research/kalshi/tests/test_ng_g15_replay_manifest_bridge.py

      - name: Run contract self-tests
        working-directory: research/kalshi
        run: |
          python ng_g15_corpus_basis_gate.py --selftest
          python ng_historical_manifest.py --selftest
          python ng_g15_replay_manifest_bridge.py --selftest

      - name: Run replay-manifest bridge tests
        run: python -m unittest -v research/kalshi/tests/test_ng_g15_replay_manifest_bridge.py

      - name: Confirm current blocked inventory yields UNKNOWN catalog only
        working-directory: research/kalshi
        run: |
          python ng_g15_replay_manifest_bridge.py \
            --inventory renders/ng_refine_s95/g15_mbo_l1_manifest.json \
            --init-catalog \
            --out /tmp/g15_replay_source_catalog.json
          python - <<'PY'
          import json
          catalog = json.load(open('/tmp/g15_replay_source_catalog.json'))
          assert catalog['status'] == 'UNKNOWN'
          assert len(catalog['sources']) == 24
          assert all(row['status'] == 'UNKNOWN' for row in catalog['sources'])
          assert all(row['location'] is None for row in catalog['sources'])
          assert catalog['actual_outcomes_used'] is False
          assert catalog['may_update_ng_brain'] is False
          assert catalog['execution_authority'] is False
          print('[g15-replay-manifest-bridge] current inventory remains truthfully UNKNOWN at source-object layer')
          PY

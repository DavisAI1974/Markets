name: Launch Granite service

on:
  push:
    branches: [codex/granite-runpod-launch-20260915]
    paths: [.github/granite-launch-request.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: granite-runpod-one-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: cloud-${{ matrix.mode }}
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [watchdog, controller]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned host dependencies
        timeout-minutes: 4
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.4.3 boto3==1.42.23 pytest==8.3.5
      # Reuse the 70 passing Linux checks from run 34924522636.
      # The continuation changes are checked locally before explicit dispatch.
      - name: Run bounded smoke role
        timeout-minutes: 36
        env:
          MODE: ${{ matrix.mode }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: us-east-1
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python -m research.kalshi.frankie_boss.granite_runpod_cloud "$MODE"
      - name: Retain scoped smoke receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: granite-runpod-${{ matrix.mode }}-${{ github.run_id }}
          path: work/cloud-receipts/
          retention-days: 30
          if-no-files-found: warn

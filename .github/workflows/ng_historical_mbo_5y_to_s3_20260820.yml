name: NG Historical MBO 5Y to S3 20260820

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-entry-timing-revival-20260818
    paths:
      - '.github/workflows/ng_historical_mbo_5y_to_s3_20260820.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull-year:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - label: y1_2021-08-20_2022-08-20
            start: '2021-08-20'
            end: '2022-08-20'
            max_usd: '32.60'
          - label: y2_2022-08-20_2023-08-20
            start: '2022-08-20'
            end: '2023-08-20'
            max_usd: '29.98'
          - label: y3_2023-08-20_2024-08-20
            start: '2023-08-20'
            end: '2024-08-20'
            max_usd: '21.99'
          - label: y4_2024-08-20_2025-08-20
            start: '2024-08-20'
            end: '2025-08-20'
            max_usd: '33.32'
          - label: y5_2025-08-20_2026-08-20
            start: '2025-08-20'
            end: '2026-08-20'
            max_usd: '27.91'
    env:
      DATABENTO_API_KEY: ${{ secrets.MARKETS_NG_LIVE_MBO }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      BUCKET: bento-568968024170-us-east-2-an
      PREFIX: nymex/ng_mbo_5y_v0
      DATASET: GLBX.MDP3
      SYMBOL: NG.v.0
      STYPE: continuous
      SCHEMA: mbo
      START: ${{ matrix.start }}
      END: ${{ matrix.end }}
      LABEL: ${{ matrix.label }}
      YEAR_MAX_USD: ${{ matrix.max_usd }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ng-exhaustion-entry-timing-revival-20260818

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install clients
        run: python -m pip install --quiet databento boto3

      - name: Preflight and resumable native DBN ingest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import calendar
          import datetime as dt
          import glob
          import hashlib
          import json
          import os
          import tempfile
          import time
          from pathlib import Path

          import boto3
          import databento as db

          key = os.environ['DATABENTO_API_KEY']
          if not key:
              raise SystemExit('MARKETS_NG_LIVE_MBO secret unavailable')

          bucket = os.environ['BUCKET']
          prefix = os.environ['PREFIX'].strip('/')
          dataset = os.environ['DATASET']
          symbol = os.environ['SYMBOL']
          stype = os.environ['STYPE']
          schema = os.environ['SCHEMA']
          start = dt.date.fromisoformat(os.environ['START'])
          end = dt.date.fromisoformat(os.environ['END'])
          label = os.environ['LABEL']
          year_max = float(os.environ['YEAR_MAX_USD'])

          s3 = boto3.client('s3', region_name=os.environ.get('AWS_DEFAULT_REGION'))
          client = db.Historical(key)

          # Hard cost gate for the entire assigned year before any new job is submitted.
          quoted = float(client.metadata.get_cost(
              dataset=dataset, symbols=[symbol], stype_in=stype, schema=schema,
              start=start.isoformat(), end=end.isoformat()))
          print(f'[preflight] {label} quote=${quoted:.12f} ceiling=${year_max:.2f}', flush=True)
          if quoted > year_max:
              raise SystemExit(f'year quote ${quoted:.6f} exceeds hard ceiling ${year_max:.2f}')

          def exists(key_name: str) -> bool:
              try:
                  s3.head_object(Bucket=bucket, Key=key_name)
                  return True
              except Exception as exc:
                  code = getattr(exc, 'response', {}).get('Error', {}).get('Code')
                  if str(code) in {'404', 'NoSuchKey', 'NotFound'}:
                      return False
                  # boto3 ClientError often uses numeric 404 in metadata only.
                  status = getattr(exc, 'response', {}).get('ResponseMetadata', {}).get('HTTPStatusCode')
                  if status == 404:
                      return False
                  raise

          def get_json(key_name: str):
              return json.loads(s3.get_object(Bucket=bucket, Key=key_name)['Body'].read())

          def put_json(key_name: str, obj):
              s3.put_object(Bucket=bucket, Key=key_name,
                            Body=(json.dumps(obj, indent=2, sort_keys=True) + '\n').encode(),
                            ContentType='application/json')

          def month_ranges(a: dt.date, b: dt.date):
              cur = a
              while cur < b:
                  if cur.month == 12:
                      nxt = dt.date(cur.year + 1, 1, 1)
                  else:
                      nxt = dt.date(cur.year, cur.month + 1, 1)
                  stop = min(nxt, b)
                  yield cur, stop
                  cur = stop

          receipt = {
              'schema': 'NG_MBO_5Y_NATIVE_DBN_INGEST_V1',
              'label': label,
              'dataset': dataset,
              'symbol': symbol,
              'stype_in': stype,
              'data_schema': schema,
              'start': start.isoformat(),
              'end': end.isoformat(),
              'year_quote_usd': quoted,
              'year_ceiling_usd': year_max,
              'native_dbn_preserved': True,
              'canonical_conversion_performed': False,
              'months': [],
          }

          for ms, me in month_ranges(start, end):
              month = ms.strftime('%Y-%m')
              done_key = f'{prefix}/_done/{month}.done'
              job_key = f'{prefix}/_jobs/{month}.json'
              manifest_key = f'{prefix}/manifests/{month}.json'

              if exists(done_key) and exists(manifest_key):
                  print(f'[resume] {month} already complete', flush=True)
                  receipt['months'].append({'month': month, 'status': 'already_complete'})
                  continue

              monthly_quote = float(client.metadata.get_cost(
                  dataset=dataset, symbols=[symbol], stype_in=stype, schema=schema,
                  start=ms.isoformat(), end=me.isoformat()))
              print(f'[quote] {month} ${monthly_quote:.8f}', flush=True)

              if exists(job_key):
                  saved = get_json(job_key)
                  jid = saved['job_id']
                  print(f'[resume] {month} reuse job {jid}', flush=True)
              else:
                  job = client.batch.submit_job(
                      dataset=dataset,
                      symbols=[symbol],
                      stype_in=stype,
                      schema=schema,
                      start=ms.isoformat(),
                      end=me.isoformat(),
                      encoding='dbn',
                      compression='zstd',
                      split_duration='day',
                  )
                  jid = job.get('id')
                  if not jid:
                      raise RuntimeError(f'no job id returned for {month}: {job}')
                  saved = {
                      'job_id': jid,
                      'month': month,
                      'start': ms.isoformat(),
                      'end': me.isoformat(),
                      'quote_usd': monthly_quote,
                      'submitted_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
                      'dataset': dataset,
                      'symbol': symbol,
                      'stype_in': stype,
                      'schema': schema,
                  }
                  put_json(job_key, saved)
                  print(f'[submit] {month} job={jid}', flush=True)

              # Poll the durable Databento batch job. Re-runs reuse job id instead of rebuying.
              deadline = time.time() + 4.5 * 3600
              while True:
                  det = client.batch.get_job_details(jid)
                  state = det.get('state')
                  print(f'[poll] {month} job={jid} state={state}', flush=True)
                  if state == 'done':
                      break
                  if state in {'failed', 'expired'}:
                      raise RuntimeError(f'{month} job {jid} state={state}')
                  if time.time() > deadline:
                      raise RuntimeError(f'{month} job {jid} polling deadline exceeded; rerun will reuse it')
                  time.sleep(30)

              with tempfile.TemporaryDirectory(prefix=f'ngmbo_{month}_') as tmp:
                  client.batch.download(jid, output_dir=tmp)
                  files = sorted(glob.glob(os.path.join(tmp, '**', '*.dbn.zst'), recursive=True))
                  if not files:
                      raise RuntimeError(f'{month} job {jid}: no .dbn.zst files downloaded')

                  entries = []
                  for file_path in files:
                      p = Path(file_path)
                      h = hashlib.sha256()
                      size = 0
                      with p.open('rb') as fh:
                          for chunk in iter(lambda: fh.read(8 * 1024 * 1024), b''):
                              h.update(chunk)
                              size += len(chunk)

                      # Validate this is readable native DBN and contains MBO records; never rewrite it.
                      store = db.DBNStore.from_file(str(p))
                      first_type = None
                      count_probe = 0
                      for rec in store:
                          first_type = first_type or type(rec).__name__
                          count_probe += 1
                          if count_probe >= 100:
                              break
                      if first_type is None:
                          raise RuntimeError(f'{p.name}: empty DBN file')
                      if first_type not in {'MBOMsg', 'SymbolMappingMsg', 'SystemMsg', 'ErrorMsg'}:
                          raise RuntimeError(f'{p.name}: unexpected first record type {first_type}')

                      dest_key = f'{prefix}/native/{month}/{p.name}'
                      s3.upload_file(str(p), bucket, dest_key, ExtraArgs={'Metadata': {
                          'sha256': h.hexdigest(),
                          'dataset': dataset,
                          'schema': schema,
                          'symbol': symbol,
                          'stype': stype,
                          'job_id': str(jid),
                      }})
                      # Verify remote byte count after upload.
                      head = s3.head_object(Bucket=bucket, Key=dest_key)
                      if int(head['ContentLength']) != size:
                          raise RuntimeError(f'{p.name}: S3 size mismatch local={size} remote={head["ContentLength"]}')
                      entries.append({
                          'file': p.name,
                          's3_key': dest_key,
                          'bytes': size,
                          'sha256': h.hexdigest(),
                          'first_record_type_probe': first_type,
                      })
                      print(f'[upload] {month} {p.name} bytes={size} sha256={h.hexdigest()[:16]}...', flush=True)

              manifest = {
                  'schema': 'NG_MBO_NATIVE_MONTH_MANIFEST_V1',
                  'month': month,
                  'dataset': dataset,
                  'symbol': symbol,
                  'stype_in': stype,
                  'data_schema': schema,
                  'start': ms.isoformat(),
                  'end': me.isoformat(),
                  'job_id': jid,
                  'quote_usd': monthly_quote,
                  'native_dbn_preserved': True,
                  'files': entries,
                  'completed_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
              }
              put_json(manifest_key, manifest)
              s3.put_object(Bucket=bucket, Key=done_key,
                            Body=(json.dumps({'month': month, 'job_id': jid, 'manifest': manifest_key}) + '\n').encode())
              receipt['months'].append({'month': month, 'status': 'complete', 'job_id': jid,
                                        'quote_usd': monthly_quote, 'files': len(entries)})

          receipt['completed_at_utc'] = dt.datetime.now(dt.timezone.utc).isoformat()
          Path(f'/tmp/{label}.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          put_json(f'{prefix}/year_receipts/{label}.json', receipt)
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload run receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ng-mbo-5y-${{ matrix.label }}
          path: /tmp/${{ matrix.label }}.json
          if-no-files-found: ignore

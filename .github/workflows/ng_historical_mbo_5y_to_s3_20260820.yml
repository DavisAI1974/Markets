name: NG Historical MBO 5Y to S3 20260820

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-entry-timing-revival-20260818
    paths:
      - '.github/workflows/ng_historical_mbo_5y_to_s3_20260820.yml'
      - 'research/kalshi/ng_mbo_5y_native_to_s3.py'
      - 'research/kalshi/ng_mbo_5y_native_to_s3_safe.py'
  workflow_dispatch:
    # 2026-09-29 (Greg: "do the 30 days immediately"): two more modes on this already-registered workflow, because a new
    # workflow file cannot be dispatched until it has run once. five_year (default) is the original job, unchanged.
    inputs:
      mode:
        description: 'five_year (original) | curve_days (NG.FUT parent for the 30 experiment days) | day_history (free sources)'
        required: false
        default: 'five_year'
      schemas:
        description: 'curve_days: comma list of definition,statistics,mbo'
        required: false
        default: 'definition,statistics,mbo'
      ceiling_usd:
        description: 'curve_days: hard ceiling on the whole quote; nothing is bought above it'
        required: false
        default: '100'
      ranges:
        description: 'curve_days: comma list of UTC START:END (YYYY-MM-DD, END exclusive) instead of the 30 days; empty = the 30 days'
        required: false
        default: ''
      quote_only:
        description: 'curve_days: 1 = print the quotes, buy nothing'
        required: false
        default: '0'
      families:
        description: 'day_history: all, or a comma list of calendar,cot,storage,consensus,weather_obs,mos,eia930'
        required: false
        default: 'all'
      days:
        description: 'day_history: comma list of YYYYMMDD, a subset of the selected days (empty = all of them)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  pull-year:
    if: ${{ github.event_name == 'push' || inputs.mode == '' || inputs.mode == 'five_year' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - label: y1_2021-08-20_2022-08-20
            start: '2021-08-20'
            end: '2022-08-20'
            max_usd: '32.60'
          - label: y2_2022-08-20_2023-08-20
            start: '2022-08-20'
            end: '2023-08-20'
            max_usd: '29.98'
          - label: y3_2023-08-20_2024-08-20
            start: '2023-08-20'
            end: '2024-08-20'
            max_usd: '21.99'
          - label: y4_2024-08-20_2025-08-20
            start: '2024-08-20'
            end: '2025-08-20'
            max_usd: '33.32'
          - label: y5_2025-08-20_2026-08-20
            start: '2025-08-20'
            end: '2026-08-20'
            max_usd: '27.91'
    env:
      DATABENTO_API_KEY: ${{ secrets.MARKETS_NG_LIVE_MBO }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      BUCKET: bento-568968024170-us-east-2-an
      PREFIX: nymex/ng_mbo_5y_v0
      DATASET: GLBX.MDP3
      SYMBOL: NG.v.0
      STYPE: continuous
      SCHEMA: mbo
      START: ${{ matrix.start }}
      END: ${{ matrix.end }}
      LABEL: ${{ matrix.label }}
      YEAR_MAX_USD: ${{ matrix.max_usd }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install clients
        run: python -m pip install --quiet databento boto3

      - name: Pull native MBO segments to S3 with legacy-job reuse guard
        run: python research/kalshi/ng_mbo_5y_native_to_s3_safe.py

      - name: Upload run receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ng-mbo-5y-${{ matrix.label }}
          path: /tmp/${{ matrix.label }}.json
          if-no-files-found: ignore

  curve-days:
    # The futures curve for the 30 experiment days (research/kalshi/frankie_boss/operations/pull_curve_days.py).
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'curve_days' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABENTO_API_KEY: ${{ secrets.MARKETS_NG_LIVE_MBO }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      BUCKET: bento-568968024170-us-east-2-an
      PREFIX: nymex/ng_fut_parent_v0
      SCHEMAS: ${{ inputs.schemas }}
      CEILING_USD: ${{ inputs.ceiling_usd }}
      CANDIDATES: ${{ inputs.ranges == '' && 'research/kalshi/frankie_boss/blocks/DAY_SELECTION_CANDIDATES_20260929.json' || '' }}
      RANGES: ${{ inputs.ranges }}
      QUOTE_ONLY: ${{ inputs.quote_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet databento boto3
      - run: |
          case "$SCHEMAS" in *[!a-z0-9_,-]*) echo "schemas must be a comma list"; exit 2;; esac
          case "$CEILING_USD" in *[!0-9.]*) echo "ceiling must be a number"; exit 2;; esac
          case "$RANGES" in *[!0-9:,-]*) echo "ranges must be START:END,START:END"; exit 2;; esac
          python research/kalshi/frankie_boss/operations/pull_curve_days.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curve-days-${{ github.run_id }}
          path: /tmp/curve-days-receipt.json
          if-no-files-found: ignore

  day-history:
    # The free historical sources for the 30 days (research/kalshi/frankie_boss/operations/fetch_day_history.py), the
    # same steps as frankie_day_history.yml action=fetch; uploads under frankie/day_history/<run_id>/ only.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'day_history' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      PYTHONPATH: research/kalshi
      FAMILIES: ${{ inputs.families }}
      DAY_HISTORY_DAYS: ${{ inputs.days }}
      # the fetch stops making requests after 330 min (each then recorded as a gap) so every receipt closes and uploads
      DAY_HISTORY_DEADLINE_S: '19800'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir requests boto3==1.42.23
      - name: EIA key (the repository secret, else SSM /markets/EIA_API_KEY in us-east-2; never printed)
        # Run 36557302661 ran with the secret empty and fell back to DEMO_KEY (EIA answered 429). The key of record is the
        # SSM SecureString (KEYS.md). Masked before it reaches GITHUB_ENV; the step fails if no key is found at all.
        env:
          EIA_SECRET: ${{ secrets.EIA_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          case ",$FAMILIES," in *,all,*|*,storage,*|*,eia930,*) ;; *) echo "EIA key: not needed for $FAMILIES"; exit 0;; esac
          if [ -n "$EIA_SECRET" ]; then
            key="$EIA_SECRET"; src='repository secret EIA_API_KEY'
          else
            key="$(python -c "import boto3; print(boto3.client('ssm', region_name='us-east-2').get_parameter(Name='/markets/EIA_API_KEY', WithDecryption=True)['Parameter']['Value'])")"
            src='SSM /markets/EIA_API_KEY (us-east-2)'
          fi
          if [ -z "$key" ]; then echo "EIA key: none found (secret empty, SSM empty); refusing to run on DEMO_KEY"; exit 1; fi
          echo "::add-mask::$key"
          echo "EIA_API_KEY=$key" >> "$GITHUB_ENV"
          echo "EIA key: $src, length ${#key}"
      - run: |
          set -euo pipefail
          case "$FAMILIES" in *[!a-z0-9_,]*) echo "families must be a comma list of names"; exit 2;; esac
          case "$DAY_HISTORY_DAYS" in *[!0-9,]*) echo "days must be a comma list of YYYYMMDD"; exit 2;; esac
          echo "days: ${DAY_HISTORY_DAYS:-all selected}"
          python research/kalshi/frankie_boss/operations/fetch_day_history.py fetch --family "$FAMILIES" --out day-history
      - name: Upload to S3 (new prefix, new objects only)
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          import boto3
          bucket = 'bento-568968024170-us-east-2-an'
          prefix = f"frankie/day_history/{os.environ['GITHUB_RUN_ID']}/"
          s3 = boto3.client('s3', region_name='us-east-2')
          files = sorted(p for p in pathlib.Path('day-history').rglob('*') if p.is_file())
          manifest = []
          for p in files:
              key = prefix + str(p.relative_to('day-history'))
              body = p.read_bytes()
              s3.put_object(Bucket=bucket, Key=key, Body=body, ServerSideEncryption='AES256')
              manifest.append(dict(key=key, bytes=len(body), sha256=hashlib.sha256(body).hexdigest()))
          s3.put_object(Bucket=bucket, Key=prefix + 'manifest.json', Body=json.dumps(manifest, indent=1).encode(),
                        ServerSideEncryption='AES256')
          print(f'uploaded {len(manifest)} objects under s3://{bucket}/{prefix}')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day-history-${{ github.run_id }}
          path: day-history/**/receipt.json
          if-no-files-found: ignore

# 2026-08-21 resume trigger: reuse canonical jobs and finish missing native segment manifests.

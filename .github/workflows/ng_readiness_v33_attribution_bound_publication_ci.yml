name: NG readiness v33 attribution-bound publication

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - research/kalshi/ng_g15_attribution_bound_publication_gate.py
      - research/kalshi/ng_historical_refinement_readiness_v33.py
      - research/kalshi/ng_historical_refinement_executor_v29.py
      - research/kalshi/tests/test_ng_g15_attribution_bound_publication_gate.py
      - research/kalshi/tests/test_ng_readiness_v33_attribution_bound_publication.py
      - .github/workflows/ng_readiness_v33_attribution_bound_publication_ci.yml
  workflow_dispatch:

jobs:
  attribution-bound-publication:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Compile v33 attribution-bound publication chain
        run: |
          python -m py_compile \
            ng_g15_attribution_bound_publication_gate.py \
            ng_historical_refinement_readiness_v33.py \
            ng_historical_refinement_executor_v29.py \
            tests/test_ng_g15_attribution_bound_publication_gate.py \
            tests/test_ng_readiness_v33_attribution_bound_publication.py
      - name: Run deterministic self-tests
        run: |
          python ng_g15_exact_publication_gate.py --selftest
          python ng_g15_counterfactual_attribution_gate.py --selftest
          python ng_g15_attribution_bound_publication_gate.py --selftest
          python ng_historical_refinement_readiness_v33.py --selftest
      - name: Run focused attribution and readiness tests
        run: |
          pytest -q \
            tests/test_ng_g15_counterfactual_attribution_gate.py \
            tests/test_ng_readiness_v32_attribution_authorization.py \
            tests/test_ng_g15_attribution_bound_publication_gate.py \
            tests/test_ng_readiness_v33_attribution_bound_publication.py
      - name: Verify fixed-outcome wall and permanent controls
        run: |
          python - <<'PY'
          import ng_g15_attribution_bound_publication_gate as gate
          import ng_historical_refinement_executor_v29 as executor
          import ng_historical_refinement_readiness_v33 as readiness
          from pathlib import Path
          import tempfile

          order = [spec.key for spec in readiness.STAGES]
          publication = order.index("g15_publication")
          assert order[publication:publication + 3] == [
              "g15_publication",
              "g15_attribution_bound_publication",
              "g15_counterfactual_lesson_gate",
          ]
          by_key = {spec.key: spec for spec in readiness.STAGES}
          assert by_key["g15_publication"].pre_outcome is False
          assert by_key["g15_attribution_bound_publication"].pre_outcome is False
          assert by_key["g15_counterfactual_lesson_gate"].pre_outcome is False
          assert executor.SUGGESTED_ENTRYPOINTS[
              "g15_attribution_bound_publication"
          ] == ("python", "ng_g15_attribution_bound_publication_gate.py")

          with tempfile.TemporaryDirectory() as directory:
              result = gate.build_gate(**gate._synthetic_fixture(Path(directory)))
          assert result["separate_blind_refined_scores_verified"] is True
          assert result["blind_score_fingerprint"] != result["refined_score_fingerprint"]
          assert result["all_six_factors_authorized_before_scoring"] is True
          assert result["actual_g15_outcomes_used"] is True
          assert result["actual_g16_outcomes_used"] is False
          assert result["random_shuffle_used"] is False
          assert result["one_signal_authority_preserved"] is True
          assert result["blind_forecasts_immutable"] is True
          assert result["may_update_ng_brain"] is False
          assert result["execution_authority"] is False
          assert result["g16_outcome_access_authorized"] is False
          assert result["cme_event_contracts_mode"] == "SHADOW"
          assert result["brokerage_contract"] == "tastytrade_not_ibkr"
          assert result["options_lane_started"] is False
          PY

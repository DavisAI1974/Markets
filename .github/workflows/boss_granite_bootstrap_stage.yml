name: BOSS Granite verified bootstrap staging

on:
  push:
    branches: [codex/boss-full-evidence-20260907]
    paths: [.github/workflows/boss_granite_bootstrap_stage.yml]

permissions:
  contents: read

concurrency:
  group: boss-granite-bootstrap-staging
  cancel-in-progress: false

jobs:
  stage-bootstrap:
    if: github.ref == 'refs/heads/codex/boss-full-evidence-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned test and staging dependencies
        run: python -m pip install boto3==1.42.23 pytest==8.3.5
      - name: Verify startup contracts without credentials
        env:
          PYTHONPATH: ${{ github.workspace }}/research/kalshi/frankie_boss
        run: |
          mkdir -p work/bootstrap-tests
          cp research/kalshi/frankie_boss/tests/test_granite_run_artifacts.py work/bootstrap-tests/
          cp research/kalshi/frankie_boss/tests/test_granite_startup.py work/bootstrap-tests/
          python -m pytest work/bootstrap-tests/ -q
      - name: Stage four verified bootstrap files without creating GPU resources
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          PYTHONPATH: ${{ github.workspace }}/research/kalshi/frankie_boss
        run: |
          python - <<'PY'
          import boto3
          from pathlib import Path
          from botocore.config import Config
          from granite_run_artifacts import ensure_scoped_bucket
          from granite_startup import stage_bootstrap
          config=Config(connect_timeout=10,read_timeout=60,retries={'total_max_attempts':1,'mode':'standard'})
          account=boto3.client('sts',region_name='us-east-1',config=config).get_caller_identity()['Account']
          client=boto3.client('s3',region_name='us-east-1',config=config)
          bucket=ensure_scoped_bucket(client,account)
          stage_bootstrap(client,bucket,Path('work/granite-bootstrap-receipt.json'))
          PY
      - name: Retain startup staging evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: granite-bootstrap-${{ github.run_id }}
          path: |
            work/granite-bootstrap-receipt.json
            research/kalshi/frankie_boss/granite_image_identity.json
          retention-days: 30
          if-no-files-found: warn

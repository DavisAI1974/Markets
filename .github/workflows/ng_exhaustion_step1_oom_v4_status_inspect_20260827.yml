name: ONE-SHOT APPROVED - NG Exhaustion Step-1 OOM V4 Status Inspect 20260827

on:
  push:
    branches:
      - chatgpt/frankie-october-aws-readonly-20260824
    paths:
      - .github/workflows/ng_exhaustion_step1_oom_v4_status_inspect_20260827.yml

permissions:
  contents: read

jobs:
  inspect-v4-status:
    if: ${{ contains(github.event.head_commit.message, '[APPROVED_STEP1_OOM_V4_STATUS_INSPECT_20260827]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_DEFAULT_REGION: us-east-2
      INSTANCE_ID: i-08cee7171c0a76a04
      SYSTEMD_UNIT: ng-exhaustion-step1-oom-v4-33078419684-1.service
      CONT_ROOT: /mnt/markets/ng_exhaustion_two_day_full_mbo_step1_20260825/oom_continue/33078419684-1
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Inspect V4 continuation read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, shlex
          unit=os.environ['SYSTEMD_UNIT']
          root=os.environ['CONT_ROOT']
          script=(
              'set -u -o pipefail\n'
              'unit='+shlex.quote(unit)+'\n'
              'root='+shlex.quote(root)+'\n'
              'echo SYSTEMCTL_STATUS_BEGIN\n'
              'systemctl status "$unit" --no-pager -l || true\n'
              'echo SYSTEMCTL_STATUS_END\n'
              'echo JOURNAL_BEGIN\n'
              'journalctl -u "$unit" -n 200 --no-pager -l || true\n'
              'echo JOURNAL_END\n'
              'echo ACTIVE_WRAPPER_PROCESSES_BEGIN\n'
              'ps -eo pid,etimes,rss,args | grep -F ng_exhaustion_mbo_2day_full_mbo_step1_20260825.py | grep -v grep || true\n'
              'echo ACTIVE_WRAPPER_PROCESSES_END\n'
              'echo CONT_ROOT_LIST_BEGIN\n'
              'if [ -d "$root" ]; then find "$root" -maxdepth 2 -printf "%y|%p|%s|%TY-%Tm-%TdT%TH:%TM:%TS\\n" | sort; else echo CONT_ROOT_MISSING; fi\n'
              'echo CONT_ROOT_LIST_END\n'
              'echo WORKER_STATUS_BEGIN\n'
              'if [ -f "$root/WORKER_STATUS.json" ]; then cat "$root/WORKER_STATUS.json"; else echo WORKER_STATUS_MISSING; fi\n'
              'echo WORKER_STATUS_END\n'
              'echo RUN_LOG_BEGIN\n'
              'if [ -f "$root/run.log" ]; then bytes=$(stat -c %s "$root/run.log"); echo RUN_LOG_BYTES=$bytes; if [ "$bytes" -le 1048576 ]; then cat "$root/run.log"; else tail -n 200 "$root/run.log"; fi; else echo RUN_LOG_MISSING; fi\n'
              'echo RUN_LOG_END\n'
              'echo RESOURCE_BEGIN\n'
              'if [ -f "$root/resource.txt" ]; then cat "$root/resource.txt"; else echo RESOURCE_MISSING; fi\n'
              'echo RESOURCE_END\n'
              'echo RESULT_MANIFEST_BEGIN\n'
              'if [ -f "$root/results/RESULT_FILE_MANIFEST.json" ]; then cat "$root/results/RESULT_FILE_MANIFEST.json"; else echo RESULT_MANIFEST_MISSING; fi\n'
              'echo RESULT_MANIFEST_END\n'
              'echo RESULTS_TAR_BEGIN\n'
              'if [ -f "$root/results.tar.gz" ]; then stat -c "RESULTS_TAR_BYTES=%s" "$root/results.tar.gz"; sha256sum "$root/results.tar.gz"; else echo RESULTS_TAR_MISSING; fi\n'
              'echo RESULTS_TAR_END\n'
              'echo FREE_BEGIN\n'
              'free -b || true\n'
              'echo FREE_END\n'
              'echo SWAPON_BEGIN\n'
              'swapon --show || true\n'
              'echo SWAPON_END\n'
              'echo V4_READ_ONLY_INSPECT_COMPLETE=PASS\n'
          )
          open('/tmp/v4-inspect-params.json','w').write(json.dumps({
              'commands':['/bin/bash -lc '+shlex.quote(script)],
              'executionTimeout':['300'],
          }))
          PY
          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'Read-only inspection of Step-1 OOM V4 continuation' \
            --parameters file:///tmp/v4-inspect-params.json --timeout-seconds 300 \
            --query 'Command.CommandId' --output text)"
          echo SSM_COMMAND_ID="$command_id"
          for poll in $(seq 1 60); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json
          test "$status" = Success

name: BTC Book Collector (OD-BOOK, durable)

# Collects Coinbase BTC-USD L2 order-book snapshots (top-10/side depth on a
# regular 100ms grid) for the OD-BOOK experiment (S36b). Runs on GitHub compute,
# independent of any local device. Persists to the `data/btc-book` branch via
# orphan force-push (cumulative state, history-less), with the same anti-clobber
# guardrail the trade collectors use.
#
# This is SEPARATE from the trade-bin collectors (btc_collectors_durable.yml):
# those capture aggregated {buy,sell,mid,...}; this captures resting-size depth.
#
# ACTIVATION NOTE: GitHub only fires `schedule:` (cron) triggers from a
# workflow file on the repository DEFAULT branch. While this file lives only on
# the feature branch it can be launched manually (workflow_dispatch) against
# this branch; recurring cron collection requires enabling it on the default
# branch. The cron block below is therefore inert until then (kept so enabling
# is a one-step merge, not a rewrite).
#
# Storage: ~6 MB gzipped per 5h50m run at 100ms grid (validated on a live
# sample), comfortably under GitHub's 100 MiB file cap.

on:
  schedule:
    - cron: '0 */6 * * *'   # 00:00, 06:00, 12:00, 18:00 UTC (default-branch only)
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Collection duration in seconds (default 5h50m=21000)'
        default: '21000'
        type: string
      grid_ms:
        description: 'Snapshot grid in milliseconds'
        default: '100'
        type: string
      depth:
        description: 'Top-K levels per side'
        default: '10'
        type: string
  push:
    branches:
      - claude/divergence-exhaustion-backtest-wj65sm-65uts0
    paths:
      - '.github/workflows/book_collector_btc.yml'
      - 'coinbase_btcusd_book_collector.py'

permissions:
  contents: write

concurrency:
  group: btc-book-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # 5h55m, just under GitHub's 6hr hard limit

    steps:
      - name: Checkout code branch
        uses: actions/checkout@v4
        with:
          ref: claude/divergence-exhaustion-backtest-wj65sm-65uts0
          fetch-depth: 0   # need full history to access data branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet websockets numpy

      - name: Restore previous book file from data/btc-book branch
        run: |
          if git ls-remote --exit-code --heads origin data/btc-book > /dev/null 2>&1; then
            echo "[restore] data branch exists; fetching"
            git fetch origin data/btc-book
            git checkout origin/data/btc-book -- btc_coinbase_book.jsonl.gz 2>/dev/null \
              || echo "[restore] no btc_coinbase_book.jsonl.gz on data branch yet"
          else
            echo "[restore] data branch does not exist; first run, starting fresh"
          fi
          ls -la btc_coinbase_book.jsonl.gz 2>&1 || echo "[restore] no book file present"

      - name: Connectivity check
        run: |
          curl -sS --max-time 5 -o /dev/null -w "Coinbase WS: %{http_code}\n" \
            https://ws-feed.exchange.coinbase.com/ || true

      - name: Run book collector
        timeout-minutes: 350
        run: |
          DURATION="${{ github.event.inputs.duration_seconds || '21000' }}"
          GRID="${{ github.event.inputs.grid_ms || '100' }}"
          DEPTH="${{ github.event.inputs.depth || '10' }}"
          echo "[run] book collector ${DURATION}s grid=${GRID}ms depth=${DEPTH} on $(date -u)"
          python coinbase_btcusd_book_collector.py \
            --duration "$DURATION" --out btc_coinbase_book.jsonl.gz \
            --grid-ms "$GRID" --depth "$DEPTH" > /tmp/cb_book.log 2>&1 || true
          echo "=== book collector log tail ==="
          tail -40 /tmp/cb_book.log

      - name: Book file stats
        if: always()
        run: |
          if [ -f btc_coinbase_book.jsonl.gz ]; then
            SIZE=$(stat -c%s btc_coinbase_book.jsonl.gz)
            N=$(python -c "import gzip,sys; print(sum(1 for l in gzip.open(sys.argv[1],'rt') if l.strip()))" \
                btc_coinbase_book.jsonl.gz 2>/dev/null || echo "?")
            echo "btc_coinbase_book.jsonl.gz: $SIZE bytes, $N rows"
          fi

      - name: Commit book to data/btc-book branch (force-push, history-less)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          mkdir -p /tmp/book
          cp btc_coinbase_book.jsonl.gz /tmp/book/ 2>/dev/null || true

          # Anti-clobber guardrail: this step is `if: always()` + force-push, so a
          # crashed/partial run must NOT overwrite good cumulative rows. The
          # append/resume pattern means a healthy file is always >= the data-branch
          # copy; if a fresh file regressed (fewer rows), restore the data-branch
          # copy so the push preserves history instead of wiping it.
          python - <<'PY'
          import gzip, subprocess, os
          BRANCH = "origin/data/btc-book"
          FN = "btc_coinbase_book.jsonl.gz"
          def count_path(path):
              try:
                  with gzip.open(path, "rt") as f:
                      return sum(1 for l in f if l.strip())
              except Exception:
                  return 0
          newp = os.path.join("/tmp/book", FN)
          new = count_path(newp)
          try:
              blob = subprocess.run(["git", "show", f"{BRANCH}:{FN}"],
                                    capture_output=True, check=True).stdout
          except subprocess.CalledProcessError:
              blob = None
          old = 0
          if blob:
              tmp = "/tmp/_old_book.jsonl.gz"
              with open(tmp, "wb") as f: f.write(blob)
              old = count_path(tmp)
          if old and new < old:
              with open(newp, "wb") as f: f.write(blob)
              print(f"[guardrail] {FN}: collected {new} rows < {old} on data branch "
                    f"-> RESTORED data-branch copy (no regression)")
          else:
              print(f"[guardrail] {FN}: {new} rows (>= {old} on data branch) -> keep")
          PY

          git checkout --orphan data/btc-book-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/book/btc_coinbase_book.jsonl.gz . 2>/dev/null || true

          if [ -f btc_coinbase_book.jsonl.gz ]; then
            git add btc_coinbase_book.jsonl.gz
            git commit -m "BTC book update $(date -u +%Y-%m-%dT%H:%M:%SZ)" -m "Run: ${{ github.run_id }}"
            git push -f origin data/btc-book-tmp:data/btc-book
            echo "[commit] pushed to data/btc-book"
          else
            echo "[commit] no book file to commit"
          fi

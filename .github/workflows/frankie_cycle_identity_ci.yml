name: Frankie cycle identity (coordinator and declaration)
# The pipeline's checks job runs a fixed family list that does not name test_feedback_cycle.py or
# test_declare_identity_supersede.py, and frankie_journal_stack.yml is not to be modified during the
# launch (Greg, 2026-09-20). Both files need torch (the package imports it), so they get their own
# runner with the same torch pin as the checks job. Runs on push to any branch that touches the
# coordinator, the declaration helper, the host script, its workflow or the two tests.
on:
  push:
    paths:
      - 'research/kalshi/frankie_boss/feedback_cycle.py'
      - 'research/kalshi/frankie_boss/operations/declare_identity_supersede.py'
      - 'research/kalshi/frankie_boss/tests/test_feedback_cycle.py'
      - 'research/kalshi/frankie_boss/tests/test_declare_identity_supersede.py'
      - 'deploy/aws/host/frankie_host_declare_identity_supersede.ps1'
      - '.github/workflows/frankie_host_declare_identity_supersede.yml'
      - '.github/workflows/frankie_cycle_identity_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cycle-identity:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .:research/kalshi/frankie_boss:research/kalshi/frankie_boss/tests
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.3.5 boto3==1.42.23 botocore==1.42.97 cffi databento-dbn==0.62.0 zstandard pytest cryptography==46.0.3 requests pyyaml
      - name: Coordinator binding supersede and the declaration helper
        run: python -m pytest -q research/kalshi/frankie_boss/tests/test_feedback_cycle.py research/kalshi/frankie_boss/tests/test_declare_identity_supersede.py
      - name: Validate the host workflow YAML
        run: python -c "import yaml,sys; yaml.safe_load(open('.github/workflows/frankie_host_declare_identity_supersede.yml')); print('yaml ok')"

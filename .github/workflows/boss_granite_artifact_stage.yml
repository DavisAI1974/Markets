name: BOSS Granite exact artifact staging

on:
  push:
    branches: [codex/boss-full-evidence-20260907]
    paths: [.github/workflows/boss_granite_artifact_stage.yml]

permissions:
  contents: read

concurrency:
  group: boss-granite-artifact-staging
  cancel-in-progress: false

jobs:
  stage-pinned-artifacts:
    if: github.ref == 'refs/heads/codex/boss-full-evidence-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned staging dependencies
        run: python -m pip install boto3==1.42.23 pytest==8.3.5
      - name: Verify staging contract without credentials
        env:
          PYTHONPATH: ${{ github.workspace }}/research/kalshi/frankie_boss
        run: |
          mkdir -p work/staging-tests
          cp research/kalshi/frankie_boss/tests/test_granite_run_artifacts.py work/staging-tests/
          python -m pytest work/staging-tests/ -q
      - name: Stage exact model bytes and verify S3 readback
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: us-east-1
          PYTHONPATH: ${{ github.workspace }}/research/kalshi/frankie_boss
        run: |
          python - <<'PY'
          import boto3
          from pathlib import Path
          from botocore.config import Config
          from granite_run_artifacts import DEFAULT_MANIFEST, strict_json, stage, ensure_scoped_bucket
          config = Config(connect_timeout=10, read_timeout=60, retries={'total_max_attempts': 1, 'mode': 'standard'})
          identity = boto3.client('sts', region_name='us-east-1', config=config).get_caller_identity()
          client = boto3.client('s3', region_name='us-east-1', config=config)
          bucket = ensure_scoped_bucket(client, identity['Account'])
          stage(client, bucket, strict_json(DEFAULT_MANIFEST.read_bytes()),
                Path('work/granite-downloads'), Path('work/granite-stage-receipt.json'))
          PY
      - name: Retain verification evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: granite-artifact-staging-${{ github.run_id }}
          path: |
            work/granite-stage-receipt.json
            research/kalshi/frankie_boss/granite_artifacts_manifest.json
          if-no-files-found: warn
          retention-days: 30

name: Bybit Perp History Durable

# Durable forward collector for Bybit perp funding + open interest history.
# This is intentionally separate from the blocked REST backfill workflow:
# it uses the public Bybit linear ticker WebSocket, which is reachable from
# this US/cloud environment, and keeps appending fresh observations to the
# shared data/perp-history branch.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bybit-perp-history-durable
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependency
        run: python -m pip install --upgrade websocket-client
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Restore existing perp-history branch
        run: |
          if git ls-remote --exit-code --heads origin data/perp-history > /dev/null 2>&1; then
            git fetch origin data/perp-history
            git checkout origin/data/perp-history -- backend_funding_history.jsonl 2>/dev/null || true
            git checkout origin/data/perp-history -- backend_oi_history.jsonl 2>/dev/null || true
          else
            echo "[restore] data/perp-history does not exist yet; starting fresh"
          fi
          ls -la backend_funding_history.jsonl backend_oi_history.jsonl 2>/dev/null || true

      - name: Collect current Bybit snapshots
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python collect_bybit_perp_history.py \
            --funding-output-path backend_funding_history.jsonl \
            --oi-output-path backend_oi_history.jsonl \
            --min-oi-gap-sec 600
          echo ""
          echo "=== file stats ==="
          for f in backend_funding_history.jsonl backend_oi_history.jsonl; do
            if [ -f "$f" ]; then
              echo "$f: $(stat -c%s "$f") bytes"
              echo "  lines=$(wc -l < "$f")"
              tail -3 "$f" || true
            fi
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bybit-perp-history
          path: |
            backend_funding_history.jsonl
            backend_oi_history.jsonl
          if-no-files-found: warn

      - name: Force-push to data/perp-history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          changed=0
          for f in backend_funding_history.jsonl backend_oi_history.jsonl; do
            if git cat-file -e "origin/data/perp-history:$f" 2>/dev/null; then
              git show "origin/data/perp-history:$f" > "/tmp/orig-$f"
              if [ ! -f "$f" ] || ! cmp -s "$f" "/tmp/orig-$f"; then
                changed=1
              fi
            elif [ -f "$f" ]; then
              changed=1
            fi
          done

          if [ "$changed" -eq 0 ]; then
            echo "[commit] no new history rows"
            exit 0
          fi

          mkdir -p /tmp/perp-history
          for f in backend_funding_history.jsonl backend_oi_history.jsonl; do
            if [ -f "$f" ]; then
              cp "$f" /tmp/perp-history/
            fi
          done

          git checkout --orphan data/perp-history-tmp
          git rm -rf . > /dev/null 2>&1 || true

          for f in backend_funding_history.jsonl backend_oi_history.jsonl; do
            if [ -f "/tmp/perp-history/$f" ]; then
              cp "/tmp/perp-history/$f" .
            fi
          done

          for f in backend_funding_history.jsonl backend_oi_history.jsonl; do
            if [ -f "$f" ]; then
              git add -f "$f"
            fi
          done

          git status --short
          git commit -m "Bybit perp history $(date -u +%Y-%m-%dT%H:%M:%SZ)" -m "Run: ${{ github.run_id }}"
          git push -f origin data/perp-history-tmp:data/perp-history
          echo "[commit] pushed perp histories to data/perp-history"

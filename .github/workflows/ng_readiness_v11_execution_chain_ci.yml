name: NG readiness v11 execution chain

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - "research/kalshi/ng_historical_refinement_executor_v9.py"
      - "research/kalshi/ng_historical_refinement_preflight_v9.py"
      - "research/kalshi/ng_corpus_executor_plan_compiler_v8.py"
      - "research/kalshi/ng_corpus_executor_pipeline_arm_v8.py"
      - "research/kalshi/ng_historical_refinement_readiness_v11.py"
      - "research/kalshi/ng_g16_exact_counterfactual_causal_authorization.py"
      - "research/kalshi/tests/test_ng_readiness_v11_execution_chain.py"
      - ".github/workflows/ng_readiness_v11_execution_chain_ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-readiness-v11-execution-chain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile exact G16 causal-bound execution chain
        run: |
          python -m py_compile \
            ng_historical_refinement_executor_v9.py \
            ng_historical_refinement_preflight_v9.py \
            ng_corpus_executor_plan_compiler_v8.py \
            ng_corpus_executor_pipeline_arm_v8.py \
            ng_historical_refinement_readiness_v11.py \
            ng_g16_exact_counterfactual_causal_authorization.py \
            tests/test_ng_readiness_v11_execution_chain.py
      - name: Run focused readiness v11 execution tests
        run: python -m unittest tests.test_ng_readiness_v11_execution_chain
      - name: Verify exact causal provenance remains pre-outcome before curve
        run: |
          python - <<'PY'
          import ng_historical_refinement_readiness_v11 as readiness

          rows = {spec.key: spec for spec in readiness.STAGES}
          keys = [spec.key for spec in readiness.STAGES]
          partition = keys.index("g16_exact_partition_replay_authorization")
          causal = keys.index("g16_exact_causal")
          prepared_causal = keys.index("g16_prepared_causal_authorization")
          counterfactual = keys.index("g16_counterfactual_causal_authorization")
          exact = keys.index("g16_exact_counterfactual_causal_authorization")
          prepared_curve = keys.index("g16_prepared_curve_authorization")
          counterfactual_curve = keys.index("g16_counterfactual_curve_authorization")
          assert (
              partition
              < causal
              < prepared_causal
              < counterfactual
              < exact
              < prepared_curve
              < counterfactual_curve
          )
          for key in (
              "g16_exact_partition_replay_authorization",
              "g16_exact_causal",
              "g16_prepared_causal_authorization",
              "g16_counterfactual_causal_authorization",
              "g16_exact_counterfactual_causal_authorization",
              "g16_prepared_curve_authorization",
              "g16_counterfactual_curve_authorization",
          ):
              assert rows[key].pre_outcome
          PY
      - name: Verify permanent authority wall
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile
          from unittest import mock
          import ng_corpus_executor_plan_compiler_v8 as compiler
          import ng_corpus_executor_pipeline_arm_v8 as arm

          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              slice_path = root / "slice.json"
              inspection_path = root / "inspection.json"
              slice_path.write_text("{}\n", encoding="utf-8")
              inspection_path.write_text("{}\n", encoding="utf-8")
              with mock.patch.object(
                  compiler.v7.v6.fingerprinting,
                  "validate_inputs",
                  return_value=(
                      {"slice_bundle_fingerprint": "slice"},
                      {"plan_fingerprint": "inspection"},
                  ),
              ):
                  plan, receipt = compiler.build_compiled_plan(
                      artifact_dir=root / "artifacts",
                      working_directory=root / "work",
                      slice_bundle_path=slice_path,
                      inspection_plan_path=inspection_path,
                  )
              armed, arm_receipt = arm.build_armed_plan(plan, receipt)
              for value in (receipt, arm_receipt):
                  assert value["actual_outcomes_used"] is False
                  assert value["paid_live_data_assumed"] is False
                  assert value["random_shuffle_used"] is False
                  assert value["blind_forecasts_immutable"] is True
                  assert value["may_update_ng_brain"] is False
                  assert value["execution_authority"] is False
                  assert value["cme_event_contracts_mode"] == "SHADOW"
                  assert value["brokerage_contract"] == "tastytrade_not_ibkr"
                  assert value["options_lane_started"] is False
              rows = {row["key"]: row for row in armed["stages"]}
              assert rows["g16_exact_counterfactual_causal_authorization"]["enabled"] is False
              assert rows["g16_prepared_curve_authorization"]["enabled"] is False
          PY

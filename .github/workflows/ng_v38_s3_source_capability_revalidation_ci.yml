name: NG v38 S3 source capability revalidation

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - research/kalshi/ng_v38_aws_execution_context_revalidation_gate.py
      - research/kalshi/ng_v38_s3_source_capability_revalidation_gate.py
      - research/kalshi/ng_historical_refinement_preflight_v36.py
      - research/kalshi/ng_historical_refinement_preflight_v37.py
      - research/kalshi/tests/test_ng_v38_s3_source_capability_revalidation.py
      - .github/workflows/ng_v38_s3_source_capability_revalidation_ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s3-source-capability-revalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest

      - name: Compile S3 capability execution boundary
        working-directory: research/kalshi
        run: |
          python -m py_compile \
            ng_v38_aws_execution_context_revalidation_gate.py \
            ng_v38_s3_source_capability_revalidation_gate.py \
            ng_historical_refinement_preflight_v36.py \
            ng_historical_refinement_preflight_v37.py \
            tests/test_ng_v38_s3_source_capability_revalidation.py

      - name: Run focused S3 source-capability tests
        working-directory: research/kalshi
        run: pytest -q tests/test_ng_v38_s3_source_capability_revalidation.py

      - name: Verify metadata-only boundary and permanent authority wall
        working-directory: research/kalshi
        run: |
          python - <<'PY'
          import inspect
          import ng_historical_refinement_preflight_v37 as preflight
          import ng_v38_s3_source_capability_revalidation_gate as gate

          gate_text = inspect.getsource(gate)
          preflight_text = inspect.getsource(preflight)
          assert "get-bucket-location" in gate_text
          assert "get-bucket-versioning" in gate_text
          assert "list-object-versions" in gate_text
          assert "head-object" in gate_text
          assert "--checksum-mode" in gate_text
          assert "--expected-bucket-owner" in gate_text
          assert '"corpus_completeness_claimed": False' in gate_text
          assert '"all_declared_objects_verified": False' in gate_text
          assert "runtime_s3_source_capability_revalidation_at_executor_delegation" in preflight_text
          assert "guarded_runner" in preflight_text
          text = gate_text + preflight_text
          assert '"cme_event_contracts_mode": "SHADOW"' in text
          assert '"brokerage_contract": "tastytrade_not_ibkr"' in text
          assert '"options_lane_started": False' in text
          assert '"may_update_ng_brain": False' in text
          assert '"random_shuffle_used": False' in text
          PY

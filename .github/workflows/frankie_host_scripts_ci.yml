name: Frankie host scripts (text contracts)
# The operator scripts sent verbatim to the native host over SSM are pinned as TEXT by tests that need
# neither PowerShell nor torch: the probe and the supersede script (variables refused when absent, no
# path literal or credential, nothing deleted, the candidate set and what is kept, the receipt, the
# workflow inputs). The frankie_boss conftest imports the package, which imports torch, so the two
# files run with --noconftest from the tests directory exactly as they are run in the container.
# Greg's word 2026-09-20: add the text tests to CI. The stack tests (torch) are a separate matter.
on:
  push:
    paths:
      - 'deploy/aws/host/frankie_host_cycle_binding_probe.ps1'
      - 'deploy/aws/host/frankie_host_supersede_code_bound_state.ps1'
      - 'deploy/aws/host/frankie_host_declare_identity_supersede.ps1'
      - 'deploy/aws/host/frankie_host_binding_diff.ps1'
      - 'deploy/aws/host/frankie_host_cycle_report.ps1'
      - 'deploy/aws/ssm_run_ps1.py'
      - '.github/workflows/frankie_host_cycle_binding_probe.yml'
      - '.github/workflows/frankie_host_supersede_code_bound_state.yml'
      - '.github/workflows/frankie_host_declare_identity_supersede.yml'
      - '.github/workflows/frankie_host_binding_diff.yml'
      - '.github/workflows/frankie_host_cycle_report.yml'
      - '.github/workflows/frankie_host_scripts_ci.yml'
      - 'research/kalshi/frankie_boss/tests/test_host_cycle_binding_probe.py'
      - 'research/kalshi/frankie_boss/tests/test_host_supersede_code_bound_state.py'
      - 'research/kalshi/frankie_boss/tests/test_host_declare_identity_supersede.py'
      - 'research/kalshi/frankie_boss/tests/test_host_binding_diff.py'
      - 'research/kalshi/frankie_boss/tests/test_host_cycle_report.py'
      - 'research/kalshi/frankie_boss/c15_journal.py'
      - 'research/kalshi/frankie_boss/causal_packet.py'
  pull_request:
    paths:
      - 'deploy/aws/host/frankie_host_cycle_binding_probe.ps1'
      - 'deploy/aws/host/frankie_host_supersede_code_bound_state.ps1'
      - 'deploy/aws/host/frankie_host_declare_identity_supersede.ps1'
      - 'deploy/aws/host/frankie_host_binding_diff.ps1'
      - 'deploy/aws/host/frankie_host_cycle_report.ps1'
      - 'deploy/aws/ssm_run_ps1.py'
      - '.github/workflows/frankie_host_cycle_binding_probe.yml'
      - '.github/workflows/frankie_host_supersede_code_bound_state.yml'
      - '.github/workflows/frankie_host_declare_identity_supersede.yml'
      - '.github/workflows/frankie_host_binding_diff.yml'
      - '.github/workflows/frankie_host_cycle_report.yml'
      - 'research/kalshi/frankie_boss/tests/test_host_cycle_binding_probe.py'
      - 'research/kalshi/frankie_boss/tests/test_host_supersede_code_bound_state.py'
      - 'research/kalshi/frankie_boss/tests/test_host_declare_identity_supersede.py'
      - 'research/kalshi/frankie_boss/tests/test_host_binding_diff.py'
      - 'research/kalshi/frankie_boss/tests/test_host_cycle_report.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  text-contracts:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir pytest pyyaml
      - name: Probe, supersede, declaration, binding-diff and cycle-report script contracts
        working-directory: research/kalshi/frankie_boss/tests
        run: python -m pytest test_host_cycle_binding_probe.py test_host_supersede_code_bound_state.py test_host_declare_identity_supersede.py test_host_binding_diff.py test_host_cycle_report.py -q --rootdir=. --confcutdir=. --noconftest -p no:cacheprovider

name: NG Exhaustion Repair Sunday Reopen 20250629

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-aftermath-20260817
    paths:
      - research/ng_exhaustion_repair_sunday_reopen_20250629.py
      - .github/workflows/ng_exhaustion_repair_sunday_reopen_20250629.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  BUCKET: bento-568968024170-us-east-2-an
  AWS_DEFAULT_REGION: us-east-2
  TARGET_KEY: nymex/nymex_cont/NG_20250629_sun.jsonl.gz

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repair dependencies
        run: python -m pip install --quiet databento pandas boto3
      - name: Refuse overwrite and repair exact Sunday reopen
        run: |
          set -euo pipefail
          if aws s3api head-object --bucket "${BUCKET}" --key "${TARGET_KEY}" >/dev/null 2>&1; then
            echo "::error::Target already exists; refusing to overwrite ${TARGET_KEY}"
            exit 1
          fi
          PYTHONPATH=. python research/ng_exhaustion_repair_sunday_reopen_20250629.py --max-cost 0.01
          test -s /tmp/ng_repair_20250629/NG_20250629_sun.jsonl.gz
      - name: Upload repaired Sunday file
        run: |
          set -euo pipefail
          aws s3 cp /tmp/ng_repair_20250629/NG_20250629_sun.jsonl.gz "s3://${BUCKET}/${TARGET_KEY}" --only-show-errors
          aws s3api head-object --bucket "${BUCKET}" --key "${TARGET_KEY}" > /tmp/head.json
          python - <<'PY'
          import json
          r=json.load(open('NG_EXHAUSTION_REPAIR_20250629_REPORT.json'))
          h=json.load(open('/tmp/head.json'))
          assert int(h['ContentLength']) == int(r['gzip_bytes'])
          r['status']='REPAIR_UPLOADED_AND_LENGTH_VERIFIED'
          r['s3_key']='nymex/nymex_cont/NG_20250629_sun.jsonl.gz'
          open('NG_EXHAUSTION_REPAIR_20250629_REPORT.json','w').write(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print(json.dumps(r,indent=2,sort_keys=True))
          PY
      - name: Upload repair witness
        uses: actions/upload-artifact@v4
        with:
          name: ng-exhaustion-repair-20250629
          path: NG_EXHAUSTION_REPAIR_20250629_REPORT.json
          if-no-files-found: error

name: Frankie stream receipt 20260903

# F-20 ASKS A QUESTION NOTHING WAS ANSWERING.
#
# The falsifier is that `withheld_no_own_clock` and `withheld_close_occasion` read ZERO,
# against 43,569 and 65,960 before - 29.0% of 377,454 lifecycle rows that could not ride
# inside any group. Those counters are built by `native_causal_stream.CausalGroupStream`
# and exposed through `stream_receipt()`.
#
# The launcher never builds a causal stream at all: its `stream` is the raw record iterator.
# The crosswalk builds one, but the crosswalk is a separate CLI that nothing in the launch
# path calls, and it takes `--stream-receipt` as an INPUT rather than producing one. So the
# receipt has never existed for any real run, and F-20 has been unanswerable for three
# sessions - not because runs failed, but because nothing wrote the object that answers it.
#
# `native_causal_stream` already HAS the CLI that produces it. This runs it against a
# finished run's ledgers and persists the receipt beside them.
#
# It is a SECOND PASS over everything the run wrote, which is exactly why it is not folded
# into the launcher: that would add a full re-stream to every production day on the box.
# Here it costs runner minutes and nothing else.

on:
  # A workflow carrying only workflow_dispatch is never registered on a non-default branch
  # and the dispatch API returns 404 for it - measured here, and already recorded in
  # frankie_ledger_delivery_20260902.yml. A push registers it, and the push defaults name
  # the accepted canary, which is the run we want the receipt for anyway.
  push:
    branches:
      - chatgpt/frankie-raw-mbo-benchmark-20260828
    paths:
      - '.github/workflows/frankie_stream_receipt_20260903.yml'
  workflow_dispatch:
    inputs:
      durable_prefix:
        description: >-
          The run's durable S3 prefix, without the bucket.
        type: string
        default: nymex/ng_mbo_5y_v0/frankie/raw_mbo_benchmark/a-memory/7d0068d8ae720772415bf84c8c0689e84408d642/33745123325-1
      subdir:
        description: >-
          Subdirectory holding `ledgers/`. A canary writes to `canary/`; a BOX run writes at
          the prefix ROOT - pass the literal `ROOT` for that. An empty string does not work:
          GitHub replaces an empty input with this default before any expression sees it.
        type: string
        default: canary
      run_id:
        description: The run id to stamp on the receipt.
        type: string
        default: frankie-a-memory-rt-33745123325-1
      arm:
        type: choice
        default: A_MEMORY
        options:
          - A_MEMORY
          - A_CLEAN
      persist:
        description: >-
          Upload the receipt back beside the run's ledgers. It is ADDITIVE - a new object,
          nothing overwritten - but it does write, so it is a deliberate choice.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: frankie-stream-receipt-20260903
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: us-east-2
  AWS_REGION: us-east-2
  S3_ENDPOINT_URL: https://s3.us-east-2.amazonaws.com
  BUCKET: bento-568968024170-us-east-2-an
  DURABLE_PREFIX: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.durable_prefix ||
    'nymex/ng_mbo_5y_v0/frankie/raw_mbo_benchmark/a-memory/7d0068d8ae720772415bf84c8c0689e84408d642/33745123325-1' }}
  # AN EMPTY STRING CANNOT BE PASSED AS A WORKFLOW INPUT. GitHub substitutes the input's
  # own `default:` when the supplied value is empty, so `subdir: ""` arrives as 'canary'
  # and no expression here can recover it - the value was replaced before this line runs.
  # Measured twice: two dispatches with subdir="" both logged `SUBDIR: canary` and 404'd on
  # a canary/ path that never existed for a box run. Inverting the `a && b || c` did not
  # help, because the defect was never in the expression.
  # So ROOT is a sentinel that survives substitution, and it is what a box run needs: a box
  # writes its ledgers and result at the prefix root, a canary writes them under canary/.
  SUBDIR: ${{ (github.event_name == 'workflow_dispatch' && inputs.subdir == 'ROOT') && '' || (github.event_name == 'workflow_dispatch' && inputs.subdir || 'canary') }}
  RUN_ID: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.run_id ||
    'frankie-a-memory-rt-33745123325-1' }}
  ARM: ${{ github.event_name == 'workflow_dispatch' && inputs.arm || 'A_MEMORY' }}
  # `a && b || c` cannot carry a FALSE input, so this reads "not a dispatch, or the
  # dispatched value" - the same shape the launch workflow uses for its boolean flags.
  PERSIST: ${{ github.event_name != 'workflow_dispatch' || inputs.persist }}

jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Fetch the run's three exact ledgers
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/stream-receipt"
          install -d -m 0700 "$work/ledgers"
          base="${DURABLE_PREFIX}"
          if [ -n "$SUBDIR" ]; then base="${base}/${SUBDIR}"; fi

          df -h / | tail -1
          aws s3 cp "s3://${BUCKET}/${base}/ledgers/" "$work/ledgers/" --recursive \
            --endpoint-url "$S3_ENDPOINT_URL" --only-show-errors
          ls -l "$work/ledgers"

          # A BOX RUN GZIPS ITS LEDGERS BEFORE UPLOAD (`gzip -1` in the launch workflow's
          # remote command) and writes them at the prefix ROOT, not under canary/. A canary
          # uploads them plain. Both are handled, because testing for a plain .jsonl is
          # exactly how this would have refused the first real day it was needed for.
          #
          # Each .gz is decompressed and REMOVED immediately rather than after the loop: a
          # weekday member ledger is 9-12 GB plain and holding both forms of all three at
          # once is how a runner fills its volume.
          shopt -s nullglob
          for gz in "$work/ledgers"/*.gz; do
            echo "decompressing $(basename "$gz")"
            gunzip -f "$gz"
          done
          shopt -u nullglob
          df -h / | tail -1
          ls -l "$work/ledgers"

          # The box records sha256 over the PLAIN files before compressing, so the
          # decompressed ledgers can be proved identical to what it actually wrote rather
          # than merely to what arrived. A canary has no such file and skips the check by
          # name rather than silently.
          if aws s3 cp "s3://${BUCKET}/${base}/small_artifacts.tar.gz" "$work/small.tar.gz" \
               --endpoint-url "$S3_ENDPOINT_URL" --only-show-errors 2>/dev/null; then
            tar xzf "$work/small.tar.gz" -C "$work" PLAIN_SHA256SUMS 2>/dev/null || true
          fi
          if [ -s "$work/PLAIN_SHA256SUMS" ]; then
            echo "== verifying decompressed ledgers against the box's own PLAIN_SHA256SUMS =="
            cat "$work/PLAIN_SHA256SUMS"
            ( cd "$work" && sha256sum -c PLAIN_SHA256SUMS 2>&1 | grep -E 'ledgers/|FAILED' ) || {
              echo "PLAIN_SHA256SUMS DID NOT VERIFY - the receipt below describes different bytes"
              exit 1
            }
          else
            echo "no PLAIN_SHA256SUMS at this prefix (expected for a canary); skipping the check"
          fi

          echo "STREAM_WORK=$work" >> "$GITHUB_ENV"

      - name: Build the stream receipt and read F-20 off it
        shell: bash
        run: |
          set -euo pipefail
          led="$STREAM_WORK/ledgers"
          # The CLI refuses rather than guessing, so a missing ledger is named here first.
          test -s "$led/exact_member_rows.jsonl"
          test -s "$led/exact_lifecycle_rows.jsonl"
          test -s "$led/legacy_observable_rows.jsonl"

          python3 -m research.kalshi.frankie_raw_mbo_benchmark.native_causal_stream \
            --member-ledger "$led/exact_member_rows.jsonl" \
            --lifecycle-ledger "$led/exact_lifecycle_rows.jsonl" \
            --legacy-ledger "$led/legacy_observable_rows.jsonl" \
            --run-id "$RUN_ID" --arm "$ARM" \
            --progress-every 5000 \
            --receipt "$STREAM_WORK/stream_receipt.json" > "$STREAM_WORK/summary.json"

          RECEIPT="$STREAM_WORK/stream_receipt.json" python3 - <<'PY'
          import json
          import os

          body = json.load(open(os.environ["RECEIPT"]))
          no_clock = body.get("withheld_no_own_clock", {})
          close_occ = body.get("withheld_close_occasion", {})
          total_no_clock = sum(no_clock.values()) if isinstance(no_clock, dict) else no_clock
          total_close = sum(close_occ.values()) if isinstance(close_occ, dict) else close_occ

          print("== F-20 ==")
          print(f"withheld_no_own_clock   total: {total_no_clock}   by section: {json.dumps(no_clock, sort_keys=True)}")
          print(f"withheld_close_occasion total: {total_close}   by key: {json.dumps(close_occ, sort_keys=True)}")
          print("")
          verdict = "PASS" if (total_no_clock == 0 and total_close == 0) else "FAIL"
          print(f"F-20 (both read zero): {verdict}")
          print("  before this wiring: withheld_no_own_clock 43,569 and withheld_close_occasion 65,960")
          print("")
          print("== stream ==")
          for field in ("schema", "complete", "groups_delivered", "bytes_delivered",
                        "sha256_delivered", "registry_sha256", "causal_clock",
                        "run_id", "arm", "receipt_sha256"):
              if field in body:
                  print(f"{field}: {json.dumps(body[field])}")
          for name in ("member_ledger", "lifecycle_ledger", "legacy_ledger"):
              if name in body:
                  row = dict(body[name])
                  row.pop("path", None)
                  print(f"{name}: {json.dumps(row, sort_keys=True)}")
          print("")
          print(f"other keys: {sorted(set(body) - {'cutoffs'})}")
          PY

      - name: Persist the receipt beside the run
        if: ${{ env.PERSIST == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          base="${DURABLE_PREFIX}"
          if [ -n "$SUBDIR" ]; then base="${base}/${SUBDIR}"; fi
          # Additive: a new object next to the ledgers it was computed from. Nothing the run
          # wrote is overwritten, so the frozen result stays exactly as the run left it.
          aws s3 cp "$STREAM_WORK/stream_receipt.json" \
            "s3://${BUCKET}/${base}/stream_receipt.json" \
            --endpoint-url "$S3_ENDPOINT_URL" --only-show-errors
          echo "persisted s3://${BUCKET}/${base}/stream_receipt.json"

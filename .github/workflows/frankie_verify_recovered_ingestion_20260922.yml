name: Independently verify recovered Monday ingestion
on:
  push:
    branches: ['codex/trading-day-readiness-20260922']
    paths: ['.github/workflows/frankie_verify_recovered_ingestion_20260922.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2ae4da204b0d2a12f605e765f281b505ff51491a
          path: .original
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-cache-dir numpy==2.3.5 boto3==1.42.23 botocore==1.42.97
      - name: Verify actual published checkpoint and exact session coverage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_EC2_METADATA_DISABLED: 'true'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python deploy/aws/verify_recovered_ingestion_20260922.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-monday-ingestion-recovery
          path: verified-ingestion-recovery.json

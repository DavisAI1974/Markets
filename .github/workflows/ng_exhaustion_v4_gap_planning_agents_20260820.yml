name: NG Exhaustion V4 Gap Planning Agents 20260820

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-entry-timing-revival-20260818
    paths:
      - research/ng_exhaustion_v4_gap_planning_agents_20260820.py
      - .github/workflows/ng_exhaustion_v4_gap_planning_agents_20260820.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [causal_clock, v4_mechanics, p0_evidence, history_support, integration_redteam]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ng-exhaustion-entry-timing-revival-20260818
      - name: Run isolated planning lane
        run: |
          python research/ng_exhaustion_v4_gap_planning_agents_20260820.py \
            --mode '${{ matrix.mode }}' \
            --out 'NG_V4_PLAN_${{ matrix.mode }}.json'
      - name: Enforce planning boundary
        run: |
          python - <<'PY'
          import glob,json
          p=glob.glob('NG_V4_PLAN_*.json'); assert len(p)==1,p
          d=json.load(open(p[0])); assert d['status']=='PLANNING_AGENT_COMPLETE'
          assert d['v4_empirical_launch'] is False and d['promotion_performed'] is False
          assert all(v is False for v in d['protected_mutations'].values())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ng-v4-plan-${{ matrix.mode }}
          path: NG_V4_PLAN_${{ matrix.mode }}.json

  reconcile:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ng-exhaustion-entry-timing-revival-20260818
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ng-v4-plan-*
          path: /tmp/plans
      - name: Reconcile plans
        run: |
          python - <<'PY'
          import glob,json,hashlib,shutil
          from pathlib import Path
          paths=sorted(glob.glob('/tmp/plans/**/NG_V4_PLAN_*.json',recursive=True))
          expected={'causal_clock','v4_mechanics','p0_evidence','history_support','integration_redteam'}
          lanes=[]; modes=set(); out=Path('research/generated/ng_v4_gap_plans_20260820'); out.mkdir(parents=True,exist_ok=True)
          for p in paths:
              raw=Path(p).read_bytes(); d=json.loads(raw); modes.add(d['mode'])
              assert d['status']=='PLANNING_AGENT_COMPLETE' and not d['v4_empirical_launch'] and not d['promotion_performed']
              assert all(v is False for v in d['protected_mutations'].values())
              dst=out/Path(p).name; shutil.copyfile(p,dst)
              lanes.append({'mode':d['mode'],'build_ready':bool(d.get('build_ready')),'path':str(dst),'sha256':hashlib.sha256(raw).hexdigest(),'done_when':d['done_when']})
          assert modes==expected,(modes,expected)
          summary={
              'status':'V4_GAP_PLAN_RECONCILED',
              'empirical_launch_authorized':False,
              'promotion_authorized':False,
              'protected_mutation_authorized':False,
              'build_authorization_from_user':'BUILD_READY planning lanes may proceed into isolated implementation and tests; no empirical launch/promotion/permanent Frankie mutation.',
              'dependency_order':['history_support_provenance','causal_clock','v4_state_lifecycle','probability_lock_ledger','sealed_execution_handoff','unified_reconciler','p0_real_empirical_receipts'],
              'lanes':sorted(lanes,key=lambda x:x['mode']),
              'build_ready_modes':sorted(x['mode'] for x in lanes if x['build_ready']),
              'externally_blocked_modes':sorted(x['mode'] for x in lanes if not x['build_ready']),
          }
          (out/'RECONCILED_PLAN.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - name: Commit durable plans
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/ng_v4_gap_plans_20260820
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: reconcile V4 gap implementation plans'
          git push origin HEAD:chatgpt/ng-exhaustion-entry-timing-revival-20260818

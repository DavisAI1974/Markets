name: Inactive code staging checks
on:
  push:
    branches: ['codex/trading-day-readiness-20260922']
    paths:
      - 'deploy/aws/box/frankie_box_stage_code.py'
      - 'deploy/aws/box/frankie_box_stage_code.sh'
      - 'tests/test_box_code_staging.py'
      - '.github/workflows/frankie_code_staging_ci.yml'
      - '.github/workflows/frankie_stage_code.yml'
      - 'deploy/aws/ssm_run_sh.py'
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir pytest==9.1.1
      - name: Disposable Git source-pack and fresh-checkout tests
        working-directory: tests
        run: python -B -m pytest test_box_code_staging.py -q --rootdir=. --confcutdir=. --noconftest -p no:cacheprovider

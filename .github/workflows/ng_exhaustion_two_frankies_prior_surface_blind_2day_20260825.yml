name: NG Exhaustion Two Frankies Keyless Prior Surface Packet 2-Day 20260825

on:
  push:
    branches:
      - chatgpt/frankie-october-aws-readonly-20260824
  workflow_dispatch:
    inputs:
      confirm_exact_two_day_packet:
        description: Confirm keyless packet staging for October 4-5 only
        required: true
        type: boolean
        default: false
      greg_approval:
        description: Enter APPROVE_KEYLESS_TWO_DAY_PACKET_STAGE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ng-exhaustion-two-frankies-keyless-prior-surface-packet-2day-20260825
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: us-east-2
  AWS_REGION: us-east-2
  S3_ENDPOINT_URL: https://s3.us-east-2.amazonaws.com
  INSTANCE_ID: i-08cee7171c0a76a04
  BUCKET: bento-568968024170-us-east-2-an
  LAUNCH_BRANCH: chatgpt/frankie-october-aws-readonly-20260824
  PROTECTED_PRODUCTION_SHA: a7611133f64064200de48cd2e7839fcea2510d51
  CANDIDATE_SHA: 0d318335825b4a0e19a5a2881522f3da0374788e
  TARGET_SEGMENT: '20211001_20211101'
  WINDOW_START: '2021-10-04T00:00:00Z'
  WINDOW_END_EXCLUSIVE: '2021-10-06T00:00:00Z'
  EXPECTED_SECONDS_BYTES: '112852940'
  EXPECTED_SECONDS_SHA256: 93654eb5eaf24be6dc6821f422cdd7fc416e12778dcecd6c97150cbc34004f90
  EXPECTED_RECEIPT_FILE_SHA256: 80b6cf7199805cf40a0b16b139ee1aa8f705b884acf03856640df4054802f7ab
  EXPECTED_MODEL: gpt-5.6-sol
  EXPECTED_CAPABILITY_LEAVES: '1940'
  EXPECTED_CAPABILITY_BLOCKS: '46'
  EXPECTED_CAPABILITY_SURFACES: '24'
  PACKET_BUILDER: research/kalshi/ng_exhaustion_two_frankies_workmode_packet_2day_20260825.py
  COORDINATOR: research/kalshi/ng_exhaustion_two_frankies_workmode_coordinate_2day_20260825.py
  CAPABILITY_OVERLAY: research/kalshi/FRANKIE_PRIOR_SURFACE_OCT45_CAPABILITY_OVERLAY_20260825.json
  RT_MISSION: research/kalshi/agents/frankie_prior_surface_oct45_realtime_20260825.md
  FORECASTER_MISSION: research/kalshi/agents/frankie_prior_surface_oct45_forecaster_20260825.md
  LAUNCH_CONTROL: research/kalshi/NG_EXHAUSTION_PRIOR_SURFACE_OCT45_TWO_FRANKIES_LAUNCH_20260825.json

jobs:
  stage-keyless-work-packets:
    if: >-
      ${{ github.ref == 'refs/heads/chatgpt/frankie-october-aws-readonly-20260824' &&
          ((github.event_name == 'workflow_dispatch' &&
            inputs.confirm_exact_two_day_packet == true &&
            inputs.greg_approval == 'APPROVE_KEYLESS_TWO_DAY_PACKET_STAGE') ||
           (github.event_name == 'push' &&
            github.event.head_commit.message == 'launch: one-shot keyless two-day Frankie packet stage')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - name: Checkout exact packet-stage commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3

      - name: Validate exact keyless two-day contract
        shell: bash
        env:
          GREG_APPROVAL: ${{ github.event_name == 'push' && 'APPROVE_KEYLESS_TWO_DAY_PACKET_STAGE' || inputs.greg_approval }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/$LAUNCH_BRANCH"
          test "$GREG_APPROVAL" = APPROVE_KEYLESS_TWO_DAY_PACKET_STAGE
          if test "$GITHUB_EVENT_NAME" = push; then
            test "$(git log -1 --pretty=%s)" = 'launch: one-shot keyless two-day Frankie packet stage'
            test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
            authorization_commit="$(git rev-parse HEAD^)"
            implementation_commit="$(git rev-parse HEAD^^)"
            test "$(git rev-list --parents -n 1 "$authorization_commit" | wc -w)" -eq 2
            test "$PUSH_AFTER" = "$(git rev-parse HEAD)"
            test "$PUSH_BEFORE" = "$implementation_commit"
            mapfile -t trigger_diff < <(git diff --name-only "$authorization_commit" HEAD)
            test "${#trigger_diff[@]}" -eq 1
            test "${trigger_diff[0]}" = '.github/workflows/ng_exhaustion_two_frankies_prior_surface_blind_2day_20260825.yml'
          else
            authorization_commit="$(git rev-parse HEAD)"
            implementation_commit="$(git rev-parse HEAD^)"
          fi
          mapfile -t authorization_diff < <(git diff --name-only "$implementation_commit" "$authorization_commit")
          test "${#authorization_diff[@]}" -eq 1
          test "${authorization_diff[0]}" = "$LAUNCH_CONTROL"
          export AUTHORIZATION_COMMIT="$authorization_commit"
          export IMPLEMENTATION_COMMIT="$implementation_commit"
          {
            echo "AUTHORIZATION_COMMIT=$authorization_commit"
            echo "IMPLEMENTATION_COMMIT=$implementation_commit"
          } >> "$GITHUB_ENV"
          for path in "$PACKET_BUILDER" "$COORDINATOR" "$CAPABILITY_OVERLAY" \
            "$RT_MISSION" "$FORECASTER_MISSION" "$LAUNCH_CONTROL"; do
            test -s "$path"
          done
          test -z "${OPENAI_API_KEY:-}"
          test -z "${MARKETS_OPENAI_API_KEY:-}"
          ! sed '/! rg -n/d' .github/workflows/ng_exhaustion_two_frankies_prior_surface_blind_2day_20260825.yml | rg -n 'ssm get-parameter|with-decryption|openai-runtime\.env'
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          overlay = json.loads(Path(os.environ["CAPABILITY_OVERLAY"]).read_text(encoding="utf-8"))
          registry = overlay["registry_contract"]
          assert registry["expected_exact_leaf_count"] == int(os.environ["EXPECTED_CAPABILITY_LEAVES"])
          assert registry["expected_exact_block_count"] == int(os.environ["EXPECTED_CAPABILITY_BLOCKS"])
          fc = overlay["role_surface_overrides"]["FORECASTER_FRANKIE"]
          assert len(fc) == int(os.environ["EXPECTED_CAPABILITY_SURFACES"])
          assert all(row["state"] == "DIRECT" for row in fc.values())
          assert all(row["availability"] != "DORMANT" for row in fc.values())
          rt_text = Path(os.environ["RT_MISSION"]).read_text(encoding="utf-8").lower()
          fc_text = Path(os.environ["FORECASTER_MISSION"]).read_text(encoding="utf-8").lower()
          for token in ("dipole", "direction change", "lookahead", "runway", "pre-birth", "clock", "strategy"):
              assert token in rt_text
          for token in ("forecast curve", "dipole", "runway", "clock", "knowledge-helper"):
              assert token in fc_text
          control = json.loads(Path(os.environ["LAUNCH_CONTROL"]).read_text(encoding="utf-8"))
          assert control["evidence_surface_label"] == "PRIOR_REDUCED_NON_FULL_MBO_SURFACE"
          assert control["window"] == {
              "start": os.environ["WINDOW_START"],
              "end_exclusive": os.environ["WINDOW_END_EXCLUSIVE"],
          }
          assert control["source"]["bytes"] == int(os.environ["EXPECTED_SECONDS_BYTES"])
          assert control["source"]["sha256"] == os.environ["EXPECTED_SECONDS_SHA256"]
          assert control["provider_api_called"] is False
          assert control["openai_key_used"] is False
          assert control["canary"] is False and control["tests"] is False
          assert control["launch_authorized"] is True
          authorization = control["authorization"]
          assert authorization["authorized_by"] == "Greg"
          assert authorization["authorized_at"]
          assert authorization["exact_implementation_commit"] == os.environ["IMPLEMENTATION_COMMIT"]
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              assert len(control["transient_one_shot_workflow_sha256"]) == 64
          import hashlib
          for name, row in control["files"].items():
              path = Path(row["path"])
              assert path.is_file(), (name, path)
              observed = hashlib.sha256(path.read_bytes()).hexdigest()
              if name == "manual_only_workflow" and os.environ["GITHUB_EVENT_NAME"] == "push":
                  assert observed == control["transient_one_shot_workflow_sha256"]
              else:
                  assert observed == row["sha256"], (name, observed, row["sha256"])
          print("KEYLESS_PACKET_STATIC_PREFLIGHT=PASS")
          PY

      - name: Package exact repository state
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/frankie-keyless-package"
          install -d -m 0755 "$package_dir"
          git archive --format=tar.gz -o "$package_dir/repo.tgz" "$GITHUB_SHA"
          sha256sum "$package_dir/repo.tgz" > "$package_dir/repo.sha256"
          launch_identity="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          prefix="nymex/ng_mbo_5y_v0/frankie/prior_surface_oct45_workmode_packets/${GITHUB_SHA}/${launch_identity}"
          aws s3 cp "$package_dir/repo.tgz" "s3://${BUCKET}/${prefix}/repo.tgz" \
            --endpoint-url "$S3_ENDPOINT_URL" --only-show-errors
          {
            echo "LAUNCH_IDENTITY=$launch_identity"
            echo "PACKET_PREFIX=$prefix"
            echo "REPO_SHA256=$(awk '{print $1}' "$package_dir/repo.sha256")"
          } >> "$GITHUB_ENV"

      - name: Build packets on sealed worker without provider credentials
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shlex
          from pathlib import Path

          identity = os.environ["LAUNCH_IDENTITY"]
          root = f"/mnt/markets/frankie_prior_surface_oct45_workmode_packet_20260825/{identity}"
          repo = f"{root}/repo"
          source = f"{root}/input/prior_seconds.jsonl.gz"
          packet = f"{root}/packet"
          repo_tgz = f"{root}/repo.tgz"
          packet_tgz = f"{root}/packet.tgz"
          packet_sha = f"{root}/packet.sha256"
          identity_json = f"{root}/stage_identity.json"
          aws_env = f"{root}/aws-runtime.env"
          original_base = f"/mnt/markets/ng_exhaustion_step1_5y_20260822/{os.environ['CANDIDATE_SHA']}"
          original_source = f"{original_base}/full/segments/{os.environ['TARGET_SEGMENT']}.seconds.jsonl.gz"
          original_receipt = f"{original_base}/full/segments/{os.environ['TARGET_SEGMENT']}.receipt.json"
          source_credential = f"{original_base}/aws.env"
          output_uri = f"s3://{os.environ['BUCKET']}/{os.environ['PACKET_PREFIX']}"
          packet_user = "frkpkt_" + os.environ["GITHUB_RUN_ID"]
          unit = "frankie-keyless-packet-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]

          commands = [
              "set -euo pipefail",
              f"export LAUNCH_IDENTITY={shlex.quote(identity)}",
              f"export GITHUB_SHA={shlex.quote(os.environ['GITHUB_SHA'])}",
              f"export IMPLEMENTATION_COMMIT={shlex.quote(os.environ['IMPLEMENTATION_COMMIT'])}",
              f"export AUTHORIZATION_COMMIT={shlex.quote(os.environ['AUTHORIZATION_COMMIT'])}",
              f"export GITHUB_RUN_ID={shlex.quote(os.environ['GITHUB_RUN_ID'])}",
              f"export GITHUB_RUN_ATTEMPT={shlex.quote(os.environ['GITHUB_RUN_ATTEMPT'])}",
              f"export WINDOW_START={shlex.quote(os.environ['WINDOW_START'])}",
              f"export WINDOW_END_EXCLUSIVE={shlex.quote(os.environ['WINDOW_END_EXCLUSIVE'])}",
              f"export EXPECTED_SECONDS_BYTES={shlex.quote(os.environ['EXPECTED_SECONDS_BYTES'])}",
              f"export EXPECTED_SECONDS_SHA256={shlex.quote(os.environ['EXPECTED_SECONDS_SHA256'])}",
              f"root={shlex.quote(root)}", f"repo={shlex.quote(repo)}",
              f"source={shlex.quote(source)}", f"packet={shlex.quote(packet)}",
              f"repo_tgz={shlex.quote(repo_tgz)}", f"packet_tgz={shlex.quote(packet_tgz)}",
              f"packet_sha={shlex.quote(packet_sha)}", f"identity_json={shlex.quote(identity_json)}",
              f"aws_env={shlex.quote(aws_env)}", f"source_credential={shlex.quote(source_credential)}",
              f"original_source={shlex.quote(original_source)}", f"original_receipt={shlex.quote(original_receipt)}",
              f"output_uri={shlex.quote(output_uri)}", f"packet_user={shlex.quote(packet_user)}",
              f"unit={shlex.quote(unit)}",
              "test ! -e \"$root\"", "test -s \"$original_source\"", "test -s \"$original_receipt\"",
              "test -s \"$source_credential\"",
              f"test \"$(stat -c %s \"$original_source\")\" = {shlex.quote(os.environ['EXPECTED_SECONDS_BYTES'])}",
              f"test \"$(sha256sum \"$original_source\" | awk '{{print $1}}')\" = {shlex.quote(os.environ['EXPECTED_SECONDS_SHA256'])}",
              f"test \"$(sha256sum \"$original_receipt\" | awk '{{print $1}}')\" = {shlex.quote(os.environ['EXPECTED_RECEIPT_FILE_SHA256'])}",
              "install -d -m 0750 \"$root\" \"$repo\" \"$root/input\"",
              "cp --reflink=auto \"$original_source\" \"$source\"",
              "trap 'test ! -e \"$aws_env\" || shred -u \"$aws_env\"' EXIT",
              "python3 - \"$source_credential\" \"$aws_env\" <<'PYCRED'\nimport os, shlex, sys\nsource, destination = sys.argv[1:]\nallowed = {'AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY','AWS_SESSION_TOKEN','AWS_DEFAULT_REGION','AWS_REGION','MARKETS_AWS_ACCESS_KEY_ID','MARKETS_AWS_SECRET_ACCESS_KEY','MARKETS_AWS_SESSION_TOKEN'}\nvalues = {}\nfor raw in open(source, encoding='utf-8'):\n    line = raw.strip()\n    if not line or line.startswith('#'): continue\n    if line.startswith('export '): line = line[7:].strip()\n    parts = shlex.split(line, comments=True)\n    if len(parts) != 1 or '=' not in parts[0]: raise SystemExit('unsupported credential statement')\n    key, value = parts[0].split('=', 1)\n    if key in allowed: values[key] = value\nfd = os.open(destination, os.O_WRONLY|os.O_CREAT|os.O_EXCL, 0o600)\nwith os.fdopen(fd, 'w') as handle:\n    for key, value in sorted(values.items()): handle.write(f'{key}={shlex.quote(value)}\\n')\nPYCRED",
              f"( set -a; source \"$aws_env\"; set +a; aws s3 cp {shlex.quote(output_uri + '/repo.tgz')} \"$repo_tgz\" --region us-east-2 --endpoint-url {shlex.quote(os.environ['S3_ENDPOINT_URL'])} --only-show-errors )",
              f"test \"$(sha256sum \"$repo_tgz\" | awk '{{print $1}}')\" = {shlex.quote(os.environ['REPO_SHA256'])}",
              "tar -xzf \"$repo_tgz\" -C \"$repo\"",
              "if id \"$packet_user\" >/dev/null 2>&1; then echo packet identity exists >&2; exit 1; fi",
              "useradd --system --no-create-home --shell /usr/sbin/nologin \"$packet_user\"",
              "packet_group=\"$(id -gn \"$packet_user\")\"",
              "chown root:\"$packet_group\" \"$(dirname \"$root\")\"",
              "chmod 0750 \"$(dirname \"$root\")\"",
              "chown root:\"$packet_group\" \"$root\"",
              "chmod 0750 \"$root\"",
              "chown -R root:\"$packet_group\" \"$repo\" \"$root/input\"",
              "chmod -R g+rX,g-w,o-rwx \"$repo\" \"$root/input\"",
              "install -d -o \"$packet_user\" -g \"$packet_group\" -m 0700 \"$packet\"",
              "systemd-run --pipe --wait --collect --unit \"$unit\" --uid \"$packet_user\" --gid \"$packet_group\" --property=Type=exec --property=Restart=no --property=NoNewPrivileges=yes --property=PrivateTmp=yes --property=PrivateDevices=yes --property=ProtectHome=yes --property=ProtectSystem=strict --property=IPAddressDeny=any --property=ReadOnlyPaths=\"$repo $root/input\" --property=ReadWritePaths=\"$packet\" --property=InaccessiblePaths=\"$aws_env $source_credential /mnt/markets/ng_exhaustion_step1_5y_20260822 /mnt/markets/ng_exhaustion_two_day_step1_20260824 /mnt/markets/ng_exhaustion_two_day_full_mbo_step1_20260825\" /usr/bin/env -u OPENAI_API_KEY -u MARKETS_OPENAI_API_KEY -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN python3 \"$repo/research/kalshi/ng_exhaustion_two_frankies_workmode_packet_2day_20260825.py\" --source \"$source\" --output-root \"$packet/output\" --run-id \"workmode-$LAUNCH_IDENTITY\"",
              "test -s \"$packet/output/PACKET_COMPLETE.json\"",
              "tar -czf \"$packet_tgz\" -C \"$packet\" output",
              "sha256sum \"$packet_tgz\" > \"$packet_sha\"",
              "python3 - \"$identity_json\" \"$packet_tgz\" <<'PYID'\nimport hashlib,json,os,sys\npath,out=sys.argv[1:]\nraw=open(out,'rb').read()\nvalue={'schema':'FRANKIE_KEYLESS_PACKET_STAGE_IDENTITY_V2_20260825','source_commit':os.environ['GITHUB_SHA'],'implementation_commit':os.environ['IMPLEMENTATION_COMMIT'],'authorization_commit':os.environ['AUTHORIZATION_COMMIT'],'launch_commit':os.environ['GITHUB_SHA'],'github_run_id':os.environ['GITHUB_RUN_ID'],'github_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'launch_identity':os.environ['LAUNCH_IDENTITY'],'window':{'start':os.environ['WINDOW_START'],'end_exclusive':os.environ['WINDOW_END_EXCLUSIVE']},'source_bytes':int(os.environ['EXPECTED_SECONDS_BYTES']),'source_sha256':os.environ['EXPECTED_SECONDS_SHA256'],'packet_sha256':hashlib.sha256(raw).hexdigest(),'provider_api_called':False,'openai_key_used':False,'cli_model_called':False,'logical_role_calls_completed':0,'canary':False,'tests':False}\nvalue['receipt_hash']=hashlib.sha256(json.dumps(value,sort_keys=True,separators=(',',':'),ensure_ascii=True,allow_nan=False).encode()).hexdigest()\nopen(path,'w',encoding='utf-8').write(json.dumps(value,indent=2,sort_keys=True)+'\\n')\nPYID",
              "( set -a; source \"$aws_env\"; set +a; aws s3 cp \"$packet_tgz\" \"$output_uri/packet.tgz\" --region us-east-2 --endpoint-url https://s3.us-east-2.amazonaws.com --only-show-errors; aws s3 cp \"$packet_sha\" \"$output_uri/packet.sha256\" --region us-east-2 --endpoint-url https://s3.us-east-2.amazonaws.com --only-show-errors; aws s3 cp \"$identity_json\" \"$output_uri/stage_identity.json\" --region us-east-2 --endpoint-url https://s3.us-east-2.amazonaws.com --only-show-errors )",
              "shred -u \"$aws_env\"",
              "echo KEYLESS_WORK_PACKET_STAGE=PASS",
          ]
          Path("/tmp/frankie-keyless-packet-params.json").write_text(json.dumps({
              "commands": ["/bin/bash -lc " + shlex.quote("\n".join(commands))],
              "executionTimeout": ["3000"],
          }), encoding="utf-8")
          PY
          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Keyless exact Oct 4-5 Frankie Work packet stage" \
            --parameters file:///tmp/frankie-keyless-packet-params.json \
            --timeout-seconds 3000 --query Command.CommandId --output text)"
          status=Pending
          for _ in $(seq 1 330); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|TimedOut|Cancelled|Cancelling) break ;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json > /tmp/frankie-keyless-packet-result.json
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          value = json.loads(Path('/tmp/frankie-keyless-packet-result.json').read_text(encoding='utf-8'))
          credential_names = ('AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'AWS_SESSION_TOKEN')
          access_key = re.compile(r'\b(?:AKIA|ASIA)[A-Z0-9]{16}\b')
          for field in ('StandardOutput', 'StandardError'):
              safe_lines = []
              for line in str(value.get(field, '')).splitlines():
                  if any(name in line for name in credential_names):
                      safe_lines.append('[REDACTED_CREDENTIAL_LINE]')
                  else:
                      safe_lines.append(access_key.sub('[REDACTED_AWS_ACCESS_KEY]', line))
              value[field] = '\n'.join(safe_lines)
          print(json.dumps(value, indent=2, sort_keys=True))
          PY
          python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path('/tmp/frankie-keyless-packet-result.json').read_text(encoding='utf-8'))
          assert value['Status'] == 'Success'
          assert int(value['ResponseCode']) == 0
          assert 'KEYLESS_WORK_PACKET_STAGE=PASS' in value['StandardOutput']
          PY
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Download and verify keyless packet
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/frankie-keyless-work-packet"
          install -d -m 0700 "$artifact"
          uri="s3://${BUCKET}/${PACKET_PREFIX}"
          aws s3 cp "$uri/packet.tgz" "$artifact/packet.tgz" --endpoint-url "$S3_ENDPOINT_URL" --only-show-errors
          aws s3 cp "$uri/packet.sha256" "$artifact/packet.sha256" --endpoint-url "$S3_ENDPOINT_URL" --only-show-errors
          aws s3 cp "$uri/stage_identity.json" "$artifact/stage_identity.json" --endpoint-url "$S3_ENDPOINT_URL" --only-show-errors
          cd "$artifact"
          test "$(sha256sum packet.tgz | awk '{print $1}')" = "$(awk '{print $1}' packet.sha256)"
          python - <<'PY'
          import hashlib, json, os
          value=json.load(open('stage_identity.json',encoding='utf-8'))
          receipt=value.pop('receipt_hash')
          assert receipt == hashlib.sha256(json.dumps(value,sort_keys=True,separators=(',',':'),ensure_ascii=True,allow_nan=False).encode()).hexdigest()
          assert value['source_commit']==os.environ['GITHUB_SHA']
          assert value['implementation_commit']==os.environ['IMPLEMENTATION_COMMIT']
          assert value['authorization_commit']==os.environ['AUTHORIZATION_COMMIT']
          assert value['launch_commit']==os.environ['GITHUB_SHA']
          assert value['github_run_id']==os.environ['GITHUB_RUN_ID']
          assert value['github_run_attempt']==os.environ['GITHUB_RUN_ATTEMPT']
          assert value['launch_identity']==f"{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          assert value['packet_sha256']==__import__('hashlib').sha256(open('packet.tgz','rb').read()).hexdigest()
          assert value['logical_role_calls_completed']==0
          assert value['provider_api_called'] is False and value['openai_key_used'] is False
          assert value['canary'] is False and value['tests'] is False
          PY

      - name: Publish private Work packet artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frankie-keyless-work-packet-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frankie-keyless-work-packet
          if-no-files-found: error
          retention-days: 7

      - name: Report packet stage only
        shell: bash
        run: |
          {
            echo '### Keyless prior reduced/non-full-MBO two-day Work packets'
            echo "- Commit: ${GITHUB_SHA}"

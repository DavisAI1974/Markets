name: NG Exhaustion Held Week 20260329 20260817

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-chain-full-history-phase1-20260817
    paths:
      - research/NG_EXHAUSTION_20260403_CME_CLOSURE_WITNESS_20260817.json
      - research/ng_exhaustion_chain_canonical_held_week_20260329.py
      - .github/workflows/ng_exhaustion_held_week_20260329_20260817.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: us-east-2
  BUCKET: bento-568968024170-us-east-2-an

jobs:
  held-week:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install canonical dependencies
        run: python -m pip install --quiet matplotlib
      - name: Materialize five real raw dates only
        run: |
          set -euo pipefail
          mkdir -p /tmp/ngheld
          days=(20260329 20260330 20260331 20260401 20260402)
          for d in "${days[@]}"; do
            mapfile -t keys < <(aws s3api list-objects-v2 --bucket "${BUCKET}" --prefix "nymex/nymex_cont/NG_${d}" --query 'Contents[].Key' --output text | tr '\t' '\n' | grep -E "NG_${d}(_[A-Za-z]{3})?\\.jsonl\\.gz$" | sort -u)
            if [ "${#keys[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one NG raw object for ${d}, found ${#keys[@]}: ${keys[*]-}"
              exit 1
            fi
            aws s3 cp "s3://${BUCKET}/${keys[0]}" "/tmp/ngheld/NG_${d}.jsonl.gz" --only-show-errors
            test -s "/tmp/ngheld/NG_${d}.jsonl.gz"
          done
          if aws s3api list-objects-v2 --bucket "${BUCKET}" --prefix "nymex/nymex_cont/NG_20260403" --query 'Contents[].Key' --output text | grep -q 'NG_20260403'; then
            echo "::error::Unexpected raw 20260403 object appeared; held-week closure witness must be re-adjudicated"
            exit 1
          fi
      - name: Build held week with explicit CME closure witness
        run: |
          set -euo pipefail
          mapfile -t RAW < <(printf '%s\n' /tmp/ngheld/NG_*.jsonl.gz | sort)
          test "${#RAW[@]}" -eq 5
          PYTHONPATH=research:research/kalshi python research/ng_exhaustion_chain_canonical_held_week_20260329.py "${RAW[@]}"
      - name: Upload held-week canonical artifact
        uses: actions/upload-artifact@v4
        with:
          name: ng-exhaustion-chain-canonical-held-week-20260329
          path: |
            NG_EXHAUSTION_CHAIN_CANONICAL_HELD_WEEK_20260329_SUMMARY.json
            NG_EXHAUSTION_CHAIN_CANONICAL_HELD_WEEK_20260329_EVENT_TABLE.jsonl.gz
          if-no-files-found: error

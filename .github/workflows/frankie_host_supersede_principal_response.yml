name: Frankie supersede a cycle's RECORDED principal response on the native host (move aside, receipted)
# 2026-09-21, the Dipole classroom exchange (Greg: option 1): cycle 0's recorded response carried no classroom
# teach-back and the runner stopped on it inside the classroom grade. The request is unchanged, so only the recorded
# response and what the recorder placed beside it (host session record, incoming-*/, response-check-*/, any classroom
# turn files, the audit post-grade) are moved aside (never deleted) with sha256 in a receipt; the box's corrected
# response to the SAME request is then recorded by frankie_host_record_principal_response.yml. Refuses when a runner
# is alive, when the cycle holds a classroom completion, or when the coordinator retains a principal_output for the
# request. Dispatch only; Greg's go. Inputs reach the shell through env, never by expression interpolation into run:.
on:
  workflow_dispatch:
    inputs:
      cycle_index:
        description: 'Zero-padded cycle index'
        required: false
        default: '00'
      reason:
        description: 'Why (goes into the receipt; no apostrophes)'
        required: true
      instance:
        description: 'Native host instance id'
        required: false
        default: 'i-0e90ee6110ef609aa'
      day:
        description: 'Day whose run directory holds the cycle'
        required: false
        default: '20211003'
      run_root:
        description: 'Day pipeline RunRoot on the host'
        required: false
        default: 'C:/Codex/Frankie-BOSS-20260919/days'
permissions:
  contents: read
jobs:
  supersede:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97
      - name: Validate the inputs (shapes only)
        env:
          CYCLE_INDEX: ${{ inputs.cycle_index }}
          REASON: ${{ inputs.reason }}
          DAY: ${{ inputs.day }}
        run: |
          set -euo pipefail
          [[ "$CYCLE_INDEX" =~ ^[0-9]{2}$ ]] || { echo "cycle_index must be two digits"; exit 1; }
          [[ "$DAY" =~ ^[0-9]{8}$ ]] || { echo "day must be YYYYMMDD"; exit 1; }
          [[ "$REASON" != *"'"* && "$REASON" != *$'\n'* && -n "$REASON" ]] || { echo "reason must be nonempty without apostrophes or newlines"; exit 1; }
      - name: Supersede the recorded principal response over SSM
        env:
          INSTANCE: ${{ inputs.instance }}
          DAY: ${{ inputs.day }}
          RUN_ROOT: ${{ inputs.run_root }}
          CYCLE_INDEX: ${{ inputs.cycle_index }}
          REASON: ${{ inputs.reason }}
        run: |
          python deploy/aws/ssm_run_ps1.py \
            --instance "$INSTANCE" --region us-east-2 \
            --script deploy/aws/host/frankie_host_supersede_principal_response.ps1 \
            --set "Day=$DAY" \
            --set "RunRoot=$RUN_ROOT" \
            --set "CycleIndex=$CYCLE_INDEX" \
            --set "Reason=$REASON" \
            --timeout 600 --tail 0 --comment "supersede the cycle $CYCLE_INDEX recorded principal response for day $DAY"

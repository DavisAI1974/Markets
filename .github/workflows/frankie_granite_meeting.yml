name: Frankie Granite meeting (post-class coordinator on a standard CPU runner; dispatch only)
# Greg, 2026-10-06 (GRANITE_DISCUSSION_REPORT_20261006.md): Granite 4.2 3B Q4_K_M with llama.cpp, free standard GitHub
# CPU runner first, ephemeral per meeting. This workflow is the GitHub hosting of frankie_box_granite_meeting.py: it is
# dispatched by hand with a presigned GET of one day's exchange-frankie.json (small) and a presigned PUT for the record.
# It refuses while a pin in knowledge/GRANITE_MEETING_RUNTIME_V1.json is an explicit blank or the runtime parameters are
# unconfirmed (the setup and the Python gate both check). Never scheduled, never on push. No Pod, no GPU, no AWS action.
# The record's return to the owning lane's brain is the explicit owner-side import (frankie_box_lane_state.py
# --import-meeting RECORD --record-sha256 SHA --exchange ...), run by hand on the owning lane with the hash that return.json
# names; this workflow returns the bytes only (artifact, optional presigned PUT). Nothing here dispatches that import,
# downloads an artifact onto a lane or chooses the first E2E host. Workflow inputs reach the shell only through environment
# variables (never interpolated into shell source; Codex finding 4, 2026-10-06).
# Current source gate: inputs-only and verified complete replay/return are available without admission.
# Model setup/start runs ONLY after the owning lane's admission of this exact GitHub run is fetched (admission_get_url)
# and verified by frankie_box_granite_runner.py admit (run id, attempt, exchange sha256, commit, predecessor archive);
# a fresh workflow dispatch is not proof that prior remote model work never happened. The owner writes the admission
# with frankie_box_experiment.sh ACTION=voice-dispatched after dispatching by hand (CCode, Step 6 caller, 2026-10-07).
on:
  workflow_dispatch:
    inputs:
      exchange_get_url:
        description: "presigned GET URL of the day's exchange-frankie.json (FRANKIE_EXPERIMENT_EXCHANGE_V1, view frankie)"
        required: true
      exchange_sha256:
        description: 'Exact SHA256 of the owner exchange; also serializes dispatches for that exchange'
        required: true
      prior_state_get_url:
        description: 'Resume: HTTPS URL of the complete prior runner-state.zip; never restart unknown work without it'
        required: false
        default: ''
      prior_state_sha256:
        description: 'Resume: archive SHA256 from prior runner-state.json'
        required: false
        default: ''
      record_put_url:
        description: 'presigned PUT URL for meeting.json (optional; the record is always kept as a run artifact)'
        required: false
        default: ''
      inputs_only:
        description: 'true = inputs only; false = the admitted meeting (admission_get_url required), else retained-complete replay only'
        required: false
        default: 'true'
      admission_get_url:
        description: 'presigned GET of the owning lane admission.json for THIS run (voice-dispatched writes it); empty = no model work'
        required: false
        default: ''
      admission_wait_minutes:
        description: 'how long to wait for the admission to be served before refusing (bounded; default 30)'
        required: false
        default: '30'
permissions:
  contents: read
concurrency:
  group: frankie-granite-meeting-${{ inputs.exchange_sha256 }}
  cancel-in-progress: false
jobs:
  meeting:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      INPUTS_ONLY: ${{ inputs.inputs_only }}
      EXCHANGE_GET_URL: ${{ inputs.exchange_get_url }}
      EXCHANGE_SHA256: ${{ inputs.exchange_sha256 }}
      PRIOR_STATE_GET_URL: ${{ inputs.prior_state_get_url }}
      PRIOR_STATE_SHA256: ${{ inputs.prior_state_sha256 }}
      RECORD_PUT_URL: ${{ inputs.record_put_url }}
      ADMISSION_GET_URL: ${{ inputs.admission_get_url }}
      ADMISSION_WAIT_MINUTES: ${{ inputs.admission_wait_minutes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch the exchange view (small; Jev raw items already withheld by the exchange)
        run: |
          mkdir -p work/meeting
          case "$EXCHANGE_GET_URL" in https://*) ;; *) echo "exchange_get_url must be an https URL" >&2; exit 2;; esac
          curl -fsSL -o work/meeting/exchange-frankie.json "$EXCHANGE_GET_URL"
      - name: Bind owner and restore complete prior state before setup or model work
        id: intake
        run: |
          set -- prepare --exchange work/meeting/exchange-frankie.json --exchange-sha256 "$EXCHANGE_SHA256" --commit "$GITHUB_SHA" --out work/meeting/out --attempt "$GITHUB_RUN_ATTEMPT"
          if [ -n "$PRIOR_STATE_GET_URL" ]; then
            case "$PRIOR_STATE_GET_URL" in https://*) ;; *) echo "prior_state_get_url must be HTTPS" >&2; exit 2;; esac
            [ -n "$PRIOR_STATE_SHA256" ] || { echo "prior archive SHA256 required" >&2; exit 2; }
            curl -fsSL -o work/meeting/prior-state.zip "$PRIOR_STATE_GET_URL"
            set -- "$@" --archive work/meeting/prior-state.zip --archive-sha256 "$PRIOR_STATE_SHA256"
          elif [ -n "$PRIOR_STATE_SHA256" ]; then
            echo "prior archive URL required with SHA256" >&2; exit 2
          fi
          python3 deploy/aws/box/frankie_box_granite_runner.py "$@"
      - name: Owner admission of this exact run (fetched and verified BEFORE any model setup or call)
        id: admission
        if: inputs.inputs_only != 'true' && inputs.admission_get_url != ''
        run: |
          case "$ADMISSION_GET_URL" in https://*) ;; *) echo "admission_get_url must be HTTPS" >&2; exit 2;; esac
          case "$ADMISSION_WAIT_MINUTES" in ''|*[!0-9]*) echo "admission_wait_minutes must be whole minutes" >&2; exit 2;; esac
          deadline=$(( $(date +%s) + ADMISSION_WAIT_MINUTES * 60 ))
          until curl -fsSL -o work/meeting/admission.json "$ADMISSION_GET_URL"; do
            [ "$(date +%s)" -lt "$deadline" ] || { echo "refused: no admission served within $ADMISSION_WAIT_MINUTES min; no model work (an unknown dispatch is reconciled by the owner, never resent)" >&2; exit 3; }
            sleep 30
          done
          set -- admit --out work/meeting/out --admission work/meeting/admission.json --github-run-id "$GITHUB_RUN_ID" --github-run-attempt "$GITHUB_RUN_ATTEMPT" --exchange-sha256 "$EXCHANGE_SHA256" --commit "$GITHUB_SHA"
          [ -z "$PRIOR_STATE_SHA256" ] || set -- "$@" --prior-state-sha256 "$PRIOR_STATE_SHA256"
          python3 deploy/aws/box/frankie_box_granite_runner.py "$@"
      - name: Pinned runtime setup (only after admission; refuses on any blank or differing pin)
        id: setup
        if: steps.admission.outcome == 'success'
        run: |
          set -o pipefail
          CODE_ROOT="$GITHUB_WORKSPACE" GRANITE_DIR="$RUNNER_TEMP/granite" bash deploy/aws/box/frankie_box_granite_meeting_setup.sh | tee work/meeting/setup.log
          grep -E '^(LLAMA_SERVER|GGUF_MODEL)=' work/meeting/setup.log >> "$GITHUB_ENV"
      - name: The admitted meeting, inputs only, or exact completed replay
        run: |
          if [ "$INPUTS_ONLY" = "true" ]; then
            python3 deploy/aws/box/frankie_box_granite_meeting.py --exchange work/meeting/exchange-frankie.json --out-dir work/meeting/out --inputs-only
          elif [ -f work/meeting/out/admission.json ] && [ -n "${LLAMA_SERVER:-}" ] && [ -n "${GGUF_MODEL:-}" ]; then
            python3 deploy/aws/box/frankie_box_granite_meeting.py --exchange work/meeting/exchange-frankie.json --out-dir work/meeting/out --binary "$LLAMA_SERVER" --model "$GGUF_MODEL"
          else
            echo "no admission for this run: retained-complete replay only (no model call)"
            python3 deploy/aws/box/frankie_box_granite_runner.py replay-complete --exchange work/meeting/exchange-frankie.json --out work/meeting/out
          fi
      - name: Return witness (the record's bytes and sha256 by name; the owner import to run by hand)
        if: always() && steps.intake.outcome == 'success'
        run: |
          python3 deploy/aws/box/frankie_box_granite_meeting.py --exchange work/meeting/exchange-frankie.json --out-dir work/meeting/out --return-witness
      - name: Seal all owner state, progress and evidence for exact retry
        if: always() && steps.intake.outcome == 'success'
        run: python3 deploy/aws/box/frankie_box_granite_runner.py seal --out work/meeting/out --archive work/meeting/runner-state.zip
      - name: Return the record (optional presigned PUT of the same bytes; the artifact below is always kept)
        if: inputs.record_put_url != ''
        run: |
          case "$RECORD_PUT_URL" in https://*) ;; *) echo "record_put_url must be an https URL" >&2; exit 2;; esac
          curl -fsSL -X PUT -H 'Content-Type: application/json' --data-binary @work/meeting/out/meeting.json "$RECORD_PUT_URL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: granite-meeting-record-${{ github.run_attempt }}
          path: |
            work/meeting/out/
            work/meeting/runner-state.zip
            work/meeting/runner-state.json
          if-no-files-found: error

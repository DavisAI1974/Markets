name: NG Databento Secret Name Probe 20260820

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-entry-timing-revival-20260818
    paths:
      - '.github/workflows/ng_databento_secret_name_probe_20260820.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      RECEIPT: research/kalshi/NG_DATABENTO_SECRET_NAME_RECEIPT_20260820.json
      S_DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      S_MARKETS_DATABENTO_API_KEY: ${{ secrets.MARKETS_DATABENTO_API_KEY }}
      S_DATABENTO_KEY: ${{ secrets.DATABENTO_KEY }}
      S_DATABENTO_LIVE_API_KEY: ${{ secrets.DATABENTO_LIVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ng-exhaustion-entry-timing-revival-20260818
      - name: Record only secret-name availability
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt, json, os
          names = {
              'DATABENTO_API_KEY': bool(os.environ.get('S_DATABENTO_API_KEY')),
              'MARKETS_DATABENTO_API_KEY': bool(os.environ.get('S_MARKETS_DATABENTO_API_KEY')),
              'DATABENTO_KEY': bool(os.environ.get('S_DATABENTO_KEY')),
              'DATABENTO_LIVE_API_KEY': bool(os.environ.get('S_DATABENTO_LIVE_API_KEY')),
          }
          out = {
              'schema': 'NG_DATABENTO_SECRET_NAME_RECEIPT_V1',
              'checked_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
              'available_secret_names': [k for k,v in names.items() if v],
              'checked_names': sorted(names),
              'secret_values_exposed': False,
              'v4_activity': False,
          }
          path=os.environ['RECEIPT']; os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path,'w',encoding='utf-8') as f:
              json.dump(out,f,indent=2,sort_keys=True); f.write('\n')
          PY
      - name: Commit sanitized receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Markets Ops Bot'
          git config user.email 'noreply@openai.com'
          git add "$RECEIPT"
          git commit -m 'ops: record Databento secret-name availability' || exit 0
          git push origin HEAD:chatgpt/ng-exhaustion-entry-timing-revival-20260818

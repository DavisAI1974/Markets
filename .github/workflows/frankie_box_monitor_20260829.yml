name: Box memory monitor 20260829

# RUN MARKER 2026-08-29T09:05Z - bump this line to take a reading.
#
# Greg's approach to sizing, and it is better than a blind resize: "we can put a monitor
# probe on the box and watch it grow through the run. if it looks like that's still too
# small we can stop the run at a checkpoint and up it. also chat changed box sizes on the
# fly yesterday so we may not even have to stop the run."
#
# So this does NOT resize anything. It installs a small sampler on the box and reports what
# the sampler has seen. Sizing then comes from a measured growth curve rather than from an
# argument about whether 61.8 GiB is enough - which is the same discipline as the rest of
# this tree: measure the thing, do not reason about it from a number nobody checked.
#
# TWO MODES IN ONE FILE, because a push-triggered workflow cannot take inputs. Every firing
# ensures the sampler is running (idempotently) and then prints the current reading. Bump
# the marker above to take another reading; the sampler keeps running in between.
#
# WHAT IT WRITES ON THE BOX, stated exactly because writing to a live box during a run
# deserves it:
#   /opt/frankie_box_monitor/sample.sh   the sampler, ~20 lines
#   /var/log/frankie_box_monitor.csv     one CSV line per sample
# It is CAPPED at 20000 lines (~1.5 MB, about a week at 30s) and self-trims, so it cannot
# grow into the disk it is there to watch. It samples /proc and runs `ps`; it never touches
# the run's data, its checkpoints, or S3, and it does not stop, start or resize anything.

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/frankie-box-sizing-probe-20260829
    paths:
      - .github/workflows/frankie_box_monitor_20260829.yml

permissions:
  contents: read

concurrency:
  group: frankie-box-monitor-20260829
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      INSTANCE_ID: i-08cee7171c0a76a04
      SAMPLE_SECONDS: '30'
      MAX_LINES: '20000'
    steps:
      - name: Ask AWS about the box, since the box itself answers nothing
        continue-on-error: true
        run: |
          set -uo pipefail
          # EVERY CHANNEL THAT NEEDS THE BOX TO EXECUTE SOMETHING IS DEAD. Output came back
          # empty three times; then a bare `/bin/sh -c` doing nothing but `df` returned
          # ResponseCode 1 without running. That last result killed the exit-code idea too,
          # and for a reason worth writing down: SSM STAGES THE COMMAND SCRIPT TO A FILE ON
          # THE BOX before running it, so a volume with no space means nothing executes and
          # no channel that runs on the box can report anything - including the one built to
          # survive a broken output channel.
          #
          # So this asks AWS instead. Neither reading needs the box to run a single command:
          #
          #   PingStatus  - the SSM agent's own heartbeat. Online means the machine is up and
          #                 the agent is talking, which narrows a total failure to something
          #                 that stops COMMANDS rather than the instance.
          #   VolumeWriteBytes - EBS-side write volume, straight from CloudWatch. If the
          #                 traversal is still writing ledgers this is large and continuing;
          #                 if it died or is blocked on a full filesystem it collapses toward
          #                 zero. This is the closest thing to "is the run alive" that does
          #                 not ask the run.
          echo "== SSM agent heartbeat =="
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].{Ping:PingStatus,LastPing:LastPingDateTime,Agent:AgentVersion,Platform:PlatformName}' \
            --output json || echo "DESCRIBE_FAILED"

          echo "== instance state and status checks =="
          aws ec2 describe-instance-status --instance-ids "$INSTANCE_ID" \
            --query 'InstanceStatuses[0].{State:InstanceState.Name,Sys:SystemStatus.Status,Inst:InstanceStatus.Status}' \
            --output json || echo "STATUS_FAILED"

          echo "== root volume, size and modification state =="
          root_name="$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].RootDeviceName' --output text)"
          volume="$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].BlockDeviceMappings[?DeviceName=='$root_name'].Ebs.VolumeId | [0]" \
            --output text)"
          echo "VOLUME=$volume"
          aws ec2 describe-volumes --volume-ids "$volume" \
            --query 'Volumes[0].{Size:Size,Type:VolumeType,State:State}' --output json || true

          echo "== EBS write bytes, 5-minute buckets, last 90 minutes =="
          # Sum per bucket. A traversal writing ledgers shows tens to hundreds of MB per
          # bucket; a stopped or blocked one shows near zero. The SHAPE is the answer, so
          # every bucket is printed rather than averaged - a mean would hide the moment it
          # stopped, which is the only moment that matters.
          start="$(date -u -d '90 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          aws cloudwatch get-metric-statistics \
            --namespace AWS/EBS --metric-name VolumeWriteBytes \
            --dimensions "Name=VolumeId,Value=$volume" \
            --start-time "$start" --end-time "$end" \
            --period 300 --statistics Sum \
            --query 'sort_by(Datapoints,&Timestamp)[].{t:Timestamp,MB:Sum}' \
            --output table || echo "CLOUDWATCH_FAILED"

      - name: Probe the box by EXIT CODE alone, because output stopped coming back
        continue-on-error: true
        run: |
          set -uo pipefail
          # WHEN THE OUTPUT CHANNEL IS BROKEN, THE EXIT CODE IS THE ONLY BIT THAT ESCAPES.
          #
          # The monitor failed three times running with empty stdout AND empty stderr and
          # ResponseCode 1 - including after its script was rewritten to echo read-only facts
          # as its very first action with `set -e` removed. A script that cannot even emit its
          # first echo has not merely failed; its output was never captured. The leading
          # explanation is a full volume: SSM writes captured stdout and stderr to files under
          # /var/lib/amazon/ssm, so a disk with no space returns exactly this - nothing, and a
          # non-zero code.
          #
          # That hypothesis is untestable through stdout by construction, so this step does not
          # try. It sends a command whose ANSWER IS ITS EXIT STATUS, and reads ResponseCode,
          # which comes back through the control plane rather than through a file on the box:
          #   40  more than 20 GiB free   - disk is not the problem, look elsewhere
          #   41  1 to 20 GiB free        - filling, and the run is in danger
          #   42  under 1 GiB free        - full, which explains everything above
          #   1   something else entirely - not even this ran
          # It cannot fail the job, because a failed probe is a datum and not an outcome.
          python3 - <<'PY'
          import json
          import os
          import shlex
          from pathlib import Path

          Path("/tmp/probe-params.json").write_text(
              json.dumps({"commands": ["/bin/sh -c " + shlex.quote(os.environ["PROBE"])]}),
              encoding="utf-8",
          )
          PY
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "A-arm disk probe by exit code" \
            --parameters file:///tmp/probe-params.json \
            --timeout-seconds 120 \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || true
          code="$(aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" --query ResponseCode --output text 2>/dev/null || echo unknown)"
          status="$(aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo unknown)"
          printf 'A_ARM_DISK_PROBE_STATUS=%s\nA_ARM_DISK_PROBE_CODE=%s\n' "$status" "$code"
          case "$code" in
            40) echo "A_ARM_DISK_VERDICT=OVER_20_GiB_FREE" ;;
            41) echo "A_ARM_DISK_VERDICT=BETWEEN_1_AND_20_GiB_FREE_RUN_IN_DANGER" ;;
            42) echo "A_ARM_DISK_VERDICT=UNDER_1_GiB_FREE_VOLUME_IS_FULL" ;;
            43) echo "A_ARM_DISK_VERDICT=RUN_DIRECTORY_ABSENT" ;;
            *)  echo "A_ARM_DISK_VERDICT=PROBE_ITSELF_DID_NOT_RUN" ;;
          esac
        env:
          PROBE: |
            free=$(df -P /opt/frankie-a-arm-run 2>/dev/null | awk 'NR==2{print $4}')
            [ -z "$free" ] && exit 43
            [ "$free" -gt 20971520 ] && exit 40
            [ "$free" -gt 1048576 ] && exit 41
            exit 42

      - name: Ensure the sampler is running, then report what it has seen
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shlex

          remote = r'''
          # NO `set -e`, AND THE FACTS COME FIRST. This monitor failed twice in a row with
          # empty stdout, empty stderr and exit 1, which told us nothing at all - and it told
          # us nothing precisely because its first action was a WRITE (`sudo tee` of the
          # sampler) under `set -e`. A diagnostic that dies before it reports is worse than
          # no diagnostic, because a silent failure reads like a dead box.
          #
          # So: three read-only facts, unconditionally, before anything can go wrong. Disk
          # first, because a full volume is the one failure that would explain a write dying
          # with no message AND would mean the traversal is in trouble too.
          set -u
          echo "----BEGIN_FACTS----"
          echo "DF:"
          df -Ph / /opt/frankie-a-arm-run 2>&1 | sed 's/^/  /' || true
          echo "MEM:"
          awk '/^MemTotal:|^MemAvailable:|^SwapTotal:|^SwapFree:/{printf "  %s %s kB\n", $1, $2}' \
            /proc/meminfo 2>&1 || true
          echo "TOP:"
          ps -eo pid,rss,pcpu,etime,comm --sort=-rss --no-headers 2>&1 | head -6 | sed 's/^/  /' || true
          echo "RUNDIR:"
          du -sh /opt/frankie-a-arm-run 2>&1 | sed 's/^/  /' || true
          ls -1 /opt/frankie-a-arm-run 2>&1 | head -20 | sed 's/^/  /' || true
          echo "----END_FACTS----"

          DIR=/opt/frankie_box_monitor
          LOG=/var/log/frankie_box_monitor.csv
          INTERVAL=__INTERVAL__
          MAXLINES=__MAXLINES__

          sudo mkdir -p "$DIR"
          # Idempotent: rewrite the sampler every time, but only ever run ONE of them.
          sudo tee "$DIR/sample.sh" >/dev/null <<SAMPLER
          #!/bin/bash
          # Appends one CSV row per interval. Self-trimming so it cannot fill the disk it
          # exists to watch.
          LOG=$LOG
          while true; do
            ts=\$(date -u +%Y-%m-%dT%H:%M:%SZ)
            memtot=\$(awk '/^MemTotal:/{print \$2}' /proc/meminfo)
            memav=\$(awk '/^MemAvailable:/{print \$2}' /proc/meminfo)
            swtot=\$(awk '/^SwapTotal:/{print \$2}' /proc/meminfo)
            swfree=\$(awk '/^SwapFree:/{print \$2}' /proc/meminfo)
            load1=\$(cut -d' ' -f1 /proc/loadavg)
            top=\$(ps -eo rss,comm --sort=-rss --no-headers | head -1 | awk '{print \$1","\$2}')
            echo "\$ts,\$memtot,\$memav,\$swtot,\$swfree,\$load1,\$top" >> "\$LOG"
            if [ "\$(wc -l < "\$LOG")" -gt $MAXLINES ]; then
              tail -n $MAXLINES "\$LOG" > "\$LOG.tmp" && mv "\$LOG.tmp" "\$LOG"
            fi
            sleep $INTERVAL
          done
          SAMPLER
          sudo chmod +x "$DIR/sample.sh"
          sudo touch "$LOG"; sudo chmod 644 "$LOG"

          if pgrep -f "$DIR/sample.sh" >/dev/null 2>&1; then
            echo SAMPLER_STATE=ALREADY_RUNNING
          else
            sudo nohup "$DIR/sample.sh" >/dev/null 2>&1 &
            sleep 2
            if pgrep -f "$DIR/sample.sh" >/dev/null 2>&1; then
              echo SAMPLER_STATE=STARTED
            else
              echo SAMPLER_STATE=FAILED_TO_START
            fi
          fi
          echo SAMPLER_PROCS=$(pgrep -cf "$DIR/sample.sh" || echo 0)
          echo SAMPLES=$(wc -l < "$LOG" 2>/dev/null || echo 0)
          echo "----BEGIN_TAIL----"
          tail -n 12 "$LOG" 2>/dev/null || true
          echo "----END_TAIL----"
          echo "----BEGIN_PEAK----"
          # The number that decides sizing: the LOW-WATER MARK of available memory, and the
          # high-water mark of swap actually used. A mean would hide the moment that matters.
          awk -F, 'NF>=5 && $3 ~ /^[0-9]+$/ {
              if (min=="" || $3+0 < min) { min=$3+0; mint=$1 }
              used=$4-$5; if (used+0 > sw+0) { sw=used+0; swt=$1 }
              tot=$2
            } END {
              if (min=="") { print "NO_SAMPLES_YET" }
              else {
                printf "MEM_TOTAL_GIB=%.1f\n", tot/1048576
                printf "MIN_MEM_AVAILABLE_GIB=%.1f  at %s\n", min/1048576, mint
                printf "PEAK_SWAP_USED_GIB=%.1f  at %s\n", sw/1048576, swt
              }
            }' "$LOG"
          echo "----END_PEAK----"
          echo "----BEGIN_TOPNOW----"
          ps -eo rss,pcpu,etime,comm --sort=-rss --no-headers | head -5
          echo "----END_TOPNOW----"
          '''
          remote = (remote
                    .replace("__INTERVAL__", os.environ["SAMPLE_SECONDS"])
                    .replace("__MAXLINES__", os.environ["MAX_LINES"]))
          with open("/tmp/monitor-params.json", "w", encoding="utf-8") as handle:
              json.dump({"commands": ["/bin/bash -lc " + shlex.quote(remote)]}, handle)
          PY

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Frankie box memory monitor: ensure sampler, report" \
            --parameters file:///tmp/monitor-params.json \
            --timeout-seconds 300 \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json > /tmp/monitor.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/monitor.json").read_text(encoding="utf-8"))
          print("SSM_STATUS=" + str(result.get("Status")))
          print("SSM_RESPONSE_CODE=" + str(result.get("ResponseCode")))
          print(result.get("StandardOutput", ""))
          if result.get("Status") != "Success" or result.get("ResponseCode") != 0:
              print("STDERR:", result.get("StandardError", ""))
              raise SystemExit("BOX_MONITOR_FAILED")
          PY

      - name: What the reading means for sizing
        if: always()
        run: |
          echo "MIN_MEM_AVAILABLE_GIB is the number that decides a resize, not the mean."
          echo "PEAK_SWAP_USED_GIB above ~0 means the box is already spilling to disk;"
          echo "swap is 32 GiB here, so sustained use of it is the signal to stop at a"
          echo "checkpoint and go up a size, per Greg. Re-fire by bumping the RUN MARKER."

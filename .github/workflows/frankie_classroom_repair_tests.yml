name: Frankie classroom repair tests
on:
  push:
    branches: ['codex/trading-day-readiness-20260922']
    paths:
      - 'deploy/aws/box/frankie_box_classroom*.py'
      - 'deploy/aws/box/frankie_box_boss_session.py'
      - 'deploy/aws/box/frankie_box_staged*.py'
      - 'deploy/aws/box/frankie_box_scientific_dialogue.py'
      - 'deploy/aws/box/frankie_box_teacher_discussion.py'
      - 'tests/test_frankie_box_*.py'
      - 'tests/test_frankie_box_classroom_cache.py'
      - 'research/kalshi/frankie_boss/**'
      - '.github/workflows/frankie_classroom_repair_tests.yml'
permissions:
  contents: read
jobs:
  box:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir pytest==9.1.1 numpy==2.3.5
      - run: python -m pytest -q tests/test_frankie_box_scientific_dialogue.py tests/test_frankie_box_classroom_staged.py tests/test_frankie_box_staged_session.py tests/test_frankie_box_staged_reading.py tests/test_frankie_box_classroom_cache.py tests/test_frankie_box_classroom.py tests/test_frankie_box_boss_session_classroom.py
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-cache-dir pytest==9.1.1 numpy==2.3.5 boto3==1.42.1 zstandard==0.25.0 cffi==2.0.0 databento-dbn==0.62.0
      - run: python -m pytest -q research/kalshi/frankie_boss/tests/test_dipole_teacher_discussion.py research/kalshi/frankie_boss/tests/test_recovered_ingestion_bridge.py research/kalshi/frankie_boss/tests/test_dipole_shared_knowledge.py research/kalshi/frankie_boss/tests/test_dipole_scientific_review.py research/kalshi/frankie_boss/tests/test_frankie_principal_adapter.py research/kalshi/frankie_boss/tests/test_classroom_host_learning_policy.py research/kalshi/frankie_boss/tests/test_dipole_classroom*.py research/kalshi/frankie_boss/tests/test_classroom_recovery_reconciliation.py research/kalshi/frankie_boss/tests/test_box_classroom_mode_progression.py research/kalshi/frankie_boss/tests/test_cumulative_classroom_learning.py research/kalshi/frankie_boss/tests/test_critic_knowledge_loop.py research/kalshi/frankie_boss/tests/test_critic_replay_lineage.py research/kalshi/frankie_boss/tests/test_actual_training_knowledge_lineage.py research/kalshi/frankie_boss/tests/test_classroom_learning_history.py research/kalshi/frankie_boss/tests/test_completed_classroom_history.py
      - run: python -m compileall -q deploy/aws/box research/kalshi/frankie_boss
      - name: Verify all pinned shared research source bytes
        run: python research/kalshi/frankie_boss/operations/prepare_shared_knowledge.py --catalog research/kalshi/frankie_boss/knowledge/DIPOLE_SHARED_CATALOG_20260922.json --catalog-sha256 9b2ca9849e4f119b2f814304b94d0c5162a6f597b76e9ce2ab25b9ab62facf01 --destination "$RUNNER_TEMP/dipole-shared-knowledge"


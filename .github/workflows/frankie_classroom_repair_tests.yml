name: Frankie classroom repair tests
on:
  push:
    branches: ['codex/trading-day-readiness-20260922']
    paths:
      - 'deploy/aws/box/frankie_box_classroom*.py'
      - 'deploy/aws/box/frankie_box_boss_session.py'
      - 'tests/test_frankie_box_classroom_cache.py'
      - '.github/workflows/frankie_classroom_repair_tests.yml'
permissions:
  contents: read
jobs:
  box:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir pytest==9.1.1 numpy==2.3.5
      - run: python -m pytest -q tests/test_frankie_box_classroom_cache.py tests/test_frankie_box_classroom.py tests/test_frankie_box_boss_session_classroom.py

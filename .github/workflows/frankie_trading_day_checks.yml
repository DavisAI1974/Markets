name: Frankie trading-day readiness checks
on:
  push:
    branches: ['codex/trading-day-readiness-20260922']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FRANKIE_BOX_PRODUCERS: ${{ github.workspace }}/.producers-2ebb8ce8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-cache-dir numpy==2.3.5 boto3==1.42.23 botocore==1.42.97 cffi databento-dbn==0.62.0 zstandard==0.25.0 pytest==9.1.1 cryptography==46.0.3 requests pyyaml==6.0.2
      - run: bash deploy/aws/box/producers_checkout.sh
      - run: python -m compileall -q research/kalshi/frankie_boss deploy/aws/box
      - name: Trading-day boundaries and ingest regression
        run: python -m pytest -q research/kalshi/frankie_boss/tests/test_trading_day_schedule.py research/kalshi/frankie_boss/tests/test_schedule_serialization.py research/kalshi/frankie_boss/tests/test_completed_schedule_view.py research/kalshi/frankie_boss/tests/test_ingest_block_sources.py research/kalshi/frankie_boss/tests/test_run_actual_sunday_compact_source.py
      - name: Expanded cycle zero regressions
        if: success() || failure()
        run: python -m pytest -q tests/test_frankie_box_classroom.py tests/test_frankie_box_packets.py tests/test_frankie_box_boss_session_rerun.py tests/test_frankie_box_bedrock.py tests/test_frankie_box_digest_render.py tests/test_frankie_box_boss_session_derive.py tests/test_frankie_box_boss_session_teach.py

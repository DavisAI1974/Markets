name: NG Exhaustion Entry Timing Lane3 Plus0 Profitability 20260818

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-entry-timing-revival-20260818
    paths:
      - research/NG_EXHAUSTION_ENTRY_TIMING_LANE3_PLUS0_LAUNCH_20260818.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  BASE_ID: '9281733364'
  BASE_SHA: f50eaf74a57654334691cbf5cce3b038443f6944a9c00eb5da6ca35b557802b1
  HELD_ID: '9281272840'
  HELD_SHA: 21577d01d45241264df714ab6ee5b95f6a774e1475e0d74a9454221fdfdde12e

jobs:
  lane3-plus0:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ng-exhaustion-entry-timing-revival-20260818
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet numpy scikit-learn
      - name: Compile detector-confirmation plus0 agent
        run: python -m py_compile research/ng_exhaustion_d1_plus0_profitability_20260818.py
      - name: Download and verify immutable canonical sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/in/base /tmp/in/held
          get_artifact () {
            id="$1"; sha="$2"; zip="$3"; dest="$4"
            curl -L --fail --silent --show-error -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "${zip}"
            echo "${sha}  ${zip}" | sha256sum -c -
            unzip -q "${zip}" -d "${dest}"
          }
          get_artifact "${BASE_ID}" "${BASE_SHA}" /tmp/base.zip /tmp/in/base
          get_artifact "${HELD_ID}" "${HELD_SHA}" /tmp/held.zip /tmp/in/held
      - name: Require completed lane2 preserve-all outputs
        run: |
          set -euo pipefail
          D=research/generated/ng_exhaustion_entry_timing_revival_20260818/lane2_all_d1_rawpath
          test -s "${D}/NG_EXHAUSTION_D1_ALL_RAWPATH_MASTER_20260818.jsonl.gz"
          test -s "${D}/NG_EXHAUSTION_D1_ALL_DETECTOR_CHECKPOINTS_20260818.jsonl.gz"
          test -s "${D}/NG_EXHAUSTION_D1_ALL_RAWPATH_SUMMARY_20260818.json"
          python - <<'PY'
          import json
          p='research/generated/ng_exhaustion_entry_timing_revival_20260818/lane2_all_d1_rawpath/NG_EXHAUSTION_D1_ALL_RAWPATH_SUMMARY_20260818.json'
          d=json.load(open(p))
          assert d['status']=='D1_ALL_RAWPATH_ENTRY_CLOCK_LANE2_COMPLETE'
          assert d['forward_exact_d1_n']==18837
          assert d['filtered_exact_d1_rows']==0
          assert d['entry_hierarchy'].startswith('DETECTOR_KNOWN_FIRST')
          assert d['checkpoint_grid'][:9]==[0,1,2,3,4,5,10,15,20]
          assert d['checkpoint_grid'][9]==25 and d['checkpoint_grid'][-1]==3600
          PY
      - name: Run plus0 causal profitability test
        run: |
          set -euo pipefail
          D=research/generated/ng_exhaustion_entry_timing_revival_20260818/lane2_all_d1_rawpath
          OUT=research/generated/ng_exhaustion_entry_timing_revival_20260818/lane3_plus0_profitability
          python research/ng_exhaustion_d1_plus0_profitability_20260818.py \
            --base /tmp/in/base/NG_EXHAUSTION_CHAIN_CANONICAL_54W_BASE_20260817_EVENT_TABLE.jsonl.gz \
            --held /tmp/in/held/NG_EXHAUSTION_CHAIN_CANONICAL_HELD_WEEK_20260329_EVENT_TABLE.jsonl.gz \
            --path-master "${D}/NG_EXHAUSTION_D1_ALL_RAWPATH_MASTER_20260818.jsonl.gz" \
            --checkpoints "${D}/NG_EXHAUSTION_D1_ALL_DETECTOR_CHECKPOINTS_20260818.jsonl.gz" \
            --out-dir "${OUT}"
      - name: Verify plus0 chronology, preservation, and leakage guards
        run: |
          python - <<'PY'
          import json
          p='research/generated/ng_exhaustion_entry_timing_revival_20260818/lane3_plus0_profitability/NG_EXHAUSTION_D1_PLUS0_EARLY_ENTRY_SUMMARY_20260818.json'
          d=json.load(open(p))
          assert d['status']=='D1_PLUS0_EARLY_ENTRY_COMPLETE'
          pop=d['population']
          assert pop['forward_exact_d1_n']==18837
          assert pop['model_fillable_plus0_n']+pop['no_plus0_structural_window_n']+pop['no_plus0_fill_or_checkpoint_n']==18837
          assert pop['early_plus0_actionable_n']+pop['fallback_after_plus0_n']==pop['model_fillable_plus0_n']
          assert d['clock']=='DETECTOR_CONFIRMATION_IS_PLUS0'
          assert len(d['chronology']['fit_weeks'])==12
          assert len(d['chronology']['tune_weeks'])==6
          fc=' '.join(d['model']['feature_contract']).lower()
          assert 'descendant state/identity' in fc
          assert 'full-state/post-state labels are excluded' in fc
          assert d['fallback_grid'][:8]==[1,2,3,4,5,10,15,20]
          assert d['fallback_grid'][8]==25 and d['fallback_grid'][-1]==3600
          assert all((b-a)==5 for a,b in zip(d['fallback_grid'][8:],d['fallback_grid'][9:]))
          assert not any(d['protected_mutations'].values())
          print(json.dumps({
            'early_validation':d['early_validation'],
            'population':pop,
            'threshold':d['threshold_selection']['selected_abs_prediction_threshold_ticks'],
          },indent=2))
          PY
      - name: Commit durable lane3 outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/ng_exhaustion_entry_timing_revival_20260818/lane3_plus0_profitability
          git diff --cached --quiet && exit 0
          git commit -m 'Record D1 detector-confirmation plus0 profitability results'
          for i in 1 2 3; do
            git pull --rebase origin chatgpt/ng-exhaustion-entry-timing-revival-20260818 || true
            git push origin HEAD:chatgpt/ng-exhaustion-entry-timing-revival-20260818 && exit 0
            sleep $((i*3))
          done
          exit 1

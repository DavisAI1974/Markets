name: NG readiness v32 attribution authorization

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - research/kalshi/ng_g15_counterfactual_attribution_gate.py
      - research/kalshi/ng_historical_refinement_readiness_v32.py
      - research/kalshi/ng_historical_refinement_executor_v28.py
      - research/kalshi/tests/test_ng_g15_counterfactual_attribution_gate.py
      - research/kalshi/tests/test_ng_readiness_v32_attribution_authorization.py
      - .github/workflows/ng_readiness_v32_attribution_authorization_ci.yml
  workflow_dispatch:

jobs:
  attribution-authorization-readiness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Compile exact authorization chain
        run: |
          python -m py_compile \
            ng_g15_counterfactual_attribution_gate.py \
            ng_historical_refinement_readiness_v32.py \
            ng_historical_refinement_executor_v28.py \
            tests/test_ng_readiness_v32_attribution_authorization.py
      - name: Run deterministic self-tests
        run: |
          python ng_g15_counterfactual_attribution_gate.py --selftest
          python ng_historical_refinement_readiness_v32.py --selftest
      - name: Run focused tests
        run: |
          pytest -q \
            tests/test_ng_g15_counterfactual_attribution_gate.py \
            tests/test_ng_readiness_v32_attribution_authorization.py
      - name: Verify chronology and permanent authority wall
        run: |
          python - <<'PY'
          import ng_g15_counterfactual_attribution_gate as gate
          import ng_historical_refinement_executor_v28 as executor
          import ng_historical_refinement_readiness_v32 as readiness

          keys = [spec.key for spec in readiness.STAGES]
          i = keys.index("g15_counterfactual_attribution")
          assert keys[i:i+3] == [
              "g15_counterfactual_attribution",
              "g15_counterfactual_attribution_authorization",
              "g15_publication",
          ]
          spec = readiness.STAGES[i + 1]
          assert spec.pre_outcome is True
          assert spec.schema == gate.SCHEMA
          assert executor.SUGGESTED_ENTRYPOINTS[
              "g15_counterfactual_attribution_authorization"
          ] == ("python", "ng_g15_counterfactual_attribution_gate.py")

          artifact = readiness._linked_fixture_chain()[
              "g15_counterfactual_attribution_authorization"
          ]
          assert artifact["actual_outcomes_used"] is False
          assert artifact["random_shuffle_used"] is False
          assert artifact["one_signal_authority_preserved"] is True
          assert artifact["blind_forecasts_immutable"] is True
          assert artifact["may_update_ng_brain"] is False
          assert artifact["execution_authority"] is False
          assert artifact["g16_authorized"] is False
          assert artifact["cme_event_contracts_mode"] == "SHADOW"
          assert artifact["brokerage_contract"] == "tastytrade_not_ibkr"
          assert artifact["options_lane_started"] is False
          PY

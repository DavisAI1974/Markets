name: Receipt-bound workflow continuation checks
on:
  push:
    branches: ['codex/trading-day-readiness-20260922']
    paths:
      - 'research/kalshi/frankie_boss/operations/workflow_wait.py'
      - 'research/kalshi/frankie_boss/operations/run_actual_sunday.py'
      - 'research/kalshi/frankie_boss/operations/run_actual_sunday_classroom.py'
      - 'research/kalshi/frankie_boss/operations/run_actual_sunday_ec2.py'
      - 'research/kalshi/frankie_boss/operations/day_pipeline.py'
      - 'deploy/aws/host/day_cycles.ps1'
      - 'research/kalshi/frankie_boss/operations/workflow_delivery.py'
      - 'deploy/aws/host/build_readiness_delivery.py'
      - 'deploy/aws/host/frankie_host_record_principal_response.ps1'
      - '.github/workflows/frankie_deliver_readiness.yml'
      - '.github/workflows/frankie_host_record_principal_response.yml'
      - 'tests/test_workflow_delivery.py'
      - 'tests/test_workflow_wait_receipts.py'
      - 'tests/test_day_pipeline_wait_resume.py'
      - 'tests/test_actual_workflow_pending.py'
      - 'tests/test_day_cycles_pending_return.py'
      - '.github/workflows/frankie_workflow_continuation_ci.yml'
permissions:
  contents: read
jobs:
  isolated-continuation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir pytest==9.1.1 PyYAML==6.0.3 boto3==1.42.23 botocore==1.42.97
      - name: Require isolated PowerShell runtime
        run: command -v pwsh
      - name: Real receipt files and actual pipeline with fake process boundary
        working-directory: tests
        run: python -B -m pytest test_workflow_wait_receipts.py test_day_pipeline_wait_resume.py test_workflow_delivery.py test_day_cycles_pending_return.py test_actual_workflow_pending.py -q --rootdir=. --confcutdir=. --noconftest -p no:cacheprovider

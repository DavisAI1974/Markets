name: NG readiness v14 execution chain

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - "research/kalshi/ng_historical_refinement_executor_v11.py"
      - "research/kalshi/ng_historical_refinement_preflight_v11.py"
      - "research/kalshi/ng_corpus_executor_plan_compiler_v10.py"
      - "research/kalshi/ng_corpus_executor_pipeline_arm_v10.py"
      - "research/kalshi/ng_historical_refinement_readiness_v14.py"
      - "research/kalshi/ng_g16_exact_context_compilation_gate.py"
      - "research/kalshi/tests/test_ng_readiness_v14_execution_chain.py"
      - ".github/workflows/ng_readiness_v14_execution_chain_ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-readiness-v14-execution-chain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile readiness-v14 execution chain
        run: |
          python -m py_compile \
            ng_historical_refinement_executor_v11.py \
            ng_historical_refinement_preflight_v11.py \
            ng_corpus_executor_plan_compiler_v10.py \
            ng_corpus_executor_pipeline_arm_v10.py \
            ng_historical_refinement_readiness_v14.py \
            ng_g16_exact_context_compilation_gate.py \
            tests/test_ng_readiness_v14_execution_chain.py
      - name: Run focused readiness-v14 execution tests
        run: |
          python -m unittest tests.test_ng_readiness_v14_execution_chain
      - name: Run compiler-attestation self-tests
        run: |
          python ng_g16_exact_context_compilation_gate.py --selftest
          python ng_historical_refinement_readiness_v14.py --selftest
      - name: Verify final outcome boundary and entrypoints
        run: |
          python - <<'PY'
          import ng_historical_refinement_executor_v11 as executor
          import ng_historical_refinement_readiness_v14 as readiness

          rows = {spec.key: spec for spec in readiness.STAGES}
          keys = [spec.key for spec in readiness.STAGES]
          assert keys.index("g16_counterfactual_curve_lock") < keys.index(
              "g16_exact_lock_context_compilation"
          ) < keys.index("g16_counterfactual_publication") < keys.index(
              "g16_exact_publication_context_compilation"
          )
          assert rows["g16_exact_lock_context_compilation"].pre_outcome
          assert not rows["g16_exact_publication_context_compilation"].pre_outcome
          assert executor.SUGGESTED_ENTRYPOINTS[
              "g16_exact_lock_context_compilation"
          ][-1] == "lock"
          assert executor.SUGGESTED_ENTRYPOINTS[
              "g16_exact_publication_context_compilation"
          ][-1] == "complete"
          PY
      - name: Verify permanent authority wall
        run: |
          python - <<'PY'
          import ng_historical_refinement_readiness_v14 as readiness

          values = readiness._linked_fixture_chain()
          for key in (
              "g16_exact_lock_context_compilation",
              "g16_exact_publication_context_compilation",
          ):
              value = values[key]
              assert value["paid_live_data_assumed"] is False
              assert value["random_shuffle_used"] is False
              assert value["one_signal_authority_preserved"] is True
              assert value["blind_forecasts_immutable"] is True
              assert value["may_update_ng_brain"] is False
              assert value["execution_authority"] is False
              assert value["cme_event_contracts_mode"] == "SHADOW"
              assert value["brokerage_contract"] == "tastytrade_not_ibkr"
              assert value["options_lane_started"] is False
          PY

name: Dipole Classroom Integration Focused

on:
  push:
    branches:
      - chatgpt/frankie-dipole-classroom-integration-ci-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install focused numeric test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy==2.3.5
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run reviewed classroom and integration suites
        env:
          PYTHONPATH: .:research/kalshi/frankie_boss
        run: |
          python -m pytest -q \
            research/kalshi/frankie_boss/tests/test_dipole_classroom.py \
            research/kalshi/frankie_boss/tests/test_dipole_classroom_session.py \
            research/kalshi/frankie_boss/tests/test_dipole_classroom_hardening.py \
            research/kalshi/frankie_boss/tests/test_dipole_classroom_final_review.py \
            research/kalshi/frankie_boss/tests/test_dipole_classroom_review_fixes.py \
            research/kalshi/frankie_boss/tests/test_dipole_classroom_integration.py \
            research/kalshi/frankie_boss/tests/test_sunday_execution.py \
            research/kalshi/frankie_boss/tests/test_frankie_principal_adapter.py \
            research/kalshi/frankie_boss/tests/test_source_contract_runtime.py \
            research/kalshi/frankie_boss/tests/test_claude_cycle_review_fixes.py \
            research/kalshi/frankie_boss/tests/test_integrated_principal_recovery.py

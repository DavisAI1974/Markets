name: NG historical refinement branch preflight

on:
  push:
    paths:
      - research/kalshi/ng_historical_refinement_preflight.py
      - research/kalshi/ng_branch_alignment_gate.py
      - research/kalshi/ng_historical_refinement_executor.py
      - research/kalshi/ng_historical_refinement_readiness.py
      - research/kalshi/tests/test_ng_historical_refinement_preflight.py
      - .github/workflows/ng_historical_refinement_preflight_ci.yml
  pull_request:
    paths:
      - research/kalshi/ng_historical_refinement_preflight.py
      - research/kalshi/ng_branch_alignment_gate.py
      - research/kalshi/ng_historical_refinement_executor.py
      - research/kalshi/ng_historical_refinement_readiness.py
      - research/kalshi/tests/test_ng_historical_refinement_preflight.py
      - .github/workflows/ng_historical_refinement_preflight_ci.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile branch-to-executor chain
        working-directory: research/kalshi
        run: |
          python -m py_compile \
            ng_branch_alignment_gate.py \
            ng_historical_refinement_readiness.py \
            ng_historical_refinement_executor.py \
            ng_historical_refinement_preflight.py \
            tests/test_ng_historical_refinement_preflight.py

      - name: Run authority selftests
        working-directory: research/kalshi
        run: |
          python ng_branch_alignment_gate.py --selftest
          python ng_historical_refinement_executor.py --selftest
          python ng_historical_refinement_preflight.py --selftest

      - name: Run 17 preflight tests
        working-directory: research/kalshi
        run: python -m unittest discover -s tests -p 'test_ng_historical_refinement_preflight.py' -v

      - name: Verify live Git preflight and dirty-source stand-down
        working-directory: research/kalshi
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from tempfile import TemporaryDirectory

          import ng_branch_alignment_gate as alignment
          import ng_historical_refinement_executor as executor
          import ng_historical_refinement_preflight as preflight

          branch = alignment.DEFAULT_BRANCH
          with TemporaryDirectory() as tempdir:
              repo = Path(tempdir) / "Markets"
              work = repo / "research" / "kalshi"
              artifacts = work / "renders" / "ng_refine_s95"
              artifacts.mkdir(parents=True)
              subprocess.run(["git", "init", "-b", branch, str(repo)], check=True, capture_output=True)
              subprocess.run(["git", "-C", str(repo), "config", "user.email", "ci@example.com"], check=True)
              subprocess.run(["git", "-C", str(repo), "config", "user.name", "CI"], check=True)
              for relative in ("forecasts/grp15.json", "forecasts/grp16.json", "knowledge/ng_brain.json"):
                  path = work / relative
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text("{}\n", encoding="utf-8")
              subprocess.run(["git", "-C", str(repo), "add", "."], check=True)
              subprocess.run(["git", "-C", str(repo), "commit", "-m", "fixture"], check=True, capture_output=True)
              subprocess.run(
                  ["git", "-C", str(repo), "remote", "add", "origin", "git@github.com:DavisAI1974/Markets.git"],
                  check=True,
              )
              head = subprocess.check_output(["git", "-C", str(repo), "rev-parse", "HEAD"], text=True).strip()
              subprocess.run(
                  ["git", "-C", str(repo), "update-ref", f"refs/remotes/origin/{branch}", head],
                  check=True,
              )

              plan = executor.build_plan(artifacts, work)
              receipt = preflight.execute_preflight(
                  plan,
                  artifacts / "ledger.json",
                  dry_run=True,
                  executor_runner=lambda *args, **kwargs: {"status": "CONFIGURATION_REQUIRED"},
              )
              preflight.validate_receipt(receipt)
              assert receipt["status"] == "PREFLIGHT_PASSED"
              assert receipt["head_immutable_during_execution"] is True

              dirty = work / "unexpected_source.py"
              dirty.write_text("raise SystemExit\n", encoding="utf-8")
              blocked = preflight.execute_preflight(
                  plan,
                  artifacts / "ledger.json",
                  dry_run=True,
                  executor_runner=lambda *args, **kwargs: (_ for _ in ()).throw(AssertionError("must not execute")),
              )
              preflight.validate_receipt(blocked)
              assert blocked["status"] == "BRANCH_ALIGNMENT_BLOCKED"
              assert "DIRTY_OUTSIDE_ALLOWED_PATHS" in blocked["blockers"]
              assert blocked["executor_called"] is False
              assert blocked["cme_event_contracts_mode"] == "SHADOW"
              assert blocked["brokerage_contract"] == "tastytrade_not_ibkr"
              assert blocked["options_lane_started"] is False
          PY

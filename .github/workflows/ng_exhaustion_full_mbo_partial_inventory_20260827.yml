name: TEMP Read-Only Full-MBO Partial Inventory 20260827

on:
  push:
    branches:
      - chatgpt/frankie-october-aws-readonly-20260824
    paths:
      - .github/workflows/ng_exhaustion_full_mbo_partial_inventory_20260827.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_DEFAULT_REGION: us-east-2
      INSTANCE_ID: i-08cee7171c0a76a04
      RUN_ROOT: /mnt/markets/ng_exhaustion_two_day_full_mbo_step1_20260825/32819740234-1
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Inventory preserved partial output without mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = os.environ["RUN_ROOT"]
          remote = r'''set -euo pipefail
          python3 - "$1" <<'PYREMOTE'
          import datetime as dt
          import gzip
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          out = root / "results"
          report = {
              "schema": "NG_EXHAUSTION_FULL_MBO_PARTIAL_INVENTORY_V1_20260827",
              "run_root_exists": root.is_dir(),
              "results_dir_exists": out.is_dir(),
              "files": [],
              "native_seconds": None,
              "final_outputs_present": {},
          }
          if out.is_dir():
              for path in sorted(p for p in out.rglob("*") if p.is_file()):
                  h = hashlib.sha256()
                  with path.open("rb") as handle:
                      for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                          h.update(chunk)
                  report["files"].append({
                      "path": str(path.relative_to(out)),
                      "bytes": path.stat().st_size,
                      "sha256": h.hexdigest(),
                  })
              seconds = out / "V4_NATIVE_FULL_MBO_SECONDS.jsonl.gz"
              if seconds.is_file():
                  count = 0
                  first = None
                  last = None
                  instruments = set()
                  top_keys = set()
                  feature_keys = set()
                  with gzip.open(seconds, "rt", encoding="utf-8") as handle:
                      for line in handle:
                          if not line.strip():
                              continue
                          row = json.loads(line)
                          count += 1
                          sec = row.get("epoch_second")
                          if isinstance(sec, int):
                              first = sec if first is None else min(first, sec)
                              last = sec if last is None else max(last, sec)
                          iid = row.get("instrument_id")
                          if iid is not None:
                              instruments.add(str(iid))
                          top_keys.update(row.keys())
                          features = row.get("features")
                          if isinstance(features, dict):
                              feature_keys.update(features.keys())
                  iso = lambda x: dt.datetime.fromtimestamp(x, tz=dt.timezone.utc).isoformat() if x is not None else None
                  report["native_seconds"] = {
                      "rows": count,
                      "first_epoch_second": first,
                      "last_epoch_second": last,
                      "first_utc": iso(first),
                      "last_utc": iso(last),
                      "instrument_count": len(instruments),
                      "instrument_ids": sorted(instruments),
                      "top_level_keys": sorted(top_keys),
                      "feature_count": len(feature_keys),
                      "feature_keys": sorted(feature_keys),
                  }
          for name in (
              "UNCAPPED_MBO_PROPOSALS.jsonl.gz",
              "UNCAPPED_MBO_PROPOSAL_LOCK.json",
              "UNCAPPED_MBO_FAMILY_DISCOVERY.json",
              "V4_NATIVE_FULL_MBO_EVENTS.jsonl.gz",
              "STEP1_DUAL_FULL_MBO_RECEIPT.json",
          ):
              report["final_outputs_present"][name] = (out / name).is_file()
          print("PARTIAL_FULL_MBO_SUMMARY=" + json.dumps(report, sort_keys=True, separators=(",", ":")))
          PYREMOTE
          '''
          remote = remote.replace('"$1"', json.dumps(root))
          Path("/tmp/ssm-params.json").write_text(json.dumps({"commands": [remote]}))
          PY
          command_id="$(aws ssm send-command             --instance-ids "$INSTANCE_ID"             --document-name AWS-RunShellScript             --comment "Read-only inventory of preserved failed full-MBO Step-1 output"             --parameters file:///tmp/ssm-params.json             --query Command.CommandId --output text)"
          for poll in $(seq 1 90); do
            status="$(aws ssm get-command-invocation --command-id "$command_id"               --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break;; esac
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$command_id"             --instance-id "$INSTANCE_ID" --output json > /tmp/invocation.json
          python - <<'PY'
          import json
          row=json.load(open("/tmp/invocation.json"))
          print(row.get("StandardOutputContent", ""))
          if row.get("StandardErrorContent"):
              print(row["StandardErrorContent"])
          if row.get("Status") != "Success" or row.get("ResponseCode") != 0:
              raise SystemExit("PARTIAL_INVENTORY_FAILED")
          PY

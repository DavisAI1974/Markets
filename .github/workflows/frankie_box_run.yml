      - name: Disk rescue (EC2 API; Greg's go only) - stop, one-time boothook beside the existing user-data, start
        if: inputs.script == 'deploy/aws/box/frankie_box_disk_rescue.sh'
        run: |
          python - <<'PY' | tee box-run-output.txt
          import base64, boto3, email, hashlib, os, re, time
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          iid, region = os.environ['INSTANCE'], os.environ['REGION']
          if iid != 'i-035994afa8bdf66a5' or region != 'us-east-1' or os.environ['VARIABLES'] != 'CONFIRM=GREG_GO_DISK_RESCUE_TABLE_0007':
              raise SystemExit('canonical box and VARIABLES=CONFIRM=GREG_GO_DISK_RESCUE_TABLE_0007 required')
          ec2 = boto3.client('ec2', region_name=region)
          hook = open('deploy/aws/box/frankie_box_disk_rescue_boothook.sh', encoding='utf-8').read()
          if not hook.startswith('#cloud-boothook\n'):
              raise SystemExit('boothook must start with #cloud-boothook')
          value = ec2.describe_instance_attribute(InstanceId=iid, Attribute='userData')['UserData'].get('Value') or ''
          original = base64.b64decode(value) if value else b''
          print('existing user-data: %d bytes, sha256 %s' % (len(original), hashlib.sha256(original).hexdigest()), flush=True)
          if original.startswith(b'\x1f\x8b'):
              raise SystemExit('existing user-data is gzip-compressed; not combined automatically')
          part = MIMEText(hook, 'cloud-boothook', 'utf-8')
          if not original.strip():
              combined = hook.encode('utf-8')
          elif original.lstrip().lower().startswith(b'content-type: multipart') or original.startswith(b'MIME-Version'):
              message = email.message_from_bytes(original)
              if not message.is_multipart():
                  raise SystemExit('existing user-data claims MIME but is not multipart')
              if 'frankie-disk-rescue' in original.decode('utf-8', 'replace'):
                  raise SystemExit('the rescue boothook is already in the user-data')
              message.attach(part)
              combined = message.as_bytes()
          else:
              first = original.lstrip().split(b'\n', 1)[0]
              kinds = ((b'#cloud-config', 'cloud-config'), (b'#!', 'x-shellscript'), (b'#cloud-boothook', 'cloud-boothook'),
                       (b'#include', 'x-include-url'), (b'#upstart-job', 'upstart-job'), (b'#part-handler', 'part-handler'))
              kind = next((k for prefix, k in kinds if first.startswith(prefix)), None)
              if kind is None:
                  raise SystemExit('existing user-data type not recognised from its first line; not combined automatically')
              message = MIMEMultipart()
              message.attach(MIMEText(original.decode('utf-8'), kind, 'utf-8'))
              message.attach(part)
              combined = message.as_bytes()
              print('existing user-data kept as its own part: text/%s' % kind, flush=True)
          if len(combined) > 16384:
              raise SystemExit('combined user-data %d bytes exceeds the 16 KB limit' % len(combined))
          print('combined user-data: %d bytes, sha256 %s' % (len(combined), hashlib.sha256(combined).hexdigest()), flush=True)
          ec2.stop_instances(InstanceIds=[iid])
          ec2.get_waiter('instance_stopped').wait(InstanceIds=[iid], WaiterConfig={'Delay': 10, 'MaxAttempts': 90})
          print('stopped', flush=True)
          ec2.modify_instance_attribute(InstanceId=iid, UserData={'Value': combined})
          started = time.time()
          ec2.start_instances(InstanceIds=[iid])
          ec2.get_waiter('instance_running').wait(InstanceIds=[iid], WaiterConfig={'Delay': 10, 'MaxAttempts': 90})
          print('running', flush=True)
          ssm = boto3.client('ssm', region_name=region)
          for attempt in range(90):
              time.sleep(10)
              info = ssm.describe_instance_information(Filters=[{'Key': 'InstanceIds', 'Values': [iid]}])['InstanceInformationList']
              ping = info[0].get('LastPingDateTime') if info else None
              if info and info[0]['PingStatus'] == 'Online' and ping is not None and ping.timestamp() > started:
                  print('SSM Online', flush=True)
                  break
          else:
              print('SSM not Online after 15 min; read the console below', flush=True)
          text = ec2.get_console_output(InstanceId=iid, Latest=True).get('Output') or ''
          try:
              text = base64.b64decode(text, validate=True).decode('utf-8', 'replace')
          except Exception:
              pass
          lines = [l for l in text.splitlines() if 'frankie-disk-rescue' in l]
          print('### boothook console lines (%d)' % len(lines)); print('\n'.join(lines))
          PY
      # The former "CLM sidecar Pod" and "Jev Pod" runner steps (clm_sidecar/launch.py on a Runpod GPU Pod) are retired:
      # the step "Refuse the retired Pod routes" above ends either dispatch before any provider call. The launcher source
      # stays in git (research/kalshi/frankie_boss/clm_sidecar/launch.py) as historical evidence; it is no longer reachable
      # from this workflow and no step here carries a provider credential.
      - name: AWS CPU Linux lane controller (runner; retained ROOT-to-finish ownership)
        # Legacy marker filename. A LISTED, UNUSED FALLBACK (Greg, 2026-10-07: NO days on the small box; every day runs on the
        # main box's two held 16-CPU lanes and never leaves it): loop/resume refuse unless FALLBACK=worker_box names this
        # route explicitly (an explicit decision, beside Greg's AWS go); plan/status/stop stay read-only/cooperative. No Pods.
        # VARIABLES: ACTION=plan|status|loop|resume|stop RUN=<saved run> CODE_ROOT=<staged main checkout>
        # BOXES=i-0d17573dbce871520@us-east-1 SLOTS=1 [DATA_WORKERS=15] [BUDGET_MINUTES=330] [DAYS=YYYYMMDD,... the authorized scope]
        # JOB=<run>-YYYYMMDD-aN is required for resume/stop. stop requests cooperative save, not machine shutdown.
        # plan/status are read-only; loop/resume require Greg's explicit AWS go. A loop here is BOUNDED (its budget end is
        # budget_expired, never completion); the controller's lifetime is the main-box route script=
        # deploy/aws/box/frankie_box_cpu_controller.sh (a run-bound systemd unit); an S3 lease keeps the two off one run.
        # --commit binds the staged checkout to THIS dispatched commit (the controller refuses a differing queue code_commit).
        if: inputs.script == 'deploy/aws/box/frankie_box_pod_root_loop.sh'
        run: |
          set -euo pipefail
          declare -A v=()
          for pair in $VARIABLES; do
            [[ "$pair" =~ ^[A-Z_][A-Z0-9_]*= ]] || { echo "expected NAME=VALUE"; exit 1; }
            k=${pair%%=*}
            case "$k" in
              ACTION|RUN|CODE_ROOT|BOXES|SLOTS|DATA_WORKERS|BUDGET_MINUTES|JOB|DAYS|FALLBACK) ;;
              PODS|COUNT|CONFIRM|DATA_CENTERS|VOLUME_GB|CONTAINER_GB|WAIT_MINUTES|RUNPOD_API_KEY|HOST|STATE_DIR)
                echo "$k is a retired Pod input or a main-box-only controller input; refused here (even when empty)"; exit 1;;
              *) echo "unsupported Linux controller input: $k"; exit 1;;
            esac
            [[ ! -v v[$k] ]] || { echo "duplicate controller input: $k"; exit 1; }
            v[$k]=${pair#*=}
          done
          [[ "${v[ACTION]:-}" =~ ^(plan|status|loop|resume|stop)$ ]] || { echo "ACTION=plan|status|loop|resume|stop required"; exit 1; }
          [[ "${v[RUN]:-}" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || { echo "RUN (the orchestrator run) required"; exit 1; }
          [[ "${v[CODE_ROOT]:-}" =~ ^/opt/frankie-box/code/[A-Za-z0-9_.-]+/markets$ ]] || { echo "CODE_ROOT=/opt/frankie-box/code/<dir>/markets required"; exit 1; }
          [[ "${v[BOXES]:-}" == i-0d17573dbce871520@us-east-1 && "${v[SLOTS]:-1}" == 1 ]] || { echo "BOXES=i-0d17573dbce871520@us-east-1 SLOTS=1 required"; exit 1; }
          for k in DATA_WORKERS BUDGET_MINUTES; do [[ "${v[$k]:-1}" =~ ^[1-9][0-9]*$ ]] || { echo "$k must be a positive integer"; exit 1; }; done
          [[ "${v[DAYS]:-}" =~ ^([0-9]{8}(,[0-9]{8})*)?$ ]] || { echo "DAYS must be a comma list of YYYYMMDD (the authorized scope)"; exit 1; }
          args=()
          if [[ "${v[ACTION]}" == loop || "${v[ACTION]}" == resume ]]; then
            [[ "${v[FALLBACK]:-}" == worker_box ]] || { echo "the worker-box lane is a listed, unused fallback (every day runs on the main box's two lanes): FALLBACK=worker_box (an explicit decision) required for ${v[ACTION]}; nothing claimed or started"; exit 1; }
            args+=(--fallback-route worker_box)
          else
            [[ ! -v v[FALLBACK] ]] || { echo "FALLBACK is only for loop/resume"; exit 1; }
          fi
          if [[ "${v[ACTION]}" == resume || "${v[ACTION]}" == stop ]]; then
            [[ "${v[JOB]:-}" =~ ^${v[RUN]}-[0-9]{8}-a[0-9]+$ ]] || { echo "JOB must name the original RUN-YYYYMMDD-aN attempt"; exit 1; }
            args+=(--job "${v[JOB]}")
          else
            [[ ! -v v[JOB] ]] || { echo "JOB is only for resume/stop"; exit 1; }
          fi
          set +e
          python research/kalshi/frankie_boss/pod_root/controller.py --action "${v[ACTION]}" --run "${v[RUN]}" \
            --code-root "${v[CODE_ROOT]}" --boxes "${v[BOXES]}" --slots "${v[SLOTS]:-1}" --commit "$GITHUB_SHA" \
            --data-workers "${v[DATA_WORKERS]:-15}" --budget-minutes "${v[BUDGET_MINUTES]:-330}" --days "${v[DAYS]:-}" "${args[@]}" \
            2>&1 | tee box-run-output.txt
          rc=${PIPESTATUS[0]}
          set -e
          [ ! -f pod-root-controller.json ] || cp pod-root-controller.json "pod-root-controller-${GITHUB_RUN_ID}.json"
          exit "$rc"

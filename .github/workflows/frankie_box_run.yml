name: Frankie box run (a committed script over SSM on Frankie's Linux box)
# Job 0 (Greg, 2026-09-21): Frankie's harness is built on his box, the ingest runner i-035994afa8bdf66a5
# (Ubuntu, us-east-1, SSM Online, instance profile Ssm). This runs ONE committed script from deploy/aws/box/
# on that box through deploy/aws/ssm_run_sh.py (AWS-RunShellScript) and prints its output. The script comes
# from the dispatched ref's checkout; the path is validated against the checkout, never free-form shell.
# Never stops, resizes or terminates anything: only the script's own text acts, and every script is in git.
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Repo-relative path of the committed script, under deploy/aws/box/ (e.g. deploy/aws/box/frankie_box_inventory.sh)'
        required: true
        default: 'deploy/aws/box/frankie_box_inventory.sh'
      variables:
        description: "Optional NAME=VALUE pairs, space-separated, prepended as literal shell assignments (no quotes, no spaces in values)"
        required: false
        default: ''
      timeout:
        description: 'Seconds the script may run on the box (SSM executionTimeout)'
        required: false
        default: '1800'
      instance:
        description: "Instance id (Frankie's box = the ingest runner)"
        required: false
        default: 'i-035994afa8bdf66a5'
      region:
        description: 'AWS region of the instance'
        required: false
        default: 'us-east-1'
      comment:
        description: 'Short comment recorded on the SSM command'
        required: false
        default: 'frankie box run'
      presign:
        description: "Optional space-separated bucket/key items; each gets a short-lived presigned GET, collected in one private JSON the box fetches through MAP_URL (the box's role reads nothing in S3)"
        required: false
        default: ''
      presign_hours:
        description: 'Presigned GET validity in hours (the URLs live in the private JSON; only MAP_URL travels, masked)'
        required: false
        default: '4'
      github_token_to_ssm:
        description: "true = first copy the repository secret FRANKIE_GITHUB_TOKEN into the SSM SecureString /markets/frankie/github-token (us-east-2) the box reads; prints length and version only, never the value; then the script runs as usual (pass frankie_box_session.sh ACTION=status to see it read)"
        required: false
        default: 'false'
permissions:
  contents: read
concurrency:
  group: box-run-${{ inputs.instance }}
  cancel-in-progress: false
jobs:
  run:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 1440
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_EC2_METADATA_DISABLED: 'true'
      INSTANCE: ${{ inputs.instance }}
      REGION: ${{ inputs.region }}
      SCRIPT: ${{ inputs.script }}
      VARIABLES: ${{ inputs.variables }}
      RUN_TIMEOUT: ${{ inputs.timeout }}
      COMMENT: ${{ inputs.comment }}
      PRESIGN: ${{ inputs.presign }}
      PRESIGN_HOURS: ${{ inputs.presign_hours }}
      MAP_BUCKET: frankie-granite42-568968024170-us-east-1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97
      - name: Validate the script path against the checkout
        run: |
          set -euo pipefail
          case "$SCRIPT" in deploy/aws/box/*.sh) ;; *) echo "script must be a committed deploy/aws/box/*.sh path"; exit 1;; esac
          [[ "$SCRIPT" =~ ^deploy/aws/box/[A-Za-z0-9_.-]+\.sh$ ]] || { echo "script name carries a character outside [A-Za-z0-9_.-]"; exit 1; }
          test -f "$SCRIPT" || { echo "script is not in this ref's checkout: $SCRIPT"; exit 1; }
          [[ "$RUN_TIMEOUT" =~ ^[0-9]+$ ]] || { echo "timeout must be an integer number of seconds"; exit 1; }
          bash -n "$SCRIPT"
          echo "script sha256: $(sha256sum "$SCRIPT" | cut -c1-64)  ref: $GITHUB_SHA"
      - name: Copy the repository secret FRANKIE_GITHUB_TOKEN into SSM /markets/frankie/github-token (only on request; value never printed)
        if: inputs.github_token_to_ssm == 'true'
        env:
          FRANKIE_GITHUB_TOKEN: ${{ secrets.FRANKIE_GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import boto3, os, re
          token = os.environ.get('FRANKIE_GITHUB_TOKEN', '').strip()
          if not re.fullmatch(r'(ghp|github_pat)_[A-Za-z0-9_]{20,255}', token):
              raise SystemExit('repository secret FRANKIE_GITHUB_TOKEN is absent or not a GitHub token shape (length %d); nothing written' % len(token))
          r = boto3.client('ssm', region_name='us-east-2').put_parameter(Name='/markets/frankie/github-token', Type='SecureString', Value=token, Overwrite=True,
                                                                          Description='GitHub PAT for the Frankie box heartbeat and response push (repo scope)')
          print('SSM /markets/frankie/github-token written (us-east-2): version %s, length %d' % (r.get('Version'), len(token)))
          PY
      - name: Require the box Online in SSM (read-only)
        run: |
          python - <<'PY'
          import boto3, os
          iid, region = os.environ['INSTANCE'], os.environ['REGION']
          s = boto3.client('ssm', region_name=region).describe_instance_information(Filters=[{'Key': 'InstanceIds', 'Values': [iid]}])['InstanceInformationList']
          print('SSM:', [(x['PingStatus'], x.get('PlatformName', ''), x.get('PlatformVersion', '')) for x in s] or 'not registered')
          raise SystemExit(0 if s and s[0]['PingStatus'] == 'Online' else 1)
          PY
      - name: Presign the requested objects into one private map (URLs masked, never printed)
        if: inputs.presign != ''
        run: |
          python - <<'PY'
          import json, os, re
          import boto3
          from botocore.config import Config
          items = os.environ['PRESIGN'].split()
          expires = int(float(os.environ['PRESIGN_HOURS']) * 3600)
          def client(bucket):
              region = 'us-east-1' if bucket.endswith('us-east-1') else 'us-east-2'
              return boto3.client('s3', region_name=region, endpoint_url=f'https://s3.{region}.amazonaws.com',
                                  config=Config(signature_version='s3v4', s3={'addressing_style': 'virtual'}))
          out = {}
          for item in items:
              bucket, key = item.split('/', 1)
              if not re.fullmatch(r'[a-z0-9.-]{3,63}', bucket) or not key or '..' in key:
                  raise SystemExit('presign item must be bucket/key')
              s3 = client(bucket)
              head = s3.head_object(Bucket=bucket, Key=key)
              url = s3.generate_presigned_url('get_object', Params={'Bucket': bucket, 'Key': key}, ExpiresIn=expires)
              print('::add-mask::' + url)
              out[key] = dict(bucket=bucket, bytes=head['ContentLength'], url=url)
              print(f'presigned {bucket}/{key} bytes={head["ContentLength"]} expires_in={expires}s')
          mb = os.environ['MAP_BUCKET']; mk = f"box-runs/{os.environ['GITHUB_RUN_ID']}/presigned-map.json"
          g = client(mb)
          g.put_object(Bucket=mb, Key=mk, Body=json.dumps(out, sort_keys=True).encode(), ServerSideEncryption='AES256', ContentType='application/json')
          murl = g.generate_presigned_url('get_object', Params={'Bucket': mb, 'Key': mk}, ExpiresIn=expires)
          if "'" in murl or '\n' in murl or ' ' in murl:
              raise SystemExit('map URL carries a character --set refuses')
          print('::add-mask::' + murl)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'MAP_URL={murl}\n')
          print(f'map: s3://{mb}/{mk} ({len(out)} objects)')
          PY
      - name: Run the committed script on the box
        run: |
          set -euo pipefail
          sets=()
          for pair in $VARIABLES; do sets+=(--set "$pair"); done
          [ -z "${MAP_URL:-}" ] || sets+=(--set "MAP_URL=$MAP_URL")
          python deploy/aws/ssm_run_sh.py --instance "$INSTANCE" --region "$REGION" --script "$SCRIPT" \
            --timeout "$RUN_TIMEOUT" --comment "$COMMENT" "${sets[@]}" | tee box-run-output.txt
      - name: Job summary = the box output
        if: always()
        run: |
          { echo "### $SCRIPT on $INSTANCE ($REGION), ref $GITHUB_SHA"; echo '```'; tail -c 60000 box-run-output.txt 2>/dev/null || echo "(no output)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: box-run-${{ github.run_id }}
          path: box-run-output.txt
          if-no-files-found: warn
          retention-days: 30

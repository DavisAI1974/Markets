name: Frankie box run (a committed script over SSM on Frankie's Linux box)
# Job 0 (Greg, 2026-09-21): Frankie's harness is built on his box, the ingest runner i-035994afa8bdf66a5
# (Ubuntu, us-east-1, SSM Online, instance profile Ssm). This runs ONE committed script from deploy/aws/box/
# on that box through deploy/aws/ssm_run_sh.py (AWS-RunShellScript) and prints its output. The script comes
# from the dispatched ref's checkout; the path is validated against the checkout, never free-form shell.
# Never stops, resizes or terminates anything: only the script's own text acts, and every script is in git.
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Repo-relative path of the committed script, under deploy/aws/box/ (e.g. deploy/aws/box/frankie_box_inventory.sh)'
        required: true
        default: 'deploy/aws/box/frankie_box_inventory.sh'
      variables:
        description: "Optional NAME=VALUE pairs, space-separated, prepended as literal shell assignments (no quotes, no spaces in values)"
        required: false
        default: ''
      timeout:
        description: 'Seconds the script may run on the box (SSM executionTimeout)'
        required: false
        default: '1800'
      instance:
        description: "Instance id (Frankie's box = the ingest runner)"
        required: false
        default: 'i-035994afa8bdf66a5'
      region:
        description: 'AWS region of the instance'
        required: false
        default: 'us-east-1'
      comment:
        description: 'Short comment recorded on the SSM command'
        required: false
        default: 'frankie box run'
      presign:
        description: "Optional space-separated bucket/key items; each gets a short-lived presigned GET, collected in one private JSON the box fetches through MAP_URL (the box's role reads nothing in S3)"
        required: false
        default: ''
      presign_hours:
        description: 'Presigned GET validity in hours (the URLs live in the private JSON; only MAP_URL travels, masked)'
        required: false
        default: '4'
      github_token_to_ssm:
        description: "true = first copy the repository secret FRANKIE_GITHUB_TOKEN into the SSM SecureString /markets/frankie/github-token (us-east-2) the box reads; prints length and version only, never the value; then the script runs as usual (pass frankie_box_session.sh ACTION=status to see it read)"
        required: false
        default: 'false'
permissions:
  contents: read
concurrency:
  # Existing read-only progress and retained-file reads remain available during a long stage.
  # Execution and staging share the serial lock. The explicit identity-bound pause
  # and CPU-affinity controls share a separate lock; neither can launch calculations. Inactive code staging has its own
  # lock (Greg, 2026-09-27): it only unpacks a new inactive checkout, so it need not wait behind a running ROOT.
  # The stop control (frankie_box_stop_cycle.sh, Greg 2026-09-28) shares the pause lock: it must reach a running
  # cycle or render, which holds the box-run lock.
  # The bedrock side builder has its own lock (Greg, 2026-09-28): it reads a running ROOT's finished sources
  # read-only and writes only its own .digest-side-* scratch on idle cores.
  # The CLM sidecar (Jev) Pod runs on the runner and a Runpod GPU, never on the box: its own lock, so a 150-minute
  # Pod run never holds the box-run lock (Greg, 2026-09-28).
  # Jev's relay (Greg, 2026-09-28: Jev sits in with Frankie) reads the running session's files read-only and uploads
  # them through presigned slots: its own lock, so it runs beside the principal that holds box-run.
  # The joined teacher data (Greg, 2026-09-28) reads the retained Monday layer files read-only and writes only its own
  # /opt/frankie-box/work/joined-teacher/ root: its own lock, so it runs beside a launch or principal.
  # Every cycle-0 action (launch, principal, correction, record, retain) runs at once in its own group (Greg, 2026-09-28:
  # "do parallel launches as much as possible. There's no reason to have them all lined up behind each other"): no
  # cycle-0 dispatch waits behind another or replaces a queued one.
  # Principal inputs (one single-core read of ROOT's retained evidence into a fresh root) has its own lock so it can
  # run beside the read-only CLM extract (Greg, 2026-09-28: run in parallel).
  # The day facts for the day selection (2026-09-29) read partitions and write only new files: their own lock, so they
  # never queue behind a run holding box-run.
  # Pulling GitHub-runner ingests onto the box (frankie_box_pull_runner_ingest.sh, 2026-09-29) is network and disk only,
  # writing only its own .runner-pull-* staging and new ingest-<day>-gh-* directories: its own lock, one pull at a time.
  # Archiving a sealed ingest day to S3 (frankie_box_archive_day.sh, 2026-09-29) reads the sealed directory and writes only
  # receipts (restore: its own .archive-restore-* staging): its own lock per box, one archive step at a time.
  # The staged-code cleanup and the bedrock-table cleanup (Greg, 2026-09-29) remove only named, unused files: their own
  # lock, so they never queue behind a running stage.
  # Frankie's FIFO queue (frankie_box_frankie_queue.sh, Greg 2026-09-29): ACTION=show is a read-only probe on box-progress;
  # every other action (enqueue, worker, kick) gets a group of its own per dispatch, so it never replaces and is never
  # replaced by another pending dispatch (the queue's own flock and the one-worker lock keep them safe side by side).
  # The orchestrator's read-only plan / status and a DETACH=on start (returns once its systemd unit is up; the script
  # refuses a second live start of the same RUN) get a group per dispatch (2026-09-30: a plan sat pending for hours behind
  # a waiting orchestrator start that held box-experiment).
  group: ${{ (inputs.script == 'deploy/aws/box/frankie_box_pod_root_loop.sh' && ((contains(inputs.variables, 'ACTION=loop') || contains(inputs.variables, 'ACTION=resume')) && 'pod-root-loop' || format('pod-root-{0}', github.run_id))) || (inputs.script == 'deploy/aws/box/frankie_box_cpu_controller.sh' && ((contains(inputs.variables, 'ACTION=status') || contains(inputs.variables, 'ACTION=preflight')) && format('box-progress-{0}', inputs.instance) || format('box-cpu-controller-{0}-{1}', inputs.instance, github.run_id))) || (inputs.script == 'deploy/aws/box/frankie_box_cycle0.sh' && format('box-cycle0-{0}-{1}', inputs.instance, github.run_id)) || (inputs.script == 'deploy/aws/box/frankie_box_ingest_block.sh' && format('box-ingest-{0}-{1}', inputs.instance, github.run_id)) || (inputs.script == 'deploy/aws/box/frankie_box_progress.sh' || inputs.script == 'deploy/aws/box/frankie_box_read_log.sh' || inputs.script == 'deploy/aws/box/frankie_box_session_cpu.sh' || inputs.script == 'deploy/aws/box/frankie_box_disk_usage.sh' || inputs.script == 'deploy/aws/box/frankie_box_console.sh' || inputs.script == 'deploy/aws/box/frankie_box_jev_reports.sh' || inputs.script == 'deploy/aws/box/frankie_box_cores.sh' || (inputs.script == 'deploy/aws/box/frankie_box_frankie_queue.sh' && contains(inputs.variables, 'ACTION=show'))) && format('box-progress-{0}', inputs.instance) || (inputs.script == 'deploy/aws/box/frankie_box_frankie_queue.sh' && format('box-frankie-queue-{0}-{1}', inputs.instance, github.run_id)) || ((inputs.script == 'deploy/aws/box/frankie_box_pause_root.sh' || inputs.script == 'deploy/aws/box/frankie_box_root_cpu.sh' || inputs.script == 'deploy/aws/box/frankie_box_stop_side.sh' || inputs.script == 'deploy/aws/box/frankie_box_stop_cycle.sh' || inputs.script == 'deploy/aws/box/frankie_box_cleanup_side.sh') && format('box-pause-{0}', inputs.instance)) || (inputs.script == 'deploy/aws/box/frankie_box_stage_code.sh' && format('box-stage-{0}', inputs.instance)) || (inputs.script == 'deploy/aws/box/frankie_box_bedrock_side.sh' && format('box-side-{0}', inputs.instance)) || (inputs.script == 'deploy/aws/box/frankie_box_clm_sidecar_pod.sh' && format('clm-pod-{0}', inputs.instance)) || (inputs.script == 'deploy/aws/box/frankie_box_jev_pod.sh' && format('jev-pod-{0}-{1}', inputs.instance, github.run_id)) || (inputs.script == 'deploy/aws/box/frankie_box_principal_inputs.sh' && format('box-inputs-{0}', inputs.instance)) || (inputs.script == 'deploy/aws/box/frankie_box_clm_sidecar_upload.sh' && format('clm-upload-{0}', inputs.instance)) || (inputs.script == 'deploy/aws/box/frankie_box_jev_relay.sh' && format('jev-relay-{0}', inputs.instance)) || ((inputs.script == 'deploy/aws/box/frankie_box_digest_canary.sh' || inputs.script == 'deploy/aws/box/frankie_box_digest_composition.sh' || inputs.script == 'deploy/aws/box/frankie_box_digest_stacks.sh' || inputs.script == 'deploy/aws/box/frankie_box_parallel_journal_canary.sh') && format('box-canary-{0}', inputs.instance)) || (inputs.script == 'deploy/aws/box/frankie_box_joined_teacher.sh' && format('box-joined-{0}', inputs.instance)) || ((inputs.script == 'deploy/aws/box/frankie_box_export_calcs.sh' || inputs.script == 'deploy/aws/box/frankie_box_experiment_data.sh') && format('box-export-{0}', inputs.instance)) || (inputs.script == 'deploy/aws/box/frankie_box_experiment.sh' && (contains(inputs.variables, 'ACTION=plan') || contains(inputs.variables, 'ACTION=status') || contains(inputs.variables, 'DETACH=on')) && format('box-experiment-{0}-{1}', inputs.instance, github.run_id)) || ((inputs.script == 'deploy/aws/box/frankie_box_experiment_search.sh' || inputs.script == 'deploy/aws/box/frankie_box_scientific_teacher.sh' || inputs.script == 'deploy/aws/box/frankie_box_experiment_root.sh' || inputs.script == 'deploy/aws/box/frankie_box_experiment.sh') && format('box-experiment-{0}', inputs.instance)) || (inputs.script == 'deploy/aws/box/frankie_box_experiment_teacher.sh' && format('box-teacher-{0}-{1}', inputs.instance, github.run_id)) || ((inputs.script == 'deploy/aws/box/frankie_box_experiment_classroom.sh' || inputs.script == 'deploy/aws/box/frankie_box_experiment_classroom_v2.sh' || inputs.script == 'deploy/aws/box/frankie_box_experiment_day_reports.sh') && format('box-classroom-{0}-{1}', inputs.instance, github.run_id)) || (inputs.script == 'deploy/aws/box/frankie_box_day_facts.sh' && format('box-facts-{0}', inputs.instance)) || (inputs.script == 'deploy/aws/box/frankie_box_day_external.sh' && format('box-external-{0}', inputs.instance)) || (inputs.script == 'deploy/aws/box/frankie_runner_ingest.sh' && format('runner-ingest-{0}', github.run_id)) || (inputs.script == 'deploy/aws/box/frankie_box_pull_runner_ingest.sh' && format('box-pull-runner-{0}', inputs.instance)) || (inputs.script == 'deploy/aws/box/frankie_box_archive_day.sh' && format('box-archive-{0}', inputs.instance)) || ((inputs.script == 'deploy/aws/box/frankie_box_cleanup_code.sh' || inputs.script == 'deploy/aws/box/frankie_box_cleanup_bedrock.sh') && format('box-cleanup-code-{0}', inputs.instance)) || format('box-run-{0}', inputs.instance) }}
  cancel-in-progress: false
jobs:
  validate-staging-route:
    if: github.repository == 'DavisAI1974/Markets' && inputs.script == 'deploy/aws/box/frankie_box_stage_code.sh'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      action: ${{ steps.validate.outputs.action }}
    steps:
      - name: Validate the inactive staging route without credentials
        id: validate
        env:
          SCRIPT: ${{ inputs.script }}
          VARIABLES: ${{ inputs.variables }}
          INSTANCE: ${{ inputs.instance }}
          REGION: ${{ inputs.region }}
          PRESIGN: ${{ inputs.presign }}
          GITHUB_TOKEN_TO_SSM: ${{ inputs.github_token_to_ssm }}
        run: |
          python3 -I -S -B - <<'PY'
          import os
          if os.environ['SCRIPT'] != 'deploy/aws/box/frankie_box_stage_code.sh':
              raise SystemExit('inactive staging script required')
          variables=os.environ['VARIABLES']
          if variables not in ('ACTION=inventory','ACTION=stage'):
              raise SystemExit('inactive staging accepts exactly ACTION=inventory or ACTION=stage')
          if os.environ['INSTANCE'] != 'i-035994afa8bdf66a5' or os.environ['REGION'] != 'us-east-1':
              raise SystemExit('inactive staging requires the canonical Linux box and region')
          if os.environ['PRESIGN'] != '' or os.environ['GITHUB_TOKEN_TO_SSM'] != 'false':
              raise SystemExit('inactive staging refuses caller presigning and GitHub token copying')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write('action='+variables.split('=',1)[1]+'\n')
          PY
  stage-code:
    needs: validate-staging-route
    if: github.repository == 'DavisAI1974/Markets' && inputs.script == 'deploy/aws/box/frankie_box_stage_code.sh'
    uses: ./.github/workflows/frankie_stage_code.yml
    with:
      action: ${{ needs.validate-staging-route.outputs.action }}
    secrets: inherit
  # Ingest on GitHub-hosted runners (Greg, 2026-09-29: "Keep ingest data in aws and make a pointer that points at git
  # ... use those CPUs just for ingest"): script=deploy/aws/box/frankie_runner_ingest.sh, variables="DAYS=d1,d2,..
  # [WORKERS=3] [VERIFY=inline] [OBSERVATION=full] [MODE=sequential]". One job per day on its own runner; journals go to
  # S3 (frankie/ingest/<day>/gh-<run>-<attempt>/), never to git; the pointers are committed to frankie-ingest-pointers.
  runner-plan:
    if: github.repository == 'DavisAI1974/Markets' && inputs.script == 'deploy/aws/box/frankie_runner_ingest.sh'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      days: ${{ steps.plan.outputs.days }}
      env: ${{ steps.plan.outputs.env }}
    steps:
      - id: plan
        env:
          VARIABLES: ${{ inputs.variables }}
        run: |
          python3 -I -S -B - <<'PY'
          import json, os, re
          pairs = dict(item.split('=', 1) for item in os.environ['VARIABLES'].split() if '=' in item)
          unknown = set(pairs) - {'DAYS', 'WORKERS', 'VERIFY', 'OBSERVATION', 'MODE'}
          if unknown:
              raise SystemExit('unknown variables: %s' % sorted(unknown))
          days = [d for d in pairs.get('DAYS', '').split(',') if d]
          if not days or not all(re.fullmatch(r'[0-9]{8}', d) for d in days) or len(set(days)) != len(days):
              raise SystemExit('DAYS must be distinct YYYYMMDD values separated by commas')
          rest = {k: v for k, v in pairs.items() if k != 'DAYS'}
          if not all(re.fullmatch(r'[A-Za-z0-9_-]+', v) for v in rest.values()):
              raise SystemExit('variable values must be [A-Za-z0-9_-]')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('days=%s\n' % json.dumps(days))
              out.write('env=%s\n' % json.dumps(rest))
          print('days', days, 'settings', rest)
          PY
  runner-ingest:
    needs: runner-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        day: ${{ fromJSON(needs.runner-plan.outputs.days) }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_EC2_METADATA_DISABLED: 'true'
      DAY: ${{ matrix.day }}
      WORKERS: ${{ fromJSON(needs.runner-plan.outputs.env).WORKERS || '3' }}
      VERIFY: ${{ fromJSON(needs.runner-plan.outputs.env).VERIFY || 'inline' }}
      OBSERVATION: ${{ fromJSON(needs.runner-plan.outputs.env).OBSERVATION || 'full' }}
      MODE: ${{ fromJSON(needs.runner-plan.outputs.env).MODE || 'sequential' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: The box venv's pinned packages
        run: python -m pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r deploy/aws/box/frankie_box_venv_requirements.txt
      - name: Ingest the day (journal and receipts to S3; pointer for git)
        run: POINTER="$RUNNER_TEMP/pointer-$DAY.json" bash deploy/aws/box/frankie_runner_ingest.sh
      - name: Keep the pointer (also when the day failed)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ingest-pointer-${{ matrix.day }}
          path: ${{ runner.temp }}/pointer-${{ matrix.day }}.json
          if-no-files-found: warn
          retention-days: 90
  runner-pointers:
    needs: runner-ingest
    if: always() && needs.runner-ingest.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ingest-pointer-*
          path: pointers
          merge-multiple: true
      - name: Commit the pointers to the branch frankie-ingest-pointers ([skip ci]; the run branch's tip never moves)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls pointers/*.json >/dev/null 2>&1 || { echo "no pointer was written"; exit 1; }
          git init -q repo && cd repo
          git config user.name frankie-runner; git config user.email frankie-runner@markets.local
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin frankie-ingest-pointers; then git checkout -q -b frankie-ingest-pointers FETCH_HEAD
          else git checkout -q --orphan frankie-ingest-pointers; fi
          mkdir -p ingest_pointers
          for f in ../pointers/*.json; do
            day=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['day'])" "$f")
            cp "$f" "ingest_pointers/${day}-gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          done
          git add ingest_pointers
          git commit -q -m "Ingest pointers: run ${GITHUB_RUN_ID} [skip ci]"
          for i in 1 2 3 4; do git push -q origin HEAD:frankie-ingest-pointers && break; sleep $((2 ** i)); git pull -q --rebase origin frankie-ingest-pointers || true; done
          git log --oneline -1
          for f in ingest_pointers/*-gh-${GITHUB_RUN_ID}-*.json; do python3 -c "
          import json,sys; p=json.load(open(sys.argv[1])); print(p['day'], p['status'], p['wall_seconds'], 's', sum(f['bytes'] for f in p['files']), 'bytes', 's3://%s/%s' % (p['bucket'], p['prefix']))" "$f"; done
  run:
    if: github.repository == 'DavisAI1974/Markets' && inputs.script != 'deploy/aws/box/frankie_box_stage_code.sh' && inputs.script != 'deploy/aws/box/frankie_runner_ingest.sh'
    runs-on: ubuntu-24.04
    timeout-minutes: 1440
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_EC2_METADATA_DISABLED: 'true'
      INSTANCE: ${{ inputs.instance }}
      REGION: ${{ inputs.region }}
      SCRIPT: ${{ inputs.script }}
      VARIABLES: ${{ inputs.variables }}
      RUN_TIMEOUT: ${{ inputs.timeout }}
      COMMENT: ${{ inputs.comment }}
      PRESIGN: ${{ inputs.presign }}
      PRESIGN_HOURS: ${{ inputs.presign_hours }}
      MAP_BUCKET: frankie-granite42-568968024170-us-east-1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97
      - name: Validate the script path against the checkout
        run: |
          set -euo pipefail
          case "$SCRIPT" in deploy/aws/box/*.sh) ;; *) echo "script must be a committed deploy/aws/box/*.sh path"; exit 1;; esac
          [[ "$SCRIPT" =~ ^deploy/aws/box/[A-Za-z0-9_.-]+\.sh$ ]] || { echo "script name carries a character outside [A-Za-z0-9_.-]"; exit 1; }
          test -f "$SCRIPT" || { echo "script is not in this ref's checkout: $SCRIPT"; exit 1; }
          [[ "$RUN_TIMEOUT" =~ ^[0-9]+$ ]] || { echo "timeout must be an integer number of seconds"; exit 1; }
          bash -n "$SCRIPT"
          echo "script sha256: $(sha256sum "$SCRIPT" | cut -c1-64)  ref: $GITHUB_SHA"
      - name: Refuse the retired Pod routes (Greg, 2026-10-06, Pods are retired; AWS CPU lanes only; no provider is contacted)
        if: inputs.script == 'deploy/aws/box/frankie_box_jev_pod.sh' || inputs.script == 'deploy/aws/box/frankie_box_clm_sidecar_pod.sh'
        run: |
          echo "$SCRIPT is a retired Pod launch route: no Pod is created, reached or deleted; nothing ran."
          echo "Jev's CPU route is Codex's step 7 (STEP7_JEV_CPU_ROUTE_20261007.md); the Linux lane controller is script=deploy/aws/box/frankie_box_pod_root_loop.sh (runner) and deploy/aws/box/frankie_box_cpu_controller.sh (main box)."
          exit 1
      - name: Copy the repository secret FRANKIE_GITHUB_TOKEN into SSM /markets/frankie/github-token (only on request; value never printed)
        if: inputs.github_token_to_ssm == 'true'
        env:
          FRANKIE_GITHUB_TOKEN: ${{ secrets.FRANKIE_GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import boto3, os, re
          token = os.environ.get('FRANKIE_GITHUB_TOKEN', '').strip()
          if not re.fullmatch(r'(ghp|github_pat)_[A-Za-z0-9_]{20,255}', token):
              raise SystemExit('repository secret FRANKIE_GITHUB_TOKEN is absent or not a GitHub token shape (length %d); nothing written' % len(token))
          r = boto3.client('ssm', region_name='us-east-2').put_parameter(Name='/markets/frankie/github-token', Type='SecureString', Value=token, Overwrite=True,
                                                                          Description='GitHub PAT for the Frankie box heartbeat and response push (repo scope)')
          print('SSM /markets/frankie/github-token written (us-east-2): version %s, length %d' % (r.get('Version'), len(token)))
          PY
      - name: Report which repository secrets are set (names and set/unset only; values never read)
        env:
          HAS_RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY != '' }}
          HAS_FRANKIE_GITHUB_TOKEN: ${{ secrets.FRANKIE_GITHUB_TOKEN != '' }}
          HAS_DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY != '' }}
          HAS_AWS_PAIR: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          echo "repository secrets set: RUNPOD_API_KEY=$HAS_RUNPOD_API_KEY FRANKIE_GITHUB_TOKEN=$HAS_FRANKIE_GITHUB_TOKEN DATABENTO_API_KEY=$HAS_DATABENTO_API_KEY AWS_PAIR=$HAS_AWS_PAIR"
      - name: Require the box Online in SSM (read-only)
        if: inputs.script != 'deploy/aws/box/frankie_box_disk_rescue.sh' && inputs.script != 'deploy/aws/box/frankie_box_clm_sidecar_pod.sh' && inputs.script != 'deploy/aws/box/frankie_box_jev_pod.sh'
        run: |
          python - <<'PY'
          import boto3, os
          iid, region = os.environ['INSTANCE'], os.environ['REGION']
          s = boto3.client('ssm', region_name=region).describe_instance_information(Filters=[{'Key': 'InstanceIds', 'Values': [iid]}])['InstanceInformationList']
          print('SSM:', [(x['PingStatus'], x.get('PlatformName', ''), x.get('PlatformVersion', '')) for x in s] or 'not registered')
          raise SystemExit(0 if s and s[0]['PingStatus'] == 'Online' else 1)
          PY
      - name: Presign the requested objects into one private map (URLs masked, never printed)
        if: inputs.presign != ''
        run: |
          python - <<'PY'
          import json, os, re
          import boto3
          from botocore.config import Config
          items = []
          for item in os.environ['PRESIGN'].split():
              # putrange:<bucket>/<prefix>:<N> = N one-object upload slots <prefix>/0000.json.. (Jev's feed, Greg 2026-09-28)
              if item.startswith('putrange:'):
                  target, _, count = item[len('putrange:'):].rpartition(':')
                  if not re.fullmatch(r'[0-9]{1,4}', count) or not 0 < int(count) <= 2000:
                      raise SystemExit('putrange count must be 1..2000')
                  items += ['putslot:%s/%04d.json' % (target, i) for i in range(int(count))]
              # getprefix:<bucket>/<prefix> = a presigned GET for every object under clm-sidecar/<prefix> (read-only;
              # Jev's reports and checkpoints, whose numbering is not known in advance; Greg 2026-09-28)
              elif item.startswith('getprefix:'):
                  bucket, _, prefix = item[len('getprefix:'):].partition('/')
                  # also read-only: the 30 days' history and curve pulls the day file is built from (2026-09-29,
                  # frankie_box_day_external.sh)
                  # and frankie/day_external/<day>/: what S3 already holds of a day file (read-only; the orchestrator
                  # prefers a verified S3 day file, Run.external)
                  if not prefix.startswith(('clm-sidecar/', 'frankie/day_history/', 'nymex/ng_fut_parent_v0/', 'frankie/ingest/',
                                            'frankie/day_external/')) or '..' in prefix:
                      raise SystemExit('getprefix is for clm-sidecar/, frankie/day_history/, nymex/ng_fut_parent_v0/, frankie/ingest/ '
                                       'and frankie/day_external/ only')
                  region = 'us-east-1' if bucket.endswith('us-east-1') else 'us-east-2'
                  pages = boto3.client('s3', region_name=region).get_paginator('list_objects_v2').paginate(Bucket=bucket, Prefix=prefix)
                  items += ['%s/%s' % (bucket, o['Key']) for page in pages for o in page.get('Contents', [])]
              # putarchive:<bucket>/frankie/ingest/<day>/box-ingest-<day>-<name>/:<N> = a sealed box ingest moved to S3
              # (frankie_box_archive_day.sh, Greg 2026-09-29): N one-object slots <prefix>objects/0000.. (4 GiB pieces) and
              # the manifest slot <prefix>archive-manifest.json; its ACTION=plan prints the exact item
              elif item.startswith('putarchive:'):
                  target, _, count = item[len('putarchive:'):].rpartition(':')
                  m = re.fullmatch(r'([a-z0-9.-]{3,63})/(frankie/ingest/([0-9]{8})/box-ingest-\3-[A-Za-z0-9_-]+/)', target)
                  if not m or not re.fullmatch(r'[0-9]{1,4}', count) or not 0 < int(count) <= 9999:
                      raise SystemExit('putarchive is <bucket>/frankie/ingest/<YYYYMMDD>/box-ingest-<YYYYMMDD>-<name>/:<1..9999>')
                  items += ['putarchive:%s/%sobjects/%04d' % (m.group(1), m.group(2), i) for i in range(int(count))]
                  items.append('putarchive:%s/%sarchive-manifest.json' % (m.group(1), m.group(2)))
              else:
                  items.append(item)
          expires = int(float(os.environ['PRESIGN_HOURS']) * 3600)
          def client(bucket):
              region = 'us-east-1' if bucket.endswith('us-east-1') else 'us-east-2'
              return boto3.client('s3', region_name=region, endpoint_url=f'https://s3.{region}.amazonaws.com',
                                  config=Config(signature_version='s3v4', s3={'addressing_style': 'virtual'}))
          out = {}
          for item in items:
              bucket, key = item.split('/', 1)
              if not re.fullmatch(r'(put:|putslot:|putarchive:)?[a-z0-9.-]{3,63}', bucket) or not key or '..' in key:
                  raise SystemExit('presign item must be bucket/key')
              if item.startswith('putarchive:'):
                  # an archive slot: never over an existing object. A data piece already there is skipped (the box's upload
                  # proves it by GET against its plan, so a cut upload resumes); an existing manifest refuses (the archive
                  # is complete: ACTION=verify). The URL is signed with If-None-Match: * so S3 itself refuses an overwrite.
                  bucket = bucket[len('putarchive:'):]
                  s3 = client(bucket)
                  try:
                      s3.head_object(Bucket=bucket, Key=key)
                      if key.endswith('/archive-manifest.json'):
                          raise SystemExit('the archive manifest exists (never overwritten; the archive is complete, run ACTION=verify): ' + key)
                      print(f'archive slot {bucket}/{key}: the object exists; skipped, never overwritten')
                      continue
                  except s3.exceptions.ClientError as e:
                      if e.response.get('Error', {}).get('Code') not in ('404', 'NoSuchKey', 'NotFound'):
                          raise
                  url = s3.generate_presigned_url('put_object', Params={'Bucket': bucket, 'Key': key, 'IfNoneMatch': '*'}, ExpiresIn=expires)
                  print('::add-mask::' + url)
                  out['put:' + key] = dict(bucket=bucket, url=url, headers={'If-None-Match': '*'})
                  continue
              if item.startswith('putslot:'):
                  # a putrange slot: a slot already written is skipped, never overwritten, so a restarted relay
                  # continues from the first free slot in the order Jev reads them (Greg, 2026-09-28)
                  bucket = bucket[len('putslot:'):]
                  s3 = client(bucket)
                  if not key.startswith('clm-sidecar/'):
                      raise SystemExit('upload slots are for clm-sidecar/ only')
                  try:
                      s3.head_object(Bucket=bucket, Key=key)
                      print(f'upload slot {bucket}/{key} already written; skipped')
                      continue
                  except s3.exceptions.ClientError:
                      pass
                  url = s3.generate_presigned_url('put_object', Params={'Bucket': bucket, 'Key': key}, ExpiresIn=expires)
                  print('::add-mask::' + url)
                  out['put:' + key] = dict(bucket=bucket, url=url)
                  continue
              if item.startswith('put:'):
                  # a one-object upload slot (the box role writes nothing in S3): only under clm-sidecar/, never
                  # over an existing object
                  bucket = bucket[4:]
                  s3 = client(bucket)
                  # the day key of Frankie's 13 points (frankie/day_external/<day>/, 2026-09-29) takes one-object slots
                  # too; an object already there is skipped (never overwritten, the box lists it), not a failure
                  if not key.startswith(('clm-sidecar/', 'frankie/day_external/')):
                      raise SystemExit('upload slots are for clm-sidecar/ and frankie/day_external/ only')
                  if key.startswith('frankie/day_external/'):
                      # a day file and its receipt are one pair: when S3 holds EITHER object of the day, neither slot is
                      # presigned (a verified S3 day file is never overwritten, never half replaced); only a definite
                      # 404 counts as absent (a permission or transient error presigns nothing for the day)
                      day_dir = key.rsplit('/', 1)[0]
                      held = []
                      for name in ('day-external.json', 'day-external-receipt.json'):
                          try:
                              s3.head_object(Bucket=bucket, Key='%s/%s' % (day_dir, name))
                              held.append(name)
                          except s3.exceptions.ClientError as e:
                              if e.response.get('Error', {}).get('Code') not in ('404', 'NoSuchKey', 'NotFound'):
                                  print(f'upload slot {bucket}/{key}: S3 state unknown ({e.response.get("Error", {}).get("Code")}); not presigned')
                                  held.append('unknown')
                      if held:
                          print(f'upload slot {bucket}/{key}: S3 holds {held} for this day; skipped, never overwritten')
                          continue
                  else:
                      try:
                          s3.head_object(Bucket=bucket, Key=key)
                          raise SystemExit('upload slot refuses an existing object: ' + key)
                      except s3.exceptions.ClientError:
                          pass
                  url = s3.generate_presigned_url('put_object', Params={'Bucket': bucket, 'Key': key}, ExpiresIn=expires)
                  print('::add-mask::' + url)
                  out['put:' + key] = dict(bucket=bucket, url=url)
                  print(f'upload slot {bucket}/{key} expires_in={expires}s')
                  continue
              s3 = client(bucket)
              head = s3.head_object(Bucket=bucket, Key=key)
              url = s3.generate_presigned_url('get_object', Params={'Bucket': bucket, 'Key': key}, ExpiresIn=expires)
              print('::add-mask::' + url)
              out[key] = dict(bucket=bucket, bytes=head['ContentLength'], url=url)
              print(f'presigned {bucket}/{key} bytes={head["ContentLength"]} expires_in={expires}s')
          mb = os.environ['MAP_BUCKET']; mk = f"box-runs/{os.environ['GITHUB_RUN_ID']}/presigned-map.json"
          g = client(mb)
          g.put_object(Bucket=mb, Key=mk, Body=json.dumps(out, sort_keys=True).encode(), ServerSideEncryption='AES256', ContentType='application/json')
          murl = g.generate_presigned_url('get_object', Params={'Bucket': mb, 'Key': mk}, ExpiresIn=expires)
          if "'" in murl or '\n' in murl or ' ' in murl:
              raise SystemExit('map URL carries a character --set refuses')
          print('::add-mask::' + murl)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'MAP_URL={murl}\n')
          print(f'map: s3://{mb}/{mk} ({len(out)} objects)')
          PY
      - name: Expand the canonical root EBS volume only on explicit storage dispatch
        if: inputs.script == 'deploy/aws/box/frankie_box_grow_disk.sh'
        run: |
          python - <<'PY'
          import boto3, os, time
          if (os.environ['INSTANCE'] != 'i-035994afa8bdf66a5' or
              os.environ['REGION'] != 'us-east-1' or os.environ['VARIABLES'] != 'DISK_GIB=2048'):
              raise SystemExit('canonical box and DISK_GIB=2048 required')
          ec2 = boto3.client('ec2', region_name=os.environ['REGION'])
          instance = ec2.describe_instances(InstanceIds=[os.environ['INSTANCE']])['Reservations'][0]['Instances'][0]
          root = instance['RootDeviceName']
          volume_id = next(x['Ebs']['VolumeId'] for x in instance['BlockDeviceMappings'] if x['DeviceName'] == root)
          volume = ec2.describe_volumes(VolumeIds=[volume_id])['Volumes'][0]
          if len(volume['Attachments']) != 1 or volume['Attachments'][0]['InstanceId'] != os.environ['INSTANCE']:
              raise SystemExit('root volume attachment differs')
          print('Root volume:', volume_id, 'current GiB:', volume['Size'], 'requested GiB: 2048', flush=True)
          if volume['Size'] < 2048:
              result = ec2.modify_volume(VolumeId=volume_id, Size=2048)['VolumeModification']
              print('Modification:', result['ModificationState'], flush=True)
          for attempt in range(120):
              volume = ec2.describe_volumes(VolumeIds=[volume_id])['Volumes'][0]
              mods = ec2.describe_volumes_modifications(VolumeIds=[volume_id])['VolumesModifications']
              state = mods[0]['ModificationState'] if mods else 'completed'
              if state == 'failed':
                  raise SystemExit('EBS modification failed: ' + str(mods[0].get('StatusMessage')))
              if volume['Size'] >= 2048 and state in ('optimizing', 'completed'):
                  print('EBS capacity ready:', volume_id, volume['Size'], state, flush=True)
                  break
              time.sleep(5)
          else:
              raise SystemExit('EBS modification still pending; no filesystem change attempted')
          PY

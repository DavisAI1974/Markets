name: NG S90 Raw Day Probe

on:
  push:
    branches:
      - chatgpt/s40-independent-recalc-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - name: Probe authoritative NG day
        run: |
          aws s3api head-object \
            --bucket bento-568968024170-us-east-2-an \
            --key nymex/nymex_cont/NG_20250717.jsonl.gz \
            --query '{ContentLength:ContentLength,ETag:ETag,LastModified:LastModified}'
          aws s3 cp s3://bento-568968024170-us-east-2-an/nymex/nymex_cont/NG_20250717.jsonl.gz /tmp/ng.jsonl.gz --only-show-errors
          python - <<'PY'
          import gzip, json
          with gzip.open('/tmp/ng.jsonl.gz','rt') as f:
              for i, line in zip(range(5), f):
                  row=json.loads(line)
                  print('ROW', i, json.dumps(row, sort_keys=True))
          PY

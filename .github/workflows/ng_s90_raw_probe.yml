name: NG S90 Raw Day Probe

on:
  push:
    branches:
      - chatgpt/s40-independent-recalc-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - name: Check credential presence without disclosure
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && echo "AWS_ACCESS_KEY_ID_PRESENT=yes" || echo "AWS_ACCESS_KEY_ID_PRESENT=no"
          test -n "$AWS_SECRET_ACCESS_KEY" && echo "AWS_SECRET_ACCESS_KEY_PRESENT=yes" || echo "AWS_SECRET_ACCESS_KEY_PRESENT=no"
      - name: Probe authoritative NG day
        run: |
          aws s3api head-object \
            --bucket bento-568968024170-us-east-2-an \
            --key nymex/nymex_cont/NG_20250717.jsonl.gz \
            --query '{ContentLength:ContentLength,ETag:ETag,LastModified:LastModified}'

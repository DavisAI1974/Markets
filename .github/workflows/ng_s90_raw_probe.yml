name: NG S90 Exhaustion Recalc

on:
  push:
    branches:
      - chatgpt/s40-independent-recalc-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recalc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - name: Checkout scratch analysis branch
        uses: actions/checkout@v4
      - name: Download authoritative NG day
        run: aws s3 cp s3://bento-568968024170-us-east-2-an/nymex/nymex_cont/NG_20250717.jsonl.gz /tmp/ng.jsonl.gz --only-show-errors
      - name: Recalculate S90 exhaustion canary
        run: python research/ng_s90_exhaustion_recalc.py /tmp/ng.jsonl.gz
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ng-s90-exhaustion-recalc
          path: ng_s90_exhaustion_recalc_results.json

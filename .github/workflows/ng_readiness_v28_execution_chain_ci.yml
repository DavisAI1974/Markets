name: NG readiness v28 exact materialization execution chain

on:
  push:
    paths:
      - "research/kalshi/ng_corpus_executor_plan_compiler_v23.py"
      - "research/kalshi/ng_corpus_executor_pipeline_arm_v23.py"
      - "research/kalshi/ng_historical_refinement_preflight_v24.py"
      - "research/kalshi/_v28_execution_patch.txz"
      - "research/kalshi/ng_historical_refinement_executor_v24.py"
      - "research/kalshi/ng_historical_refinement_readiness_v28.py"
      - "research/kalshi/ng_corpus_s3_exact_materializer.py"
      - "research/kalshi/tests/test_ng_readiness_v28_execution_chain.py"
      - ".github/workflows/ng_readiness_v28_execution_chain_ci.yml"
  pull_request:
    paths:
      - "research/kalshi/ng_corpus_executor_plan_compiler_v23.py"
      - "research/kalshi/ng_corpus_executor_pipeline_arm_v23.py"
      - "research/kalshi/ng_historical_refinement_preflight_v24.py"
      - "research/kalshi/_v28_execution_patch.txz"
      - "research/kalshi/ng_historical_refinement_executor_v24.py"
      - "research/kalshi/ng_historical_refinement_readiness_v28.py"
      - "research/kalshi/ng_corpus_s3_exact_materializer.py"
      - "research/kalshi/tests/test_ng_readiness_v28_execution_chain.py"
      - ".github/workflows/ng_readiness_v28_execution_chain_ci.yml"

jobs:
  readiness-v28-execution-chain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile exact materialization execution chain
        run: |
          python -m py_compile \
            ng_corpus_s3_exact_materializer.py \
            ng_historical_refinement_readiness_v28.py \
            ng_historical_refinement_executor_v24.py \
            ng_corpus_executor_plan_compiler_v23.py \
            ng_corpus_executor_pipeline_arm_v23.py \
            ng_historical_refinement_preflight_v24.py \
            tests/test_ng_readiness_v28_execution_chain.py
      - name: Run upstream self-tests
        run: |
          python ng_corpus_s3_exact_materializer.py selftest
          python ng_historical_refinement_readiness_v28.py --selftest
      - name: Run focused execution-chain tests
        run: python -m pytest -q tests/test_ng_readiness_v28_execution_chain.py
      - name: Verify exact materialization boundary and authority wall
        run: |
          python - <<'PY'
          import ng_corpus_executor_pipeline_arm_v23 as arm
          import ng_corpus_executor_plan_compiler_v23 as compiler
          import ng_historical_refinement_executor_v24 as executor
          import ng_historical_refinement_preflight_v24 as preflight
          import ng_historical_refinement_readiness_v28 as readiness

          keys = [spec.key for spec in readiness.STAGES]
          assert keys[:6] == [
              "corpus_expected_day_contract",
              "corpus_inventory_finalization_contract",
              "corpus_s3_latest_version_resolution",
              "corpus_s3_inventory_capture",
              "corpus_s3_materialization",
              "corpus_coverage",
          ]
          assert readiness.STAGES[4].filename == "ng_corpus_s3_exact_materializer_receipt.json"
          assert executor.SUGGESTED_ENTRYPOINTS["corpus_s3_materialization"] == (
              "python",
              "ng_corpus_s3_exact_materializer.py",
              "materialize",
          )
          assert arm.ARMED_STAGES == compiler.CONFIGURED_STAGES
          assert preflight.READINESS_CONTRACT == readiness.SCHEMA

          authority = {
              "actual_outcomes_used": False,
              "paid_live_data_assumed": False,
              "random_shuffle_used": False,
              "one_signal_authority_preserved": True,
              "blind_forecasts_immutable": True,
              "may_change_blind_forecast": False,
              "may_change_posterior": False,
              "may_update_ng_brain": False,
              "execution_authority": False,
              "cme_event_contracts_mode": "SHADOW",
              "brokerage_contract": "tastytrade_not_ibkr",
              "options_lane_started": False,
          }
          compiler._authority(authority, label="CI authority wall")
          assert not any("option" in key.lower() for key in compiler.CONFIGURED_STAGES)
          PY

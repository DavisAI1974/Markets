name: NYMEX MBP-10 Ingest (durable, S3)

# Durable RAW-INGESTION workflow for the continuous MBP-10 tape (CL + NG) -> AWS S3.
# S92: rerouted git -> S3 ("git = CODE, S3 = ALL DATA", Greg S91) and switched to the --weekly driver whose
# marker-resume + trading-calendar stub check were fixed in S92 (weekend Saturdays no longer block a week).
#
#   * pulls WEEK-AT-A-TIME from Databento as batch jobs (research/kalshi/pull_year_mbp10.py --weekly),
#   * keeps ALL RAW DATA (every message + every column; zero filtering; databento_backfill._write_mbp10_df),
#   * names each day {ROOT}_{YYYYMMDD}_{dow}.jsonl.gz (date + day-of-week) and uploads to
#     s3://$BUCKET/nymex/nymex_cont/, writing a _done/ marker per CLEAN week,
#   * is RESUMABLE across 6h runs: a week whose marker exists is skipped (marker-resume), so re-runs are
#     cheap no-ops once a range is complete, and it rolls forward as new weeks close.
#
# REQUIRES repo secrets (Settings > Secrets and variables > Actions): DATABENTO_API_KEY, AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY. Claude's token cannot create secrets or dispatch runs -- Greg adds them + clicks
# "Run workflow" the first time; the cron self-fires after.
#
# SEQUENCING NOTE (S92): while the manual EC2 box is still running the initial backfill, keep this workflow
# DISABLED (or it will submit Databento jobs for the same weeks = double pay). Enable it AFTER the box
# finishes + `pull_year_mbp10.py --reconcile-names` has written the week markers; then it becomes the durable
# forward collector (marker-resume skips the done year, pulls only newly-closed weeks).

on:
  schedule:
    - cron: '0 */6 * * *'   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:
    inputs:
      start:
        description: 'first month, YYYY-MM inclusive'
        default: '2025-07'
        type: string
      end:
        description: 'last month, YYYY-MM EXCLUSIVE (blank = current month + 1, i.e. roll forward)'
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: nymex-mbp10-ingest
  cancel-in-progress: false

env:
  S3_DEST: s3://bento-568968024170-us-east-2-an/nymex
  AWS_DEFAULT_REGION: us-east-2

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # 5h55m, just under GitHub's 6hr hard limit
    steps:
      - name: Checkout code branch
        uses: actions/checkout@v4
        with:
          ref: claude/kalshi-s79-kickoff-ij8t9o

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet databento pandas boto3

      - name: Connectivity check
        run: |
          curl -sS --max-time 8 -o /dev/null -w "Databento hist: %{http_code}\n" \
            "https://hist.databento.com/v0/metadata.list_datasets" || true

      - name: Pull MBP-10 weeks to S3 (marker-resume)
        timeout-minutes: 345
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          for v in DATABENTO_API_KEY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v secret is not set -- add it in Settings > Secrets > Actions"; missing=1; fi
          done
          [ "$missing" = 1 ] && exit 1
          START="${{ github.event.inputs.start || '2025-07' }}"
          END="${{ github.event.inputs.end }}"
          if [ -z "$END" ]; then END="$(date -u -d "$(date -u +%Y-%m-01) +1 month" +%Y-%m)"; fi
          echo "[run] pull_year_mbp10 --weekly $START..$END -> $S3_DEST on $(date -u)"
          python research/kalshi/pull_year_mbp10.py --start "$START" --end "$END" \
            --dest "$S3_DEST" --weekly --scratch /tmp/nymex_scratch

      - name: Corpus stats
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import boto3
          b="bento-568968024170-us-east-2-an"; s3=boto3.client("s3","us-east-2")
          def n(pfx):
              c=0; tok=None
              while True:
                  kw=dict(Bucket=b,Prefix=pfx,MaxKeys=1000)
                  if tok: kw["ContinuationToken"]=tok
                  r=s3.list_objects_v2(**kw); c+=r.get("KeyCount",0)
                  if r.get("IsTruncated"): tok=r["NextContinuationToken"]
                  else: return c
          print("nymex_cont/ day files:", n("nymex/nymex_cont/CL_")+n("nymex/nymex_cont/NG_"))
          print("nymex_cont/_done/ week markers:", n("nymex/nymex_cont/_done/"))
          PY

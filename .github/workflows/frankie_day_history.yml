name: Frankie day history (the 13 points for the experiment days; free public sources only)
# research/kalshi/frankie_boss/HISTORICAL_DATA_PLAN_20260929.md. Dispatch only, each on Greg's go.
# action=canary: one small request per source (~1-2 min), prints what came back; writes nothing.
# action=fetch: runs operations/fetch_day_history.py fetch for the named families (and, with `days`, only those selected
#   days: DAY_HISTORY_DAYS) at native resolution and uploads
#   the result (raw files + receipt.json per family) to s3://<bucket>/frankie/day_history/<run_id>/ plus an artifact.
#   New objects under a new prefix only: no existing store (cot/, weather/, consensus/, grid_stack/) is touched.
# Nothing here touches Databento. The EIA key is the repository secret EIA_API_KEY (DEMO_KEY when it is absent).
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'canary | fetch'
        required: true
        default: 'canary'
      families:
        description: 'fetch: all, or a comma list of calendar,cot,storage,consensus,weather_obs,mos,eia930'
        required: false
        default: 'all'
      days:
        description: 'optional comma list YYYYMMDD of selected days (DAY_HISTORY_DAYS); empty = all selected days'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: frankie-day-history
  cancel-in-progress: false
jobs:
  run:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONPATH: research/kalshi
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir requests boto3==1.42.23
      - name: Canary
        if: inputs.action == 'canary'
        run: python research/kalshi/frankie_boss/operations/fetch_day_history.py canary | tee day-history-canary.txt
      - name: Fetch
        if: inputs.action == 'fetch'
        env:
          FAMILIES: ${{ inputs.families }}
          DAY_HISTORY_DAYS: ${{ inputs.days }}
          DAY_HISTORY_DEADLINE_S: '16200'
        run: |
          set -euo pipefail
          case "$FAMILIES" in *[!a-z0-9_,]*) echo "families must be a comma list of names"; exit 2;; esac
          case "$DAY_HISTORY_DAYS" in *[!0-9,]*) echo "days must be YYYYMMDD values separated by commas"; exit 2;; esac
          python research/kalshi/frankie_boss/operations/fetch_day_history.py fetch --family "$FAMILIES" --out day-history
      - name: Upload to S3 (new prefix, new objects only)
        if: inputs.action == 'fetch'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-east-2
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          import boto3
          bucket = 'bento-568968024170-us-east-2-an'
          prefix = f"frankie/day_history/{os.environ['GITHUB_RUN_ID']}/"
          s3 = boto3.client('s3', region_name='us-east-2')
          files = sorted(p for p in pathlib.Path('day-history').rglob('*') if p.is_file())
          manifest = []
          for p in files:
              key = prefix + str(p.relative_to('day-history'))
              body = p.read_bytes()
              s3.put_object(Bucket=bucket, Key=key, Body=body, ServerSideEncryption='AES256')
              manifest.append(dict(key=key, bytes=len(body), sha256=hashlib.sha256(body).hexdigest()))
          s3.put_object(Bucket=bucket, Key=prefix + 'manifest.json', Body=json.dumps(manifest, indent=1).encode(),
                        ServerSideEncryption='AES256')
          print(f'uploaded {len(manifest)} objects under s3://{bucket}/{prefix}')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frankie-day-history-${{ github.run_id }}
          path: |
            day-history-canary.txt
            day-history/**/receipt.json
          if-no-files-found: ignore
          retention-days: 30

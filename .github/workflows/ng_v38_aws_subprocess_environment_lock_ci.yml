name: NG v38 AWS subprocess environment lock

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - research/kalshi/ng_v38_aws_subprocess_environment_lock.py
      - research/kalshi/ng_historical_refinement_executor_v35.py
      - research/kalshi/ng_historical_refinement_preflight_v37.py
      - research/kalshi/ng_historical_refinement_preflight_v38.py
      - research/kalshi/tests/test_ng_v38_aws_subprocess_environment_lock.py
      - .github/workflows/ng_v38_aws_subprocess_environment_lock_ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aws-subprocess-environment-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest

      - name: Compile locked execution boundary
        working-directory: research/kalshi
        run: |
          python -m py_compile \
            ng_v38_aws_subprocess_environment_lock.py \
            ng_historical_refinement_executor_v35.py \
            ng_historical_refinement_preflight_v37.py \
            ng_historical_refinement_preflight_v38.py \
            tests/test_ng_v38_aws_subprocess_environment_lock.py

      - name: Run focused environment-lock tests
        working-directory: research/kalshi
        run: pytest -q tests/test_ng_v38_aws_subprocess_environment_lock.py

      - name: Verify launch binding and permanent authority wall
        working-directory: research/kalshi
        run: |
          python - <<'PY'
          import inspect
          import ng_historical_refinement_executor_v35 as executor
          import ng_historical_refinement_preflight_v38 as preflight
          import ng_v38_aws_subprocess_environment_lock as gate

          gate_text = inspect.getsource(gate)
          executor_text = inspect.getsource(executor)
          preflight_text = inspect.getsource(preflight)

          for key in (
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "AWS_SESSION_TOKEN",
              "AWS_SHARED_CREDENTIALS_FILE",
              "AWS_WEB_IDENTITY_TOKEN_FILE",
          ):
              assert key in gate_text
          for key in ("AWS_ENDPOINT_URL", "AWS_ENDPOINT_URL_S3", "S3_ENDPOINT_URL"):
              assert key in gate_text
          assert "legacy_executor._command_environment = locked_builder" in executor_text
          assert "runtime_aws_subprocess_environment_rebuilt_at_executor_delegation" in preflight_text
          assert '"secret_values_recorded": False' in gate_text
          assert '"random_shuffle_used": False' in gate_text
          assert '"may_update_ng_brain": False' in gate_text
          assert '"execution_authority": False' in gate_text
          assert '"cme_event_contracts_mode": "SHADOW"' in gate_text
          assert '"brokerage_contract": "tastytrade_not_ibkr"' in gate_text
          assert '"options_lane_started": False' in gate_text
          PY

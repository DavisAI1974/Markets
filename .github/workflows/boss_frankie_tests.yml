name: BOSS / Frankie test gate

# One quality gate for the frankie_boss package: the whole tests directory, on Linux, under the
# numeric-identity pins the Sunday host binds (Python 3.13, torch 2.9.1+cpu, numpy 2.3.5,
# databento-dbn 0.62.0, zstandard 0.25.0). Runs on every push that touches the package on the
# branches we work on, and on demand. Nothing here runs Frankie, Granite or a result-bearing cycle.

on:
  push:
    branches:
      - 'ccode/**'
      - 'chatgpt/**'
      - 'claude/**'
      - 'codex/**'
    paths:
      - 'research/kalshi/frankie_boss/**'
      - 'research/ng_exhaustion_mbo_v4_state_adapter_20260820.py'
      - 'research/refrag/**'
      - '.github/workflows/boss_frankie_tests.yml'
  pull_request:
    paths:
      - 'research/kalshi/frankie_boss/**'
  workflow_dispatch:

concurrency:
  group: boss-frankie-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install the pinned numeric runtime and test dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
            'torch==2.9.1+cpu' 'numpy==2.3.5'
          python -m pip install --quiet 'databento==0.81.0' 'databento-dbn==0.62.0' 'zstandard==0.25.0' \
            'cryptography==46.0.3' 'boto3==1.42.23' 'pytest==8.3.5'
          python -c "import sys,torch,numpy;print(sys.version.split()[0],torch.__version__,numpy.__version__)"
      - name: Run the frankie_boss suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/research/kalshi/frankie_boss:${{ github.workspace }}/research/kalshi/frankie_boss/tests
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q -p no:cacheprovider --tb=short research/kalshi/frankie_boss/tests

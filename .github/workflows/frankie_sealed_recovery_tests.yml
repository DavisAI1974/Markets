name: Sealed compact recovery differential tests
on:
  push:
    branches: ['codex/trading-day-readiness-20260922']
    paths:
      - 'research/kalshi/frankie_boss/sealed_compact_recovery.py'
      - 'research/kalshi/frankie_boss/tests/test_sealed_compact_recovery.py'
      - 'research/kalshi/frankie_boss/tests/test_sealed_recovery_publication.py'
      - 'research/kalshi/frankie_boss/sealed_recovery_run.py'
      - 'deploy/aws/sealed_recovery_20260922.py'
      - 'deploy/aws/box/frankie_box_recovery_bootstrap.py'
      - '.github/workflows/frankie_sealed_recovery_tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RECOVERY_ORIGINAL_ROOT: ${{ github.workspace }}/original
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: current
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2ae4da204b0d2a12f605e765f281b505ff51491a
          path: original
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-cache-dir pytest==9.1.1 numpy==2.3.5
      - run: python -m compileall -q research/kalshi/frankie_boss/sealed_recovery_run.py deploy/aws/sealed_recovery_20260922.py deploy/aws/box/frankie_box_recovery_bootstrap.py
        working-directory: current
      - run: python -m pytest -q research/kalshi/frankie_boss/tests/test_sealed_compact_recovery.py research/kalshi/frankie_boss/tests/test_sealed_recovery_publication.py
        working-directory: current

name: Frankie full digest streaming checks
on:
  push:
    branches: ['codex/trading-day-readiness-20260922']
    paths:
      - 'deploy/aws/box/frankie_box_digest_*.py'
      - 'deploy/aws/box/frankie_box_boss_session.py'
      - 'tests/test_digest_sources.py'
      - 'tests/test_digest_document.py'
      - 'tests/test_digest_document_memory.py'
      - '.github/workflows/frankie_digest_document_ci.yml'
permissions:
  contents: read
jobs:
  document:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DIGEST_REFERENCE_PATH: ${{ github.workspace }}/deploy/aws/box/frankie_box_digest_render.py   # the in-tree whole-table renderer: the streamed document must equal it byte for byte
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir pytest==9.1.1
      - name: Pinned producers worktree (the session loads them before any digest code)
        run: bash deploy/aws/box/producers_checkout.sh
      - name: Verify streamed sources and full documents
        working-directory: tests
        run: python -m pytest test_digest_sources.py test_digest_document.py test_digest_document_memory.py test_digest_parallel.py -q --rootdir=. --confcutdir=. --noconftest -p no:cacheprovider

name: Frankie full digest streaming checks
on:
  push:
    branches: ['codex/trading-day-readiness-20260922']
    paths:
      - 'deploy/aws/box/frankie_box_digest_*.py'
      - 'deploy/aws/box/frankie_box_boss_session.py'
      - 'tests/test_digest_sources.py'
      - 'tests/test_digest_document.py'
      - 'tests/test_digest_document_memory.py'
      - '.github/workflows/frankie_digest_document_ci.yml'
permissions:
  contents: read
jobs:
  document:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DIGEST_REFERENCE_PATH: /tmp/digest-reference-${{ github.run_id }}.py
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir pytest==9.1.1
      - name: Extract immutable compatibility oracle
        run: |
          git fetch --no-tags --depth=1 origin e297553a7c96dd615879e5aa8e5c5a0118aeaff2
          git show e297553a7c96dd615879e5aa8e5c5a0118aeaff2:deploy/aws/box/frankie_box_digest_render.py > "$DIGEST_REFERENCE_PATH"
      - name: Verify streamed sources and full documents
        working-directory: tests
        run: python -m pytest test_digest_sources.py test_digest_document.py test_digest_document_memory.py -q --rootdir=. --confcutdir=. --noconftest -p no:cacheprovider

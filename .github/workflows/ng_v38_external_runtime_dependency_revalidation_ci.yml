name: NG v38 external runtime dependency revalidation

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - research/kalshi/ng_v38_transitive_dependency_runtime_revalidation_gate.py
      - research/kalshi/ng_v38_external_runtime_dependency_revalidation_gate.py
      - research/kalshi/ng_historical_refinement_preflight_v34.py
      - research/kalshi/ng_historical_refinement_preflight_v35.py
      - research/kalshi/tests/test_ng_v38_external_runtime_dependency_revalidation.py
      - .github/workflows/ng_v38_external_runtime_dependency_revalidation_ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-runtime-dependency-revalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest

      - name: Compile external runtime boundary
        working-directory: research/kalshi
        run: |
          python -m py_compile \
            ng_v38_transitive_dependency_runtime_revalidation_gate.py \
            ng_v38_external_runtime_dependency_revalidation_gate.py \
            ng_historical_refinement_preflight_v34.py \
            ng_historical_refinement_preflight_v35.py \
            tests/test_ng_v38_external_runtime_dependency_revalidation.py

      - name: Run focused external runtime tests
        working-directory: research/kalshi
        run: pytest -q tests/test_ng_v38_external_runtime_dependency_revalidation.py

      - name: Verify runtime provenance and permanent authority wall
        working-directory: research/kalshi
        run: |
          python - <<'PY'
          import inspect
          import ng_historical_refinement_preflight_v35 as preflight
          import ng_v38_external_runtime_dependency_revalidation_gate as gate

          gate_text = inspect.getsource(gate)
          preflight_text = inspect.getsource(preflight)
          assert "all_distribution_files_rehashed" in gate_text
          assert "python_executable_rehashed" in gate_text
          assert "aws_cli_rehashed_and_version_probed" in gate_text
          assert "runtime_external_revalidation_at_executor_delegation" in preflight_text
          assert "guarded_runner" in preflight_text
          text = gate_text + preflight_text
          assert '"cme_event_contracts_mode": "SHADOW"' in text
          assert '"brokerage_contract": "tastytrade_not_ibkr"' in text
          assert '"options_lane_started": False' in text
          assert '"may_update_ng_brain": False' in text
          assert '"random_shuffle_used": False' in text
          PY

name: S131 Frankie G3 Corrected Mechanical Reblind Inputs

on:
  push:
    branches:
      - chatgpt/burn-hh-12m-s125
    paths:
      - .github/workflows/frankie_g3_reblind_s131.yml
      - research/kalshi/frankie_g3_reblind_s131.py
      - research/kalshi/frankie_g3_reblind_s131_runner.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrected-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install current decision-state and S3 staging dependencies
        run: python -m pip install --quiet numpy requests boto3 pandas databento

      - name: Restore canonical existing S3 substrate
        env:
          PYTHONPATH: research/kalshi
          MARKETS_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          MARKETS_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          # Pull existing stores only. No group staging here because canonical group_config does not
          # contain legacy G3, and stage_group's latter half builds actual/outcome artifacts.
          python research/kalshi/restore_substrate.py

      - name: Rebuild public positioning caches
        env:
          PYTHONPATH: research/kalshi
        run: |
          python research/kalshi/cot_feed.py --build
          python research/kalshi/cot_combined_feed.py --build

      - name: Export corrected G3 reblind inputs only
        env:
          PYTHONPATH: research/kalshi
          MARKETS_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          MARKETS_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          rm -rf /tmp/g3_s131
          python research/kalshi/frankie_g3_reblind_s131_runner.py \
            --out /tmp/g3_s131 \
            --namespace frankie_g3_s131_corrected_reblind
          python - <<'PY'
          import json
          p='/tmp/g3_s131/manifest.json'
          d=json.load(open(p))
          assert d['group']=='g3'
          assert d['mask_after']=='20250905'
          assert d['scored_leg']=='NGV25'
          assert d['hydration']=='REJECTED_NOT_USED'
          assert d['actuals_read'] is False
          assert d['model_api_invoked'] is False
          assert d['score_or_reveal_phase_present'] is False
          assert d['packet_count']==12
          print('S131 blind-wall manifest verified:', p)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankie-g3-s131-corrected-reblind-inputs
          path: /tmp/g3_s131
          retention-days: 14
          if-no-files-found: warn

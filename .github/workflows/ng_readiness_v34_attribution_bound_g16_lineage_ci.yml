name: NG readiness v34 attribution-bound G16 lineage

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - research/kalshi/ng_g15_g16_attribution_bound_lineage_gate.py
      - research/kalshi/ng_historical_refinement_readiness_v34.py
      - research/kalshi/ng_historical_refinement_executor_v30.py
      - research/kalshi/tests/test_ng_g15_g16_attribution_bound_lineage_gate.py
      - research/kalshi/tests/test_ng_readiness_v34_attribution_bound_g16_lineage.py
      - .github/workflows/ng_readiness_v34_attribution_bound_g16_lineage_ci.yml
  workflow_dispatch:

jobs:
  attribution-bound-g16-lineage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Compile v34 attribution-bound G16 lineage chain
        run: |
          python -m py_compile \
            ng_g15_g16_attribution_bound_lineage_gate.py \
            ng_historical_refinement_readiness_v34.py \
            ng_historical_refinement_executor_v30.py \
            tests/test_ng_g15_g16_attribution_bound_lineage_gate.py \
            tests/test_ng_readiness_v34_attribution_bound_g16_lineage.py
      - name: Run deterministic self-tests
        run: |
          python ng_g15_attribution_bound_publication_gate.py --selftest
          python ng_g15_counterfactual_lesson_gate.py --selftest
          python ng_g15_g16_counterfactual_lineage_gate.py --selftest
          python ng_g15_g16_attribution_bound_lineage_gate.py --selftest
          python ng_historical_refinement_readiness_v34.py --selftest
      - name: Run focused lineage and readiness tests
        run: |
          pytest -q \
            tests/test_ng_g15_attribution_bound_publication_gate.py \
            tests/test_ng_g15_g16_counterfactual_lineage_gate.py \
            tests/test_ng_g15_g16_attribution_bound_lineage_gate.py \
            tests/test_ng_readiness_v34_attribution_bound_g16_lineage.py
      - name: Verify G15 fixed-outcome lineage and G16 blind wall
        run: |
          python - <<'PY'
          import ng_g15_g16_attribution_bound_lineage_gate as gate
          import ng_historical_refinement_executor_v30 as executor
          import ng_historical_refinement_readiness_v34 as readiness

          order = [spec.key for spec in readiness.STAGES]
          lineage = order.index("g15_g16_counterfactual_lineage")
          assert order[lineage:lineage + 3] == [
              "g15_g16_counterfactual_lineage",
              "g15_g16_attribution_bound_lineage",
              "g16_corpus_basis",
          ]
          by_key = {spec.key: spec for spec in readiness.STAGES}
          assert by_key["g15_g16_counterfactual_lineage"].pre_outcome is False
          assert by_key["g15_g16_attribution_bound_lineage"].pre_outcome is False
          assert by_key["g16_corpus_basis"].pre_outcome is True
          assert executor.SUGGESTED_ENTRYPOINTS[
              "g15_g16_attribution_bound_lineage"
          ] == ("python", "ng_g15_g16_attribution_bound_lineage_gate.py")

          result = gate.build_gate(**gate._synthetic_fixture())
          assert result["all_six_factors_authorized_before_scoring"] is True
          assert result["separate_blind_refined_scores_verified"] is True
          assert result["blind_score_fingerprint"] != result["refined_score_fingerprint"]
          assert result["scored_lessons_bound_to_attribution_publication"] is True
          assert result["g16_plan_bound_to_validated_g15_lessons"] is True
          assert result["actual_g15_outcomes_used"] is True
          assert result["actual_g16_outcomes_used"] is False
          assert result["g16_scoring_authorized"] is False
          assert result["random_shuffle_used"] is False
          assert result["one_signal_authority_preserved"] is True
          assert result["blind_forecasts_immutable"] is True
          assert result["may_update_ng_brain"] is False
          assert result["execution_authority"] is False
          assert result["g16_outcome_access_authorized"] is False
          assert result["cme_event_contracts_mode"] == "SHADOW"
          assert result["brokerage_contract"] == "tastytrade_not_ibkr"
          assert result["options_lane_started"] is False
          PY

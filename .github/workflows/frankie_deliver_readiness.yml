name: Deliver exact retained readiness
on:
  workflow_dispatch:
    inputs:
      ready_run_id:
        required: true
        type: string
      ready_source_commit:
        required: true
        type: string
      context_json:
        required: true
        type: string
      instance:
        required: true
        type: string
  workflow_call:
    inputs:
      ready_run_id:
        required: true
        type: string
      ready_source_commit:
        required: true
        type: string
      context_json:
        required: true
        type: string
      instance:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  deliver:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Authenticate readiness producer and exact artifact before host credentials
        env:
          GH_TOKEN: ${{ github.token }}
          READY_RUN_ID: ${{ inputs.ready_run_id }}
          READY_SOURCE_COMMIT: ${{ inputs.ready_source_commit }}
          CONTEXT_JSON: ${{ inputs.context_json }}
          INSTANCE: ${{ inputs.instance }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re, shutil, subprocess, zipfile
          from pathlib import Path
          import importlib.util
          spec=importlib.util.spec_from_file_location('workflow_delivery','research/kalshi/frankie_boss/operations/workflow_delivery.py')
          delivery=importlib.util.module_from_spec(spec);spec.loader.exec_module(delivery)
          DELIVERED,validate_context=delivery.DELIVERED,delivery.validate_context
          validate_context(json.loads(os.environ['CONTEXT_JSON']))
          run_id = os.environ['READY_RUN_ID']; commit = os.environ['READY_SOURCE_COMMIT']
          if not re.fullmatch(r'[1-9][0-9]*',run_id) or not re.fullmatch('[0-9a-f]{40}',commit):
              raise SystemExit('explicit producer identity required')
          if os.environ['INSTANCE'] != 'i-0e90ee6110ef609aa':
              raise SystemExit('supported explicit native host required')
          prefix = 'repos/DavisAI1974/Markets/actions/'
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',prefix+path]))
          run = api('runs/'+run_id)
          workflow = api('workflows/frankie_retained_granite.yml')
          if (run['workflow_id'] != workflow['id'] or run['head_sha'] != commit
              or run['head_repository']['full_name'] != 'DavisAI1974/Markets'
              or run['event'] != 'workflow_dispatch'
              or run['status'] not in ('in_progress','completed')
              or (run['status']=='completed' and run['conclusion']!='success')):
              raise SystemExit('readiness producer identity or conclusion differs')
          jobs = api('runs/'+run_id+'/jobs?per_page=100')['jobs']
          producer = [j for j in jobs if j['name']=='retained-prepare']
          if (len(producer)!=1 or not any(s['name']=='Publish fresh readiness for the local controller'
              and s['conclusion']=='success' for s in producer[0]['steps'])):
              raise SystemExit('readiness artifact upload has no successful producer step')
          artifacts = api('runs/'+run_id+'/artifacts?per_page=100')['artifacts']
          found = [a for a in artifacts if a['name']=='retained-granite-ready-'+run_id and not a['expired']]
          if len(found)!=1 or not re.fullmatch(r'sha256:[0-9a-f]{64}', found[0].get('digest','')):
              raise SystemExit('unique digest-bound readiness artifact required')
          artifact = found[0]
          with Path('readiness.zip').open('xb') as stream:
              subprocess.run(['gh','api',prefix+'artifacts/'+str(artifact['id'])+'/zip'],stdout=stream,check=True)
          with Path('readiness.zip').open('rb') as stream:
              if hashlib.file_digest(stream,'sha256').hexdigest()!=artifact['digest'].split(':')[1]:
                  raise SystemExit('readiness archive digest differs')
          Path('readiness').mkdir()
          with zipfile.ZipFile('readiness.zip') as archive:
              for name in DELIVERED:
                  members=[i for i in archive.infolist() if i.filename==name]
                  if len(members)!=1 or members[0].is_dir():
                      raise SystemExit('exact readiness archive members required')
                  with archive.open(members[0]) as source, Path('readiness',name).open('xb') as target:
                      shutil.copyfileobj(source,target)
          Path('readiness-provenance.json').write_text(json.dumps(dict(
              run_id=run_id,head_sha=commit,workflow_id=run['workflow_id'],artifact=artifact,
              producer_job_id=producer[0]['id']),sort_keys=True))
          PY
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97
      - name: Build receipt-bound delivery script
        env:
          CONTEXT_JSON: ${{ inputs.context_json }}
        run: python deploy/aws/host/build_readiness_delivery.py --readiness readiness --context-json "$CONTEXT_JSON" --out delivery.ps1
      - name: Deliver only to the exact waiting native run
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-east-2
          AWS_EC2_METADATA_DISABLED: 'true'
          INSTANCE: ${{ inputs.instance }}
        run: |
          set -euo pipefail
          python deploy/aws/ssm_run_ps1.py --instance "$INSTANCE" --region us-east-2 --script delivery.ps1 --timeout 300 --tail 0 --comment "receipt-bound readiness delivery" | tee delivery.log
      - name: Retain authenticated delivery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflow-readiness-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            readiness-provenance.json
            delivery.log
          retention-days: 30
          if-no-files-found: warn

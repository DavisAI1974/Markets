name: Frankie advance native host tools to the frozen runtime
# First of Greg's two authorized actions (2026-09-20): the host's tools checkout is at c9a86e74, which
# predates the request-id fix c0749bc0 that the declared frozen native runtime 96e26f7d carries, so
# the cycles stage refuses its own cycle request id before looking for the trigger. This moves the
# checkout to 96e26f7d, refuses on a dirty tree, records the new boss_commit in the sealed host
# configuration with a dated backup, and prints a receipt. Starts nothing.
on:
  workflow_dispatch:
    inputs:
      instance:
        description: 'Native host instance id'
        required: false
        default: 'i-0e90ee6110ef609aa'
permissions:
  contents: read
jobs:
  advance:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97
      - name: Advance the tools checkout and record boss_commit
        run: python deploy/aws/ssm_run_ps1.py --instance "${{ inputs.instance }}" --region us-east-2 --script deploy/aws/host/frankie_host_advance.ps1 --timeout 600 --comment "advance tools to 96e26f7d"

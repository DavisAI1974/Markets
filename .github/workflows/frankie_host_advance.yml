name: Frankie advance native host tools to a commit
# Moves the native host's tools checkout to an explicit descendant commit and records it as
# boss_commit in the sealed host configuration (dated backup, receipt). First use 2026-09-20: the
# frozen native runtime 96e26f7d (request-id fix). Second use: the re-minted retained Pod identity.
# Refuses a dirty tree and a non-descendant target. Starts nothing.
on:
  workflow_dispatch:
    inputs:
      instance:
        description: 'Native host instance id'
        required: false
        default: 'i-0e90ee6110ef609aa'
      target:
        description: 'Full 40-hex commit to check out on the host (must descend from the current checkout)'
        required: true
permissions:
  contents: read
jobs:
  advance:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97
      - name: Advance the tools checkout and record boss_commit
        run: python deploy/aws/ssm_run_ps1.py --instance "${{ inputs.instance }}" --region us-east-2 --script deploy/aws/host/frankie_host_advance.ps1 --set "Target=${{ inputs.target }}" --timeout 600 --comment "advance tools to ${{ inputs.target }}"

name: Actual combined Sunday journal stack
on:
  push:
    branches: [codex/journal-reduction-stack-20260915]
    paths: [.github/frankie-journal-stack-request.json]
permissions:
  contents: write
concurrency:
  group: frankie-journal-stack-${{ github.sha }}
  cancel-in-progress: false
jobs:
  journal:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/frankie-parallel-source-request.json
            .github/frankie-journal-stack-request.json
            research/kalshi/frankie_boss
            research/ng_exhaustion_mbo_v4_state_adapter_20260820.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install existing transfer and archive dependencies
        run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97 cryptography==46.0.3
      - name: Verify new one-pass conversion and CPU assignment boundary
        run: python -B research/kalshi/frankie_boss/tests/test_journal_stack_execution.py
      - name: Receive the already-uploaded exact snapshot
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python research/kalshi/frankie_boss/operations/parallel_source/cloud_transfer.py fetch "$RUNNER_TEMP/journal-stack-input"
      - name: Run actual full journal with combined reductions and dedicated CPUs
        run: python research/kalshi/frankie_boss/operations/run_journal_stack.py --bundle-dir "$RUNNER_TEMP/journal-stack-input/bundle" --output-dir "$RUNNER_TEMP/journal-stack-result"
      - name: Open Git publication checkout
        if: always()
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/journal-reduction-stack-20260915
          path: publish
          fetch-depth: 1
          sparse-checkout: |
            outputs/frankie-boss/20260915/reduction-stack
          sparse-checkout-cone-mode: false
      - name: Preserve complete result files as encrypted Git parts
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/journal-stack-result" ]; then
            python research/kalshi/frankie_boss/operations/archive_journal_stack.py --result "$RUNNER_TEMP/journal-stack-result" --destination "publish/outputs/frankie-boss/20260915/reduction-stack/runs/$GITHUB_RUN_ID" --request .github/frankie-parallel-source-request.json
            cd publish
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "outputs/frankie-boss/20260915/reduction-stack/runs/$GITHUB_RUN_ID"
            git commit -m "data: preserve complete journal stack result $GITHUB_RUN_ID [skip ci]"
            git push origin HEAD:refs/heads/codex/journal-reduction-stack-20260915
          fi
      - name: Preserve nonsecret receipts even if Git publication needs attention
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: journal-stack-receipts-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/journal-stack-result/verification-*.json
            ${{ runner.temp }}/journal-stack-result/progress.json
          retention-days: 14
          if-no-files-found: warn

name: NG Exhaustion Step-1 Parallel Launch Diagnostic 20260823

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-entry-timing-revival-20260818
    paths:
      - .github/workflows/ng_exhaustion_step1_parallel_diag_20260823.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      INSTANCE_ID: i-08cee7171c0a76a04
      BRANCH: chatgpt/ng-exhaustion-entry-timing-revival-20260818
      COMMAND_ID: df5b05d6-15d2-4452-a860-701e52ed5918
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - name: Read failed invocation
        shell: bash
        run: |
          set -euo pipefail
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json > /tmp/invocation.json
          python - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          x=json.load(open('/tmp/invocation.json'))
          keep={
            'schema':'NG_EXHAUSTION_STEP1_PARALLEL_3MO_FAILURE_DIAG_V1_20260823',
            'command_id':os.environ['COMMAND_ID'],
            'status':x.get('Status'),
            'response_code':x.get('ResponseCode'),
            'standard_output':x.get('StandardOutputContent',''),
            'standard_error':x.get('StandardErrorContent',''),
            'read_at_utc':dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          p=Path('research/kalshi/NG_EXHAUSTION_STEP1_PARALLEL_3MO_FAILURE_DIAG_20260823.json')
          p.write_text(json.dumps(keep,indent=2,sort_keys=True)+'\n')
          print(p.read_text())
          PY
      - name: Retain diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/kalshi/NG_EXHAUSTION_STEP1_PARALLEL_3MO_FAILURE_DIAG_20260823.json
          git commit -m 'research: retain parallel launch failure diagnostic'
          git push origin HEAD:"$BRANCH"

name: S129 Frankie G3 Current-State Replay

on:
  push:
    branches:
      - chatgpt/burn-hh-12m-s125
    paths:
      - .github/workflows/frankie_g3_s129_current_state.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-state:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install current-state runtime dependency
        run: python -m pip install --quiet numpy
      - name: Build S128 repaired decision state for Sep 8-19 2025
        env:
          PYTHONPATH: research/kalshi
        run: |
          mkdir -p /tmp/g3_s129
          # Noncommitted runtime store: fail closed with the feed's expected empty schema.
          mkdir -p data/ngwu
          test -e data/ngwu/ngwu.json || printf '{"issues":[]}\n' > data/ngwu/ngwu.json
          python - <<'PY'
          import pathlib, re, subprocess, sys
          cmd = [sys.executable, 'research/kalshi/frankie_s128_decision_state.py', 'decision-state',
                 '--days', '20250908,20250909,20250910,20250911,20250912,20250915,20250916,20250917,20250918,20250919',
                 '--out', '/tmp/g3_s129/g3_s129_current_state.json']
          root = pathlib.Path.cwd().resolve()
          created=['data/ngwu/ngwu.json (empty issues; unavailable)']
          for attempt in range(30):
              p = subprocess.run(cmd, text=True, capture_output=True)
              pathlib.Path('/tmp/g3_s129/g3_s129_current_state.pretty.json').write_text(p.stdout, encoding='utf-8')
              if p.returncode == 0:
                  print(p.stdout)
                  print('FAIL-CLOSED EMPTY STORES CREATED:', created)
                  break
              m = re.search(r"FileNotFoundError: \[Errno 2\] No such file or directory: '([^']+)'", p.stderr)
              if not m:
                  print(p.stderr, file=sys.stderr)
                  raise SystemExit(p.returncode)
              missing = pathlib.Path(m.group(1)).resolve()
              if root not in missing.parents or not any(part in ('data','weather') for part in missing.parts):
                  print(p.stderr, file=sys.stderr)
                  raise SystemExit('refusing to synthesize non-data missing path: '+str(missing))
              missing.parent.mkdir(parents=True, exist_ok=True)
              if missing.suffix.lower() == '.json':
                  missing.write_text('{}\n', encoding='utf-8')
              elif missing.suffix.lower() in ('.csv','.txt'):
                  missing.write_text('\n', encoding='utf-8')
              else:
                  print(p.stderr, file=sys.stderr)
                  raise SystemExit('unknown missing-store type: '+str(missing))
              created.append(str(missing.relative_to(root)))
              print('FAIL-CLOSED unavailable store:', missing.relative_to(root))
          else:
              raise SystemExit('too many missing-store retries')
          PY
          python - <<'PY'
          import json
          p='/tmp/g3_s129/g3_s129_current_state.json'
          d=json.load(open(p))
          print('days', len(d))
          for day,state in d.items():
              print(day, 'fields=', len(state), 'keys=', sorted(state)[:25])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frankie-g3-s129-current-state
          path: /tmp/g3_s129
          retention-days: 14

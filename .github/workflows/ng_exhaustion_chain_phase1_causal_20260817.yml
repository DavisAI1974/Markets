name: NG Exhaustion Chain Phase1 Causal 20260817

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-aftermath-20260817
    paths:
      - research/NG_EXHAUSTION_CHAIN_PHASE1_CAUSAL_PROTOCOL_20260817.json
      - research/ng_exhaustion_chain_phase1_causal_20260817.py
      - .github/workflows/ng_exhaustion_chain_phase1_causal_20260817.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  causal:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CANONICAL_ARTIFACT_ID: '9279077256'
      CANONICAL_ARTIFACT_SHA256: 'de93a54d4b4d126ea50a2a0c9ce27a0dcf83497affcb93c0ec090de769c54ef6'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen causal protocol
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('research/NG_EXHAUSTION_CHAIN_PHASE1_CAUSAL_PROTOCOL_20260817.json'))
          assert p['status']=='FROZEN_BEFORE_CAUSAL_RESULTS'
          assert p['do_not_discard']['retrospective_structural_chain'].startswith('The parent Phase-1')
          assert p['input_at_horizon_h']['time_used_as_characteristic'] is False
          assert p['input_at_horizon_h']['time_used_only_for_causal_availability'] is True
          PY
      - name: Install causal dependencies
        run: python -m pip install --quiet numpy scikit-learn
      - name: Download strict canonical chain table
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANONICAL_ARTIFACT_ID}/zip" \
            -o /tmp/canonical.zip
          echo "${CANONICAL_ARTIFACT_SHA256}  /tmp/canonical.zip" | sha256sum -c -
          mkdir -p /tmp/canonical
          unzip -q /tmp/canonical.zip -d /tmp/canonical
          test -s /tmp/canonical/NG_EXHAUSTION_CHAIN_CANONICAL_20260817_EVENT_TABLE.jsonl.gz
      - name: Run causal-executable higher-order analysis
        run: |
          set -euo pipefail
          python research/ng_exhaustion_chain_phase1_causal_20260817.py \
            /tmp/canonical/NG_EXHAUSTION_CHAIN_CANONICAL_20260817_EVENT_TABLE.jsonl.gz
      - name: Upload causal phase1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ng-exhaustion-chain-phase1-causal-20260817
          path: NG_EXHAUSTION_CHAIN_PHASE1_CAUSAL_20260817.json
          if-no-files-found: error

name: NG corpus executor pipeline arm

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - research/kalshi/ng_corpus_executor_pipeline_arm.py
      - research/kalshi/tests/test_ng_corpus_executor_pipeline_arm.py
      - research/kalshi/ng_corpus_executor_plan_compiler.py
      - research/kalshi/ng_historical_refinement_executor.py
      - research/kalshi/ng_historical_refinement_executor_v2.py
      - research/kalshi/ng_historical_refinement_readiness.py
      - research/kalshi/ng_historical_refinement_readiness_v4.py
      - .github/workflows/ng_corpus_executor_pipeline_arm_ci.yml
  pull_request:
    paths:
      - research/kalshi/ng_corpus_executor_pipeline_arm.py
      - research/kalshi/tests/test_ng_corpus_executor_pipeline_arm.py
      - research/kalshi/ng_corpus_executor_plan_compiler.py
      - research/kalshi/ng_historical_refinement_executor.py
      - research/kalshi/ng_historical_refinement_executor_v2.py
      - research/kalshi/ng_historical_refinement_readiness.py
      - research/kalshi/ng_historical_refinement_readiness_v4.py
      - .github/workflows/ng_corpus_executor_pipeline_arm_ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-pipeline-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile exact corpus executor chain
        working-directory: research/kalshi
        run: |
          python -m py_compile \
            ng_corpus_executor_pipeline_arm.py \
            ng_corpus_executor_plan_compiler.py \
            ng_historical_refinement_executor.py \
            ng_historical_refinement_executor_v2.py \
            ng_historical_refinement_readiness.py \
            ng_historical_refinement_readiness_v4.py \
            tests/test_ng_corpus_executor_pipeline_arm.py
      - name: Run module self-test
        working-directory: research/kalshi
        run: python ng_corpus_executor_pipeline_arm.py --selftest
      - name: Run focused pipeline-arm tests
        working-directory: research/kalshi
        run: python -m unittest discover -s tests -p 'test_ng_corpus_executor_pipeline_arm.py' -v
      - name: Verify first-blocking execution boundary
        working-directory: research/kalshi
        run: |
          python - <<'PY'
          import inspect
          import ng_corpus_executor_pipeline_arm as arm
          import ng_historical_refinement_executor as legacy_executor
          import ng_historical_refinement_readiness_v4 as readiness

          assert tuple(spec.key for spec in readiness.STAGES[:3]) == arm.ARMED_STAGES
          source = inspect.getsource(legacy_executor.execute_next)
          assert 'first_key = before.get("first_blocking_stage")' in source
          assert 'step = next(step for step in plan["stages"] if step["key"] == first_key)' in source
          assert arm.STATUS == "EXACT_CORPUS_PIPELINE_ARMED"
          print("stable first-blocking corpus pipeline PASS")
          PY

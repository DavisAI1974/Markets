name: Frankie retained Pod control
# Operator-level inspect/start of the retained Granite Pod. The retained observer submits its one start
# and discards the provider's refusal body; this prints that body and, on acceptance, the status
# transition and a receipt. Never stops, patches or deletes a Pod. Prints no environment value.
on:
  workflow_dispatch:
    inputs:
      pod:
        description: 'Retained Pod id'
        required: false
        default: 'ycf4v6lmave6xw'
      action:
        description: 'inspect (read-only) or start (submits the v2 start action once)'
        required: true
        default: 'inspect'
        type: choice
        options: ['inspect', 'start']
      wait_seconds:
        description: 'After an accepted start, poll the status transition for at most this long'
        required: false
        default: '300'
      retry_seconds:
        description: 'Keep re-submitting every 60 s for at most this long while the host reports no free GPU (0 = one attempt)'
        required: false
        default: '0'
permissions:
  contents: read
jobs:
  control:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect or start the retained Pod
        run: python research/kalshi/frankie_boss/operations/pod_control.py --pod "${{ inputs.pod }}" --action "${{ inputs.action }}" --wait-seconds "${{ inputs.wait_seconds }}" --retry-seconds "${{ inputs.retry_seconds }}"

name: Frankie retained Pod control
# Operator-level inspect/start of the retained Granite Pod. The retained observer submits its one start
# and discards the provider's refusal body; this prints that body and, on acceptance, the status
# transition and a receipt. Never stops, patches or deletes a Pod. Prints no environment value.
on:
  workflow_dispatch:
    inputs:
      pod:
        description: 'Retained Pod id'
        required: false
        default: 'g7y3g2w1kor4l3'
      action:
        description: 'inspect (read-only), start (submits the v2 start action once), or terminate (DELETE an EXITED replacement Pod; never the retained Pod)'
        required: true
        default: 'inspect'
        type: choice
        options: ['inspect', 'start', 'terminate', 'restart']
      wait_seconds:
        description: 'After an accepted start, poll the status transition for at most this long'
        required: false
        default: '300'
      journal_key:
        description: 'restart only: wait for this key in the private journal bucket before restarting'
        required: false
        default: ''
      retry_seconds:
        description: 'Keep re-submitting every 60 s for at most this long while the host reports no free GPU (0 = one attempt)'
        required: false
        default: '0'
permissions:
  contents: read
jobs:
  control:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97
      - name: Inspect or start the retained Pod
        run: python research/kalshi/frankie_boss/operations/pod_control.py --pod "${{ inputs.pod }}" --action "${{ inputs.action }}" --wait-seconds "${{ inputs.wait_seconds }}" --retry-seconds "${{ inputs.retry_seconds }}" --wait-journal-key "${{ inputs.journal_key }}"

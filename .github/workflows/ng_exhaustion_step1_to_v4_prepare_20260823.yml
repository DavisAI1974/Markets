name: NG Exhaustion Step-1 to V4 Frozen Registry 20260823

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact completed Step-1 candidate commit
        required: true
  push:
    branches:
      - chatgpt/ng-exhaustion-entry-timing-revival-20260818
    paths:
      - .github/workflows/ng_exhaustion_step1_to_v4_prepare_20260823.yml

permissions:
  contents: read

concurrency:
  group: ng-exhaustion-step1-to-v4-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      BUCKET: bento-568968024170-us-east-2-an
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      LAUNCH_BRANCH: chatgpt/ng-exhaustion-entry-timing-revival-20260818
      LAUNCH_RECEIPT_PATH: research/kalshi/NG_EXHAUSTION_MBO_5Y_STEP1_LAUNCH_20260822.json
    steps:
      - name: Check out exact preparation code and durable receipt
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LAUNCH_BRANCH }}
          fetch-depth: 0

      - name: Validate exact completed candidate scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from research.kalshi.ng_exhaustion_step1_completion_gate import (
              validate_launch_canary,
          )

          launch = json.loads(Path(os.environ['LAUNCH_RECEIPT_PATH']).read_text())
          candidate = os.environ['CANDIDATE_SHA']
          bucket = os.environ['BUCKET']
          expected = f's3://{bucket}/nymex/ng_mbo_5y_v0/step1_census/launches/{candidate}/full/'
          if launch.get('schema') != 'NG_EXHAUSTION_MBO_5Y_STEP1_LAUNCH_RECEIPT_V1_20260822':
              raise SystemExit('durable launch receipt schema drift')
          if launch.get('candidate_commit') != candidate:
              raise SystemExit('durable launch receipt belongs to another candidate')
          if launch.get('full_census_launched') is not True:
              raise SystemExit('durable launch receipt does not prove full launch')
          if launch.get('result_prefix') != expected:
              raise SystemExit('durable launch result prefix drift')
          for field in (
              'release_or_virgin_holdout_consumed',
              'predictive_or_trading_experiment_run',
              'permanent_frankie_mutated',
          ):
              if launch.get(field) is not False:
                  raise SystemExit(f'unsafe launch receipt field: {field}')
          mode = validate_launch_canary(launch, launch.get('candidate_lock', {}))
          if mode != 'USER_AUTHORIZED_ONE_DAY_CANARY':
              raise SystemExit('launch does not bind the accepted one-day canary')
          PY

      - name: Download exact declared Step-1 handoff objects
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/step1-to-v4
          prefix="nymex/ng_mbo_5y_v0/step1_census/launches/$CANDIDATE_SHA/full/results"
          mkdir -p "$root"
          cp "$LAUNCH_RECEIPT_PATH" "$root/LAUNCH_RECEIPT.json"
          for name in \
            STEP1_DUAL_CENSUS_RECEIPT.json \
            LEGACY_CONTROL_POPULATION.jsonl.gz \
            V4_NATIVE_FULL_POPULATION.jsonl.gz \
            DUAL_CENSUS_CROSSWALK.jsonl.gz
          do
            aws s3 cp "s3://$BUCKET/$prefix/$name" "$root/$name" --only-show-errors
            test -s "$root/$name"
          done

      - name: Freeze non-result-bearing V4 input registry
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/step1-to-v4
          result_prefix="s3://$BUCKET/nymex/ng_mbo_5y_v0/step1_census/launches/$CANDIDATE_SHA/full/results/"
          python research/kalshi/ng_exhaustion_step1_to_v4_registry.py \
            --launch-receipt "$root/LAUNCH_RECEIPT.json" \
            --receipt "$root/STEP1_DUAL_CENSUS_RECEIPT.json" \
            --legacy-population "$root/LEGACY_CONTROL_POPULATION.jsonl.gz" \
            --native-population "$root/V4_NATIVE_FULL_POPULATION.jsonl.gz" \
            --crosswalk "$root/DUAL_CENSUS_CROSSWALK.jsonl.gz" \
            --candidate-commit "$CANDIDATE_SHA" \
            --result-prefix "$result_prefix" \
            --output "$root/STEP1_TO_V4_FROZEN_REGISTRY.json"
          python - "$root/STEP1_TO_V4_FROZEN_REGISTRY.json" <<'PY'
          import hashlib
          import json
          import sys

          registry = json.load(open(sys.argv[1]))
          claimed = registry.pop('registry_sha256', None)
          actual = hashlib.sha256(
              json.dumps(registry, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode()
          ).hexdigest()
          if claimed != actual:
              raise SystemExit('frozen registry canonical hash drift')
          if registry.get('status') != 'STEP1_TO_V4_FROZEN_REGISTRY_READY':
              raise SystemExit('frozen registry is not ready')
          if registry.get('result_bearing_launch_authorized') is not False:
              raise SystemExit('preparation must not authorize a result-bearing run')
          if registry.get('pilot_selection_status') != 'UNDECLARED':
              raise SystemExit('preparation must not silently select a pilot')
          registry['registry_sha256'] = claimed
          print(json.dumps({
              'status': registry['status'],
              'registry_sha256': claimed,
              'eligible_crosswalk_edge_count': registry['eligible_crosswalk_edge_count'],
              'inventory_by_d_year': registry['inventory_by_d_year'],
              'result_bearing_launch_authorized': False,
          }, indent=2, sort_keys=True))
          PY

      - name: Upload immutable preparation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ng-exhaustion-step1-to-v4-${{ inputs.candidate_sha }}
          path: |
            /tmp/step1-to-v4/LAUNCH_RECEIPT.json
            /tmp/step1-to-v4/STEP1_DUAL_CENSUS_RECEIPT.json
            /tmp/step1-to-v4/STEP1_TO_V4_FROZEN_REGISTRY.json
          if-no-files-found: error
          retention-days: 30

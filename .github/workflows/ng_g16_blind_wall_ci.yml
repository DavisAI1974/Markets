name: G16 Blind Wall CI

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - 'research/kalshi/ng_g16_blind_wall.py'
      - 'research/kalshi/tests/test_ng_g16_blind_wall.py'
      - '.github/workflows/ng_g16_blind_wall_ci.yml'
  pull_request:
    paths:
      - 'research/kalshi/ng_g16_blind_wall.py'
      - 'research/kalshi/tests/test_ng_g16_blind_wall.py'
      - '.github/workflows/ng_g16_blind_wall_ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile G16 blind wall
        run: |
          python -m py_compile \
            research/kalshi/ng_g16_blind_wall.py \
            research/kalshi/tests/test_ng_g16_blind_wall.py
      - name: Run self-test
        working-directory: research/kalshi
        run: python ng_g16_blind_wall.py --selftest
      - name: Run unit tests
        run: python -m unittest -v research/kalshi/tests/test_ng_g16_blind_wall.py

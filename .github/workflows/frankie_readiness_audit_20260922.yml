name: Inspect retained Monday ingest and prior-cycle evidence
on:
  push:
    branches: ['codex/trading-day-readiness-20260922']
    paths:
      - '.github/workflows/frankie_readiness_audit_20260922.yml'
      - 'deploy/aws/readiness_audit_20260922.py'
      - 'deploy/aws/box/frankie_box_readiness_audit.py'
permissions:
  contents: read
jobs:
  inspect-retained-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97
      - name: Read-only packing, process, brain and anchor audit
        run: python deploy/aws/readiness_audit_20260922.py | tee readiness-audit-output.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frankie-readiness-audit
          path: readiness-audit-output.txt
          if-no-files-found: warn

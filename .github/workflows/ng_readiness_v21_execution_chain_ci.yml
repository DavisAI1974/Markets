name: NG readiness v21 stable execution chain

on:
  push:
    paths:
      - "research/kalshi/ng_corpus_executor_plan_compiler_v16.py"
      - "research/kalshi/ng_corpus_executor_pipeline_arm_v16.py"
      - "research/kalshi/ng_historical_refinement_preflight_v17.py"
      - "research/kalshi/ng_historical_refinement_executor_v17.py"
      - "research/kalshi/ng_historical_refinement_readiness_v21.py"
      - "research/kalshi/tests/test_ng_readiness_v21_execution_chain.py"
      - ".github/workflows/ng_readiness_v21_execution_chain_ci.yml"
  pull_request:
    paths:
      - "research/kalshi/ng_corpus_executor_plan_compiler_v16.py"
      - "research/kalshi/ng_corpus_executor_pipeline_arm_v16.py"
      - "research/kalshi/ng_historical_refinement_preflight_v17.py"
      - "research/kalshi/ng_historical_refinement_executor_v17.py"
      - "research/kalshi/ng_historical_refinement_readiness_v21.py"
      - "research/kalshi/tests/test_ng_readiness_v21_execution_chain.py"
      - ".github/workflows/ng_readiness_v21_execution_chain_ci.yml"

jobs:
  readiness-v21-stable-execution:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile readiness-v21 execution chain
        run: |
          python -m py_compile \
            ng_corpus_executor_plan_compiler_v16.py \
            ng_corpus_executor_pipeline_arm_v16.py \
            ng_historical_refinement_preflight_v17.py \
            ng_historical_refinement_executor_v17.py \
            ng_historical_refinement_readiness_v21.py \
            tests/test_ng_readiness_v21_execution_chain.py
      - name: Run upstream readiness self-tests
        run: |
          python ng_corpus_s3_inventory_capture.py selftest
          python ng_historical_refinement_readiness_v21.py --selftest
      - name: Run focused execution tests
        run: python -m pytest -q tests/test_ng_readiness_v21_execution_chain.py
      - name: Verify live-capture ordering and authority wall
        run: |
          python - <<'PY'
          from pathlib import Path
          import ng_corpus_executor_plan_compiler_v16 as compiler
          import ng_historical_refinement_executor_v17 as executor
          import ng_historical_refinement_readiness_v21 as readiness

          keys = [spec.key for spec in readiness.STAGES]
          assert keys[:4] == [
              "corpus_s3_inventory_capture",
              "corpus_s3_materialization",
              "corpus_coverage",
              "corpus_definition_byte_binding",
          ]
          assert tuple(keys[:len(compiler.CONFIGURED_STAGES)]) == compiler.CONFIGURED_STAGES
          assert executor.SUGGESTED_ENTRYPOINTS["corpus_s3_inventory_capture"] == (
              "python", "ng_corpus_s3_inventory_capture.py", "capture"
          )
          plan = executor.build_plan(Path("renders/ng_refine_s95"), Path("."))
          assert plan["outcome_paths"] == []
          assert plan["paid_live_data_assumed"] is False
          assert plan["random_shuffle_used"] is False
          assert plan["one_signal_authority_preserved"] is True
          assert plan["blind_forecasts_immutable"] is True
          assert plan["may_update_ng_brain"] is False
          assert plan["execution_authority"] is False
          assert plan["cme_event_contracts_mode"] == "SHADOW"
          assert plan["brokerage_contract"] == "tastytrade_not_ibkr"
          assert plan["options_lane_started"] is False
          PY

name: Paper Trade (all cells, maker-at-the-turn + conviction sizing)

# Forward paper-trading of the S47 strategy on ALL cells (sol/doge/xrp/eth/btc): the causal
# maker-at-the-turn swing executor + two-factor conviction sizing, net-of-fee, logged to
# paper_ledger.jsonl (deduped by cell+entry_ts so runs accumulate a genuine FORWARD record).
# DOES NOT trade real money. This is the multi-window out-of-sample test the one-window S47
# backtest could not give us — let the forward ledger decide which cells earn deployment.
#
# ⚠ ACTIVATION: GitHub fires `schedule:` (cron) ONLY from a workflow file on the repository
# DEFAULT branch. This file must be placed on the default branch to auto-run (Greg's action;
# the integration token cannot dispatch GHA). Until then, run scripts/paper_trade.py per session
# (it dedups + accrues), or use the Run-workflow button (workflow_dispatch).
#
# Runs 30 min after the 6h book-collector cron so the rolling book window has the freshest data.

on:
  schedule:
    - cron: '30 */6 * * *'   # 00:30, 06:30, 12:30, 18:30 UTC (default-branch only)
  workflow_dispatch:
    inputs:
      maker_fee_bps: {description: 'maker fee bps (<=0 = rebate; S47: strategy needs <=0)', default: '0', type: string}
      taker_fee_bps: {description: 'taker fee bps on last-option exits', default: '5', type: string}
      alpha:         {description: 'sizing tilt strength', default: '1.0', type: string}

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout strategy branch
        uses: actions/checkout@v4
        with:
          ref: claude/crypto-liquidity-signals-5c5vg9   # the code + the ledger live here (keep synced)
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install deps
        run: pip install --quiet numpy scipy scikit-learn
      - name: Fetch the per-cell books (gzipped; load_book reads gzip)
        run: |
          for c in sol doge xrp eth btc; do
            git fetch origin data/$c-book || true
            git show origin/data/$c-book:${c}_coinbase_book.jsonl.gz > /tmp/${c}_coinbase_book.jsonl.gz 2>/dev/null || echo "no book for $c yet"
          done
      - name: Run paper trader (appends new trades, deduped)
        run: |
          python scripts/paper_trade.py \
            --maker "${{ github.event.inputs.maker_fee_bps || '0' }}" \
            --taker "${{ github.event.inputs.taker_fee_bps || '5' }}" \
            --alpha "${{ github.event.inputs.alpha || '1.0' }}"
      - name: Commit the updated ledger
        run: |
          git config user.email noreply@anthropic.com && git config user.name Claude
          git add paper_ledger.jsonl
          git add paper_ledger_sandbox.jsonl 2>/dev/null || true   # S57: sandbox forward record (tracked on 5c5vg9)
          git commit -m "paper_trade: forward ledger update $(date -u +%FT%TZ)" || echo "no new trades"
          git push origin HEAD:claude/crypto-liquidity-signals-5c5vg9 || echo "push failed (retry next cron)"

name: S122 Item 4 Task A verify and land

on:
  push:
    branches:
      - chatgpt/s122-item4-verify
    paths:
      - .github/workflows/s122_item4_task_a_verify.yml
      - scripts/s122_task_a_verify.sh
      - scripts/s122_task_a_verify_v2.sh

permissions:
  contents: write

concurrency:
  group: s122-item4-task-a
  cancel-in-progress: true

jobs:
  verify-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - run: bash scripts/s122_task_a_verify_v2.sh

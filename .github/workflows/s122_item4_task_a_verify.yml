name: S122 Item 4 Task A verifier

on:
  push:
    branches:
      - chatgpt/s122-item4-verify

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verifier branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Prove Actions job starts
        run: |
          set -euo pipefail
          echo WORKFLOW_OK
          git rev-parse HEAD

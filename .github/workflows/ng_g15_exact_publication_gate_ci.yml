name: G15 Exact Publication Gate CI

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - 'research/kalshi/ng_g15_exact_publication_gate.py'
      - 'research/kalshi/ng_g15_exact_refinement_gate.py'
      - 'research/kalshi/ng_g15_curve_adapter.py'
      - 'research/kalshi/ng_g15_path_score.py'
      - 'research/kalshi/ng_g15_lesson_adjudication.py'
      - 'research/kalshi/tests/test_ng_g15_exact_publication_gate.py'
      - '.github/workflows/ng_g15_exact_publication_gate_ci.yml'
  pull_request:
    paths:
      - 'research/kalshi/ng_g15_exact_publication_gate.py'
      - 'research/kalshi/ng_g15_exact_refinement_gate.py'
      - 'research/kalshi/ng_g15_curve_adapter.py'
      - 'research/kalshi/ng_g15_path_score.py'
      - 'research/kalshi/ng_g15_lesson_adjudication.py'
      - 'research/kalshi/tests/test_ng_g15_exact_publication_gate.py'
      - '.github/workflows/ng_g15_exact_publication_gate_ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile exact publication chain
        run: |
          python -m py_compile \
            research/kalshi/ng_g15_exact_refinement_gate.py \
            research/kalshi/ng_g15_curve_adapter.py \
            research/kalshi/ng_g15_path_score.py \
            research/kalshi/ng_g15_lesson_adjudication.py \
            research/kalshi/ng_g15_exact_publication_gate.py \
            research/kalshi/tests/test_ng_g15_exact_publication_gate.py
      - name: Run exact publication self-test
        run: python research/kalshi/ng_g15_exact_publication_gate.py --selftest
      - name: Run exact publication tests
        run: python -m unittest -v research/kalshi/tests/test_ng_g15_exact_publication_gate.py

name: Frankie Sunday cycle 0 — GitHub 16 CPU

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: New run identity for corrected cycle-0 benchmark
        required: true
        type: string
      configuration_artifact:
        description: Name of the pre-staged lawful Sunday configuration artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: frankie-sunday-cycle0-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  cycle0:
    runs-on:
      labels: ubuntu-24.04-16core
    timeout-minutes: 355
    env:
      # Three explicit budgets; the launcher refuses to start without all three (cpu_runtime.policy_from_environment).
      FRANKIE_JOURNAL_VERIFY_WORKERS: '16'
      FRANKIE_TORCH_INTRAOP_THREADS: '16'
      FRANKIE_TORCH_INTEROP_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact dual-compute branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/frankie-dual-compute-20260915
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Full patch version on purpose: BossTrainingCheckpoint binds sys.version, so a
          # floating '3.12' could make a later job unable to resume the run it started.
          python-version: '3.12.11'

      - name: Verify 16 CPU host before any checkpoint or model construction
        shell: bash
        run: |
          python - <<'PY'
          import os
          n = os.cpu_count()
          print(f'FRANKIE_GITHUB_LOGICAL_CPUS={n}', flush=True)
          if n is None or n < 16:
              raise SystemExit('GitHub runner exposes fewer than 16 logical CPUs')
          PY

      - name: Install project runtime dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Pinned exactly: torch and numpy versions are part of the checkpoint runtime binding.
          # These are the pins the existing Granite hosted controller already uses; they are NOT
          # the versions the failed cycle-00 ran under (torch 2.9.1+cpu / numpy 2.3.5 / Python 3.13.7
          # on Windows). The new run identity declares its own toolchain; it cannot resume the old one.
          python -m pip install numpy==2.4.3 pytest==8.3.5
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Focused CPU and lossless-reader checks only
        shell: bash
        env:
          # The tests use flat imports (from c15_journal import ...); without this the step
          # fails at collection. Same convention as boss_granite_hosted_controller.yml.
          PYTHONPATH: .:research/kalshi/frankie_boss:research/kalshi/frankie_boss/tests
        run: |
          python -m pytest research/kalshi/frankie_boss/tests/test_cpu_worker_policy.py -q -p no:cacheprovider
          python -m pytest research/kalshi/frankie_boss/tests/test_verified_journal_reader.py research/kalshi/frankie_boss/tests/test_verified_reader_concurrent_tail.py -q -p no:cacheprovider

      - name: Require externally staged lawful Sunday configuration
        shell: bash
        run: |
          echo 'The result-bearing launch is intentionally gated.'
          echo 'Before enabling the next step, restore the exact Sunday source/configuration package for the NEW run identity.'
          echo 'Do not reuse E: paths, the failed cycle-00 checkpoint, or mutate the original run.'
          exit 78

      # RESULT-BEARING STEP IS DELIBERATELY NOT ENABLED UNTIL THE LAWFUL CONFIGURATION
      # PACKAGE IS RESTORED IN GITHUB WITH ITS EXISTING hashes/receipts and Claude/Greg
      # review the migration. The eventual command is:
      # python -m research.kalshi.frankie_boss.operations.run_actual_sunday_github16 \
      #   --configuration <github-restored-new-run-config.json>

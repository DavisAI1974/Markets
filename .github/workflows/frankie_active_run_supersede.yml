name: Frankie close a stale active-run claim on the retained Pod
# The observer's S3 active-run claim (retained-granite-pods/<pod>/active-run.json) is released only by
# a confirmed Pod STOP, which loses the GPU under low stock. When the claiming observer's world is
# dead (run cancelled, its readiness superseded on the host) and a new startup must claim the same
# RUNNING Pod, this copies the record aside server-side (never deletes) and writes phase 'closed'
# with the store's own conditional ETag, printing one receipt. Inspect mode only reads. No Runpod
# call, no start/stop/restart. Dispatch only; inputs reach the script through env.
on:
  workflow_dispatch:
    inputs:
      pod:
        description: 'Retained Pod id'
        required: false
        default: '8vqdacl5t61rjx'
      action:
        description: 'inspect (read-only) or close (copy aside, then phase closed)'
        required: true
        default: 'inspect'
        type: choice
        options: ['inspect', 'close']
      expect_startup_sha256:
        description: 'close only: the stale startup digest (at least 8 hex, prefix match; refused otherwise)'
        required: false
        default: ''
      reason:
        description: 'close only: why this claim is superseded (goes into the receipt)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  supersede:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97
      - name: Inspect or close the active-run claim
        env:
          POD: ${{ inputs.pod }}
          ACTION: ${{ inputs.action }}
          EXPECT: ${{ inputs.expect_startup_sha256 }}
          REASON: ${{ inputs.reason }}
        run: python research/kalshi/frankie_boss/operations/active_run_supersede.py --pod "$POD" --action "$ACTION" --expect-startup-sha256 "$EXPECT" --reason "$REASON"

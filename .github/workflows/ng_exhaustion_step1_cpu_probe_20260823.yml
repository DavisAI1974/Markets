name: NG Exhaustion Step-1 CPU Probe 20260823

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-entry-timing-revival-20260818
    paths:
      - .github/workflows/ng_exhaustion_step1_cpu_probe_20260823.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      INSTANCE_ID: i-08cee7171c0a76a04
      CANDIDATE_SHA: 0d318335825b4a0e19a5a2881522f3da0374788e
      BRANCH: chatgpt/ng-exhaustion-entry-timing-revival-20260818
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Read CPU topology without touching census
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'AWS_EC2_METADATA_BEGIN'
            aws ec2 describe-instances \
              --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].{InstanceType:InstanceType,State:State.Name,CoreCount:CpuOptions.CoreCount,ThreadsPerCore:CpuOptions.ThreadsPerCore}' \
              --output json || true
            echo 'AWS_EC2_METADATA_END'
          } > /tmp/ec2-meta.txt

          python - <<'PY'
          import json, os
          command = r'''set -euo pipefail
printf 'NPROC='; nproc
printf 'ONLINE_CPUS='; cat /sys/devices/system/cpu/online
printf 'MODEL_NAME='; lscpu | awk -F: '/Model name/ {sub(/^[ \t]+/,"",$2); print $2; exit}'
printf 'CPU_SOCKETS='; lscpu | awk -F: '/Socket\(s\)/ {gsub(/ /,"",$2); print $2; exit}'
printf 'CORES_PER_SOCKET='; lscpu | awk -F: '/Core\(s\) per socket/ {gsub(/ /,"",$2); print $2; exit}'
printf 'THREADS_PER_CORE='; lscpu | awk -F: '/Thread\(s\) per core/ {gsub(/ /,"",$2); print $2; exit}'
printf 'CPU_MHZ='; lscpu | awk -F: '/CPU max MHz/ {gsub(/ /,"",$2); print $2; exit}'
unit=ng-exhaustion-step1-0d318335825b
systemctl show "$unit" --property=LoadState,ActiveState,SubState,MainPID --no-pager || true
ps -eo pid,ppid,etimes,pcpu,pmem,stat,comm --sort=-pcpu | head -n 8
'''
          with open('/tmp/cpu-probe-params.json','w',encoding='utf-8') as f:
              json.dump({'commands':[command]},f)
          PY
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Read-only Step-1 CPU topology $CANDIDATE_SHA" \
            --parameters file:///tmp/cpu-probe-params.json \
            --timeout-seconds 120 \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json > /tmp/ssm-cpu.json

          python - <<'PY'
          import json
          from pathlib import Path
          ssm=json.loads(Path('/tmp/ssm-cpu.json').read_text())
          if ssm.get('Status')!='Success' or ssm.get('ResponseCode')!=0:
              raise SystemExit(ssm)
          out=Path('research/kalshi/NG_EXHAUSTION_STEP1_CPU_PROBE_20260823.txt')
          out.write_text(
              Path('/tmp/ec2-meta.txt').read_text() + '\n' +
              'SSM_CPU_TOPOLOGY_BEGIN\n' + ssm.get('StandardOutput','') +
              'SSM_CPU_TOPOLOGY_END\n', encoding='utf-8')
          print(out.read_text())
          PY

      - name: Retain CPU probe evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/kalshi/NG_EXHAUSTION_STEP1_CPU_PROBE_20260823.txt
          git commit -m 'research: retain Step-1 CPU topology probe'
          git push origin HEAD:"$BRANCH"

name: NG readiness v9 execution chain

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - "research/kalshi/ng_historical_refinement_executor_v7.py"
      - "research/kalshi/ng_historical_refinement_preflight_v7.py"
      - "research/kalshi/ng_corpus_executor_plan_compiler_v6.py"
      - "research/kalshi/ng_corpus_executor_pipeline_arm_v6.py"
      - "research/kalshi/ng_historical_refinement_readiness_v9.py"
      - "research/kalshi/ng_g15_exact_partition_replay_authorization.py"
      - "research/kalshi/tests/test_ng_readiness_v9_execution_chain.py"
      - ".github/workflows/ng_readiness_v9_execution_chain_ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-readiness-v9-execution-chain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile exact partition-bound execution chain
        run: |
          python -m py_compile \
            ng_historical_refinement_executor_v7.py \
            ng_historical_refinement_preflight_v7.py \
            ng_corpus_executor_plan_compiler_v6.py \
            ng_corpus_executor_pipeline_arm_v6.py \
            ng_historical_refinement_readiness_v9.py \
            ng_g15_exact_partition_replay_authorization.py \
            tests/test_ng_readiness_v9_execution_chain.py
      - name: Run focused readiness v9 execution tests
        run: python -m unittest tests.test_ng_readiness_v9_execution_chain
      - name: Verify exact pre-outcome stage boundary
        run: |
          python - <<'PY'
          import ng_historical_refinement_readiness_v9 as readiness

          rows = {spec.key: spec for spec in readiness.STAGES}
          keys = [spec.key for spec in readiness.STAGES]
          replay = keys.index("g15_exact_replay")
          binding = keys.index("g15_exact_partition_replay_authorization")
          window = keys.index("g15_exact_replay_window_authorization")
          refinement = keys.index("g15_exact_refinement")
          assert replay < binding < window < refinement
          assert rows["g15_exact_partition_replay_authorization"].pre_outcome
          assert rows["g15_exact_replay_window_authorization"].pre_outcome
          PY
      - name: Verify permanent authority wall
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile
          from unittest import mock
          import ng_corpus_executor_plan_compiler_v6 as compiler
          import ng_corpus_executor_pipeline_arm_v6 as arm

          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              slice_path = root / "slice.json"
              inspection_path = root / "inspection.json"
              slice_path.write_text("{}\n", encoding="utf-8")
              inspection_path.write_text("{}\n", encoding="utf-8")
              with mock.patch.object(
                  compiler.fingerprinting,
                  "validate_inputs",
                  return_value=(
                      {"slice_bundle_fingerprint": "slice"},
                      {"plan_fingerprint": "inspection"},
                  ),
              ):
                  plan, receipt = compiler.build_compiled_plan(
                      artifact_dir=root / "artifacts",
                      working_directory=root / "work",
                      slice_bundle_path=slice_path,
                      inspection_plan_path=inspection_path,
                  )
              armed, arm_receipt = arm.build_armed_plan(plan, receipt)
              for value in (receipt, arm_receipt):
                  assert value["random_shuffle_used"] is False
                  assert value["blind_forecasts_immutable"] is True
                  assert value["may_update_ng_brain"] is False
                  assert value["execution_authority"] is False
                  assert value["cme_event_contracts_mode"] == "SHADOW"
                  assert value["brokerage_contract"] == "tastytrade_not_ibkr"
                  assert value["options_lane_started"] is False
              rows = {row["key"]: row for row in armed["stages"]}
              assert rows["g15_exact_partition_replay_authorization"]["enabled"] is False
              assert rows["g15_exact_replay_window_authorization"]["enabled"] is False
          PY

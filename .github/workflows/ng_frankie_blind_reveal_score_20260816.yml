name: NG Frankie Exhaustion Blind Reveal Score 20260816

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-frankie-blind-20260816
    paths:
      - research/ng_exhaustion_frankie_blind_reveal_score_20260816.py
      - .github/workflows/ng_frankie_blind_reveal_score_20260816.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reveal_score:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      BUCKET: bento-568968024170-us-east-2-an
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify prediction freeze is immutable ancestor
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0f26c125548c801037bb3084d23b1b5d974ae0eb HEAD
          test -s research/blind_freeze/ng_exhaustion_20260816/FRANKIE_NG_EXHAUSTION_BLIND_PREDICTION_FREEZE_MANIFEST_20260816.json
      - name: Install reveal scoring dependencies
        run: python -m pip install --quiet numpy scipy scikit-learn matplotlib databento
      - name: Download authoritative continuous MBP10 days after freeze verification
        run: |
          set -euo pipefail
          for d in 20250717 20250923 20250930 20251001; do
            aws s3 cp s3://${BUCKET}/nymex/nymex_cont/NG_${d}.jsonl.gz /tmp/NG_${d}.jsonl.gz --only-show-errors
            test -s /tmp/NG_${d}.jsonl.gz
          done
      - name: Reveal and score frozen Frankie curves
        run: |
          PYTHONPATH=research:research/kalshi python research/ng_exhaustion_frankie_blind_reveal_score_20260816.py \
            /tmp/NG_20250717.jsonl.gz \
            /tmp/NG_20250923.jsonl.gz \
            /tmp/NG_20250930.jsonl.gz \
            /tmp/NG_20251001.jsonl.gz
      - name: Upload reveal scorecard and renders
        uses: actions/upload-artifact@v4
        with:
          name: frankie-ng-exhaustion-blind-reveal-score-20260816
          path: |
            FRANKIE_NG_EXHAUSTION_BLIND_REVEAL_SCORECARD_20260816.json
            frankie_ng_blind_reveal_event_scores.jsonl.gz
            frankie_blind_group_*.png
            frankie_blind_representative_*.png
          if-no-files-found: error

name: NG readiness v31 stable execution chain

on:
  push:
    paths:
      - "research/kalshi/ng_corpus_executor_plan_compiler_v26.py"
      - "research/kalshi/ng_corpus_executor_pipeline_arm_v26.py"
      - "research/kalshi/ng_historical_refinement_preflight_v27.py"
      - "research/kalshi/ng_historical_refinement_executor_v27.py"
      - "research/kalshi/ng_historical_refinement_readiness_v31.py"
      - "research/kalshi/ng_historical_refinement_readiness_v31_impl.py"
      - "research/kalshi/ng_g15_prepared_normalized_identity_guard.py"
      - "research/kalshi/ng_g15_prepared_normalized_identity_guard_impl.py"
      - "research/kalshi/tests/test_ng_g15_prepared_normalized_identity_guard.py"
      - "research/kalshi/tests/test_ng_readiness_v31_execution_chain.py"
      - ".github/workflows/ng_readiness_v31_execution_chain_ci.yml"
  pull_request:
    paths:
      - "research/kalshi/ng_corpus_executor_plan_compiler_v26.py"
      - "research/kalshi/ng_corpus_executor_pipeline_arm_v26.py"
      - "research/kalshi/ng_historical_refinement_preflight_v27.py"
      - "research/kalshi/ng_historical_refinement_executor_v27.py"
      - "research/kalshi/ng_historical_refinement_readiness_v31.py"
      - "research/kalshi/ng_historical_refinement_readiness_v31_impl.py"
      - "research/kalshi/ng_g15_prepared_normalized_identity_guard.py"
      - "research/kalshi/ng_g15_prepared_normalized_identity_guard_impl.py"
      - "research/kalshi/tests/test_ng_g15_prepared_normalized_identity_guard.py"
      - "research/kalshi/tests/test_ng_readiness_v31_execution_chain.py"
      - ".github/workflows/ng_readiness_v31_execution_chain_ci.yml"

jobs:
  stable-prepared-normalized-identity-execution:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile readiness v31 execution chain
        run: |
          python -m py_compile \
            ng_corpus_executor_plan_compiler_v26.py \
            ng_corpus_executor_pipeline_arm_v26.py \
            ng_historical_refinement_preflight_v27.py \
            ng_historical_refinement_executor_v27.py \
            ng_historical_refinement_readiness_v31.py \
            ng_historical_refinement_readiness_v31_impl.py \
            ng_g15_prepared_normalized_identity_guard.py \
            ng_g15_prepared_normalized_identity_guard_impl.py \
            tests/test_ng_g15_prepared_normalized_identity_guard.py \
            tests/test_ng_readiness_v31_execution_chain.py
      - name: Run prepared normalized identity self-test
        run: python ng_g15_prepared_normalized_identity_guard.py --selftest
      - name: Run readiness v31 self-test
        run: python ng_historical_refinement_readiness_v31.py --selftest
      - name: Run prepared identity and stable-route tests
        run: |
          python -m pytest -q \
            tests/test_ng_g15_prepared_normalized_identity_guard.py \
            tests/test_ng_readiness_v31_execution_chain.py
      - name: Verify exact prepared-input boundary and permanent authority wall
        run: |
          python - <<'PY'
          import ng_corpus_executor_pipeline_arm_v26 as arm
          import ng_corpus_executor_plan_compiler_v26 as compiler
          import ng_historical_refinement_preflight_v27 as preflight
          import ng_historical_refinement_readiness_v31 as readiness

          keys = [spec.key for spec in readiness.STAGES]
          guard = keys.index("g15_prepared_normalized_identity")
          assert keys[guard - 1] == "broad_corpus_exact_partition"
          assert keys[guard + 1] == "g15_exact_replay"
          assert list(compiler.CONFIGURED_STAGES) == keys[: len(compiler.CONFIGURED_STAGES)]
          assert compiler.CONFIGURED_STAGES[-1] == "g15_prepared_normalized_identity"
          assert arm.ARMED_STAGES == compiler.CONFIGURED_STAGES
          assert preflight.READINESS_CONTRACT == readiness.SCHEMA
          assert preflight.EXECUTOR_CONTRACT == "ng_historical_refinement_executor_v27"

          fixture = readiness._linked_fixture_chain()["g15_prepared_normalized_identity"]
          assert fixture["actual_outcomes_used"] is False
          assert fixture["random_shuffle_used"] is False
          assert fixture["blind_forecasts_immutable"] is True
          assert fixture["may_update_ng_brain"] is False
          assert fixture["execution_authority"] is False
          assert fixture["cme_event_contracts_mode"] == "SHADOW"
          assert fixture["brokerage_contract"] == "tastytrade_not_ibkr"
          assert fixture["options_lane_started"] is False
          PY

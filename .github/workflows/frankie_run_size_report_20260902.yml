name: Frankie run size report 20260902

# WHICH CALCULATION IS THE SIZE. A finished traversal writes calculation_result.json to S3,
# and an interactive session resolves no AWS credentials - they are GitHub-secret scoped -
# so only a workflow can read it back. This is that workflow.
#
# It renders nothing itself. The table comes from
# research/kalshi/frankie_raw_mbo_benchmark/report_ledger_size.py, which has tests, because
# the rendering is exactly where a SAMPLED per-field number is most likely to be presented
# as an exact one and a drop decision taken off it.
#
# Nothing here recommends dropping anything. D60: a row is USED, or RETAINED and counted, or
# REFUSED loudly, and what to drop is discussed first. This says only what each thing costs.

on:
  # A workflow carrying only workflow_dispatch is never registered on a non-default branch
  # and the dispatch API returns 404 for it. This one is read-only in every branch of its
  # logic - it downloads a result and renders a table - so a push firing it is harmless and
  # is in fact the fastest way to get the answer.
  push:
    branches:
      - chatgpt/frankie-raw-mbo-benchmark-20260828
    paths:
      - '.github/workflows/frankie_run_size_report_20260902.yml'
      - 'research/kalshi/frankie_raw_mbo_benchmark/report_ledger_size.py'
      - 'research/kalshi/frankie_raw_mbo_benchmark/verify_ledger_size_witness.py'
  workflow_dispatch:
    inputs:
      prefix:
        description: >-
          S3 prefix of the run to report on, WITHOUT the bucket, e.g.
          nymex/ng_mbo_5y_v0/frankie/raw_mbo_benchmark/a-clean/full/<sha>/<run>-<attempt>.
          Leave empty to report on the most recently modified calculation_result.json under
          the a-clean tree, which is the usual case right after a run.
        type: string
        default: ''
      run_id:
        description: >-
          The GitHub run id to report on, e.g. 33596898227, resolved by scanning the tree for
          a prefix containing it so the commit sha in the key does not have to be known. The
          literal word `newest` takes the most recently modified result instead. Ignored when
          `prefix` is given.
        type: string
        default: ''

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: us-east-2
  AWS_REGION: us-east-2
  S3_ENDPOINT_URL: https://s3.us-east-2.amazonaws.com
  BUCKET: bento-568968024170-us-east-2-an
  ROOT_PREFIX: nymex/ng_mbo_5y_v0/frankie/raw_mbo_benchmark/a-clean

jobs:
  size-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      WANTED_PREFIX: ${{ inputs.prefix || '' }}
      WANTED_RUN_ID: ${{ inputs.run_id || '33596898227' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Locate the run and fetch its result
        shell: bash
        run: |
          set -euo pipefail
          # THE DEFAULT IS A PINNED RUN, NOT THE NEWEST ONE. Taking the newest was the
          # first thing this workflow got wrong live: it reported CONFIRMED against a
          # push-CI canary at 33599514613 rather than the 50,001-record run 33596898227
          # whose per-record figure is the open question. `newest` is still reachable, but
          # it now has to be asked for by name.
          if [ -n "$WANTED_PREFIX" ]; then
            key="$WANTED_PREFIX/calculation_result.json"
          elif [ "$WANTED_RUN_ID" = "newest" ]; then
            # Chosen by S3's own LastModified rather than by sorting key names: a run id
            # sorts lexically, not chronologically, so the newest run is not reliably the
            # last name in the list.
            key="$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$ROOT_PREFIX" \
              --query "reverse(sort_by(Contents[?ends_with(Key, 'calculation_result.json')], &LastModified))[0].Key" \
              --output text)"
          else
            # A named run, found by SCANNING rather than by constructing the key: the prefix
            # carries the commit sha as well as the run id, and guessing the sha is how a
            # deterministic lookup turns into a 404 that reads as a missing run.
            key="$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$ROOT_PREFIX" \
              --query "Contents[?ends_with(Key, 'calculation_result.json')].Key" \
              --output text | tr '\t' '\n' | grep "/${WANTED_RUN_ID}-" | head -1)"
          fi
          test -n "$key"
          test "$key" != "None"
          printf 'reporting on s3://%s/%s\n' "$BUCKET" "$key"
          aws s3 cp "s3://${BUCKET}/${key}" ./calculation_result.json \
            --endpoint-url "$S3_ENDPOINT_URL" --only-show-errors
          echo "RESULT_KEY=$key" >> "$GITHUB_ENV"

      - name: List what S3 itself holds for this run
        shell: bash
        run: |
          set -euo pipefail
          # THE INDEPENDENT WITNESS. Every size figure so far has been the sink counting its
          # own writes. S3 recorded a length for each object at PUT time, with no stake in
          # the answer, and this is that reading. Paginated by the CLI, keyed and sized only -
          # nothing here downloads a ledger.
          prefix="${RESULT_KEY%/calculation_result.json}"
          printf 'witnessing s3://%s/%s\n' "$BUCKET" "$prefix"
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$prefix" \
            --query 'Contents[].{Key:Key,Size:Size}' --output json > ./s3_listing.json
          python3 - <<'MAP' > ./s3_objects.json
          import json
          rows = json.load(open("s3_listing.json")) or []
          print(json.dumps({r["Key"]: int(r["Size"]) for r in rows}))
          MAP
          echo "RUN_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Download the smallest ledger for a content witness
        shell: bash
        run: |
          set -euo pipefail
          # A size witness proves LENGTH. It says nothing about whether the bytes are the rows
          # the traversal reconciled, and the receipt carries a sha256 that can settle that.
          # Only the smallest uncompressed ledger is fetched, and only under a cap, because
          # the point is a content check rather than a transfer of twelve gigabytes.
          read -r ledger key < <(python3 - <<'PICK' || true
          import json
          from pathlib import PurePosixPath
          objects = json.load(open("s3_objects.json"))
          result = json.load(open("calculation_result.json"))
          receipts = result.get("ledger_retention") or {}
          by_name = {PurePosixPath(str(r.get("path") or "")).name: n for n, r in receipts.items()}
          CAP = 512 * 1024 * 1024
          best = None
          for key, size in objects.items():
              name = PurePosixPath(key).name
              if name in by_name and size <= CAP and (best is None or size < best[2]):
                  best = (by_name[name], key, size)
          print(f"{best[0]} {best[1]}" if best else " ")
          PICK
          )
          if [ -z "${ledger:-}" ] || [ -z "${key:-}" ]; then
            echo "no uncompressed ledger under the cap; the content witness is skipped and"
            echo "the size witness stands alone - stated rather than silently omitted"
            echo "CONTENT_WITNESS=" >> "$GITHUB_ENV"
            exit 0
          fi
          aws s3 cp "s3://${BUCKET}/${key}" ./content_witness.jsonl \
            --endpoint-url "$S3_ENDPOINT_URL" --only-show-errors
          digest="$(sha256sum ./content_witness.jsonl | cut -d' ' -f1)"
          rm -f ./content_witness.jsonl
          printf 'content witness: %s = %s\n' "$ledger" "$digest"
          echo "CONTENT_WITNESS=${ledger}=${digest}" >> "$GITHUB_ENV"

      - name: Witness the size against S3, and refuse a per-record figure without both halves
        shell: bash
        run: |
          set -euo pipefail
          # Runs BEFORE the self-reported table, so the witness cannot be read as a footnote
          # to a number the reader has already accepted.
          args=(--result ./calculation_result.json --objects ./s3_objects.json
                --summary "$GITHUB_STEP_SUMMARY" --output ./LEDGER_SIZE_WITNESS.md)
          if [ -n "${CONTENT_WITNESS:-}" ]; then
            args+=(--observed-sha256 "$CONTENT_WITNESS")
          fi
          set +e
          python3 -m research.kalshi.frankie_raw_mbo_benchmark.verify_ledger_size_witness "${args[@]}"
          code=$?
          set -e
          cat ./LEDGER_SIZE_WITNESS.md || echo 'no witness file was written'
          # The self-reported table is rendered whatever the witness says - a contradicted run
          # is exactly when both figures need to be visible side by side - but the job's own
          # verdict is the witness's, recorded here and applied after the table.
          echo "WITNESS_EXIT=$code" >> "$GITHUB_ENV"

      - name: Render the size table
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Run: \`s3://${BUCKET}/${RESULT_KEY}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -m research.kalshi.frankie_raw_mbo_benchmark.report_ledger_size \
            --result ./calculation_result.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --output ./LEDGER_SIZE_TABLE.md

      - name: Publish the table and the result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frankie-size-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            LEDGER_SIZE_TABLE.md
            LEDGER_SIZE_WITNESS.md
            calculation_result.json
            s3_objects.json
          if-no-files-found: error
          retention-days: 30

      - name: The witness decides the verdict
        shell: bash
        run: |
          set -euo pipefail
          # 0 CONFIRMED, 1 CONTRADICTED, 2 WITNESS_UNAVAILABLE. Two is red on purpose: item
          # zero is then still open, and a green run would be read as having settled it.
          printf 'witness exit code: %s\n' "$WITNESS_EXIT"
          exit "$WITNESS_EXIT"

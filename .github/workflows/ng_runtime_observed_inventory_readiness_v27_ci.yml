name: NG runtime-observed inventory readiness v27

on:
  push:
    paths:
      - "research/kalshi/ng_corpus_inventory_finalization_contract.py"
      - "research/kalshi/ng_corpus_s3_paginated_inventory_capture.py"
      - "research/kalshi/ng_corpus_s3_runtime_observed_inventory_capture.py"
      - "research/kalshi/ng_historical_refinement_readiness_v27.py"
      - "research/kalshi/ng_historical_refinement_executor_v23.py"
      - "research/kalshi/tests/test_ng_corpus_s3_runtime_observed_inventory_capture.py"
      - "research/kalshi/tests/test_ng_runtime_observed_inventory_readiness_v27.py"
      - ".github/workflows/ng_runtime_observed_inventory_readiness_v27_ci.yml"
  pull_request:
    paths:
      - "research/kalshi/ng_corpus_inventory_finalization_contract.py"
      - "research/kalshi/ng_corpus_s3_paginated_inventory_capture.py"
      - "research/kalshi/ng_corpus_s3_runtime_observed_inventory_capture.py"
      - "research/kalshi/ng_historical_refinement_readiness_v27.py"
      - "research/kalshi/ng_historical_refinement_executor_v23.py"
      - "research/kalshi/tests/test_ng_corpus_s3_runtime_observed_inventory_capture.py"
      - "research/kalshi/tests/test_ng_runtime_observed_inventory_readiness_v27.py"
      - ".github/workflows/ng_runtime_observed_inventory_readiness_v27_ci.yml"

jobs:
  runtime-observed-inventory-v27:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile runtime-observed inventory chain
        run: |
          python -m py_compile \
            ng_corpus_inventory_finalization_contract.py \
            ng_corpus_s3_paginated_inventory_capture.py \
            ng_corpus_s3_runtime_observed_inventory_capture.py \
            ng_historical_refinement_readiness_v27.py \
            ng_historical_refinement_executor_v23.py \
            tests/test_ng_corpus_s3_runtime_observed_inventory_capture.py \
            tests/test_ng_runtime_observed_inventory_readiness_v27.py
      - name: Run upstream and v27 self-tests
        run: |
          python ng_corpus_inventory_finalization_contract.py selftest
          python ng_corpus_s3_paginated_inventory_capture.py selftest
          python ng_corpus_s3_runtime_observed_inventory_capture.py selftest
          python ng_historical_refinement_readiness_v27.py --selftest
      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/test_ng_corpus_s3_runtime_observed_inventory_capture.py \
            tests/test_ng_runtime_observed_inventory_readiness_v27.py
      - name: Verify runtime chronology and authority wall
        run: |
          python - <<'PY'
          import ng_corpus_s3_runtime_observed_inventory_capture as capture
          import ng_historical_refinement_executor_v23 as executor
          import ng_historical_refinement_readiness_v27 as readiness

          keys = [spec.key for spec in readiness.STAGES]
          assert keys[:5] == [
              "corpus_expected_day_contract",
              "corpus_inventory_finalization_contract",
              "corpus_s3_latest_version_resolution",
              "corpus_s3_inventory_capture",
              "corpus_s3_materialization",
          ]
          assert readiness.STAGES[3].filename == (
              "ng_corpus_s3_runtime_observed_inventory_capture_attestation.json"
          )
          assert executor.SUGGESTED_ENTRYPOINTS["corpus_s3_inventory_capture"] == (
              "python",
              "ng_corpus_s3_runtime_observed_inventory_capture.py",
              "capture",
          )
          receipt = {
              "actual_outcomes_used": False,
              "paid_live_data_assumed": False,
              "random_shuffle_used": False,
              "one_signal_authority_preserved": True,
              "blind_forecasts_immutable": True,
              "may_change_blind_forecast": False,
              "may_change_posterior": False,
              "may_update_ng_brain": False,
              "execution_authority": False,
              "cme_event_contracts_mode": "SHADOW",
              "brokerage_contract": "tastytrade_not_ibkr",
              "options_lane_started": False,
          }
          capture._authority(receipt, label="CI authority wall")
          PY

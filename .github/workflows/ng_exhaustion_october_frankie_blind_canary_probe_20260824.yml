name: Probe running blind October Frankie V4 canary 20260824

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-october-sharded-20260824
    paths:
      - research/kalshi/NG_EXHAUSTION_OCTOBER_FRANKIE_BLIND_CANARY_PROBE_20260824.json

permissions:
  contents: read

concurrency:
  group: ng-exhaustion-october-frankie-blind-canary-probe-20260824
  cancel-in-progress: false

jobs:
  probe-existing-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      INSTANCE_ID: i-08cee7171c0a76a04
      UNIT: ng-exhaustion-frankie-october-blind-dcf839e911c5
      RUN_ROOT: /mnt/markets/ng_exhaustion_frankie_october_blind_20260824/dcf839e911c5d501396fa7af9d6692012fb6e0d9
    steps:
      - name: Capture bounded observability snapshot from the running unit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shlex

          unit = os.environ["UNIT"]
          root = os.environ["RUN_ROOT"]
          commands = [
              "set -euo pipefail",
              f"unit={shlex.quote(unit)}",
              f"root={shlex.quote(root)}",
              'echo PROBED_SYSTEMD_UNIT="$unit"',
              'echo PERMANENT_FRANKIE_STATE="$(systemctl is-active markets-frankie.service 2>/dev/null || true)"',
              'systemctl show "$unit" --property=LoadState,ActiveState,SubState,Result,MainPID,ExecMainStatus,MemoryCurrent,CPUUsageNSec --no-pager || true',
              'pid="$(systemctl show "$unit" --property=MainPID --value 2>/dev/null || true)"',
              'echo MAIN_PID="$pid"',
              'if [ -n "$pid" ] && [ "$pid" != 0 ] && [ -d "/proc/$pid" ]; then',
              '  ps -o pid,ppid,etime,time,%cpu,%mem,rss,vsz,stat,wchan:28,cmd -p "$pid" --forest',
              '  for child in $(pgrep -P "$pid" || true); do ps -o pid,ppid,etime,time,%cpu,%mem,rss,vsz,stat,wchan:28,cmd -p "$child"; done',
              '  sed -n "1,40p" "/proc/$pid/status"',
              '  cat "/proc/$pid/io"',
              '  ls -l "/proc/$pid/fd" 2>/dev/null | tail -40 || true',
              '  python_pid="$(pgrep -P "$pid" -f ng_exhaustion_october_frankie_v4_bridge | head -1 || true)"',
              '  echo PYTHON_PID="$python_pid"',
              '  for sample in 1 2; do',
              '    echo IO_SAMPLE="$sample"',
              '    ps -o pid,ppid,etime,time,%cpu,%mem,rss,vsz,stat,wchan:28,cmd -p "$python_pid"',
              '    cat "/proc/$python_pid/io"',
              '    for fd in /proc/$python_pid/fd/*; do target="$(readlink "$fd" 2>/dev/null || true)"; case "$target" in *.dbn.zst|/tmp/*) echo FD="${fd##*/}" TARGET="$target"; sed -n "1,8p" "/proc/$python_pid/fdinfo/${fd##*/}";; esac; done',
              '    [ "$sample" = 1 ] && sleep 10',
              '  done',
              'fi',
              'find "$root" -maxdepth 3 -type f -printf "%s %TY-%Tm-%TdT%TH:%TM:%TS %p\\n" | sort -n | tail -80',
              'journalctl -u "$unit" -n 240 --no-pager || true',
              'echo OBSERVABILITY_SNAPSHOT=COMPLETE',
          ]
          with open("/tmp/blind-october-frankie-probe-params.json", "w", encoding="utf-8") as handle:
              json.dump({"commands": ["/bin/bash -lc " + shlex.quote("\n".join(commands))]}, handle)
          PY
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Observe running blind October V4 Frankie" \
            --parameters file:///tmp/blind-october-frankie-probe-params.json \
            --timeout-seconds 180 \
            --query 'Command.CommandId' --output text)"
          status=Pending
          for _ in $(seq 1 30); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|TimedOut|Cancelled) break ;; esac
            sleep 10
          done
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json | tee /tmp/blind-october-frankie-probe-result.json
          test "$status" = Success
          grep -F 'OBSERVABILITY_SNAPSHOT=COMPLETE' /tmp/blind-october-frankie-probe-result.json

      - name: Publish probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blind-october-frankie-probe-${{ github.sha }}
          path: /tmp/blind-october-frankie-probe-result.json
          if-no-files-found: warn

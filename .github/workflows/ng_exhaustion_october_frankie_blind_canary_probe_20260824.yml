name: Probe running blind October Frankie V4 canary 20260824

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-october-sharded-20260824
    paths:
      - research/kalshi/NG_EXHAUSTION_OCTOBER_FRANKIE_BLIND_CANARY_PROBE_20260824.json

permissions:
  contents: read

concurrency:
  group: ng-exhaustion-october-frankie-blind-canary-probe-20260824
  cancel-in-progress: false

jobs:
  probe-existing-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      INSTANCE_ID: i-08cee7171c0a76a04
      UNIT: ng-exhaustion-frankie-october-blind-dcf839e911c5
      RUN_ROOT: /mnt/markets/ng_exhaustion_frankie_october_blind_20260824/dcf839e911c5d501396fa7af9d6692012fb6e0d9
    steps:
      - name: Observe existing unit through first accepted Sol response
        id: observe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shlex

          unit = os.environ["UNIT"]
          root = os.environ["RUN_ROOT"]
          commands = [
              "set -u",
              f"unit={shlex.quote(unit)}",
              f"root={shlex.quote(root)}",
              'echo PROBED_SYSTEMD_UNIT="$unit"',
              'echo PERMANENT_FRANKIE_STATE="$(systemctl is-active markets-frankie.service 2>/dev/null || true)"',
              'echo UNIT_STATE="$(systemctl is-active "$unit" 2>/dev/null || true)"',
              'systemctl show "$unit" --property=LoadState,ActiveState,SubState,Result,MainPID,ExecMainStatus,MemoryCurrent,CPUUsageNSec --no-pager || true',
              'pid="$(systemctl show "$unit" --property=MainPID --value 2>/dev/null || true)"',
              'echo MAIN_PID="$pid"',
              'if [ -n "$pid" ] && [ "$pid" != 0 ] && [ -d "/proc/$pid" ]; then',
              '  python_pid="$(pgrep -P "$pid" -f ng_exhaustion_october_frankie_v4_bridge | head -1 || true)"',
              '  echo PYTHON_PID="$python_pid"',
              '  if [ -n "$python_pid" ] && [ -d "/proc/$python_pid" ]; then',
              '    ps -o pid,ppid,etime,time,%cpu,%mem,rss,vsz,stat,wchan:28,cmd -p "$python_pid"',
              '    cat "/proc/$python_pid/io"',
              '    for fd in /proc/$python_pid/fd/*; do target="$(readlink "$fd" 2>/dev/null || true)"; case "$target" in *.dbn.zst|/tmp/*) echo FD="${fd##*/}" TARGET="$target"; sed -n "1,8p" "/proc/$python_pid/fdinfo/${fd##*/}";; esac; done',
              '  fi',
              'fi',
              'journalctl -u "$unit" -o cat --no-pager | grep -E "V4_GROUPS_PROCESSED|SOL_INVOCATION_STARTED|SOL_RESPONSE_ACCEPTED|BLIND_OCTOBER_FRANKIE_EXIT_CODE|Traceback" | tail -24 || true',
              'echo OBSERVABILITY_HEARTBEAT=COMPLETE',
          ]
          with open("/tmp/blind-october-frankie-probe-params.json", "w", encoding="utf-8") as handle:
              json.dump({"commands": ["/bin/bash -lc " + shlex.quote("\n".join(commands))]}, handle)
          PY

          : > /tmp/blind-october-frankie-probe-result.txt
          for attempt in $(seq 1 60); do
            echo "OBSERVER_ATTEMPT=$attempt"
            command_id="$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Observe running blind October V4 Frankie" \
              --parameters file:///tmp/blind-october-frankie-probe-params.json \
              --timeout-seconds 45 \
              --query 'Command.CommandId' --output text)"
            status=Pending
            for _ in $(seq 1 12); do
              status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
              case "$status" in Success|Failed|TimedOut|Cancelled) break ;; esac
              sleep 5
            done
            output="$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query StandardOutputContent --output text)"
            printf '%s\n' "$output" | tee -a /tmp/blind-october-frankie-probe-result.txt
            if printf '%s\n' "$output" | grep -Fq '"event": "SOL_RESPONSE_ACCEPTED"'; then
              accepted="$(printf '%s\n' "$output" | grep -F '"event": "SOL_RESPONSE_ACCEPTED"' | tail -1)"
              ACCEPTED_LINE="$accepted" python - <<'PY'
          import json
          import os

          row = json.loads(os.environ["ACCEPTED_LINE"])
          if row.get("event") != "SOL_RESPONSE_ACCEPTED":
              raise SystemExit("unexpected evidence event")
          if row.get("model") != "gpt-5.6-sol":
              raise SystemExit(f"unexpected resolved model: {row.get('model')!r}")
          if not str(row.get("provider_request_id") or "").strip():
              raise SystemExit("missing provider request id")
          print("AUTHENTIC_SOL_PROVIDER_RESPONSE=ACCEPTED")
          print("PROVIDER_REQUEST_ID=" + str(row["provider_request_id"]))
          PY
              echo "run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! printf '%s\n' "$output" | grep -Fq 'UNIT_STATE=active'; then
              echo "Existing canary unit stopped before an accepted Sol response" >&2
              exit 1
            fi
            sleep 60
          done
          echo "Observer timed out while the existing canary remained active" >&2
          exit 1

      - name: Publish probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blind-october-frankie-probe-${{ github.sha }}
          path: /tmp/blind-october-frankie-probe-result.txt
          if-no-files-found: warn

      - name: Report live observer
        if: always()
        shell: bash
        run: |
          {
            echo "### Blind October Frankie V4 observer"
            echo "- Live run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Existing unit: ${UNIT}"
            echo "- Launch commit: dcf839e911c5d501396fa7af9d6692012fb6e0d9"
            echo "- Evidence gate: authentic gpt-5.6-sol provider response ID"
          } >> "$GITHUB_STEP_SUMMARY"

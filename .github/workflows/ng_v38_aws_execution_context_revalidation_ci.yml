name: NG v38 AWS execution context revalidation

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - research/kalshi/ng_v38_external_runtime_dependency_revalidation_gate.py
      - research/kalshi/ng_v38_aws_execution_context_revalidation_gate.py
      - research/kalshi/ng_historical_refinement_preflight_v35.py
      - research/kalshi/ng_historical_refinement_preflight_v36.py
      - research/kalshi/tests/test_ng_v38_aws_execution_context_revalidation.py
      - .github/workflows/ng_v38_aws_execution_context_revalidation_ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aws-execution-context-revalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest

      - name: Compile AWS execution-context boundary
        working-directory: research/kalshi
        run: |
          python -m py_compile \
            ng_v38_external_runtime_dependency_revalidation_gate.py \
            ng_v38_aws_execution_context_revalidation_gate.py \
            ng_historical_refinement_preflight_v35.py \
            ng_historical_refinement_preflight_v36.py \
            tests/test_ng_v38_aws_execution_context_revalidation.py

      - name: Run focused AWS execution-context tests
        working-directory: research/kalshi
        run: pytest -q tests/test_ng_v38_aws_execution_context_revalidation.py

      - name: Verify AWS identity boundary and permanent authority wall
        working-directory: research/kalshi
        run: |
          python - <<'PY'
          import inspect
          import ng_historical_refinement_preflight_v36 as preflight
          import ng_v38_aws_execution_context_revalidation_gate as gate

          gate_text = inspect.getsource(gate)
          preflight_text = inspect.getsource(preflight)
          assert "sts_caller_identity_revalidated" in gate_text
          assert "aws_account_bound_to_expected_account" in gate_text
          assert "aws_region_bound_to_expected_region" in gate_text
          assert "custom AWS endpoint configuration is forbidden" in gate_text
          assert "credential_values_recorded" in gate_text
          assert "runtime_aws_context_revalidation_at_executor_delegation" in preflight_text
          assert "guarded_runner" in preflight_text
          text = gate_text + preflight_text
          assert '"cme_event_contracts_mode": "SHADOW"' in text
          assert '"brokerage_contract": "tastytrade_not_ibkr"' in text
          assert '"options_lane_started": False' in text
          assert '"may_update_ng_brain": False' in text
          assert '"random_shuffle_used": False' in text
          PY

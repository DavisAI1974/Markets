name: S126 Frankie AWS Stage Invariant

on:
  push:
    branches:
      - chatgpt/burn-hh-12m-s125
    paths:
      - research/kalshi/frankie_aws_stage_s126.py
      - research/kalshi/frankie_s114_separation_metadata_s126.py
      - research/kalshi/tests/test_frankie_aws_stage_s126.py
      - research/kalshi/tests/test_frankie_s114_separation_metadata_s126.py
      - .github/workflows/frankie_aws_stage_s126_ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aws-stage-invariant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependency
        run: pip install --quiet pytest
      - name: Compile AWS staging and S114 metadata preflights
        run: |
          python -m py_compile research/kalshi/frankie_aws_stage_s126.py
          python -m py_compile research/kalshi/frankie_s114_separation_metadata_s126.py
      - name: Test fail-closed weather, metadata and causal-slice invariants
        run: |
          python -m pytest -q \
            research/kalshi/tests/test_frankie_aws_stage_s126.py \
            research/kalshi/tests/test_frankie_s114_separation_metadata_s126.py
      - name: Prove recovery reuses existing S114 and canonical staging paths
        env:
          PYTHONPATH: research/kalshi
        run: |
          python - <<'PY'
          import inspect
          from pathlib import Path
          import frankie_aws_stage_s126 as s
          import frankie_s114_separation_metadata_s126 as sep

          src = inspect.getsource(s.stage_for_aws)
          restore_src = Path('research/kalshi/restore_substrate.py').read_text(encoding='utf-8')
          sep_src = inspect.getsource(sep)
          assert 'restore_substrate.py' in src
          assert 'build_causal_slices.py' in src
          assert 'stage_group.py' in restore_src
          assert '"--group" in sys.argv' in restore_src
          assert 'grp{gid[1:]}_state_blind_s114.json' in src
          assert 'weather_forcing_forecast' in inspect.getsource(s.validate_served_forcing)
          assert 'wind_cf_proxy' in sep_src and 'solar_irradiance_proxy' in sep_src
          assert 'served_separately' in sep_src
          assert 'platform_sync.py' in sep_src
          assert 'verify_s3_readback' in sep_src
          print('PASS: S114 recovery keeps strict verifier; metadata repair can only label already-separate non-null proxies')
          PY

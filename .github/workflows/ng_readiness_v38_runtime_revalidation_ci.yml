name: NG v38 runtime command revalidation

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - research/kalshi/ng_v38_execution_runtime_revalidation_gate.py
      - research/kalshi/ng_historical_refinement_preflight_v32.py
      - research/kalshi/ng_corpus_executor_plan_compiler_v31.py
      - research/kalshi/ng_corpus_executor_pipeline_arm_v31.py
      - research/kalshi/ng_v38_execution_command_contract_gate.py
      - research/kalshi/ng_v38_execution_command_lineage_gate.py
      - research/kalshi/tests/test_ng_readiness_v38_runtime_revalidation.py
      - .github/workflows/ng_readiness_v38_runtime_revalidation_ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-revalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest

      - name: Compile runtime revalidation sources
        working-directory: research/kalshi
        run: |
          python -m py_compile \
            ng_corpus_executor_plan_compiler_v31.py \
            ng_corpus_executor_pipeline_arm_v31.py \
            ng_historical_refinement_preflight_v31.py \
            ng_historical_refinement_preflight_v32.py \
            ng_v38_execution_command_contract_gate.py \
            ng_v38_execution_command_lineage_gate.py \
            ng_v38_execution_runtime_revalidation_gate.py \
            tests/test_ng_readiness_v38_runtime_revalidation.py

      - name: Run focused runtime revalidation tests
        working-directory: research/kalshi
        run: pytest -q tests/test_ng_readiness_v38_runtime_revalidation.py

      - name: Verify TOCTOU and permanent authority wall
        working-directory: research/kalshi
        run: |
          python - <<'PY'
          import inspect
          import ng_historical_refinement_preflight_v32 as preflight
          import ng_v38_execution_runtime_revalidation_gate as gate

          gate_text = inspect.getsource(gate)
          preflight_text = inspect.getsource(preflight)
          assert "verify_files=True" in gate_text
          assert "verify_runtime_contract=verify_runtime" in gate_text
          assert "runtime_help_probes_reexecuted" in gate_text
          assert "runtime_script_bytes_rehashed" in gate_text
          assert "runtime_command_lineage_reconstructed" in gate_text
          assert "runtime_revalidation_immediately_before_execution" in preflight_text
          text = gate_text + preflight_text
          assert '"cme_event_contracts_mode": "SHADOW"' in text
          assert '"brokerage_contract": "tastytrade_not_ibkr"' in text
          assert '"options_lane_started": False' in text
          assert '"may_update_ng_brain": False' in text
          assert '"random_shuffle_used": False' in text
          PY

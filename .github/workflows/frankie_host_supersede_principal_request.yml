name: Frankie supersede a cycle's rendered principal request on the native host (move aside, receipted)
# Greg, 2026-09-20: the run-findings ledger enters cycle 0's prompt, so its rendered prompt.md and durable
# session-request.json are moved aside (never deleted) with sha256 in a receipt, and the pipeline renders
# the request again. Pairs with frankie_host_declare_identity_supersede.yml (supersede_principal=true),
# which lets the coordinator supersede the saved attachment and intent stages. Refuses when a response
# is recorded or a runner is alive. Dispatch only.
on:
  workflow_dispatch:
    inputs:
      cycle_index:
        description: 'Zero-padded cycle index'
        required: false
        default: '00'
      reason:
        description: 'Why (goes into the receipt; no apostrophes)'
        required: true
      instance:
        description: 'Native host instance id'
        required: false
        default: 'i-0e90ee6110ef609aa'
      day:
        description: 'Day whose run directory holds the cycle'
        required: false
        default: '20211003'
      run_root:
        description: 'Day pipeline RunRoot on the host'
        required: false
        default: 'C:/Codex/Frankie-BOSS-20260919/days'
permissions:
  contents: read
jobs:
  supersede:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97
      - name: Supersede the rendered principal request over SSM
        env:
          INSTANCE: ${{ inputs.instance }}
          DAY: ${{ inputs.day }}
          RUN_ROOT: ${{ inputs.run_root }}
          CYCLE_INDEX: ${{ inputs.cycle_index }}
          REASON: ${{ inputs.reason }}
        run: |
          python deploy/aws/ssm_run_ps1.py \
            --instance "$INSTANCE" --region us-east-2 \
            --script deploy/aws/host/frankie_host_supersede_principal_request.ps1 \
            --set "Day=$DAY" \
            --set "RunRoot=$RUN_ROOT" \
            --set "CycleIndex=$CYCLE_INDEX" \
            --set "Reason=$REASON" \
            --timeout 600 --tail 0 --comment "supersede the cycle $CYCLE_INDEX principal request for day $DAY"

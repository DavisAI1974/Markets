          active = paired.get("active_provisional_components")
          if not isinstance(active, list) or set(active) != expected_active or len(active) != 7:
              print("the seven lawful provisional components are not all active", file=sys.stderr)
              raise SystemExit(1)
          active_receipts = paired.get("active_provisional_component_receipt_hashes")
          if not isinstance(active_receipts, dict) or set(active_receipts) != expected_active:
              print("active provisional component receipts are incomplete", file=sys.stderr)
              raise SystemExit(1)
          if any(not sha_pattern.fullmatch(str(value or "")) for value in active_receipts.values()):
              print("active provisional component receipt hash is invalid", file=sys.stderr)
              raise SystemExit(1)
          meta_loop = paired.get("deferred_meta_loop")
          if not isinstance(meta_loop, dict) or (
              meta_loop.get("component_id") != "META_LOOP"
              or meta_loop.get("status") != "DEFERRED_NOT_YET_LAWFUL"
              or meta_loop.get("lifecycle_stage") != "POST_EVIDENCE_DIAGNOSTIC"
              or meta_loop.get("executed_stage") != "PRE_REVEAL_PREFIX"
              or not sha_pattern.fullmatch(str(meta_loop.get("receipt_hash") or ""))
          ):
              print("META_LOOP was not explicitly deferred to post-evidence", file=sys.stderr)
              raise SystemExit(1)

          control_ledger = paired.get("control_ledger")
          combined_ledger = paired.get("combined_ledger")
          if not isinstance(control_ledger, dict) or not isinstance(combined_ledger, dict):
              print("paired independent ledger receipts are missing", file=sys.stderr)
              raise SystemExit(1)
          if control_ledger.get("path") == combined_ledger.get("path"):
              print("control and combined ledgers are not independent", file=sys.stderr)
              raise SystemExit(1)
          if not control_ledger.get("path") or not combined_ledger.get("path"):
              print("lane ledger path is blank", file=sys.stderr)
              raise SystemExit(1)
          if control_ledger.get("lane_id") != "S135_CONTROL":
              print("control ledger lane identity drift", file=sys.stderr)
              raise SystemExit(1)
          if combined_ledger.get("lane_id") != "FULL_PROVISIONAL_COMBINED":
              print("combined ledger lane identity drift", file=sys.stderr)
              raise SystemExit(1)
          if paired.get("control_lock_authority") != "S135_PRIMARY":
              print("control lock authority drift", file=sys.stderr)
              raise SystemExit(1)
          if paired.get("combined_lock_authority") != "SHADOW_ONLY":
              print("combined lock authority drift", file=sys.stderr)
              raise SystemExit(1)
          if not sha_pattern.fullmatch(str(control_ledger.get("control_final_ledger_hash") or "")):
              print("invalid control final ledger hash", file=sys.stderr)
              raise SystemExit(1)
          if not sha_pattern.fullmatch(str(combined_ledger.get("combined_final_ledger_hash") or "")):
              print("invalid combined final ledger hash", file=sys.stderr)
              raise SystemExit(1)
          if control_ledger["control_final_ledger_hash"] == combined_ledger["combined_final_ledger_hash"]:
              print("paired lane ledgers did not diverge under isolated lane tags", file=sys.stderr)
              raise SystemExit(1)
          for lane_name, ledger in (("control", control_ledger), ("combined", combined_ledger)):
              receipts = ledger.get("first_receipt_hashes")
              if not isinstance(receipts, dict):
                  print(f"{lane_name} first receipt map is missing", file=sys.stderr)
                  raise SystemExit(1)
              for receipt_name in ("helper_evidence", "frankie_reasoning", "probability_movie"):
                  if not sha_pattern.fullmatch(str(receipts.get(receipt_name) or "")):
                      print(f"missing {lane_name} {receipt_name} receipt_hash", file=sys.stderr)
                      raise SystemExit(1)

          if str(paired.get("knowledge_manifest_hash") or "") != knowledge["knowledge_manifest_hash"]:
              print("paired prefix knowledge manifest drift", file=sys.stderr)
              raise SystemExit(1)
          summary = {
              "event": "FULLSTACK_LAUNCH_GATES_PASS",
              "knowledge_manifest_hash": knowledge["knowledge_manifest_hash"],
              "model": paired["model"],
              "identical_prefix_proof_hash": proof_hash,
              "control_provider_response_ids": control_ids,
              "combined_provider_response_ids": combined_ids,
              "decision_state_snapshot_hash": control_snapshot,
              "schema_registered_count": decision_state["schema_registered_count"],
              "registered_block_count": decision_state["registered_block_count"],
              "present_count": present_count,
              "explicit_null_count": explicit_null_count,
              "unavailable_count": unavailable_count,
              "causal_quarantine_count": causal_quarantine_count,
              "same_day_realized_weather_present_count": weather_present_count,
              "availability_matrix_hash": matrix_hash,
              "availability_matrix_block_count": matrix_count,
              "availability_audit_hash": audit_hash,
              "provider_tool_call_counts": {
                  lane: provider_tools[lane]["call_count"] for lane in expected_lanes
              },
              "helper_cpu_mapping_version": mapping_version,
              "helper_role_cpu_map": expected_role_cpu_map,
              "provider_process_effective_affinity": [0, 1, 2, 3],
              "helper_receipt_hashes": helper_receipt_hashes,
              "helper_native_thread_ids": helper_native_thread_ids,
              "helper_batch_timings": helper_batch_timings,
              "october_replay_progress": october_replay_progress,
              "evidence_journal_head_hashes": journal_heads,
              "v4_governing_runtime_receipt_hash": governing["governing_runtime_receipt_hash"],
              "v4_governing_module_identity_hash": governing["module_identity_hash"],
              "step1_sealed": True,
          }
          print(json.dumps(summary, sort_keys=True))
          print("FULLSTACK_LAUNCH_GATES=PASS")
          '''

          runner_script = r'''#!/bin/bash
          set -euo pipefail
          cd __REPO__
          export PYTHONPATH=__REPO__
          export SOURCE_COMMIT=__SOURCE_COMMIT__
          venv_python=__VENV_PYTHON__
          run_log=__RUN_LOG__
          output=__OUTPUT__
          openai_credential_file=__OPENAI_CREDENTIAL_FILE__

          "$venv_python" -c 'import json, os, platform, sys; assert sys.implementation.name == "cpython" and sys.version_info[:2] == (3, 10) and platform.machine() == "x86_64"; effective = os.sched_getaffinity(0); assert effective == {0, 1, 2, 3}, f"provider unit CPU affinity drift: {sorted(effective)}"; print(json.dumps({"event": "PROVIDER_UNIT_CPU_AFFINITY_VERIFIED", "effective_cpu_affinity": sorted(effective), "python_version": list(sys.version_info[:3])}, sort_keys=True))'

          set +e
          set -a
          source "$openai_credential_file"
          set +a
          env \
            -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN \
            -u MARKETS_AWS_ACCESS_KEY_ID -u MARKETS_AWS_SECRET_ACCESS_KEY -u MARKETS_AWS_SESSION_TOKEN \
            "$venv_python" research/kalshi/ng_exhaustion_frankie_fullstack_october_20260824.py \
            --manifest research/kalshi/NG_EXHAUSTION_MBO_5Y_CANONICAL_OBJECT_MANIFEST_20260822.json \
            --source-root __STAGE__ \
            --output-root "$output" \
            --run-id __RUNNER_ID__ \
            2>&1 | tee "$run_log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '{"event":"FULLSTACK_RUNNER_EXIT","exit_code":%s}\n' "$rc" | tee -a "$run_log"
          exit "$rc"
          '''
          replacements = {
              "__OPENAI_CREDENTIAL_FILE__": shlex.quote(openai_credential_file),
              "__ROOT__": shlex.quote(root),
              "__REPO__": shlex.quote(repo),
              "__SOURCE_COMMIT__": shlex.quote(sha),
              "__RUN_LOG__": shlex.quote(run_log),
              "__OUTPUT__": shlex.quote(output),
              "__VENV_PYTHON__": shlex.quote(f"{root}/venv/bin/python"),
              "__ARTIFACT_URI__": shlex.quote(artifact_uri),
              "__STAGE__": shlex.quote(stage),
              "__RUNNER_ID__": shlex.quote(runner_id),
          }
          for old, new in replacements.items():
              runner_script = runner_script.replace(old, new)

          def encoded(value: str) -> str:
              return base64.b64encode(value.encode("utf-8")).decode("ascii")

          services = (
              "markets-frankie.service",
              "markets-frankie-reflect.service",
              "markets-frankie-reflect.timer",
              "markets-frankie-bounded-3mo.service",
          )
          commands = [
              "set -euo pipefail",
              "trap 'echo FULLSTACK_REMOTE_FAILED_COMMAND=\"$BASH_COMMAND\" >&2' ERR",
              f"root={shlex.quote(root)}",
              f"repo={shlex.quote(repo)}",
              f"stage={shlex.quote(stage)}",
              f"output={shlex.quote(output)}",
              f"package={shlex.quote(package)}",
              f"run_log={shlex.quote(run_log)}",
              f"unit={shlex.quote(unit)}",
              f"credential_file={shlex.quote(credential_file)}",
              f"aws_credential_file={shlex.quote(aws_credential_file)}",
              f"openai_credential_file={shlex.quote(openai_credential_file)}",
              f"artifact_uri={shlex.quote(artifact_uri)}",
              f"provider_user={shlex.quote('frk_' + sha[:8] + '_' + run_id)}",
              'runtime_python=/usr/bin/python3.10',
              'test -x "$runtime_python"',
              "\"$runtime_python\" -c 'import os, platform, sys; assert sys.implementation.name == \"cpython\"; assert sys.version_info[:2] == (3, 10); assert sys.implementation.cache_tag == \"cpython-310\"; assert platform.machine() == \"x86_64\"; available = os.sched_getaffinity(0); required = {0, 1, 2, 3}; assert required.issubset(available), f\"required CPUs 0-3 unavailable: {sorted(available)}\"'",
              'test ! -e "$root"',
              'test -s "$credential_file"',
              'install -d -m 0755 "$root" "$repo" "$output"',
              f"printf %s {shlex.quote(encoded(credential_scope_script))} | base64 -d > \"$root/scope_credentials.py\"",
              'chmod 700 "$root/scope_credentials.py"',
              '"$runtime_python" "$root/scope_credentials.py" "$credential_file" "$aws_credential_file" "$openai_credential_file"',
              'if ! grep -Eq "^(OPENAI_API_KEY|MARKETS_OPENAI_API_KEY)=" "$openai_credential_file"; then',
              '  ( set -a; source "$aws_credential_file"; set +a; unset OPENAI_API_KEY MARKETS_OPENAI_API_KEY;',
              '    openai_value="$(aws ssm get-parameter --name /markets/OPENAI_API_KEY --with-decryption --query Parameter.Value --output text)";',
              '    test -n "$openai_value"; printf "OPENAI_API_KEY=%q\\n" "$openai_value" >> "$openai_credential_file"; )',
              'fi',
              'chmod 600 "$aws_credential_file" "$openai_credential_file"',
              f"( set -a; source \"$aws_credential_file\"; set +a; unset OPENAI_API_KEY MARKETS_OPENAI_API_KEY; aws s3 cp {shlex.quote('s3://' + os.environ['BUCKET'] + '/' + os.environ['PACKAGE_KEY'])} \"$package\" --only-show-errors )",
              f"echo {shlex.quote(os.environ['PACKAGE_SHA256'] + '  ' + package)} | sha256sum -c -",
              'tar -xzf "$package" -C "$repo"',
              'chmod 0755 "$repo"',
              f"test -s \"$repo/research/kalshi/ng_exhaustion_frankie_fullstack_october_20260824.py\"",
              f"printf %s {shlex.quote(encoded(package_verify_script))} | base64 -d > \"$root/verify_package.py\"",
              'chmod 700 "$root/verify_package.py"',
              f'"$runtime_python" "$root/verify_package.py" "$repo" {shlex.quote(sha)}',
              'if id "$provider_user" >/dev/null 2>&1; then echo "dedicated provider identity already exists" >&2; exit 1; fi',
              'useradd --system --no-create-home --shell /usr/sbin/nologin "$provider_user"',
              'provider_group="$(id -gn "$provider_user")"',
              'install -d -o "$provider_user" -g "$provider_group" -m 0750 "$root/venv"',
              'env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN -u OPENAI_API_KEY -u MARKETS_OPENAI_API_KEY runuser -u "$provider_user" -- "$runtime_python" -m venv "$root/venv"',
              'env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN -u OPENAI_API_KEY -u MARKETS_OPENAI_API_KEY runuser -u "$provider_user" -- "$root/venv/bin/python" -m pip install --disable-pip-version-check --no-index --only-binary=:all: --find-links "$repo/deploy/wheelhouse" --require-hashes -r "$repo/deploy/aws/requirements-frankie-fullstack-20260824.lock"',
              f"export FULLSTACK_REPO={shlex.quote(repo)} FULLSTACK_STAGE={shlex.quote(stage)}",
              f"printf %s {shlex.quote(encoded(stage_script))} | base64 -d > \"$root/stage.py\"",
              'chmod 700 "$root/stage.py"',
              '( set -a; source "$aws_credential_file"; set +a; unset OPENAI_API_KEY MARKETS_OPENAI_API_KEY; "$root/venv/bin/python" "$root/stage.py" )',
              '( set -a; source "$aws_credential_file"; set +a; unset OPENAI_API_KEY MARKETS_OPENAI_API_KEY; cd "$repo"; PYTHONPATH="$repo" "$root/venv/bin/python" research/kalshi/restore_substrate.py )',
              'PYTHONPATH="$repo" "$root/venv/bin/python" "$repo/research/kalshi/frankie_s135_substrate_descriptor_20260824.py" --repo-root "$repo" --out "$stage/S135_SUBSTRATE_DESCRIPTOR.json"',
              'chown -R root:"$provider_group" "$repo" "$stage"',
              'chown root:"$provider_group" "$root"',
              'chmod -R g+rX,g-w,o-rwx "$repo" "$stage"',
              'test -z "$(find "$repo" "$stage" -perm /g=w -print -quit)"',
              'chown -R "$provider_user":"$provider_group" "$output" "$root/venv"',
              'chown "$provider_user":"$provider_group" "$openai_credential_file"',
              'chmod 0400 "$aws_credential_file" "$openai_credential_file"',
              'chmod 0750 "$root" "$repo" "$stage" "$output"',
              'install -o "$provider_user" -g "$provider_group" -m 0600 /dev/null "$run_log"',
              'runuser -u "$provider_user" -- test -r "$repo/deploy/aws/requirements-frankie-fullstack-20260824.lock"',
              'runuser -u "$provider_user" -- test -r "$repo/deploy/RUNTIME_TARGET.json"',
              'runuser -u "$provider_user" -- test -r "$repo/deploy/PACKAGE_MANIFEST.json"',
              'runuser -u "$provider_user" -- test -r "$stage/S135_SUBSTRATE_DESCRIPTOR.json"',
              f"runuser -u \"$provider_user\" -- env PYTHONPATH={shlex.quote(repo)} \"$root/venv/bin/python\" -c 'import aiohttp, async_timeout, databento, openai, platform, sys; import research.kalshi.ng_exhaustion_frankie_fullstack_october_20260824; assert sys.implementation.name == \"cpython\" and sys.version_info[:2] == (3, 10) and sys.implementation.cache_tag == \"cpython-310\" and platform.machine() == \"x86_64\"'",
              f"for service in {' '.join(shlex.quote(item) for item in services)}; do",
              '  echo "PERMANENT_SERVICE_READ_ONLY=$service"',
              '  systemctl show "$service" --property=LoadState,ActiveState,SubState,Result,UnitFileState --no-pager 2>/dev/null || true',
              'done',
              f"printf %s {shlex.quote(encoded(gate_script))} | base64 -d > \"$root/check_gates.py\"",
              f"printf %s {shlex.quote(encoded(runner_script))} | base64 -d > \"$root/run.sh\"",
              'chown "$provider_user":"$provider_group" "$root/run.sh"',
              'chmod 700 "$root/check_gates.py" "$root/run.sh"',
              'systemd-run --collect --unit "$unit" --uid "$provider_user" --gid "$provider_group" --property=Type=exec --property=Restart=no --property="CPUAffinity=0 1 2 3" --property=WorkingDirectory="$repo" --property=NoNewPrivileges=yes --property=PrivateTmp=yes --property=PrivateDevices=yes --property=ProtectHome=yes --property=ProtectSystem=strict --property=IPAddressDeny=169.254.169.254/32 --property=IPAddressDeny=fd00:ec2::254/128 --property="ReadWritePaths=$output $run_log" --property="InaccessiblePaths=$aws_credential_file /mnt/markets/ng_exhaustion_step1_5y_20260822" /bin/bash "$root/run.sh" >/dev/null',
              'main_pid=0',
              'for _ in $(seq 1 60); do main_pid="$(systemctl show --property=MainPID --value "$unit" 2>/dev/null || true)"; if [ "${main_pid:-0}" -gt 0 ] 2>/dev/null; then break; fi; sleep 1; done',
              'test "${main_pid:-0}" -gt 0',
              "\"$root/venv/bin/python\" -c 'import json, os, sys; effective = os.sched_getaffinity(int(sys.argv[1])); assert effective == {0, 1, 2, 3}, f\"provider MainPID CPU affinity drift: {sorted(effective)}\"; print(json.dumps({\"event\": \"PROVIDER_MAINPID_CPU_AFFINITY_VERIFIED\", \"main_pid\": int(sys.argv[1]), \"effective_cpu_affinity\": sorted(effective)}, sort_keys=True))' \"$main_pid\"",
              'echo "FULLSTACK_SYSTEMD_UNIT=$unit"',
              'echo "FULLSTACK_ROOT=$root"',
              'echo "FULLSTACK_ARTIFACT_PREFIX=$artifact_uri/"',
              'echo "FULLSTACK_STOP_COMMAND=systemctl stop $unit"',
              'deadline=$((SECONDS + 5400))',
              'while [ "$SECONDS" -lt "$deadline" ]; do',
              '  ( set -a; source "$aws_credential_file"; set +a; unset OPENAI_API_KEY MARKETS_OPENAI_API_KEY; aws s3 sync "$output" "$artifact_uri/artifacts/" --no-follow-symlinks --only-show-errors; if [ -f "$run_log" ]; then aws s3 cp "$run_log" "$artifact_uri/RUN.log" --only-show-errors; fi; aws s3 cp "$stage/SOURCE_ROSTER.json" "$artifact_uri/SOURCE_ROSTER.json" --only-show-errors; ) || true',
              '  set +e',
              '  "$root/venv/bin/python" "$root/check_gates.py" "$run_log"',
              '  gate_rc=$?',
              '  set -e',
              '  if [ "$gate_rc" -eq 0 ]; then break; fi',
              '  if [ "$gate_rc" -ne 3 ]; then journalctl -u "$unit" -n 240 -o cat --no-pager; exit 1; fi',
              '  active_state="$(systemctl show --property=ActiveState --value "$unit" 2>/dev/null || true)"',
              '  if [ "$active_state" != active ] && [ "$active_state" != activating ]; then',
              '    echo "FULLSTACK_UNIT_EXITED_BEFORE_GATES=$active_state" >&2',
              '    journalctl -u "$unit" -n 240 -o cat --no-pager',
              '    exit 1',
              '  fi',
              '  sleep 15',
              'done',
              '"$root/venv/bin/python" "$root/check_gates.py" "$run_log"',
              '( set -a; source "$aws_credential_file"; set +a; unset OPENAI_API_KEY MARKETS_OPENAI_API_KEY; aws s3 sync "$output" "$artifact_uri/artifacts/" --no-follow-symlinks --only-show-errors; aws s3 cp "$run_log" "$artifact_uri/RUN.log" --only-show-errors; aws s3 cp "$stage/SOURCE_ROSTER.json" "$artifact_uri/SOURCE_ROSTER.json" --only-show-errors; )',
              'test "$(systemctl show --property=ActiveState --value "$unit")" = active',
              'journalctl -u "$unit" -n 240 -o cat --no-pager',
              'echo FULLSTACK_LAUNCH_GATES=PASS',
          ]
          payload = {"commands": ["/bin/bash -lc " + shlex.quote("\n".join(commands))]}
          with open("/tmp/fullstack-october-launch-params.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          with open("/tmp/fullstack-october-launch-identity.json", "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "source_commit": sha,
                      "unit": unit,
                      "root": root,
                      "artifact_prefix": artifact_uri + "/",
                      "stop_command": f"systemctl stop {unit}",
                  },
                  handle,
                  indent=2,
                  sort_keys=True,
              )
          PY

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Launch full-stack October Frankie from ${GITHUB_SHA}" \
            --parameters file:///tmp/fullstack-october-launch-params.json \
            --timeout-seconds 6600 \
            --query 'Command.CommandId' \
            --output text)"
          status=Pending
          for _ in $(seq 1 440); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|TimedOut|Cancelled) break ;;
            esac
            sleep 15
          done
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json | tee /tmp/fullstack-october-launch-result.json
          test "$status" = Success
          grep -F 'FULLSTACK_LAUNCH_GATES=PASS' /tmp/fullstack-october-launch-result.json
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Publish launch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fullstack-october-launch-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/fullstack-october-launch-result.json
            /tmp/fullstack-october-launch-identity.json
          if-no-files-found: warn

      - name: Report live full-October run
        if: always()
        shell: bash
        run: |
          unit="ng-exhaustion-frankie-fullstack-october-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          root="/mnt/markets/ng_exhaustion_frankie_fullstack_october_20260824/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "### Full-stack Frankie — October 2021"
            echo "- Live run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Exact commit: ${GITHUB_SHA}"
            echo "- SSM command: ${{ steps.launch.outputs.command_id }}"
            echo "- Unit: \`${unit}\`"
            echo "- Root: \`${root}\`"
            echo "- Artifacts: \`s3://${BUCKET}/${ARTIFACT_PREFIX}/\`"
            echo "- Stop only this run: \`systemctl stop ${unit}\`"
            echo "- Launch gate: active isolated unit plus the first identical-prefix S135 control vs all-provisional-combined pair, independent lane ledgers, 5+5 distinct accepted gpt-5.6-sol responses, seven active provisional components, deferred META_LOOP, and sealed Step-1"
          } >> "$GITHUB_STEP_SUMMARY"

name: Launch full-stack Frankie October 2021 20260824

# RETIRED_FORENSIC_ONLY: the four-helper October stack is superseded by the
# one-skill-per-principal RT/Forecaster architecture. Keep the body as a record,
# but expose no push trigger and permit no job to execute.
on:
  workflow_dispatch:
    inputs:
      confirm_full_october:
        description: Launch the unique full October 2021 construction
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: >-
    ${{ startsWith(github.event.head_commit.message, 'stop: October Frankie attempt 8') &&
        format('ng-exhaustion-frankie-fullstack-october-20260824-stop-{0}', github.run_id) ||
        'ng-exhaustion-frankie-fullstack-october-20260824' }}
  cancel-in-progress: false

jobs:
  stop-attempt-8:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_DEFAULT_REGION: us-east-2
      INSTANCE_ID: i-08cee7171c0a76a04
      UNIT: ng-exhaustion-frankie-fullstack-october-1ae2d5d83906-32753586584-1
    steps:
      - name: Stop only October Frankie attempt 8
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          unit = os.environ["UNIT"]
          command = (
              f"set -eu; systemctl stop {unit}; "
              f"state=$(systemctl is-active {unit} || true); "
              'test "$state" = inactive || test "$state" = failed; '
              f"echo FULLSTACK_STOPPED={unit}"
          )
          Path("/tmp/fullstack-october-stop-params.json").write_text(
              json.dumps({"commands": [command]}),
              encoding="utf-8",
          )
          PY
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Stop only October Frankie attempt 8" \
            --parameters file:///tmp/fullstack-october-stop-params.json \
            --timeout-seconds 120 \
            --query 'Command.CommandId' \
            --output text)"
          status=Pending
          for _ in $(seq 1 30); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|TimedOut|Cancelled) break ;;
            esac
            sleep 2
          done
          result="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json)"
          printf '%s\n' "$result"
          test "$status" = Success
          grep -F "FULLSTACK_STOPPED=$UNIT" <<<"$result"

  build-and-verify:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      package_sha256: ${{ steps.package.outputs.package_sha256 }}
      wheelhouse_sha256: ${{ steps.package.outputs.wheelhouse_sha256 }}
    steps:
      - name: Checkout exact launch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Verify focused full-stack contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ci_wheelhouse="$(mktemp -d)"
          ci_venv="$(mktemp -d)"
          python -m pip download \
            --disable-pip-version-check \
            --only-binary=:all: \
            --no-deps \
            --require-hashes \
            --dest "$ci_wheelhouse" \
            -r deploy/aws/requirements-frankie-fullstack-ci-20260824.lock
          python -m venv "$ci_venv"
          "$ci_venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-index \
            --only-binary=:all: \
            --find-links "$ci_wheelhouse" \
            --require-hashes \
            -r deploy/aws/requirements-frankie-fullstack-ci-20260824.lock
          "$ci_venv/bin/python" -m pytest --quiet \
            research/kalshi/tests/test_frankie_full_stack_runtime_adapter_20260824.py::test_four_helpers_overlap_on_distinct_singleton_cpu_threads_before_frankie \
            research/kalshi/tests/test_ng_exhaustion_frankie_fullstack_october_launch_workflow_20260824.py::FullStackOctoberLaunchWorkflowTests::test_cpu_affinity_and_first_prefix_receipts_are_gated

      - name: Bind build and resolver to CPython 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10.14'

      - name: Build hash-locked offline runtime package without credentials
        id: package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bundle="$(mktemp -d)"
          wheelhouse="$bundle/deploy/wheelhouse"
          lock="$bundle/deploy/aws/requirements-frankie-fullstack-20260824.lock"
          runtime_python_version=310
          runtime_abi=cp310
          runtime_platform=manylinux2014_x86_64
          runtime_python="$(command -v python)"
          "$runtime_python" -c 'import platform, sys; assert sys.implementation.name == "cpython"; assert sys.version_info[:3] == (3, 10, 14); assert sys.implementation.cache_tag == "cpython-310"; assert platform.machine() == "x86_64"'
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$bundle"
          install -d -m 0755 "$wheelhouse"
          "$runtime_python" -m pip download \
            --disable-pip-version-check \
            --only-binary=:all: \
            --no-deps \
            --require-hashes \
            --implementation cp \
            --python-version "$runtime_python_version" \
            --abi "$runtime_abi" \
            --platform "$runtime_platform" \
            --dest "$wheelhouse" \
            -r "$lock"
          "$runtime_python" -m pip install \
            --dry-run \
            --ignore-installed \
            --disable-pip-version-check \
            --no-index \
            --only-binary=:all: \
            --find-links "$wheelhouse" \
            --require-hashes \
            --implementation cp \
            --python-version "$runtime_python_version" \
            --abi "$runtime_abi" \
            --platform "$runtime_platform" \
            -r "$lock"
          test "$(find "$wheelhouse" -maxdepth 1 -type f -name 'async_timeout-5.0.1-py3-none-any.whl' | wc -l)" -eq 1
          test "$(find "$wheelhouse" -maxdepth 1 -type f -name 'exceptiongroup-1.3.1-py3-none-any.whl' | wc -l)" -eq 1
          lock_sha256="$(sha256sum "$lock" | awk '{print $1}')"
          entrypoint="$bundle/research/kalshi/ng_exhaustion_frankie_fullstack_october_20260824.py"
          entrypoint_sha256="$(sha256sum "$entrypoint" | awk '{print $1}')"
          wheelhouse_sha256="$(cd "$wheelhouse" && find . -maxdepth 1 -type f -name '*.whl' -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          "$runtime_python" - "$bundle" "$GITHUB_SHA" "$runtime_python_version" "$runtime_abi" "$runtime_platform" "$lock_sha256" "$entrypoint_sha256" "$wheelhouse_sha256" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          bundle = Path(sys.argv[1])
          target_core = {
              "schema": "FRANKIE_RUNTIME_TARGET_V1_20260824",
              "implementation": "cp",
              "python_version": sys.argv[3],
              "abi": sys.argv[4],
              "platform": sys.argv[5],
              "machine": "x86_64",
          }
          canonical = lambda value: json.dumps(
              value, sort_keys=True, separators=(",", ":"), ensure_ascii=True
          )
          target = {
              **target_core,
              "receipt_hash": hashlib.sha256(canonical(target_core).encode()).hexdigest(),
          }
          (bundle / "deploy/RUNTIME_TARGET.json").write_text(
              json.dumps(target, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          wheels = []
          for path in sorted((bundle / "deploy/wheelhouse").glob("*.whl")):
              wheels.append(
                  {
                      "name": path.name,
                      "bytes": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
              )
          manifest_core = {
              "schema": "FRANKIE_RUNTIME_PACKAGE_MANIFEST_V1_20260824",
              "source_commit": sys.argv[2],
              "runtime_target_receipt_hash": target["receipt_hash"],
              "requirements_lock_sha256": sys.argv[6],
              "entrypoint_sha256": sys.argv[7],
              "wheelhouse_sha256": sys.argv[8],
              "wheels": wheels,
          }
          manifest = {
              **manifest_core,
              "receipt_hash": hashlib.sha256(canonical(manifest_core).encode()).hexdigest(),
          }
          (bundle / "deploy/PACKAGE_MANIFEST.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          package_dir="$RUNNER_TEMP/frankie-fullstack-package"
          install -d -m 0755 "$package_dir"
          package="$package_dir/package.tgz"
          tar -czf "$package" -C "$bundle" .
          package_sha256="$(sha256sum "$package" | awk '{print $1}')"
          [[ "$package_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$wheelhouse_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  package.tgz\n' "$package_sha256" > "$package_dir/package.sha256"
          printf '%s\n' "$wheelhouse_sha256" > "$package_dir/wheelhouse.sha256"
          echo "package_sha256=$package_sha256" >> "$GITHUB_OUTPUT"
          echo "wheelhouse_sha256=$wheelhouse_sha256" >> "$GITHUB_OUTPUT"

      - name: Cross the no-secret artifact boundary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fullstack-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/frankie-fullstack-package
          if-no-files-found: error
          retention-days: 1

  launch-fullstack-october:
    needs: build-and-verify
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      AWS_DEFAULT_REGION: us-east-2
      INSTANCE_ID: i-08cee7171c0a76a04
      BUCKET: bento-568968024170-us-east-2-an
    steps:
      - name: Download attested no-secret runtime package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fullstack-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/frankie-fullstack-package

      - name: Verify artifact boundary
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/frankie-fullstack-package"
          expected_package_sha="${{ needs.build-and-verify.outputs.package_sha256 }}"
          expected_wheelhouse_sha="${{ needs.build-and-verify.outputs.wheelhouse_sha256 }}"
          [[ "$expected_package_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expected_wheelhouse_sha" =~ ^[0-9a-f]{64}$ ]]
          mapfile -t package_lines < package.sha256
          mapfile -t wheelhouse_lines < wheelhouse.sha256
          test "${#package_lines[@]}" -eq 1
          test "${#wheelhouse_lines[@]}" -eq 1
          [[ "${package_lines[0]}" =~ ^[0-9a-f]{64}[[:space:]][[:space:]]package\.tgz$ ]]
          [[ "${wheelhouse_lines[0]}" =~ ^[0-9a-f]{64}$ ]]
          observed_package_sha="${package_lines[0]%% *}"
          observed_wheelhouse_sha="${wheelhouse_lines[0]}"
          test "$observed_package_sha" = "$expected_package_sha"
          test "$observed_wheelhouse_sha" = "$expected_wheelhouse_sha"
          sha256sum -c package.sha256
          {
            echo "PACKAGE_PATH=$RUNNER_TEMP/frankie-fullstack-package/package.tgz"
            echo "PACKAGE_SHA256=$observed_package_sha"
            echo "WHEELHOUSE_SHA256=$observed_wheelhouse_sha"
          } >> "$GITHUB_ENV"

      - name: Publish exact GITHUB_SHA package
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail
          package="$PACKAGE_PATH"
          echo "$PACKAGE_SHA256  $package" | sha256sum -c -
          launch_identity="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          artifact_prefix="frankie/fullstack-october-2021/launches/${GITHUB_SHA}/${launch_identity}"
          package_key="${artifact_prefix}/package.tgz"
          aws s3 cp "$package" "s3://${BUCKET}/${package_key}" --only-show-errors
          {
            echo "PACKAGE_KEY=$package_key"
            echo "PACKAGE_SHA256=$PACKAGE_SHA256"
            echo "ARTIFACT_PREFIX=$artifact_prefix"
            echo "LAUNCH_IDENTITY=$launch_identity"
          } >> "$GITHUB_ENV"

      - name: Start isolated bounded full-October unit and await evidence gates
        id: launch
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import shlex

          sha = os.environ["GITHUB_SHA"]
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          identity = os.environ["LAUNCH_IDENTITY"]
          root = f"/mnt/markets/ng_exhaustion_frankie_fullstack_october_20260824/{sha}/{identity}"
          repo = f"{root}/repo"
          stage = f"{root}/raw"
          output = f"{root}/artifacts"
          package = f"{root}/package.tgz"
          run_log = f"{root}/RUN.log"
          unit = f"ng-exhaustion-frankie-fullstack-october-{sha[:12]}-{run_id}-{attempt}"
          runner_id = f"github-{run_id}-{attempt}-{sha[:12]}"
          artifact_uri = f"s3://{os.environ['BUCKET']}/{os.environ['ARTIFACT_PREFIX']}"
          credential_file = (
              "/mnt/markets/ng_exhaustion_step1_5y_20260822/"
              "0d318335825b4a0e19a5a2881522f3da0374788e/aws.env"
          )
          aws_credential_file = f"{root}/aws-runtime.env"
          openai_credential_file = f"{root}/openai-runtime.env"

          credential_scope_script = r'''#!/usr/bin/env python3
          import os
          from pathlib import Path
          import shlex
          import sys

          source = Path(sys.argv[1])
          aws_destination = Path(sys.argv[2])
          openai_destination = Path(sys.argv[3])
          aws_keys = {
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "AWS_SESSION_TOKEN",
              "AWS_DEFAULT_REGION",
              "AWS_REGION",
              "MARKETS_AWS_ACCESS_KEY_ID",
              "MARKETS_AWS_SECRET_ACCESS_KEY",
              "MARKETS_AWS_SESSION_TOKEN",
          }
          openai_keys = {"OPENAI_API_KEY", "MARKETS_OPENAI_API_KEY"}
          scoped = {"aws": {}, "openai": {}}
          for raw_line in source.read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              if line.startswith("export "):
                  line = line[7:].strip()
              tokens = shlex.split(line, comments=True, posix=True)
              if len(tokens) != 1 or "=" not in tokens[0]:
                  raise SystemExit("credential file contains an unsupported statement")
              key, value = tokens[0].split("=", 1)
              if key in aws_keys:
                  scoped["aws"][key] = value
              elif key in openai_keys:
                  scoped["openai"][key] = value
          if not any(key in scoped["aws"] for key in ("AWS_ACCESS_KEY_ID", "MARKETS_AWS_ACCESS_KEY_ID")):
              raise SystemExit("scoped AWS credentials are missing")

          def write_exclusive(path: Path, values: dict[str, str]) -> None:
              descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
                  for key, value in sorted(values.items()):
                      handle.write(f"{key}={shlex.quote(value)}\n")

          write_exclusive(aws_destination, scoped["aws"])
          write_exclusive(openai_destination, scoped["openai"])
          '''

          package_verify_script = r'''#!/usr/bin/env python3
          import hashlib
          import json
          from pathlib import Path
          import platform
          import sys

          repo = Path(sys.argv[1])
          expected_commit = sys.argv[2]
          canonical = lambda value: json.dumps(
              value, sort_keys=True, separators=(",", ":"), ensure_ascii=True
          )
          target = json.loads((repo / "deploy/RUNTIME_TARGET.json").read_text(encoding="utf-8"))
          target_core = dict(target)
          target_hash = target_core.pop("receipt_hash", None)
          if target_core != {
              "schema": "FRANKIE_RUNTIME_TARGET_V1_20260824",
              "implementation": "cp",
              "python_version": "310",
              "abi": "cp310",
              "platform": "manylinux2014_x86_64",
              "machine": "x86_64",
          }:
              raise SystemExit("runtime target drift")
          if target_hash != hashlib.sha256(canonical(target_core).encode()).hexdigest():
              raise SystemExit("runtime target receipt hash mismatch")
          if (
              sys.implementation.name != "cpython"
              or sys.version_info[:2] != (3, 10)
              or platform.machine() != "x86_64"
          ):
              raise SystemExit("host runtime differs from package target")

          manifest = json.loads((repo / "deploy/PACKAGE_MANIFEST.json").read_text(encoding="utf-8"))
          manifest_core = dict(manifest)
          manifest_hash = manifest_core.pop("receipt_hash", None)
          if manifest_hash != hashlib.sha256(canonical(manifest_core).encode()).hexdigest():
              raise SystemExit("package manifest receipt hash mismatch")
          if manifest_core.get("source_commit") != expected_commit:
              raise SystemExit("package source commit drift")
          if manifest_core.get("runtime_target_receipt_hash") != target_hash:
              raise SystemExit("package/runtime target binding drift")

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          lock = repo / "deploy/aws/requirements-frankie-fullstack-20260824.lock"
          entrypoint = repo / "research/kalshi/ng_exhaustion_frankie_fullstack_october_20260824.py"
          if sha256_file(lock) != manifest_core.get("requirements_lock_sha256"):
              raise SystemExit("runtime lock hash mismatch")
          if sha256_file(entrypoint) != manifest_core.get("entrypoint_sha256"):
              raise SystemExit("runtime entrypoint hash mismatch")
          observed_wheels = []
          wheelhouse_lines = []
          for path in sorted((repo / "deploy/wheelhouse").glob("*.whl")):
              digest = sha256_file(path)
              observed_wheels.append(
                  {"name": path.name, "bytes": path.stat().st_size, "sha256": digest}
              )
              wheelhouse_lines.append(f"{digest}  ./{path.name}\n")
          wheelhouse_hash = hashlib.sha256("".join(wheelhouse_lines).encode()).hexdigest()
          if observed_wheels != manifest_core.get("wheels"):
              raise SystemExit("wheel roster hash or size mismatch")
          if wheelhouse_hash != manifest_core.get("wheelhouse_sha256"):
              raise SystemExit("wheelhouse aggregate hash mismatch")
          print(
              json.dumps(
                  {
                      "event": "RUNTIME_PACKAGE_VERIFIED",
                      "runtime_target_receipt_hash": target_hash,
                      "package_manifest_receipt_hash": manifest_hash,
                      "wheelhouse_sha256": wheelhouse_hash,
                  },
                  sort_keys=True,
              )
          )
          '''

          stage_script = r'''#!/usr/bin/env python3
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          expected_manifest_sha256 = "5739bce85d9bfbbe6c59d000bc411b424d7752b98a309725161d44e6d1d3dc2e"
          predecessor_segment = "20210901_20211001"
          october_segment = "20211001_20211101"
          predecessor_name = "glbx-mdp3-20210930.mbo.dbn.zst"
          repo = Path(os.environ["FULLSTACK_REPO"])
          stage = Path(os.environ["FULLSTACK_STAGE"])
          manifest_path = repo / "research/kalshi/NG_EXHAUSTION_MBO_5Y_CANONICAL_OBJECT_MANIFEST_20260822.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("manifest_sha256") != expected_manifest_sha256:
              raise SystemExit("canonical manifest identity drift")
          rows = manifest["canonical_dbn_objects"]
          predecessors = [
              row for row in rows
              if row.get("segment") == predecessor_segment
              and str(row.get("key") or "").endswith(predecessor_name)
          ]
          targets = [row for row in rows if row.get("segment") == october_segment]
          targets.sort(key=lambda row: row["key"])
          if len(predecessors) != 1:
              raise SystemExit("exactly one canonical predecessor is required")
          if len(targets) != 26 or len({row["key"] for row in targets}) != 26:
              raise SystemExit("len(targets) != 26")
          roster = [predecessors[0], *targets]
          if len(roster) != 27:
              raise SystemExit("len(roster) != 27")

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          stage.mkdir(parents=True, exist_ok=False)
          receipt = []
          for index, row in enumerate(roster):
              key = str(row["key"])
              bucket = str(row["bucket"])
              destination = stage / Path(key).name
              subprocess.run(
                  ["aws", "s3", "cp", f"s3://{bucket}/{key}", str(destination), "--only-show-errors"],
                  check=True,
              )
              if destination.stat().st_size != row["bytes"]:
                  raise SystemExit(f"byte mismatch for {key}")
              if sha256_file(destination) != row["sha256"]:
                  raise SystemExit(f"SHA-256 mismatch for {key}")
              receipt.append(
                  {
                      "index": index,
                      "purpose": "PREDECESSOR_BOOTSTRAP" if index == 0 else "OCTOBER_CAUSAL_STREAM",
                      "key": key,
                      "local_path": str(destination),
                      "bytes": row["bytes"],
                      "sha256": row["sha256"],
                  }
              )
          (stage / "SOURCE_ROSTER.json").write_text(
              json.dumps(
                  {
                      "schema": "FRANKIE_FULLSTACK_OCTOBER_SOURCE_ROSTER_V1",
                      "manifest_sha256": expected_manifest_sha256,
                      "object_count": len(receipt),
                      "objects": receipt,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          print("FULLSTACK_SOURCE_OBJECTS_VERIFIED=27")
          '''

          gate_script = r'''#!/usr/bin/env python3
          import hashlib
          import json
          from pathlib import Path
          import re
          import sys

          log_path = Path(sys.argv[1])
          if not log_path.exists():
              raise SystemExit(3)
          text = log_path.read_text(encoding="utf-8", errors="replace")
          if "Traceback" in text or "MODEL_DRIFT" in text or "RUN_FAILED" in text:
              print("fatal runner output detected", file=sys.stderr)
              raise SystemExit(1)
          records = []
          for line in text.splitlines():
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(row, dict):
                  records.append(row)
          by_event = {}
          for row in records:
              by_event.setdefault(str(row.get("event") or ""), []).append(row)

          required = {
              "KNOWLEDGE_MANIFEST_READY",
              "ANSWER_WALL_PREFREEZE_VERIFIED",
              "FORBIDDEN_V3_DENIED",
              "PAIRED_PREFIX_ACCEPTED",
          }

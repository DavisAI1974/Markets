name: Launch full-stack Frankie October 2021 20260824

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-october-sharded-20260824
    paths:
      - research/kalshi/NG_EXHAUSTION_FRANKIE_FULLSTACK_OCTOBER_LAUNCH_20260824.json
  workflow_dispatch:
    inputs:
      confirm_full_october:
        description: Launch the unique full October 2021 construction
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ng-exhaustion-frankie-fullstack-october-20260824
  cancel-in-progress: false

jobs:
  launch-fullstack-october:
    if: >-
      ${{ github.ref == 'refs/heads/chatgpt/ng-exhaustion-october-sharded-20260824' &&
          (github.event_name == 'push' || inputs.confirm_full_october == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-2
      INSTANCE_ID: i-08cee7171c0a76a04
      BUCKET: bento-568968024170-us-east-2-an
    steps:
      - name: Checkout exact launch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify focused full-stack contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python research/kalshi/tests/test_ng_exhaustion_frankie_fullstack_october_20260824.py
          python research/kalshi/tests/test_ng_exhaustion_frankie_fullstack_october_launch_workflow_20260824.py

      - name: Publish exact GITHUB_SHA package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          package="/tmp/ng-frankie-fullstack-october-${GITHUB_SHA}.tgz"
          git archive --format=tar.gz --output="$package" "$GITHUB_SHA"
          package_sha256="$(sha256sum "$package" | awk '{print $1}')"
          launch_identity="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          artifact_prefix="frankie/fullstack-october-2021/launches/${GITHUB_SHA}/${launch_identity}"
          package_key="${artifact_prefix}/package.tgz"
          aws s3 cp "$package" "s3://${BUCKET}/${package_key}" --only-show-errors
          {
            echo "PACKAGE_KEY=$package_key"
            echo "PACKAGE_SHA256=$package_sha256"
            echo "ARTIFACT_PREFIX=$artifact_prefix"
            echo "LAUNCH_IDENTITY=$launch_identity"
          } >> "$GITHUB_ENV"

      - name: Start isolated bounded full-October unit and await evidence gates
        id: launch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import shlex

          sha = os.environ["GITHUB_SHA"]
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          identity = os.environ["LAUNCH_IDENTITY"]
          root = f"/mnt/markets/ng_exhaustion_frankie_fullstack_october_20260824/{sha}/{identity}"
          repo = f"{root}/repo"
          stage = f"{root}/raw"
          output = f"{root}/artifacts"
          package = f"{root}/package.tgz"
          run_log = f"{root}/RUN.log"
          unit = f"ng-exhaustion-frankie-fullstack-october-{sha[:12]}-{run_id}-{attempt}"
          runner_id = f"github-{run_id}-{attempt}-{sha[:12]}"
          artifact_uri = f"s3://{os.environ['BUCKET']}/{os.environ['ARTIFACT_PREFIX']}"
          credential_file = (
              "/mnt/markets/ng_exhaustion_step1_5y_20260822/"
              "0d318335825b4a0e19a5a2881522f3da0374788e/aws.env"
          )

          stage_script = r'''#!/usr/bin/env python3
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          expected_manifest_sha256 = "5739bce85d9bfbbe6c59d000bc411b424d7752b98a309725161d44e6d1d3dc2e"
          predecessor_segment = "20210901_20211001"
          october_segment = "20211001_20211101"
          predecessor_name = "glbx-mdp3-20210930.mbo.dbn.zst"
          repo = Path(os.environ["FULLSTACK_REPO"])
          stage = Path(os.environ["FULLSTACK_STAGE"])
          manifest_path = repo / "research/kalshi/NG_EXHAUSTION_MBO_5Y_CANONICAL_OBJECT_MANIFEST_20260822.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("manifest_sha256") != expected_manifest_sha256:
              raise SystemExit("canonical manifest identity drift")
          rows = manifest["canonical_dbn_objects"]
          predecessors = [
              row for row in rows
              if row.get("segment") == predecessor_segment
              and str(row.get("key") or "").endswith(predecessor_name)
          ]
          targets = [row for row in rows if row.get("segment") == october_segment]
          targets.sort(key=lambda row: row["key"])
          if len(predecessors) != 1:
              raise SystemExit("exactly one canonical predecessor is required")
          if len(targets) != 26 or len({row["key"] for row in targets}) != 26:
              raise SystemExit("len(targets) != 26")
          roster = [predecessors[0], *targets]
          if len(roster) != 27:
              raise SystemExit("len(roster) != 27")

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          stage.mkdir(parents=True, exist_ok=False)
          receipt = []
          for index, row in enumerate(roster):
              key = str(row["key"])
              bucket = str(row["bucket"])
              destination = stage / Path(key).name
              subprocess.run(
                  ["aws", "s3", "cp", f"s3://{bucket}/{key}", str(destination), "--only-show-errors"],
                  check=True,
              )
              if destination.stat().st_size != row["bytes"]:
                  raise SystemExit(f"byte mismatch for {key}")
              if sha256_file(destination) != row["sha256"]:
                  raise SystemExit(f"SHA-256 mismatch for {key}")
              receipt.append(
                  {
                      "index": index,
                      "purpose": "PREDECESSOR_BOOTSTRAP" if index == 0 else "OCTOBER_CAUSAL_STREAM",
                      "key": key,
                      "local_path": str(destination),
                      "bytes": row["bytes"],
                      "sha256": row["sha256"],
                  }
              )
          (stage / "SOURCE_ROSTER.json").write_text(
              json.dumps(
                  {
                      "schema": "FRANKIE_FULLSTACK_OCTOBER_SOURCE_ROSTER_V1",
                      "manifest_sha256": expected_manifest_sha256,
                      "object_count": len(receipt),
                      "objects": receipt,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          print("FULLSTACK_SOURCE_OBJECTS_VERIFIED=27")
          '''

          gate_script = r'''#!/usr/bin/env python3
          import hashlib
          import json
          from pathlib import Path
          import re
          import sys

          log_path = Path(sys.argv[1])
          if not log_path.exists():
              raise SystemExit(3)
          text = log_path.read_text(encoding="utf-8", errors="replace")
          if "Traceback" in text or "MODEL_DRIFT" in text or "RUN_FAILED" in text:
              print("fatal runner output detected", file=sys.stderr)
              raise SystemExit(1)
          records = []
          for line in text.splitlines():
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(row, dict):
                  records.append(row)
          by_event = {}
          for row in records:
              by_event.setdefault(str(row.get("event") or ""), []).append(row)

          required = {
              "KNOWLEDGE_MANIFEST_READY",
              "ANSWER_WALL_PREFREEZE_VERIFIED",
              "FORBIDDEN_V3_DENIED",
              "CAUSAL_STATE_APPENDED",
              "HELPER_EVIDENCE_APPENDED",
              "FRANKIE_REASONING_APPENDED",
              "PROBABILITY_MOVIE_APPENDED",
              "SOL_RESPONSE_ACCEPTED",
          }
          missing = sorted(required - by_event.keys())
          if missing:
              print("PENDING_GATES=" + ",".join(missing))
              raise SystemExit(3)

          sha_pattern = re.compile(r"[0-9a-f]{64}")
          knowledge = by_event["KNOWLEDGE_MANIFEST_READY"][-1]
          if not sha_pattern.fullmatch(str(knowledge.get("knowledge_manifest_hash") or "")):
              print("invalid knowledge_manifest_hash", file=sys.stderr)
              raise SystemExit(1)
          wall = by_event["ANSWER_WALL_PREFREEZE_VERIFIED"][-1]
          if wall.get("step1_sealed") is not True:
              print("answer wall is not sealed", file=sys.stderr)
              raise SystemExit(1)
          denied = by_event["FORBIDDEN_V3_DENIED"][-1]
          if denied.get("ordinary_v3_denied") is not True or denied.get("d1_extratrees_denied") is not True:
              print("forbidden V3 denial is incomplete", file=sys.stderr)
              raise SystemExit(1)
          for event in (
              "CAUSAL_STATE_APPENDED",
              "HELPER_EVIDENCE_APPENDED",
              "FRANKIE_REASONING_APPENDED",
              "PROBABILITY_MOVIE_APPENDED",
          ):
              if not sha_pattern.fullmatch(str(by_event[event][-1].get("receipt_hash") or "")):
                  print(f"missing receipt_hash for {event}", file=sys.stderr)
                  raise SystemExit(1)
          sol = by_event["SOL_RESPONSE_ACCEPTED"][-1]
          if sol.get("model") != "gpt-5.6-sol":
              print("MODEL_DRIFT", file=sys.stderr)
              raise SystemExit(1)
          provider_response_id = str(sol.get("provider_response_id") or "").strip()
          if not provider_response_id:
              print("missing provider_response_id", file=sys.stderr)
              raise SystemExit(1)
          summary = {
              "event": "FULLSTACK_LAUNCH_GATES_PASS",
              "knowledge_manifest_hash": knowledge["knowledge_manifest_hash"],
              "model": sol["model"],
              "provider_response_id": provider_response_id,
          }
          print(json.dumps(summary, sort_keys=True))
          print("FULLSTACK_LAUNCH_GATES=PASS")
          '''

          runner_script = r'''#!/bin/bash
          set -euo pipefail
          set -a
          source __CREDENTIAL_FILE__
          set +a
          source __ROOT__/venv/bin/activate
          cd __REPO__
          export PYTHONPATH=__REPO__:__REPO__/research:__REPO__/research/kalshi
          export SOURCE_COMMIT=__SOURCE_COMMIT__
          run_log=__RUN_LOG__
          output=__OUTPUT__
          sync_done=__ROOT__/SYNC_DONE

          sync_once() {
            aws s3 sync "$output" __ARTIFACT_URI__/artifacts/ --only-show-errors
            if [ -f "$run_log" ]; then
              aws s3 cp "$run_log" __ARTIFACT_URI__/RUN.log --only-show-errors
            fi
            aws s3 cp __STAGE__/SOURCE_ROSTER.json __ARTIFACT_URI__/SOURCE_ROSTER.json --only-show-errors
          }

          (
            while [ ! -f "$sync_done" ]; do
              sync_once || true
              sleep 60
            done
          ) &
          sync_pid=$!

          set +e
          python research/kalshi/ng_exhaustion_frankie_fullstack_october_20260824.py \
            --manifest research/kalshi/NG_EXHAUSTION_MBO_5Y_CANONICAL_OBJECT_MANIFEST_20260822.json \
            --source-root __STAGE__ \
            --output-root "$output" \
            --run-id __RUNNER_ID__ \
            2>&1 | tee "$run_log"
          rc=${PIPESTATUS[0]}
          set -e
          touch "$sync_done"
          kill "$sync_pid" 2>/dev/null || true
          wait "$sync_pid" 2>/dev/null || true
          sync_once || rc=1
          printf '{"event":"FULLSTACK_RUNNER_EXIT","exit_code":%s}\n' "$rc" | tee -a "$run_log"
          exit "$rc"
          '''
          replacements = {
              "__CREDENTIAL_FILE__": shlex.quote(credential_file),
              "__ROOT__": shlex.quote(root),
              "__REPO__": shlex.quote(repo),
              "__SOURCE_COMMIT__": shlex.quote(sha),
              "__RUN_LOG__": shlex.quote(run_log),
              "__OUTPUT__": shlex.quote(output),
              "__ARTIFACT_URI__": shlex.quote(artifact_uri),
              "__STAGE__": shlex.quote(stage),
              "__RUNNER_ID__": shlex.quote(runner_id),
          }
          for old, new in replacements.items():
              runner_script = runner_script.replace(old, new)

          def encoded(value: str) -> str:
              return base64.b64encode(value.encode("utf-8")).decode("ascii")

          services = (
              "markets-frankie.service",
              "markets-frankie-reflect.service",
              "markets-frankie-reflect.timer",
              "markets-frankie-bounded-3mo.service",
          )
          commands = [
              "set -euo pipefail",
              "trap 'echo FULLSTACK_REMOTE_FAILED_COMMAND=\"$BASH_COMMAND\" >&2' ERR",
              f"root={shlex.quote(root)}",
              f"repo={shlex.quote(repo)}",
              f"stage={shlex.quote(stage)}",
              f"output={shlex.quote(output)}",
              f"package={shlex.quote(package)}",
              f"run_log={shlex.quote(run_log)}",
              f"unit={shlex.quote(unit)}",
              f"credential_file={shlex.quote(credential_file)}",
              f"artifact_uri={shlex.quote(artifact_uri)}",
              'test ! -e "$root"',
              'test -s "$credential_file"',
              'install -d -m 0755 "$root" "$repo" "$output"',
              'set -a; source "$credential_file"; set +a',
              f"aws s3 cp {shlex.quote('s3://' + os.environ['BUCKET'] + '/' + os.environ['PACKAGE_KEY'])} \"$package\" --only-show-errors",
              f"echo {shlex.quote(os.environ['PACKAGE_SHA256'] + '  ' + package)} | sha256sum -c -",
              'tar -xzf "$package" -C "$repo"',
              f"test -s \"$repo/research/kalshi/ng_exhaustion_frankie_fullstack_october_20260824.py\"",
              'python3 -m venv "$root/venv"',
              'source "$root/venv/bin/activate"',
              'python -m pip install --quiet --upgrade pip',
              'python -m pip install --quiet -r "$repo/deploy/aws/requirements-frankie.txt"',
              'python -m pip install --quiet databento==0.81.0 "numpy>=1.26" "pandas>=2.0" "scipy>=1.11" "scikit-learn>=1.3" matplotlib',
              f"export FULLSTACK_REPO={shlex.quote(repo)} FULLSTACK_STAGE={shlex.quote(stage)}",
              f"printf %s {shlex.quote(encoded(stage_script))} | base64 -d > \"$root/stage.py\"",
              'chmod 700 "$root/stage.py"',
              'python "$root/stage.py"',
              f"for service in {' '.join(shlex.quote(item) for item in services)}; do",
              '  echo "PERMANENT_SERVICE_READ_ONLY=$service"',
              '  systemctl show "$service" --property=LoadState,ActiveState,SubState,Result,UnitFileState --no-pager 2>/dev/null || true',
              'done',
              f"printf %s {shlex.quote(encoded(gate_script))} | base64 -d > \"$root/check_gates.py\"",
              f"printf %s {shlex.quote(encoded(runner_script))} | base64 -d > \"$root/run.sh\"",
              'chmod 700 "$root/check_gates.py" "$root/run.sh"',
              'systemd-run --collect --unit "$unit" --property=Type=exec --property=Restart=no --property=WorkingDirectory="$repo" /bin/bash "$root/run.sh" >/dev/null',
              'echo "FULLSTACK_SYSTEMD_UNIT=$unit"',
              'echo "FULLSTACK_ROOT=$root"',
              'echo "FULLSTACK_ARTIFACT_PREFIX=$artifact_uri/"',
              'echo "FULLSTACK_STOP_COMMAND=systemctl stop $unit"',
              'deadline=$((SECONDS + 5400))',
              'while [ "$SECONDS" -lt "$deadline" ]; do',
              '  set +e',
              '  python "$root/check_gates.py" "$run_log"',
              '  gate_rc=$?',
              '  set -e',
              '  if [ "$gate_rc" -eq 0 ]; then break; fi',
              '  if [ "$gate_rc" -ne 3 ]; then journalctl -u "$unit" -n 240 -o cat --no-pager; exit 1; fi',
              '  active_state="$(systemctl show --property=ActiveState --value "$unit" 2>/dev/null || true)"',
              '  if [ "$active_state" != active ] && [ "$active_state" != activating ]; then',
              '    echo "FULLSTACK_UNIT_EXITED_BEFORE_GATES=$active_state" >&2',
              '    journalctl -u "$unit" -n 240 -o cat --no-pager',
              '    exit 1',
              '  fi',
              '  sleep 15',
              'done',
              'python "$root/check_gates.py" "$run_log"',
              'test "$(systemctl show --property=ActiveState --value "$unit")" = active',
              'journalctl -u "$unit" -n 240 -o cat --no-pager',
              'echo FULLSTACK_LAUNCH_GATES=PASS',
          ]
          payload = {"commands": ["/bin/bash -lc " + shlex.quote("\n".join(commands))]}
          with open("/tmp/fullstack-october-launch-params.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          with open("/tmp/fullstack-october-launch-identity.json", "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "source_commit": sha,
                      "unit": unit,
                      "root": root,
                      "artifact_prefix": artifact_uri + "/",
                      "stop_command": f"systemctl stop {unit}",
                  },
                  handle,
                  indent=2,
                  sort_keys=True,
              )
          PY

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Launch full-stack October Frankie from ${GITHUB_SHA}" \
            --parameters file:///tmp/fullstack-october-launch-params.json \
            --timeout-seconds 6600 \
            --query 'Command.CommandId' \
            --output text)"
          status=Pending
          for _ in $(seq 1 440); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|TimedOut|Cancelled) break ;;
            esac
            sleep 15
          done
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json | tee /tmp/fullstack-october-launch-result.json
          test "$status" = Success
          grep -F 'FULLSTACK_LAUNCH_GATES=PASS' /tmp/fullstack-october-launch-result.json
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Publish launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-october-launch-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/fullstack-october-launch-result.json
            /tmp/fullstack-october-launch-identity.json
          if-no-files-found: warn

      - name: Report live full-October run
        if: always()
        shell: bash
        run: |
          unit="ng-exhaustion-frankie-fullstack-october-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          root="/mnt/markets/ng_exhaustion_frankie_fullstack_october_20260824/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "### Full-stack Frankie — October 2021"
            echo "- Live run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Exact commit: ${GITHUB_SHA}"
            echo "- SSM command: ${{ steps.launch.outputs.command_id }}"
            echo "- Unit: \`${unit}\`"
            echo "- Root: \`${root}\`"
            echo "- Artifacts: \`s3://${BUCKET}/${ARTIFACT_PREFIX}/\`"
            echo "- Stop only this run: \`systemctl stop ${unit}\`"
            echo "- Launch gate: knowledge/answer-wall/V3 plus first state, helper, reasoning, probability, and accepted gpt-5.6-sol response receipts"
          } >> "$GITHUB_STEP_SUMMARY"

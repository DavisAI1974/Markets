name: Request archive automation checks
on:
  push:
    branches: ['codex/trading-day-readiness-20260922']
    paths:
      - 'research/kalshi/frankie_boss/git_request_archive_writer.py'
      - 'research/kalshi/frankie_boss/git_request_archive.py'
      - 'tests/test_git_request_archive_writer.py'
      - 'tests/test_request_archive_workflow.py'
      - 'tests/test_critic_request_export.py'
      - 'deploy/aws/host/frankie_host_stage_critic_request.ps1'
      - '.github/workflows/frankie_request_archive_ci.yml'
      - '.github/workflows/frankie_host_stage_critic_request.yml'
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir pytest==9.1.1 cryptography==46.0.3 PyYAML==6.0.3
      - name: Require isolated PowerShell test runtime
        run: command -v pwsh
      - name: Isolated exact-byte archive and orchestration-contract tests
        working-directory: tests
        run: python -B -m pytest test_git_request_archive_writer.py test_request_archive_workflow.py test_critic_request_export.py -q --rootdir=. --confcutdir=. --noconftest -p no:cacheprovider

name: NG Exhaustion Focused POX Fixed-Ledger Gate 20260819

on:
  workflow_dispatch:
    inputs:
      ledger_artifact_id:
        description: 'GitHub Actions artifact id containing the authoritative fixed 3,429 POX ledger'
        required: true
        type: string
      ledger_member_path:
        description: 'Path/name of the ledger inside the downloaded artifact'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  fixed-ledger-gate:
    name: Validate immutable 3,429 POX ledger without population rediscovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ng-exhaustion-entry-timing-revival-20260818
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify fixed-population contract and compile runner
        run: |
          set -euo pipefail
          python -m py_compile research/ng_exhaustion_pox_focused_predict_trade_20260819.py
          python - <<'PY'
          import json
          from pathlib import Path
          launch=json.loads(Path('research/NG_EXHAUSTION_POX_FOCUSED_LAUNCH_20260819.json').read_text())
          protocol=Path('research/NG_EXHAUSTION_POX_FOCUSED_PREDICT_TRADE_PROTOCOL_20260819.md').read_text()
          assert launch['population_reconciliation']=='FIXED_3429_DO_NOT_REOPEN'
          assert launch['master_population_expected']==3429
          assert launch['expected_flip']==1444
          assert launch['expected_same']==1985
          assert launch['population_rediscovery_authorized'] is False
          assert 'FIXED_3429_DO_NOT_REOPEN' in protocol
          assert 'Do **not** re-derive the 3,429' in protocol
          print('fixed POX contract: PASS')
          PY

      - name: Download authoritative ledger artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEDGER_ARTIFACT_ID: ${{ inputs.ledger_artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pox-ledger
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${LEDGER_ARTIFACT_ID}/zip" \
            -o /tmp/pox-ledger.zip
          unzip -q /tmp/pox-ledger.zip -d /tmp/pox-ledger
          find /tmp/pox-ledger -maxdepth 4 -type f -print

      - name: Validate fixed 3,429 ledger
        env:
          LEDGER_MEMBER: ${{ inputs.ledger_member_path }}
        run: |
          set -euo pipefail
          LEDGER="/tmp/pox-ledger/${LEDGER_MEMBER}"
          test -f "${LEDGER}" || { echo "::error::ledger member not found: ${LEDGER_MEMBER}"; exit 1; }
          python research/ng_exhaustion_pox_focused_predict_trade_20260819.py \
            --ledger "${LEDGER}" \
            --out /tmp/NG_EXHAUSTION_POX_FIXED_LEDGER_VALIDATION_20260819.json \
            --normalized-ledger /tmp/NG_EXHAUSTION_POX_FIXED_3429_NORMALIZED_20260819.jsonl.gz
          python - <<'PY'
          import json
          d=json.load(open('/tmp/NG_EXHAUSTION_POX_FIXED_LEDGER_VALIDATION_20260819.json'))
          assert d['status']=='POX_FIXED_LEDGER_VALIDATED'
          assert d['population']['policy']=='FIXED_3429_DO_NOT_REOPEN'
          assert d['population']['total']==3429
          assert d['population']['flip']==1444
          assert d['population']['same']==1985
          assert d['population']['population_rediscovery_performed'] is False
          assert d['promotion_performed'] is False
          assert not any(d['protected_mutations'].values())
          print(json.dumps(d, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ng-exhaustion-pox-fixed-ledger-validation-20260819
          path: |
            /tmp/NG_EXHAUSTION_POX_FIXED_LEDGER_VALIDATION_20260819.json
            /tmp/NG_EXHAUSTION_POX_FIXED_3429_NORMALIZED_20260819.jsonl.gz
          if-no-files-found: error
          retention-days: 14

      - name: State next-stage boundary
        run: |
          echo 'Ledger gate complete. Do not derive POX membership from canonical adjacency.'
          echo 'Next stage: join these fixed identities to causal canonical/raw-tape features and run Targets B/C/D/E.'
          echo 'Target A binary membership prediction additionally requires a separate honest candidate/control universe; do not fabricate negatives.'
          echo 'Do not read D0-D5 result artifacts until standalone POX rules are frozen.'

name: NG Exhaustion Focused POX Standalone 20260819

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  focused-pox-standalone:
    name: Fixed ledger, causal prediction, knowability, and exact execution
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      GITHUB_TOKEN: ${{ github.token }}
      ROSTER_ARTIFACT_ID: '9279235031'
      REVEAL_ARTIFACT_ID: '9273273233'
      BLIND_ARTIFACT_ID: '9274443976'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ng-exhaustion-entry-timing-revival-20260818
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and verify fixed contract
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy scikit-learn
          python -m py_compile \
            research/ng_exhaustion_pox_focused_predict_trade_20260819.py \
            research/ng_exhaustion_pox_fixed_ledger_materialize_20260819.py \
            research/ng_exhaustion_pox_standalone_analysis_20260819.py \
            research/ng_exhaustion_pox_raw_execution_20260819.py \
            research/test_ng_exhaustion_pox_dynamic_live_state_20260820.py
          PYTHONPATH=research python -m unittest research/test_ng_exhaustion_pox_dynamic_live_state_20260820.py
          python - <<'PY'
          import json
          from pathlib import Path
          launch=json.loads(Path('research/NG_EXHAUSTION_POX_FOCUSED_LAUNCH_20260819.json').read_text())
          protocol=Path('research/NG_EXHAUSTION_POX_FOCUSED_PREDICT_TRADE_PROTOCOL_20260819.md').read_text()
          assert launch['population_reconciliation']=='FIXED_3429_DO_NOT_REOPEN'
          assert launch['master_population_expected']==3429
          assert launch['expected_flip']==1546
          assert launch['expected_same']==1883
          assert launch['population_rediscovery_authorized'] is False
          assert launch['prediction_sequence']=='PREBIRTH_FIRST_THEN_H_RESIDUAL_ONLY'
          assert launch['prebirth_calls_removed_before_h_regardless_of_correctness'] is True
          assert launch['execution_after_completed_information_bin'] is True
          assert launch['fixed_prior_horizon_s'] is None
          assert launch['fixed_h_max_s'] is None
          assert launch['h_fallback_checkpoint_policy'].startswith('START_H0; H1_H2_H3_H4_H5; THEN_EVERY_5_SECONDS')
          assert launch['feature_layering_policy'].startswith('RETAIN_BASE_AND_V3; APPEND_V4')
          assert 'FIXED_3429_DO_NOT_REOPEN' in protocol
          assert 'Do **not** re-derive the 3,429' in protocol
          print('fixed POX contract: PASS')
          PY

      - name: Download frozen causal artifacts
        run: |
          set -euo pipefail
          download_artifact() {
            local artifact_id="$1"
            local destination="$2"
            mkdir -p "${destination}"
            curl -L --fail --silent --show-error \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o "/tmp/${artifact_id}.zip"
            unzip -q "/tmp/${artifact_id}.zip" -d "${destination}"
          }
          download_artifact "${ROSTER_ARTIFACT_ID}" /tmp/pox/roster
          download_artifact "${REVEAL_ARTIFACT_ID}" /tmp/pox/reveal
          download_artifact "${BLIND_ARTIFACT_ID}" /tmp/pox/blind
          test -s /tmp/pox/roster/NG_EXHAUSTION_WEEK_CHAIN_STATE_ROSTER_20260817_EVENTS.jsonl.gz
          test -s /tmp/pox/reveal/ng_frankie_reveal_records.json
          test -s /tmp/pox/blind/ng_frankie_blind_records.json

      - name: Materialize and validate immutable fixed ledger
        run: |
          set -euo pipefail
          mkdir -p /tmp/pox/out
          python research/ng_exhaustion_pox_fixed_ledger_materialize_20260819.py \
            --roster /tmp/pox/roster/NG_EXHAUSTION_WEEK_CHAIN_STATE_ROSTER_20260817_EVENTS.jsonl.gz \
            --out-ledger /tmp/pox/out/NG_EXHAUSTION_POX_FIXED_3429_LEDGER_20260819.jsonl \
            --provenance-out /tmp/pox/out/NG_EXHAUSTION_POX_FIXED_3429_PROVENANCE_20260819.json
          python research/ng_exhaustion_pox_focused_predict_trade_20260819.py \
            --ledger /tmp/pox/out/NG_EXHAUSTION_POX_FIXED_3429_LEDGER_20260819.jsonl \
            --out /tmp/pox/out/NG_EXHAUSTION_POX_FIXED_LEDGER_VALIDATION_20260819.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/pox/out/NG_EXHAUSTION_POX_FIXED_LEDGER_VALIDATION_20260819.json'))
          assert d['status']=='POX_FIXED_LEDGER_VALIDATED'
          assert d['population']['policy']=='FIXED_3429_DO_NOT_REOPEN'
          assert (d['population']['total'],d['population']['flip'],d['population']['same'])==(3429,1546,1883)
          assert d['population']['population_rediscovery_performed'] is False
          assert d['promotion_performed'] is False
          assert not any(d['protected_mutations'].values())
          PY

      - name: Download authoritative NG MBP-10 tape
        run: |
          set -euo pipefail
          mkdir -p /tmp/pox/raw
          python - <<'PY' > /tmp/pox/raw_days.txt
          import gzip,json
          from datetime import datetime,timedelta
          roster='/tmp/pox/roster/NG_EXHAUSTION_WEEK_CHAIN_STATE_ROSTER_20260817_EVENTS.jsonl.gz'
          weeks=set()
          with gzip.open(roster,'rt') as f:
              for line in f:
                  if line.strip(): weeks.add(json.loads(line)['week_sunday'])
          assert weeks
          for week in sorted(weeks):
              start=datetime.strptime(week,'%Y%m%d')
              for i in range(6): print((start+timedelta(days=i)).strftime('%Y%m%d'))
          PY
          python - <<'PY' > /tmp/pox/closure_days.txt
          import json
          d=json.load(open('research/NG_EXHAUSTION_20260403_CME_CLOSURE_WITNESS_20260817.json'))
          assert d['status']=='FROZEN_EXCHANGE_CLOSURE_WITNESS'
          for day in d['canonicalization_rule']['explicit_closure_dates']: print(day)
          PY
          while read -r d; do
            mapfile -t keys < <(aws s3api list-objects-v2 \
              --bucket bento-568968024170-us-east-2-an \
              --prefix "nymex/nymex_cont/NG_${d}" \
              --query 'Contents[].Key' --output text \
              | tr '\t' '\n' \
              | grep -E "^nymex/nymex_cont/NG_${d}(_[A-Za-z]{3})?\.jsonl\.gz$" \
              | sort -u || true)
            if grep -qx "${d}" /tmp/pox/closure_days.txt; then
              test "${#keys[@]}" -eq 0 || {
                echo "::error::frozen closure ${d} unexpectedly has raw objects"
                exit 1
              }
              continue
            fi
            test "${#keys[@]}" -eq 1 || {
              echo "::error::expected exactly one authoritative NG raw shard for ${d}; found ${#keys[@]}"
              printf '%s\n' "${keys[@]}"
              exit 1
            }
            aws s3 cp "s3://bento-568968024170-us-east-2-an/${keys[0]}" "/tmp/pox/raw/NG_${d}.jsonl.gz" --only-show-errors
            test -s "/tmp/pox/raw/NG_${d}.jsonl.gz"
          done < /tmp/pox/raw_days.txt

      - name: Run rich causal prebirth-first prediction and branch knowability
        run: |
          set -euo pipefail
          python research/ng_exhaustion_pox_standalone_analysis_20260819.py \
            --ledger /tmp/pox/out/NG_EXHAUSTION_POX_FIXED_3429_LEDGER_20260819.jsonl \
            --roster /tmp/pox/roster/NG_EXHAUSTION_WEEK_CHAIN_STATE_ROSTER_20260817_EVENTS.jsonl.gz \
            --reveal-records /tmp/pox/reveal/ng_frankie_reveal_records.json \
            --blind-records /tmp/pox/blind/ng_frankie_blind_records.json \
            --raw-dir /tmp/pox/raw \
            --out-dir /tmp/pox/out

      - name: Run exact raw-tape execution, successor actions, and delayed SAME watch
        run: |
          set -euo pipefail
          python research/ng_exhaustion_pox_raw_execution_20260819.py \
            --enriched-ledger /tmp/pox/out/NG_EXHAUSTION_POX_CAUSAL_ENRICHED_3429_20260819.jsonl \
            --branch-first-call-ledger /tmp/pox/out/NG_EXHAUSTION_POX_STAGE2_FIRST_CALL_CASCADE_3429_20260819.jsonl \
            --raw-dir /tmp/pox/raw \
            --out-dir /tmp/pox/out

      - name: Final standalone assertions
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('/tmp/pox/out')
          join=json.loads((out/'NG_EXHAUSTION_POX_CAUSAL_JOIN_PROVENANCE_20260819.json').read_text())
          raw=json.loads((out/'NG_EXHAUSTION_POX_RAW_EXECUTION_PROVENANCE_20260819.json').read_text())
          target_a=json.loads((out/'NG_EXHAUSTION_POX_TARGET_A_PREBIRTH_MEMBERSHIP_20260819.json').read_text())
          stage1=json.loads((out/'NG_EXHAUSTION_POX_STAGE1_INITIAL_CONTINUATION_EXECUTION_20260819.json').read_text())
          stage2=json.loads((out/'NG_EXHAUSTION_POX_STAGE2_BRANCH_PREDICTION_20260819.json').read_text())
          stage3=json.loads((out/'NG_EXHAUSTION_POX_STAGE3_SUCCESSOR_ACTION_ECONOMICS_20260819.json').read_text())
          stage4=json.loads((out/'NG_EXHAUSTION_POX_STAGE4_DELAYED_SAME_REEXPRESSION_20260819.json').read_text())
          assert join['rows']==raw['rows']==3429
          assert join['label_counts']=={'FLIP':1546,'SAME':1883}
          assert join['membership_or_label_changes']==0
          assert raw['membership_changes']==raw['label_changes']==0
          assert raw['chart_or_derived_price_substitution'] is False
          assert join['fixed_prediction_horizon_used'] is False
          assert 'DENSE_ROLL20_DIPOLE' in join['v3_live_market_policy']
          assert 'V4_MUST_NOT_REPLACE_RENAME_OR_SHADOW_V3' in join['feature_layer_policy']
          assert target_a['cascade']['prebirth_calls_removed_before_h_regardless_of_correctness'] is True
          assert target_a['h_input_residual_candidate_n'] <= target_a['cascade']['oot_candidate_n']
          assert stage2['cascade']['anti_retry_rule'].startswith('all emitted prebirth calls')
          assert stage2['cascade']['checkpoint_order']['policy'].endswith("each case's causal terminal")
          assert stage2['h_input_residual_n'] <= stage2['cascade']['primary_result']['oot_cases']
          if stage2['prebirth_emitted_n']:
              assert stage2['h_full_population_used'] is False
          expected='PROPOSAL_ONLY_FRESH_PROSPECTIVE_OOT_REQUIRED'
          assert stage1['promotion_status']==stage2['promotion_status']==stage3['promotion_status']==stage4['promotion_status']==expected
          assert stage1['status']=='STAGE1_DYNAMIC_FIRST_CALL_EXACT_RAW_TAPE_COMPLETE_NO_PROMOTION'
          assert stage4['automatic_reentry_authorized'] is False
          print('standalone POX final assertions: PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ng-exhaustion-pox-standalone-exact-20260819
          path: /tmp/pox/out/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve scope boundary
        if: always()
        run: |
          echo 'No D0-D5 result artifact was downloaded or read.'
          echo 'No detector/canonical/frozen play/brain/strategy mutation or promotion was performed.'
          echo 'The D0-D5 incremental crosswalk remains deferred until standalone POX outputs are frozen.'

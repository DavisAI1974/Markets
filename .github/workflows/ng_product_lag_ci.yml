name: NG Product-Specific Lag CI

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - 'research/kalshi/ng_product_lag.py'
      - 'research/kalshi/tests/test_ng_product_lag.py'
      - '.github/workflows/ng_product_lag_ci.yml'
  pull_request:
    paths:
      - 'research/kalshi/ng_product_lag.py'
      - 'research/kalshi/tests/test_ng_product_lag.py'
      - '.github/workflows/ng_product_lag_ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile product lag contract
        run: |
          python -m py_compile \
            research/kalshi/ng_product_lag.py \
            research/kalshi/tests/test_ng_product_lag.py
      - name: Product lag self-test
        run: python research/kalshi/ng_product_lag.py selftest
      - name: Product lag unit tests
        run: python -m unittest -v research/kalshi/tests/test_ng_product_lag.py

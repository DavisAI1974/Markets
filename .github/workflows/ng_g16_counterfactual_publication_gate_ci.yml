name: NG G16 Counterfactual Publication Gate CI

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - research/kalshi/ng_g16_counterfactual_publication_gate.py
      - research/kalshi/ng_g16_counterfactual_curve_authorization.py
      - research/kalshi/ng_g16_prepared_publication_gate.py
      - research/kalshi/tests/test_ng_g16_counterfactual_publication_gate.py
      - .github/workflows/ng_g16_counterfactual_publication_gate_ci.yml
  pull_request:
    paths:
      - research/kalshi/ng_g16_counterfactual_publication_gate.py
      - research/kalshi/ng_g16_counterfactual_curve_authorization.py
      - research/kalshi/ng_g16_prepared_publication_gate.py
      - research/kalshi/tests/test_ng_g16_counterfactual_publication_gate.py
      - .github/workflows/ng_g16_counterfactual_publication_gate_ci.yml

permissions:
  contents: read

jobs:
  counterfactual-publication-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests
        run: python -m pip install --upgrade pip pytest
      - name: Compile lineage-to-publication chain
        working-directory: research/kalshi
        run: |
          python -m py_compile \
            ng_g15_counterfactual_attribution.py \
            ng_g15_counterfactual_lesson_gate.py \
            ng_g15_g16_counterfactual_lineage_gate.py \
            ng_g16_counterfactual_causal_authorization.py \
            ng_g16_counterfactual_curve_authorization.py \
            ng_g16_prepared_publication_gate.py \
            ng_g16_counterfactual_publication_gate.py \
            tests/test_ng_g16_counterfactual_publication_gate.py
      - name: Run focused tests
        working-directory: research/kalshi
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_ng_g16_counterfactual_publication_gate.py
      - name: Verify permanent authority wall
        working-directory: research/kalshi
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import ng_g16_counterfactual_publication_gate as module
          assert module.LOCK_NEXT_STAGE == 'FIXED_G16_BLIND_REFINED_SCORING_WITH_COUNTERFACTUAL_LINEAGE'
          assert 'COUNTERFACTUAL_LINEAGE' in module.LOCK_AUTHORITY
          assert 'SCORED_PUBLICATION' in module.AUTHORITY
          PY

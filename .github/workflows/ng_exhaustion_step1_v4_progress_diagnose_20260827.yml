name: ONE-SHOT APPROVED - NG Exhaustion Step-1 V4 Progress Diagnose 20260827

on:
  push:
    branches:
      - chatgpt/frankie-october-aws-readonly-20260824
    paths:
      - .github/workflows/ng_exhaustion_step1_v4_progress_diagnose_20260827.yml

permissions:
  contents: read

jobs:
  diagnose-v4-progress:
    if: ${{ contains(github.event.head_commit.message, '[APPROVED_STEP1_V4_PROGRESS_DIAGNOSE_20260827]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_DEFAULT_REGION: us-east-2
      INSTANCE_ID: i-08cee7171c0a76a04
      SYSTEMD_UNIT: ng-exhaustion-step1-oom-v4-33078419684-1.service
      CONT_ROOT: /mnt/markets/ng_exhaustion_two_day_full_mbo_step1_20260825/oom_continue/33078419684-1
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Build and syntax-check read-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, shlex, subprocess, textwrap
          unit=os.environ['SYSTEMD_UNIT']
          root=os.environ['CONT_ROOT']
          body=textwrap.dedent(r'''
          set -u -o pipefail
          echo PROGRESS_DIAG_BEGIN
          systemctl show "$unit" -p ActiveState -p SubState -p MainPID -p MemoryCurrent -p MemoryPeak -p CPUUsageNSec --no-pager || true
          pid="$(pgrep -f '[n]g_exhaustion_mbo_2day_full_mbo_step1_20260825.py' | tail -n 1 || true)"
          echo PYTHON_PID=${pid:-MISSING}
          if [ -n "${pid:-}" ] && [ -r "/proc/$pid/status" ]; then
            echo PROC_STATUS_BEGIN
            grep -E '^(Name|State|VmPeak|VmSize|VmRSS|VmSwap|Threads|voluntary_ctxt_switches|nonvoluntary_ctxt_switches):' "/proc/$pid/status" || true
            echo PROC_STATUS_END
            echo PROC_IO_BEGIN
            cat "/proc/$pid/io" || true
            echo PROC_IO_END
            echo PROC_SMAPS_BEGIN
            grep -E '^(Rss|Pss|Private_Clean|Private_Dirty|Swap|SwapPss|Anonymous):' "/proc/$pid/smaps_rollup" || true
            echo PROC_SMAPS_END
            echo PROC_WCHAN=$(cat "/proc/$pid/wchan" 2>/dev/null || true)
            echo SAMPLE1="$(ps -p "$pid" -o etimes=,time=,pcpu=,rss=,stat=,wchan= 2>/dev/null || true)"
            stat1="$(cat "/proc/$pid/stat" 2>/dev/null || true)"
            io1="$(cat "/proc/$pid/io" 2>/dev/null || true)"
            vm1="$(grep -E '^(pswpin|pswpout|pgmajfault|pgfault) ' /proc/vmstat | tr '\n' ' ')"
            sleep 15
            echo SAMPLE2="$(ps -p "$pid" -o etimes=,time=,pcpu=,rss=,stat=,wchan= 2>/dev/null || true)"
            stat2="$(cat "/proc/$pid/stat" 2>/dev/null || true)"
            io2="$(cat "/proc/$pid/io" 2>/dev/null || true)"
            vm2="$(grep -E '^(pswpin|pswpout|pgmajfault|pgfault) ' /proc/vmstat | tr '\n' ' ')"
            echo STAT1="$stat1"
            echo STAT2="$stat2"
            echo IO1_BEGIN; printf '%s\n' "$io1"; echo IO1_END
            echo IO2_BEGIN; printf '%s\n' "$io2"; echo IO2_END
            echo VMSTAT1="$vm1"
            echo VMSTAT2="$vm2"
          fi
          echo MEMORY_BEGIN; free -b || true; echo MEMORY_END
          echo SWAP_BEGIN; swapon --show || true; echo SWAP_END
          echo PSI_MEMORY_BEGIN; cat /proc/pressure/memory 2>/dev/null || true; echo PSI_MEMORY_END
          echo PSI_IO_BEGIN; cat /proc/pressure/io 2>/dev/null || true; echo PSI_IO_END
          echo RESULT_MTIMES_BEGIN
          if [ -d "$root/results" ]; then find "$root/results" -maxdepth 1 -type f -printf '%f|%s|%TY-%Tm-%TdT%TH:%TM:%TS\n' | sort; fi
          echo RESULT_MTIMES_END
          echo PROGRESS_DIAG_COMPLETE=PASS
          ''')
          script='unit='+shlex.quote(unit)+'\nroot='+shlex.quote(root)+'\n'+body
          open('/tmp/v4-progress-remote.sh','w').write(script)
          subprocess.run(['bash','-n','/tmp/v4-progress-remote.sh'], check=True)
          open('/tmp/v4-progress-params.json','w').write(json.dumps({
              'commands':['/bin/bash -lc '+shlex.quote(script)],
              'executionTimeout':['300'],
          }))
          print('PROGRESS_DIAG_LOCAL_SYNTAX=PASS')
          PY

      - name: Diagnose V4 forward progress read-only
        shell: bash
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'Read-only forward-progress diagnosis for Step-1 V4' \
            --parameters file:///tmp/v4-progress-params.json --timeout-seconds 300 \
            --query 'Command.CommandId' --output text)"
          echo SSM_COMMAND_ID="$command_id"
          for poll in $(seq 1 60); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json
          test "$status" = Success

name: NG Exhaustion Step-1 Bounded Three-Month Progress 20260823

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-step1-3mo-finalize-20260823
    paths:
      - .github/workflows/ng_exhaustion_step1_3mo_progress_20260823.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      INSTANCE_ID: i-08cee7171c0a76a04
      CANDIDATE_SHA: 0d318335825b4a0e19a5a2881522f3da0374788e
      BRANCH: chatgpt/ng-exhaustion-step1-3mo-finalize-20260823
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - name: Read exact three worker progress
        shell: bash
        run: |
          set -euo pipefail
          base="/mnt/markets/ng_exhaustion_step1_5y_20260822/$CANDIDATE_SHA"
          python - "$base" <<'PY'
          import json, os, shlex, sys
          base=sys.argv[1]
          remote=r'''
          import json, os, subprocess
          from pathlib import Path
          base=Path(os.environ['BASE']); full=base/'full'; segdir=full/'segments'
          segs=['20210901_20211001','20211001_20211101','20211101_20211201']
          out={}
          for seg in segs:
              unit=f'ng-exhaustion-step1-p3m-{seg}'
              p=subprocess.run(['systemctl','show',unit,'--property=ActiveState,SubState,MainPID','--no-pager'],capture_output=True,text=True)
              state={k:v for k,v in (line.split('=',1) for line in p.stdout.splitlines() if '=' in line)}
              pid=state.get('MainPID','0')
              ps=''
              if pid not in ('','0'):
                  q=subprocess.run(['ps','-p',pid,'-o','pid=,psr=,etimes=,pcpu=,pmem=,rss=,stat=,comm='],capture_output=True,text=True)
                  ps=q.stdout.strip()
              hb=segdir/f'{seg}.heartbeat.json'; log=full/'parallel_3mo'/f'{seg}.log'
              row={'unit':state,'ps':ps,'receipt_exists':(segdir/f'{seg}.receipt.json').is_file(),'seconds_exists':(segdir/f'{seg}.seconds.jsonl.gz').is_file(),'heartbeat_exists':hb.is_file(),'log_exists':log.is_file()}
              if hb.is_file():
                  try: row['heartbeat']=json.loads(hb.read_text())
                  except Exception as exc: row['heartbeat_error']=repr(exc)
              if log.is_file():
                  st=log.stat(); row['log_bytes']=st.st_size; row['log_mtime_ns']=st.st_mtime_ns
                  lines=log.read_text(errors='replace').splitlines(); row['log_tail']=lines[-12:]
              stage=full/'parallel_3mo'/seg/'stage'
              if stage.exists():
                  files=[p for p in stage.rglob('*') if p.is_file()]
                  row['stage_file_count']=len(files); row['stage_bytes']=sum(p.stat().st_size for p in files)
              out[seg]=row
          print(json.dumps({'schema':'NG_EXHAUSTION_STEP1_3MO_PROGRESS_V1_20260823','candidate_commit':os.environ['CANDIDATE_SHA'],'nproc':os.cpu_count(),'segments':out,'raw_mbo_replayed_by_progress_check':False,'frankie_launched':False},sort_keys=True))
          '''
          cmd=f"BASE={shlex.quote(base)} CANDIDATE_SHA={shlex.quote(os.environ['CANDIDATE_SHA'])} python3 - <<'PYREMOTE'\n{remote}\nPYREMOTE"
          json.dump({'commands':[cmd]},open('/tmp/params.json','w'))
          PY
          cid="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Read-only bounded Step-1 progress" --parameters file:///tmp/params.json --timeout-seconds 120 --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$cid" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' --output json > /tmp/result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('/tmp/result.json'))
          if r.get('Status')!='Success' or r.get('ResponseCode')!=0: raise SystemExit(r)
          lines=[x for x in r.get('StandardOutput','').splitlines() if x.strip().startswith('{')]
          if not lines: raise SystemExit(r)
          body=json.loads(lines[-1])
          Path('research/kalshi/NG_EXHAUSTION_STEP1_3MO_PROGRESS_20260823.json').write_text(json.dumps(body,indent=2,sort_keys=True)+'\n')
          PY
      - name: Retain progress evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/kalshi/NG_EXHAUSTION_STEP1_3MO_PROGRESS_20260823.json
          git commit -m 'research: retain bounded Step-1 three-month progress'
          git push origin HEAD:"$BRANCH"

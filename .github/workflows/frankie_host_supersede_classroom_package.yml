name: Frankie supersede the retained classroom package of a cycle
# Moves aside (never deletes) the four host-dipole-classroom-*.c15.json files of one cycle in the
# retained run directory, with sha256 recorded and one receipt in the day directory, so the runner
# rebuilds the package from the current code (pipeline run 35517121900 frames: prime_cache -> _save
# refused the 2026-09-17 bytes). Refuses when the cycle already holds a classroom completion.
# Dispatch only. Inputs reach the shell through env, never by expression interpolation into run:.
on:
  workflow_dispatch:
    inputs:
      instance:
        description: 'Native host instance id'
        required: false
        default: 'i-0e90ee6110ef609aa'
      day:
        description: 'Day whose run directory holds the cycle'
        required: false
        default: '20211003'
      run_root:
        description: 'Day pipeline RunRoot on the host'
        required: false
        default: 'C:/Codex/Frankie-BOSS-20260919/days'
      tools_root:
        description: 'Host tools checkout'
        required: false
        default: 'C:/tools/Frankie-20260919/Markets'
      cycle_index:
        description: 'Zero-padded cycle index whose package is superseded'
        required: false
        default: '00'
permissions:
  contents: read
jobs:
  supersede:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97
      - name: Supersede the classroom package over SSM
        env:
          INSTANCE: ${{ inputs.instance }}
          DAY: ${{ inputs.day }}
          RUN_ROOT: ${{ inputs.run_root }}
          TOOLS_ROOT: ${{ inputs.tools_root }}
          CYCLE_INDEX: ${{ inputs.cycle_index }}
        run: |
          python deploy/aws/ssm_run_ps1.py \
            --instance "$INSTANCE" --region us-east-2 \
            --script deploy/aws/host/frankie_host_supersede_classroom_package.ps1 \
            --set "Day=$DAY" \
            --set "RunRoot=$RUN_ROOT" \
            --set "ToolsRoot=$TOOLS_ROOT" \
            --set "CycleIndex=$CYCLE_INDEX" \
            --timeout 300 --comment "supersede the retained classroom package of cycle $CYCLE_INDEX for day $DAY"

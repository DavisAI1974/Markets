name: Parallel exact Sunday source verification

on:
  push:
    branches: [codex/full-frankie-boss-connection-20260915]
    paths: [.github/frankie-parallel-source-request.json]

permissions:
  contents: read

concurrency:
  group: frankie-parallel-source-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    # GitHub's hosted runner has a provider maximum of six hours.
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/frankie-parallel-source-request.json
            research/kalshi/frankie_boss/granite_request_stage.py
            research/kalshi/frankie_boss/operations/parallel_source
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install transfer dependencies only
        run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97 cryptography==46.0.3
      - name: Prepare private snapshot upload capability
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python research/kalshi/frankie_boss/operations/parallel_source/cloud_transfer.py stage "$RUNNER_TEMP/upload-capability"
      - name: Return encrypted capability to local controller
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parallel-source-upload-capability-${{ github.run_id }}
          path: ${{ runner.temp }}/upload-capability/upload-capability.encrypted.json
          retention-days: 1
          if-no-files-found: error
      - name: Receive exact independent journal snapshot
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python research/kalshi/frankie_boss/operations/parallel_source/cloud_transfer.py fetch "$RUNNER_TEMP/source-verification-input"
      - name: Verify all source evidence using available CPUs
        run: python research/kalshi/frankie_boss/operations/parallel_source/verify_snapshot.py --bundle-dir "$RUNNER_TEMP/source-verification-input/bundle" --output-dir "$RUNNER_TEMP/source-verification-result"
      - name: Preserve verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parallel-source-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source-verification-result/*.json
          retention-days: 14
          if-no-files-found: warn

name: Frankie box control (status or start one EC2 box)
# Greg, 2026-09-21 04:4xZ: "Use the ingest runner as Frankie's box, start it." Starts (or only describes) one
# EC2 instance with deploy/aws/ec2_host.py and tags it KeepRunning=true so the idle guard leaves it alone.
# Never stops, resizes or terminates anything. Dispatch only.
on:
  workflow_dispatch:
    inputs:
      instance:
        description: "Instance id (Frankie's box = the ingest runner i-035994afa8bdf66a5)"
        required: false
        default: 'i-035994afa8bdf66a5'
      region:
        description: 'AWS region of the instance'
        required: false
        default: 'us-east-1'
      action:
        description: 'status (read-only) or start'
        required: true
        default: 'status'
        type: choice
        options: ['status', 'start']
      keep_running:
        description: 'start only: tag KeepRunning=true after the start'
        required: false
        default: 'true'
permissions:
  contents: read
concurrency:
  group: box-control-${{ inputs.instance }}
  cancel-in-progress: false
jobs:
  control:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_EC2_METADATA_DISABLED: 'true'
      INSTANCE: ${{ inputs.instance }}
      REGION: ${{ inputs.region }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97
      - name: Status before (read-only)
        run: python deploy/aws/ec2_host.py --instance "$INSTANCE" --region "$REGION" --hourly 2.02 status
      - name: Start (waits for running, then up to 600 s for SSM Online; a box outside SSM still starts)
        if: inputs.action == 'start'
        continue-on-error: true
        run: python deploy/aws/ec2_host.py --instance "$INSTANCE" --region "$REGION" --hourly 2.02 start
      - name: Tag KeepRunning=true
        if: inputs.action == 'start' && inputs.keep_running == 'true'
        run: |
          python - <<'PY'
          import boto3, os
          iid, region = os.environ['INSTANCE'], os.environ['REGION']
          ec2 = boto3.client('ec2', region_name=region)
          ec2.create_tags(Resources=[iid], Tags=[{'Key': 'KeepRunning', 'Value': 'true'}])
          tags = {t['Key']: t['Value'] for t in ec2.describe_instances(InstanceIds=[iid])['Reservations'][0]['Instances'][0].get('Tags', [])}
          print('KeepRunning =', tags.get('KeepRunning'))
          PY
      - name: Status after (read-only; state, type, SSM, public address)
        if: always()
        run: |
          python - <<'PY'
          import boto3, os
          iid, region = os.environ['INSTANCE'], os.environ['REGION']
          i = boto3.client('ec2', region_name=region).describe_instances(InstanceIds=[iid])['Reservations'][0]['Instances'][0]
          print('state:', i['State']['Name'], ' type:', i['InstanceType'], ' cpu:', i.get('CpuOptions'), ' launched:', i['LaunchTime'].isoformat())
          print('public_dns:', i.get('PublicDnsName') or '(none)', ' private_ip:', i.get('PrivateIpAddress'))
          print('profile:', (i.get('IamInstanceProfile') or {}).get('Arn', '(none)').split('/')[-1], ' key_name:', i.get('KeyName', '(none)'))
          s = boto3.client('ssm', region_name=region).describe_instance_information(Filters=[{'Key': 'InstanceIds', 'Values': [iid]}])['InstanceInformationList']
          print('SSM:', [(x['PingStatus'], x.get('PlatformName', '')) for x in s] or 'not registered')
          PY

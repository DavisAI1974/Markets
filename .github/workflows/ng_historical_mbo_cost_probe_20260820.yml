# retrigger: 2026-08-20
name: NG Historical MBO Cost Probe 20260820

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-entry-timing-revival-20260818
    paths:
      - '.github/workflows/ng_historical_mbo_cost_probe_20260820.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cost-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABENTO_API_KEY: ${{ secrets.MARKETS_NG_LIVE_MBO }}
      RECEIPT: research/kalshi/NG_HISTORICAL_MBO_COST_RECEIPT_20260820.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ng-exhaustion-entry-timing-revival-20260818

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --quiet databento

      - name: Quote only - no data request
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          import databento as db

          key = os.environ.get('DATABENTO_API_KEY')
          out = {
              'schema': 'NG_HISTORICAL_MBO_COST_RECEIPT_V1',
              'checked_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
              'dataset': 'GLBX.MDP3',
              'symbol': 'NG.v.0',
              'stype_in': 'continuous',
              'data_schema': 'mbo',
              'quote_only': True,
              'data_downloaded': False,
              'secret_present': bool(key),
              'secret_exposed': False,
              'quotes': {},
          }
          if not key:
              out['status'] = 'SECRET_UNAVAILABLE'
          else:
              client = db.Historical(key)
              windows = {
                  '3y_2023-08-20_to_2026-08-20': ('2023-08-20', '2026-08-20'),
                  '5y_2021-08-20_to_2026-08-20': ('2021-08-20', '2026-08-20'),
                  'y1_2021-08-20_to_2022-08-20': ('2021-08-20', '2022-08-20'),
                  'y2_2022-08-20_to_2023-08-20': ('2022-08-20', '2023-08-20'),
                  'y3_2023-08-20_to_2024-08-20': ('2023-08-20', '2024-08-20'),
                  'y4_2024-08-20_to_2025-08-20': ('2024-08-20', '2025-08-20'),
                  'y5_2025-08-20_to_2026-08-20': ('2025-08-20', '2026-08-20'),
              }
              for name, (start, end) in windows.items():
                  try:
                      cost = client.metadata.get_cost(
                          dataset='GLBX.MDP3',
                          symbols=['NG.v.0'],
                          stype_in='continuous',
                          schema='mbo',
                          start=start,
                          end=end,
                      )
                      out['quotes'][name] = {'start': start, 'end': end, 'usd': float(cost)}
                  except Exception as exc:
                      out['quotes'][name] = {'start': start, 'end': end, 'error': f'{type(exc).__name__}:{exc}'}
              out['status'] = 'COMPLETE'

          path = Path(os.environ['RECEIPT'])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(out, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(out, indent=2, sort_keys=True))
          PY

      - name: Commit sanitized quote receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RECEIPT" || exit 0
          git config user.name 'Markets Ops Bot'
          git config user.email 'noreply@openai.com'
          git add "$RECEIPT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: record NG historical MBO cost quotes'
          git push origin HEAD:chatgpt/ng-exhaustion-entry-timing-revival-20260818

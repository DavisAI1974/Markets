name: NG Dipole Duration Class Only

on:
  push:
    branches:
      - chatgpt/s40-independent-recalc-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duration_class:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
      - name: Download authoritative NG days
        run: |
          set -euo pipefail
          for d in 20250717 20250923 20250930 20251001; do
            aws s3 cp s3://bento-568968024170-us-east-2-an/nymex/nymex_cont/NG_${d}.jsonl.gz /tmp/NG_${d}.jsonl.gz --only-show-errors
            test -s /tmp/NG_${d}.jsonl.gz
          done
      - name: Run duration-class curve audit
        run: |
          PYTHONPATH=research python research/ng_dipole_duration_class_audit.py \
            /tmp/NG_20250717.jsonl.gz \
            /tmp/NG_20250923.jsonl.gz \
            /tmp/NG_20250930.jsonl.gz \
            /tmp/NG_20251001.jsonl.gz
      - name: Upload duration-class results
        uses: actions/upload-artifact@v4
        with:
          name: ng-dipole-duration-class
          path: ng_dipole_duration_class_results.json

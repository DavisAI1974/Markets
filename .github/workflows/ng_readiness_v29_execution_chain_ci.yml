name: NG readiness v29 recursive materializer provenance execution chain

on:
  push:
    paths:
      - "research/kalshi/ng_corpus_executor_plan_compiler_v24.py"
      - "research/kalshi/ng_corpus_executor_pipeline_arm_v24.py"
      - "research/kalshi/ng_historical_refinement_preflight_v25.py"
      - "research/kalshi/ng_historical_refinement_executor_v25.py"
      - "research/kalshi/ng_historical_refinement_readiness_v29.py"
      - "research/kalshi/ng_corpus_s3_materializer_provenance_gate.py"
      - "research/kalshi/tests/test_ng_readiness_v29_execution_chain.py"
      - "research/kalshi/tests/test_ng_s3_materializer_provenance_readiness_v29.py"
      - ".github/workflows/ng_readiness_v29_execution_chain_ci.yml"
  pull_request:
    paths:
      - "research/kalshi/ng_corpus_executor_plan_compiler_v24.py"
      - "research/kalshi/ng_corpus_executor_pipeline_arm_v24.py"
      - "research/kalshi/ng_historical_refinement_preflight_v25.py"
      - "research/kalshi/ng_historical_refinement_executor_v25.py"
      - "research/kalshi/ng_historical_refinement_readiness_v29.py"
      - "research/kalshi/ng_corpus_s3_materializer_provenance_gate.py"
      - "research/kalshi/tests/test_ng_readiness_v29_execution_chain.py"
      - "research/kalshi/tests/test_ng_s3_materializer_provenance_readiness_v29.py"
      - ".github/workflows/ng_readiness_v29_execution_chain_ci.yml"

jobs:
  readiness-v29-execution-chain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile recursive provenance execution chain
        run: |
          python -m py_compile \
            ng_corpus_s3_materializer_provenance_gate.py \
            ng_historical_refinement_readiness_v29.py \
            ng_historical_refinement_executor_v25.py \
            ng_corpus_executor_plan_compiler_v24.py \
            ng_corpus_executor_pipeline_arm_v24.py \
            ng_historical_refinement_preflight_v25.py \
            tests/test_ng_readiness_v29_execution_chain.py \
            tests/test_ng_s3_materializer_provenance_readiness_v29.py
      - name: Run upstream self-tests
        run: |
          python ng_corpus_s3_materializer_provenance_gate.py selftest
          python ng_historical_refinement_readiness_v29.py --selftest
      - name: Run focused recursive-provenance tests
        run: |
          python -m pytest -q \
            tests/test_ng_s3_materializer_provenance_readiness_v29.py \
            tests/test_ng_readiness_v29_execution_chain.py
      - name: Verify recursive provenance boundary and authority wall
        run: |
          python - <<'PY'
          import ng_corpus_executor_pipeline_arm_v24 as arm
          import ng_corpus_executor_plan_compiler_v24 as compiler
          import ng_historical_refinement_executor_v25 as executor
          import ng_historical_refinement_preflight_v25 as preflight
          import ng_historical_refinement_readiness_v29 as readiness

          keys = [spec.key for spec in readiness.STAGES]
          assert keys[:7] == [
              "corpus_expected_day_contract",
              "corpus_inventory_finalization_contract",
              "corpus_s3_latest_version_resolution",
              "corpus_s3_inventory_capture",
              "corpus_s3_materialization",
              "corpus_s3_materialization_provenance",
              "corpus_coverage",
          ]
          assert readiness.STAGES[5].filename == "ng_corpus_s3_materializer_provenance_gate.json"
          assert executor.SUGGESTED_ENTRYPOINTS["corpus_s3_materialization_provenance"] == (
              "python",
              "ng_corpus_s3_materializer_provenance_gate.py",
              "build",
          )
          assert arm.ARMED_STAGES == compiler.CONFIGURED_STAGES
          assert preflight.READINESS_CONTRACT == readiness.SCHEMA

          authority = {
              "actual_outcomes_used": False,
              "paid_live_data_assumed": False,
              "random_shuffle_used": False,
              "one_signal_authority_preserved": True,
              "blind_forecasts_immutable": True,
              "may_change_blind_forecast": False,
              "may_change_posterior": False,
              "may_update_ng_brain": False,
              "execution_authority": False,
              "cme_event_contracts_mode": "SHADOW",
              "brokerage_contract": "tastytrade_not_ibkr",
              "options_lane_started": False,
          }
          compiler._authority(authority, label="CI authority wall")
          assert not any("option" in key.lower() for key in compiler.CONFIGURED_STAGES)
          PY

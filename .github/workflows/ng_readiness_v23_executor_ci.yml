name: NG readiness v23 guarded executor

on:
  push:
    paths:
      - "research/kalshi/ng_corpus_s3_paginated_latest_version_resolution.py"
      - "research/kalshi/ng_historical_refinement_readiness_v23.py"
      - "research/kalshi/ng_historical_refinement_executor_v19.py"
      - "research/kalshi/tests/test_ng_readiness_v23_executor.py"
      - ".github/workflows/ng_readiness_v23_executor_ci.yml"
  pull_request:
    paths:
      - "research/kalshi/ng_corpus_s3_paginated_latest_version_resolution.py"
      - "research/kalshi/ng_historical_refinement_readiness_v23.py"
      - "research/kalshi/ng_historical_refinement_executor_v19.py"
      - "research/kalshi/tests/test_ng_readiness_v23_executor.py"
      - ".github/workflows/ng_readiness_v23_executor_ci.yml"

jobs:
  readiness-v23-executor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile executor chain
        run: |
          python -m py_compile \
            ng_corpus_s3_paginated_latest_version_resolution.py \
            ng_historical_refinement_readiness_v23.py \
            ng_historical_refinement_executor_v18.py \
            ng_historical_refinement_executor_v19.py \
            tests/test_ng_readiness_v23_executor.py
      - name: Run readiness self-test
        run: python ng_historical_refinement_readiness_v23.py --selftest
      - name: Run focused executor tests
        run: python -m pytest -q tests/test_ng_readiness_v23_executor.py
      - name: Verify executor contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import ng_historical_refinement_executor_v18 as old
          import ng_historical_refinement_executor_v19 as current

          plan = current.build_plan(Path("renders/ng_refine_s95"), Path("."))
          first = plan["stages"][0]
          assert first["expected_output"] == (
              "ng_corpus_s3_paginated_latest_version_resolution_attestation.json"
          )
          assert first["suggested_entrypoint"] == [
              "python",
              "ng_corpus_s3_paginated_latest_version_resolution.py",
              "resolve",
          ]
          old_plan = old.build_plan(Path("renders/ng_refine_s95"), Path("."))
          try:
              current.validate_plan(old_plan)
          except current.HistoricalRefinementExecutionError:
              pass
          else:
              raise AssertionError("legacy v22 resolution plan was accepted")
          assert plan["outcome_paths"] == []
          assert plan["random_shuffle_used"] is False
          assert plan["blind_forecasts_immutable"] is True
          assert plan["may_update_ng_brain"] is False
          assert plan["execution_authority"] is False
          assert plan["cme_event_contracts_mode"] == "SHADOW"
          assert plan["brokerage_contract"] == "tastytrade_not_ibkr"
          assert plan["options_lane_started"] is False
          PY

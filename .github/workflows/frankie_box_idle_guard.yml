# The idle box guard (Greg, 2026-10-07: KeepRunning means "keep running only when in use"; the 2026-09-15 design). Every six
# hours, and by hand: deploy/aws/idle_instance_guard.py stops any Frankie box that is running with KeepRunning not 'true'
# and no fresh lane lease (s3 pod-root/<run>/controller/lease.json within its freshness); a box with KeepRunning=true or a
# fresh lease is left running and reported. Nothing is terminated; no tag is changed. The report is the job's artifact.
# dry_run=true reports without stopping. Source-built 2026-10-07; not run yet.
name: frankie_box_idle_guard
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = report only, stop nothing'
        required: false
        default: 'false'
permissions: {}
concurrency:
  group: frankie-box-idle-guard
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: boto3
        run: python -m pip install --no-cache-dir boto3
      - name: Stop idle Frankie boxes (KeepRunning not true and no fresh lane lease); report everything
        run: |
          set -euo pipefail
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}" = "true" ]; then
            python deploy/aws/idle_instance_guard.py --dry-run --report "$RUNNER_TEMP/idle-guard-report.json"
          else
            python deploy/aws/idle_instance_guard.py --report "$RUNNER_TEMP/idle-guard-report.json"
          fi
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: idle-guard-report-${{ github.run_id }}
          path: ${{ runner.temp }}/idle-guard-report.json
          if-no-files-found: warn
          retention-days: 90

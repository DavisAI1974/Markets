name: NG historical refinement readiness v24

on:
  push:
    paths:
      - "research/kalshi/ng_corpus_s3_paginated_latest_version_resolution.py"
      - "research/kalshi/ng_corpus_s3_inventory_capture.py"
      - "research/kalshi/ng_corpus_s3_paginated_inventory_capture.py"
      - "research/kalshi/ng_historical_refinement_readiness_v23.py"
      - "research/kalshi/ng_historical_refinement_readiness_v24.py"
      - "research/kalshi/ng_historical_refinement_executor_v19.py"
      - "research/kalshi/ng_historical_refinement_executor_v20.py"
      - "research/kalshi/tests/test_ng_corpus_s3_paginated_inventory_capture.py"
      - "research/kalshi/tests/test_ng_historical_refinement_readiness_v24.py"
      - ".github/workflows/ng_historical_refinement_readiness_v24_ci.yml"
  pull_request:
    paths:
      - "research/kalshi/ng_corpus_s3_paginated_latest_version_resolution.py"
      - "research/kalshi/ng_corpus_s3_inventory_capture.py"
      - "research/kalshi/ng_corpus_s3_paginated_inventory_capture.py"
      - "research/kalshi/ng_historical_refinement_readiness_v23.py"
      - "research/kalshi/ng_historical_refinement_readiness_v24.py"
      - "research/kalshi/ng_historical_refinement_executor_v19.py"
      - "research/kalshi/ng_historical_refinement_executor_v20.py"
      - "research/kalshi/tests/test_ng_corpus_s3_paginated_inventory_capture.py"
      - "research/kalshi/tests/test_ng_historical_refinement_readiness_v24.py"
      - ".github/workflows/ng_historical_refinement_readiness_v24_ci.yml"

jobs:
  paginated-inventory-readiness-v24:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile paginated inventory readiness chain
        run: |
          python -m py_compile \
            ng_corpus_s3_paginated_inventory_capture.py \
            ng_historical_refinement_readiness_v24.py \
            ng_historical_refinement_executor_v20.py \
            tests/test_ng_corpus_s3_paginated_inventory_capture.py \
            tests/test_ng_historical_refinement_readiness_v24.py
      - name: Run self-tests
        run: |
          python ng_corpus_s3_paginated_latest_version_resolution.py selftest
          python ng_corpus_s3_paginated_inventory_capture.py selftest
          python ng_historical_refinement_readiness_v24.py --selftest
      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/test_ng_corpus_s3_paginated_inventory_capture.py \
            tests/test_ng_historical_refinement_readiness_v24.py
      - name: Verify dual-pagination boundary and authority wall
        run: |
          python - <<'PY'
          from pathlib import Path
          import ng_historical_refinement_executor_v20 as executor
          import ng_historical_refinement_readiness_v24 as readiness

          keys = [spec.key for spec in readiness.STAGES]
          assert keys[:3] == [
              "corpus_s3_latest_version_resolution",
              "corpus_s3_inventory_capture",
              "corpus_s3_materialization",
          ]
          assert readiness.STAGES[0].filename == (
              "ng_corpus_s3_paginated_latest_version_resolution_attestation.json"
          )
          assert readiness.STAGES[1].filename == (
              "ng_corpus_s3_paginated_inventory_capture_attestation.json"
          )
          assert all(spec.pre_outcome for spec in readiness.STAGES[:3])
          assert executor.SUGGESTED_ENTRYPOINTS[
              "corpus_s3_inventory_capture"
          ] == (
              "python",
              "ng_corpus_s3_paginated_inventory_capture.py",
              "capture",
          )
          plan = executor.build_plan(Path("renders/ng_refine_s95"), Path("."))
          assert plan["outcome_paths"] == []
          assert plan["paid_live_data_assumed"] is False
          assert plan["random_shuffle_used"] is False
          assert plan["one_signal_authority_preserved"] is True
          assert plan["blind_forecasts_immutable"] is True
          assert plan["may_update_ng_brain"] is False
          assert plan["execution_authority"] is False
          assert plan["cme_event_contracts_mode"] == "SHADOW"
          assert plan["brokerage_contract"] == "tastytrade_not_ibkr"
          assert plan["options_lane_started"] is False
          PY

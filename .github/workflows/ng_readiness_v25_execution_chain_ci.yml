name: NG stable historical execution readiness v25

on:
  push:
    paths:
      - "research/kalshi/ng_corpus_expected_day_contract.py"
      - "research/kalshi/ng_historical_refinement_readiness_v25.py"
      - "research/kalshi/ng_historical_refinement_executor_v21.py"
      - "research/kalshi/ng_corpus_executor_plan_compiler_v20.py"
      - "research/kalshi/ng_corpus_executor_pipeline_arm_v20.py"
      - "research/kalshi/ng_historical_refinement_preflight_v21.py"
      - "research/kalshi/tests/test_ng_readiness_v25_execution_chain.py"
      - ".github/workflows/ng_readiness_v25_execution_chain_ci.yml"
  pull_request:
    paths:
      - "research/kalshi/ng_corpus_expected_day_contract.py"
      - "research/kalshi/ng_historical_refinement_readiness_v25.py"
      - "research/kalshi/ng_historical_refinement_executor_v21.py"
      - "research/kalshi/ng_corpus_executor_plan_compiler_v20.py"
      - "research/kalshi/ng_corpus_executor_pipeline_arm_v20.py"
      - "research/kalshi/ng_historical_refinement_preflight_v21.py"
      - "research/kalshi/tests/test_ng_readiness_v25_execution_chain.py"
      - ".github/workflows/ng_readiness_v25_execution_chain_ci.yml"

jobs:
  stable-expected-day-v25:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile stable readiness v25 chain
        run: |
          python -m py_compile \
            ng_corpus_expected_day_contract.py \
            ng_historical_refinement_readiness_v25.py \
            ng_historical_refinement_executor_v21.py \
            ng_corpus_executor_plan_compiler_v20.py \
            ng_corpus_executor_pipeline_arm_v20.py \
            ng_historical_refinement_preflight_v21.py \
            tests/test_ng_readiness_v25_execution_chain.py
      - name: Run upstream self-tests
        run: |
          python ng_corpus_expected_day_contract.py selftest
          python ng_historical_refinement_readiness_v25.py --selftest
      - name: Run stable execution tests
        run: python -m pytest -q tests/test_ng_readiness_v25_execution_chain.py
      - name: Verify expected-day execution boundary
        run: |
          python - <<'PY'
          import ng_corpus_executor_pipeline_arm_v20 as arm
          import ng_corpus_executor_plan_compiler_v20 as compiler
          import ng_historical_refinement_executor_v21 as executor
          import ng_historical_refinement_preflight_v21 as preflight
          import ng_historical_refinement_readiness_v25 as readiness

          keys = [spec.key for spec in readiness.STAGES]
          assert keys[:4] == [
              "corpus_expected_day_contract",
              "corpus_s3_latest_version_resolution",
              "corpus_s3_inventory_capture",
              "corpus_s3_materialization",
          ]
          assert readiness.STAGES[0].filename == (
              "ng_corpus_expected_day_contract_attestation.json"
          )
          assert executor.SUGGESTED_ENTRYPOINTS[
              "corpus_expected_day_contract"
          ] == (
              "python",
              "ng_corpus_expected_day_contract.py",
              "build",
          )
          assert compiler.CONFIGURED_STAGES == arm.ARMED_STAGES
          assert compiler.CONFIGURED_STAGES[:4] == tuple(keys[:4])
          assert preflight.EXECUTOR_CONTRACT == "ng_historical_refinement_executor_v21"
          assert preflight.READINESS_CONTRACT == "ng_historical_refinement_readiness.v25"

          authority = {
              "actual_outcomes_used": False,
              "paid_live_data_assumed": False,
              "random_shuffle_used": False,
              "one_signal_authority_preserved": True,
              "blind_forecasts_immutable": True,
              "may_change_blind_forecast": False,
              "may_change_posterior": False,
              "may_update_ng_brain": False,
              "execution_authority": False,
              "cme_event_contracts_mode": "SHADOW",
              "brokerage_contract": "tastytrade_not_ibkr",
              "options_lane_started": False,
          }
          compiler._authority(authority, label="ci")
          assert not any("option" in key.lower() for key in compiler.CONFIGURED_STAGES)
          PY

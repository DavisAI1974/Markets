name: S131 Score Frozen Current-Frankie G3 Replay

on:
  push:
    branches:
      - chatgpt/burn-hh-12m-s125
    paths:
      - .github/workflows/frankie_g3_s131_score.yml
      - research/kalshi/frankie_g3_s131_score.py
      - research/kalshi/frankie_g3_s131_reconcile_score.py
      - research/kalshi/forecasts/frankie_g3_s131_corrected_reblind/grp3_s131_blind_frozen.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reveal-score-after-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install reveal/scoring runtime
        run: python -m pip install --quiet numpy pandas matplotlib databento boto3

      - name: Score immutable S131 freeze against exact NGV25 MBO actual
        env:
          PYTHONPATH: research/kalshi
          MARKETS_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          MARKETS_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          rm -rf /tmp/g3_s131_score
          python research/kalshi/frankie_g3_s131_score.py --out /tmp/g3_s131_score
          python research/kalshi/frankie_g3_s131_reconcile_score.py \
            --score /tmp/g3_s131_score/g3_s131_score.json \
            --out /tmp/g3_s131_score/g3_s131_score_reconciled.json
          python - <<'PY'
          import json
          p='/tmp/g3_s131_score/g3_s131_score.json'
          d=json.load(open(p))
          assert d['phase']=='POST_FREEZE_REVEAL_SCORE'
          assert d['frozen_sha256']=='3368822121b9c515891c83cb5b3d0a4d85881acff7f3d57cc1e7189870836771'
          assert d['frozen_before_actual_access'] is True
          assert d['actuals_read'] is True
          assert d['hydration']=='REJECTED_NOT_USED'
          assert d['endpoint']['n_days']==10
          assert d['curve']['points']==120
          r=json.load(open('/tmp/g3_s131_score/g3_s131_score_reconciled.json'))
          assert 'S129 reported endpoint actual == exact NGV25 session open-to-close net on all 10 days' in r['basis_proof']['verdict']
          assert r['shared_11_point_intraday_curve']['points_per_run']==110
          print('PASS: S131 revealed/scored after immutable freeze and score bases reconciled')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: frankie-g3-s131-post-freeze-score
          path: /tmp/g3_s131_score
          retention-days: 30
          if-no-files-found: error

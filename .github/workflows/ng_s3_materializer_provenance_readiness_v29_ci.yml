name: NG S3 materializer provenance readiness v29

on:
  push:
    paths:
      - "research/kalshi/ng_corpus_s3_materializer_provenance_gate.py"
      - "research/kalshi/ng_historical_refinement_readiness_v29.py"
      - "research/kalshi/ng_historical_refinement_executor_v25.py"
      - "research/kalshi/ng_corpus_s3_exact_materializer.py"
      - "research/kalshi/ng_corpus_s3_runtime_observed_inventory_capture.py"
      - "research/kalshi/tests/test_ng_s3_materializer_provenance_readiness_v29.py"
      - ".github/workflows/ng_s3_materializer_provenance_readiness_v29_ci.yml"
  pull_request:
    paths:
      - "research/kalshi/ng_corpus_s3_materializer_provenance_gate.py"
      - "research/kalshi/ng_historical_refinement_readiness_v29.py"
      - "research/kalshi/ng_historical_refinement_executor_v25.py"
      - "research/kalshi/ng_corpus_s3_exact_materializer.py"
      - "research/kalshi/ng_corpus_s3_runtime_observed_inventory_capture.py"
      - "research/kalshi/tests/test_ng_s3_materializer_provenance_readiness_v29.py"
      - ".github/workflows/ng_s3_materializer_provenance_readiness_v29_ci.yml"

permissions:
  contents: read

jobs:
  provenance-readiness-v29:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Compile provenance chain
        run: |
          python -m py_compile \
            ng_corpus_s3_materializer_provenance_gate.py \
            ng_historical_refinement_readiness_v29.py \
            ng_historical_refinement_executor_v25.py \
            tests/test_ng_s3_materializer_provenance_readiness_v29.py
      - name: Run module self-tests
        run: |
          python ng_corpus_s3_materializer_provenance_gate.py selftest
          python ng_historical_refinement_readiness_v29.py --selftest
      - name: Run focused tests
        run: python -m pytest -q tests/test_ng_s3_materializer_provenance_readiness_v29.py
      - name: Verify chronology and permanent authority wall
        run: |
          python - <<'PY'
          import ng_historical_refinement_executor_v25 as executor
          import ng_historical_refinement_readiness_v29 as readiness

          keys = [stage.key for stage in readiness.STAGES]
          assert keys.index("corpus_s3_inventory_capture") < keys.index("corpus_s3_materialization")
          assert keys.index("corpus_s3_materialization") < keys.index("corpus_s3_materialization_provenance")
          assert keys.index("corpus_s3_materialization_provenance") < keys.index("corpus_coverage")
          assert readiness._MATERIALIZER_PROVENANCE.pre_outcome is True
          assert executor.SUGGESTED_ENTRYPOINTS["corpus_s3_materialization_provenance"] == (
              "python",
              "ng_corpus_s3_materializer_provenance_gate.py",
              "build",
          )

          authority = {
              "actual_outcomes_used": False,
              "paid_live_data_assumed": False,
              "random_shuffle_used": False,
              "one_signal_authority_preserved": True,
              "blind_forecasts_immutable": True,
              "may_update_ng_brain": False,
              "execution_authority": False,
              "cme_event_contracts_mode": "SHADOW",
              "brokerage_contract": "tastytrade_not_ibkr",
              "options_lane_started": False,
          }
          fixture = readiness._linked_fixture_chain()[
              "corpus_s3_materialization_provenance"
          ]
          for key, expected in authority.items():
              assert fixture.get(key) == expected
          PY

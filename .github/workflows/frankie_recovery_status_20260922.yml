name: Read sealed recovery runtime status
on:
  push:
    branches: ['codex/trading-day-readiness-20260922']
    paths: ['.github/workflows/frankie_recovery_status_20260922.yml']
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97
      - env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python - <<'PY'
          import boto3,json,time
          s=boto3.client('ssm',region_name='us-east-1')
          bucket='frankie-granite42-568968024170-us-east-1'
          s3=boto3.client('s3',region_name='us-east-1')
          dispatch=json.loads(s3.get_object(Bucket=bucket,Key='readiness/20260922/sealed-recovery/35796793428/dispatch.json')['Body'].read())
          current=s.get_command_invocation(CommandId=dispatch['ssm_command_id'],InstanceId=dispatch['instance_id'])
          print('RECOVERY_SSM '+json.dumps(dict(command_id=dispatch['ssm_command_id'],status=current['Status'],stdout=current.get('StandardOutputContent',''),stderr=current.get('StandardErrorContent',''))),flush=True)
          code="""import json,os
          from pathlib import Path
          out=Path('/opt/frankie-box/work/sealed-recovery-35796793428')
          result={'output_exists':out.exists(),'files':[],'progress':None,'processes':[]}
          if out.exists():
              for name in ('source-boundary.json','progress.jsonl','builder-checkpoint.c15.json','completion.json','recovery-receipt.json'):
                  p=out/name
                  if p.is_file():result['files'].append({'name':name,'bytes':p.stat().st_size})
              p=out/'progress.jsonl'
              if p.is_file():
                  lines=p.read_text().splitlines()
                  result['progress']=json.loads(lines[-1]) if lines else None
          for d in Path('/proc').glob('[0-9]*'):
              try:
                  args=(d/'cmdline').read_bytes().split(b'\\0')
                  if b'research.kalshi.frankie_boss.sealed_recovery_run' not in args and not any(b'multiprocessing.spawn' in a for a in args):continue
                  fields=(d/'stat').read_text().split()
                  result['processes'].append({'pid':int(d.name),'ppid':int(fields[3]),'state':fields[2],'user_ticks':fields[13],'system_ticks':fields[14],'rss_pages':fields[23]})
              except OSError:pass
          print('RUNTIME_STATUS '+json.dumps(result,sort_keys=True))
          """
          script="/opt/frankie-box/venv/bin/python - <<'READ_ONLY_STATUS'\n"+code+"\nREAD_ONLY_STATUS\n"
          cid=s.send_command(InstanceIds=[dispatch['instance_id'}},DocumentName='AWS-RunShellScript',Parameters={'commands':[script],'executionTimeout':['120']},Comment='Read-only current recovery progress; no process control')['Command']['CommandId']
          while True:
              time.sleep(3)
              try:r=s.get_command_invocation(CommandId=cid,InstanceId=dispatch['instance_id'])
              except s.exceptions.InvocationDoesNotExist:continue
              if r['Status'] not in ('Pending','InProgress','Delayed'):break
          print(r.get('StandardOutputContent',''),flush=True)
          print(r.get('StandardErrorContent',''),flush=True)
          assert r['Status']=='Success'
          PY

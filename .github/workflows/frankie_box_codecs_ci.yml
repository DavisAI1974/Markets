name: Frankie box codecs (render, digest, stacked text, head) tests
# The exact-render codecs the box session reads through (deploy/aws/box/frankie_box_*_render.py, frankie_box_stacked_text.py)
# are proven by parse-back; this runs their tests on every push that touches them (test-engineer, /ship 2026-09-21).
# No torch: the tests load the codec modules as a namespace package. Trunk registration is Greg's word.
on:
  push:
    paths:
      - 'deploy/aws/box/frankie_box_reading_render.py'
      - 'deploy/aws/box/frankie_box_digest_render.py'
      - 'deploy/aws/box/frankie_box_stacked_text.py'
      - 'deploy/aws/box/frankie_box_head_render.py'
      - 'research/kalshi/frankie_boss/granite_context_stacked.py'
      - 'research/kalshi/frankie_boss/c15_journal.py'
      - 'research/kalshi/frankie_boss/causal_packet.py'
      - 'research/kalshi/frankie_boss/operations/serverless_reading_endpoint.py'
      - 'tests/test_frankie_box_*.py'
      - 'tests/test_frankie_serverless_reading_endpoint.py'
      - 'deploy/aws/box/frankie_box_docs.py'
      - 'deploy/aws/box/frankie_box_brain.py'
      - 'deploy/aws/box/frankie_box_classroom.py'
      - 'deploy/aws/box/frankie_box_heartbeat.py'
      - 'deploy/aws/box/frankie_box_compare.py'
      - 'deploy/aws/box/frankie_box_receipts.py'
      - 'tests/test_frankie_box_packets.py'
      - 'tests/test_frankie_box_classroom.py'
      - 'research/kalshi/frankie_boss/dipole_classroom*.py'
      - 'tests/test_frankie_box_brain.py'
      - 'research/kalshi/frankie_boss/operations/record_actual_frankie_response.py'
      - 'deploy/aws/host/frankie_host_record_principal_response.ps1'
      - 'tests/test_frankie_host_recorder_script.py'
      - 'tests/test_frankie_correction_turn_plumbing.py'
      - 'deploy/aws/box/frankie_box_push_response.sh'
      - 'deploy/aws/box/frankie_box_session.sh'
      - 'deploy/aws/host/frankie_host_export_principal_request.ps1'
      - '.github/workflows/frankie_box_fetch_response.yml'
      - '.github/workflows/frankie_host_export_principal_request.yml'
      - '.github/workflows/frankie_host_record_principal_response.yml'
      - 'deploy/aws/box/frankie_box_boss_session.py'
      - 'tests/test_frankie_box_docs.py'
      - 'tests/test_frankie_box_boss_session_*.py'
      - '.github/workflows/frankie_box_codecs_ci.yml'
      - 'deploy/aws/box/producers_checkout.sh'
      - 'deploy/aws/box/frankie_box_bedrock.py'
      - 'deploy/aws/box/frankie_box_teach.py'
      - 'tests/_producers.py'
      - 'tests/test_producers_checkout.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FRANKIE_BOX_PRODUCERS: ${{ github.workspace }}/.producers-2ebb8ce8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      # numpy: research.refrag (reached by the session's serverless_job through granite_sagemaker) imports markets_adapter;
      # run 35663044367 failed on its absence (ModuleNotFoundError qsv_registry, the bare-name fallback)
      - run: python -m pip install --no-cache-dir pytest==9.1.1 pyyaml==6.0.2 "numpy>=1.26,<3"
      # BR-0: the pinned producers as an in-repo worktree (never a scratchpad); the tests reach it through FRANKIE_BOX_PRODUCERS
      - run: bash deploy/aws/box/producers_checkout.sh
      - run: python -m pytest -q tests/test_frankie_box_digest_render.py tests/test_frankie_box_reading_render.py tests/test_frankie_box_stacked_text.py tests/test_frankie_box_head_render.py tests/test_frankie_serverless_reading_endpoint.py tests/test_frankie_box_docs.py tests/test_frankie_box_boss_session_merge.py tests/test_frankie_box_boss_session_reading.py tests/test_frankie_box_brain.py tests/test_frankie_host_recorder_script.py tests/test_frankie_box_classroom.py tests/test_frankie_box_boss_session_classroom.py tests/test_frankie_correction_turn_plumbing.py tests/test_frankie_box_packets.py tests/test_frankie_box_boss_session_rerun.py tests/test_producers_checkout.py tests/test_frankie_box_bedrock.py tests/test_frankie_box_boss_session_derive.py tests/test_frankie_box_boss_session_teach.py

name: Frankie box codecs (render, digest, stacked text, head) tests
# The exact-render codecs the box session reads through (deploy/aws/box/frankie_box_*_render.py, frankie_box_stacked_text.py)
# are proven by parse-back; this runs their tests on every push that touches them (test-engineer, /ship 2026-09-21).
# No torch: the tests load the codec modules as a namespace package. Trunk registration is Greg's word.
on:
  push:
    paths:
      - 'deploy/aws/box/frankie_box_reading_render.py'
      - 'deploy/aws/box/frankie_box_digest_render.py'
      - 'deploy/aws/box/frankie_box_stacked_text.py'
      - 'deploy/aws/box/frankie_box_head_render.py'
      - 'research/kalshi/frankie_boss/granite_context_stacked.py'
      - 'research/kalshi/frankie_boss/c15_journal.py'
      - 'research/kalshi/frankie_boss/causal_packet.py'
      - 'research/kalshi/frankie_boss/operations/serverless_reading_endpoint.py'
      - 'tests/test_frankie_box_*.py'
      - 'tests/test_frankie_serverless_reading_endpoint.py'
      - 'deploy/aws/box/frankie_box_docs.py'
      - 'deploy/aws/box/frankie_box_boss_session.py'
      - 'tests/test_frankie_box_docs.py'
      - 'tests/test_frankie_box_boss_session_*.py'
      - '.github/workflows/frankie_box_codecs_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir pytest==9.1.1
      - run: python -m pytest -q tests/test_frankie_box_digest_render.py tests/test_frankie_box_reading_render.py tests/test_frankie_box_stacked_text.py tests/test_frankie_box_head_render.py tests/test_frankie_serverless_reading_endpoint.py tests/test_frankie_box_docs.py tests/test_frankie_box_boss_session_merge.py tests/test_frankie_box_boss_session_reading.py

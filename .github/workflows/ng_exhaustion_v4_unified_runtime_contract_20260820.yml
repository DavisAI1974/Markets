name: NG Exhaustion V4 Unified Runtime Contract 20260820

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-entry-timing-revival-20260818
    paths:
      - research/kalshi/ng_exhaustion_v4_unified_runtime.py
      - research/kalshi/tests/test_ng_exhaustion_v4_unified_runtime.py
      - .github/workflows/ng_exhaustion_v4_unified_runtime_contract_20260820.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pytest
      - name: Run unified runtime adversarial tests
        run: |
          set +e
          python -m pytest -q research/kalshi/tests/test_ng_exhaustion_v4_unified_runtime.py > /tmp/unified.txt 2>&1
          code=$?
          echo "$code" > /tmp/unified.code
          cat /tmp/unified.txt
          exit 0
      - name: Write exact-SHA receipt
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          paths=['research/kalshi/ng_exhaustion_v4_unified_runtime.py','research/kalshi/tests/test_ng_exhaustion_v4_unified_runtime.py']
          code=int(Path('/tmp/unified.code').read_text().strip()) if Path('/tmp/unified.code').exists() else 999
          out={
            'schema':'NG_EXHAUSTION_V4_UNIFIED_RUNTIME_RECEIPT_V1',
            'runner_commit':os.environ.get('GITHUB_SHA'),
            'tests_passed':code==0,
            'pytest_exit_code':code,
            'test_output':Path('/tmp/unified.txt').read_text() if Path('/tmp/unified.txt').exists() else 'pytest did not run',
            'files':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},
            'one_registry':True,'one_engine':True,'one_reconciler':True,'alternate_d4_d5_engine':False,
            'v4_empirical_launch':False,'promotion_performed':False,'permanent_frankie_mutation':False,
          }
          text=json.dumps(out,indent=2,sort_keys=True)+'\n'
          Path('/tmp/unified_receipt.json').write_text(text)
          Path('research/kalshi/NG_EXHAUSTION_V4_UNIFIED_RUNTIME_RECEIPT_20260820.json').write_text(text)
          PY
      - name: Commit receipt safely
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch='chatgpt/ng-exhaustion-entry-timing-revival-20260818'
          path='research/kalshi/NG_EXHAUSTION_V4_UNIFIED_RUNTIME_RECEIPT_20260820.json'
          for attempt in 1 2 3 4; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            cp /tmp/unified_receipt.json "$path"
            git add "$path"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'research: record unified V4 runtime verification'
            if git push origin HEAD:"$branch"; then exit 0; fi
          done
          exit 1

# Trigger revision: exact-SHA unified registry/engine/reconciler verification only; no launch.

name: Stage exact Granite request capability

on:
  workflow_dispatch:
    inputs:
      request_sha256:
        description: SHA256 of the complete actual request
        required: true
        type: string
      request_bytes:
        description: Exact complete request byte count
        required: true
        type: string
      recipient_public_key_der_base64:
        description: Local recipient RSA public key in base64 DER SubjectPublicKeyInfo format
        required: true
        type: string
  push:
    branches: [codex/full-frankie-boss-connection-20260915]
    paths: [.github/frankie-request-stage-request.json]

permissions:
  contents: read

jobs:
  stage:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
      REQUEST_SHA256: ${{ inputs.request_sha256 }}
      REQUEST_BYTES: ${{ inputs.request_bytes }}
      RECIPIENT_PUBLIC_KEY_DER_BASE64: ${{ inputs.recipient_public_key_der_base64 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install boto3==1.42.23 botocore==1.42.97 cryptography==46.0.3
      - name: Prepare one conditional checksum-bound PUT capability
        run: python research/kalshi/frankie_boss/granite_request_stage.py
      - name: Retain sensitive capability for the authorized local controller
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: granite-request-stage-sensitive-${{ github.run_id }}
          path: work/request-stage-sensitive/request-stage.encrypted.json
          retention-days: 1
          if-no-files-found: error

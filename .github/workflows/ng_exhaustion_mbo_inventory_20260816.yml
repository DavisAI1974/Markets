name: NG Exhaustion MBO Inventory 20260816

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-frankie-blind-20260816
    paths:
      - .github/workflows/ng_exhaustion_mbo_inventory_20260816.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      BUCKET: bento-568968024170-us-east-2-an
    steps:
      - uses: actions/checkout@v4
      - name: Inventory contract MBO stores for exact exhaustion dates
        run: |
          set -euo pipefail
          : > mbo_inventory.txt
          aws s3 ls s3://${BUCKET}/nymex/ | awk '$1=="PRE" && $2 ~ /^ng_mbo_/ {print $2}' | sort > mbo_prefixes.txt
          echo "prefix_count=$(wc -l < mbo_prefixes.txt)" >> mbo_inventory.txt
          for p in $(cat mbo_prefixes.txt); do
            for d in 20250717 20250923 20250930 20251001; do
              key="nymex/${p}NG_${d}.dbn.zst"
              if aws s3api head-object --bucket "${BUCKET}" --key "${key}" >/tmp/head.json 2>/dev/null; then
                size=$(python -c 'import json; print(json.load(open("/tmp/head.json"))["ContentLength"])')
                echo "FOUND ${key} ${size}" >> mbo_inventory.txt
              fi
            done
          done
          cat mbo_inventory.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ng-exhaustion-mbo-inventory-20260816
          path: |
            mbo_prefixes.txt
            mbo_inventory.txt

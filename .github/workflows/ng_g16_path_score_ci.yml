name: NG G16 Path Score CI

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - 'research/kalshi/ng_g16_path_score.py'
      - 'research/kalshi/ng_g16_curve_adapter.py'
      - 'research/kalshi/ng_g16_shadow_gate.py'
      - 'research/kalshi/ng_g16_blind_wall.py'
      - 'research/kalshi/tests/test_ng_g16_path_score.py'
      - '.github/workflows/ng_g16_path_score_ci.yml'
  pull_request:
    paths:
      - 'research/kalshi/ng_g16_path_score.py'
      - 'research/kalshi/ng_g16_curve_adapter.py'
      - 'research/kalshi/ng_g16_shadow_gate.py'
      - 'research/kalshi/ng_g16_blind_wall.py'
      - 'research/kalshi/tests/test_ng_g16_path_score.py'
      - '.github/workflows/ng_g16_path_score_ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile G16 scoring authority chain
        run: |
          python -m py_compile \
            research/kalshi/ng_g16_blind_wall.py \
            research/kalshi/ng_g16_shadow_gate.py \
            research/kalshi/ng_g16_shadow_runner.py \
            research/kalshi/ng_g16_curve_adapter.py \
            research/kalshi/ng_g16_path_score.py \
            research/kalshi/tests/test_ng_g16_path_score.py
      - name: Run G16 path scorer self-test
        working-directory: research/kalshi
        run: python ng_g16_path_score.py --selftest
      - name: Run G16 path scorer tests
        run: python -m unittest -v research/kalshi/tests/test_ng_g16_path_score.py

name: NG Exhaustion Aftermath Validate 20260817

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-aftermath-20260817
    paths:
      - research/NG_EXHAUSTION_AFTERMATH_CAUSAL_VALIDATION_FREEZE_20260817.json
      - research/NG_EXHAUSTION_AFTERMATH_ENDPOINT_CONFIRMATION_ADDENDUM_20260817.json
      - research/ng_exhaustion_aftermath_validate_v2_20260817.py
      - .github/workflows/ng_exhaustion_aftermath_validate_20260817.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate_v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      BUCKET: bento-568968024170-us-east-2-an
      REVEAL_ARTIFACT_ID: '9273273233'
      BLIND_ARTIFACT_ID: '9274443976'
      REVEAL_SHA256: '127e936355be479398e14f20f071f81b0d22a2975b02e87a1a3e0a044ec023e1'
      BLIND_SHA256: '224be8b033c1a03d638d7b84aef849363067e1961e9945e72bc86b52c3d01c39'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen causal contract and endpoint addendum
        run: |
          set -euo pipefail
          test -s research/NG_EXHAUSTION_AFTERMATH_CAUSAL_VALIDATION_FREEZE_20260817.json
          test -s research/NG_EXHAUSTION_AFTERMATH_ENDPOINT_CONFIRMATION_ADDENDUM_20260817.json
          python - <<'PY'
          import json
          x=json.load(open('research/NG_EXHAUSTION_AFTERMATH_CAUSAL_VALIDATION_FREEZE_20260817.json'))
          a=json.load(open('research/NG_EXHAUSTION_AFTERMATH_ENDPOINT_CONFIRMATION_ADDENDUM_20260817.json'))
          assert x['status']=='FROZEN_PREVALIDATION'
          assert x['target1']['holdout_retuning'] is False
          assert a['status']=='FROZEN_PREVALIDATION_ADDENDUM'
          assert a['endpoint_semantics']['hardcoded_end_time'] is False
          assert a['endpoint_semantics']['primary_aftermath_anchor']=='causal_confirmation_second'
          assert a['validation_rule']['no_heldout_retuning'] is True
          PY
      - name: Download exact frozen reveal and blind artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REVEAL_ARTIFACT_ID}/zip" -o /tmp/reveal.zip
          curl -L --fail --silent --show-error -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BLIND_ARTIFACT_ID}/zip" -o /tmp/blind.zip
          echo "${REVEAL_SHA256}  /tmp/reveal.zip" | sha256sum -c -
          echo "${BLIND_SHA256}  /tmp/blind.zip" | sha256sum -c -
          mkdir -p /tmp/reveal /tmp/blind
          unzip -q /tmp/reveal.zip ng_frankie_reveal_records.json -d /tmp/reveal
          unzip -q /tmp/blind.zip ng_frankie_blind_records.json -d /tmp/blind
      - name: Download contiguous target-week NG raw corpus
        run: |
          set -euo pipefail
          mkdir -p /tmp/ngweeks
          optional=(20250713 20250921 20250928)
          required=(
            20250714 20250715 20250716 20250717 20250718
            20250922 20250923 20250924 20250925 20250926
            20250929 20250930 20251001 20251002 20251003
          )
          for d in "${required[@]}"; do
            aws s3 cp "s3://${BUCKET}/nymex/nymex_cont/NG_${d}.jsonl.gz" "/tmp/ngweeks/NG_${d}.jsonl.gz" --only-show-errors
            test -s "/tmp/ngweeks/NG_${d}.jsonl.gz"
          done
          for d in "${optional[@]}"; do
            if aws s3api head-object --bucket "${BUCKET}" --key "nymex/nymex_cont/NG_${d}.jsonl.gz" >/dev/null 2>&1; then
              aws s3 cp "s3://${BUCKET}/nymex/nymex_cont/NG_${d}.jsonl.gz" "/tmp/ngweeks/NG_${d}.jsonl.gz" --only-show-errors
            fi
          done
          find /tmp/ngweeks -type f -name 'NG_*.jsonl.gz' -size +0c | sort > /tmp/raw_paths.txt
          cat /tmp/raw_paths.txt
      - name: Build endpoint-confirmed causal aftermath table
        run: |
          set -euo pipefail
          mapfile -t RAW < /tmp/raw_paths.txt
          python research/ng_exhaustion_aftermath_validate_v2_20260817.py \
            --reveal-records /tmp/reveal/ng_frankie_reveal_records.json \
            --holdout-records /tmp/blind/ng_frankie_blind_records.json \
            "${RAW[@]}"
      - name: Upload causal validation V2
        uses: actions/upload-artifact@v4
        with:
          name: ng-exhaustion-aftermath-validation-v2-20260817
          path: |
            NG_EXHAUSTION_AFTERMATH_VALIDATION_V2_20260817.json
            NG_EXHAUSTION_AFTERMATH_VALIDATION_V2_20260817_EVENT_TABLE.jsonl.gz
          if-no-files-found: error

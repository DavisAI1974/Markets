name: NG readiness v20 S3 materialization wall

on:
  push:
    paths:
      - "research/kalshi/ng_corpus_s3_materialization_attestation.py"
      - "research/kalshi/ng_corpus_s3_materialization_stage.py"
      - "research/kalshi/ng_historical_refinement_readiness_v20.py"
      - "research/kalshi/ng_historical_refinement_executor_v16.py"
      - "research/kalshi/ng_corpus_executor_plan_compiler_v15.py"
      - "research/kalshi/ng_corpus_executor_pipeline_arm_v15.py"
      - "research/kalshi/ng_historical_refinement_preflight_v16.py"
      - "research/kalshi/tests/test_ng_readiness_v20_s3_materialization.py"
      - ".github/workflows/ng_readiness_v20_s3_materialization_ci.yml"
  pull_request:
    paths:
      - "research/kalshi/ng_corpus_s3_materialization_attestation.py"
      - "research/kalshi/ng_corpus_s3_materialization_stage.py"
      - "research/kalshi/ng_historical_refinement_readiness_v20.py"
      - "research/kalshi/ng_historical_refinement_executor_v16.py"
      - "research/kalshi/ng_corpus_executor_plan_compiler_v15.py"
      - "research/kalshi/ng_corpus_executor_pipeline_arm_v15.py"
      - "research/kalshi/ng_historical_refinement_preflight_v16.py"
      - "research/kalshi/tests/test_ng_readiness_v20_s3_materialization.py"
      - ".github/workflows/ng_readiness_v20_s3_materialization_ci.yml"

jobs:
  readiness-v20-s3-materialization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile S3-attested execution chain
        run: |
          python -m py_compile \
            ng_corpus_s3_materialization_attestation.py \
            ng_corpus_s3_materialization_stage.py \
            ng_historical_refinement_readiness_v20.py \
            ng_historical_refinement_executor_v16.py \
            ng_corpus_executor_plan_compiler_v15.py \
            ng_corpus_executor_pipeline_arm_v15.py \
            ng_historical_refinement_preflight_v16.py \
            tests/test_ng_readiness_v20_s3_materialization.py
      - name: Run upstream materialization self-test
        run: python ng_corpus_s3_materialization_attestation.py --self-test
      - name: Run readiness self-test
        run: python ng_historical_refinement_readiness_v20.py --selftest
      - name: Run focused tests
        run: python -m pytest -q tests/test_ng_readiness_v20_s3_materialization.py
      - name: Verify S3 wall and permanent authority controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import ng_corpus_executor_plan_compiler_v15 as compiler
          import ng_historical_refinement_executor_v16 as executor
          import ng_historical_refinement_preflight_v16 as preflight
          import ng_historical_refinement_readiness_v20 as readiness

          keys = [spec.key for spec in readiness.STAGES]
          assert keys[0:3] == [
              "corpus_s3_materialization",
              "corpus_coverage",
              "corpus_definition_byte_binding",
          ]
          assert compiler.CONFIGURED_STAGES[0] == "corpus_s3_materialization"
          assert preflight.READINESS_CONTRACT == "ng_historical_refinement_readiness.v20"
          assert preflight.EXECUTOR_CONTRACT == "ng_historical_refinement_executor_v16"
          plan = executor.build_plan(Path("renders/ng_refine_s95"), Path("."))
          assert plan["outcome_paths"] == []
          assert plan["paid_live_data_assumed"] is False
          assert plan["random_shuffle_used"] is False
          assert plan["one_signal_authority_preserved"] is True
          assert plan["blind_forecasts_immutable"] is True
          assert plan["may_update_ng_brain"] is False
          assert plan["execution_authority"] is False
          assert plan["cme_event_contracts_mode"] == "SHADOW"
          assert plan["brokerage_contract"] == "tastytrade_not_ibkr"
          assert plan["options_lane_started"] is False
          PY

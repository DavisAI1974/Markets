name: NG Exhaustion D0 Root Value Post V2 20260819

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-entry-timing-revival-20260818
    paths:
      - research/generated/ng_exhaustion_entry_timing_revival_20260819/d1_d5_chain_birth_agents_v2/NG_EXHAUSTION_D1_D5_CHAIN_BIRTH_V2_ALL_AGENT_RESULTS_20260819.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  V2_RESULTS: research/generated/ng_exhaustion_entry_timing_revival_20260819/d1_d5_chain_birth_agents_v2/NG_EXHAUSTION_D1_D5_CHAIN_BIRTH_V2_ALL_AGENT_RESULTS_20260819.json

jobs:
  d0-root-value:
    name: Root-stage value for D1-D5 prediction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ng-exhaustion-entry-timing-revival-20260818
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet numpy scikit-learn
      - name: Verify corrected D0 contract and V2 dependency boundary
        run: |
          set -euo pipefail
          test -f research/NG_EXHAUSTION_D0_PREDICTABLE_TRADEABLE_PROTOCOL_20260819.md
          test -f "${V2_RESULTS}"
          python -m py_compile research/ng_exhaustion_d0_focused_agents_20260819.py
          python - <<'PY'
          p=open('research/NG_EXHAUSTION_D0_PREDICTABLE_TRADEABLE_PROTOCOL_20260819.md').read()
          assert 'Agents A and B may run immediately' in p
          assert "Agent C's D2/D3 root-ablation audit waits only" in p
          print('post-V2 dependency boundary: PASS')
          PY
      - name: Audit causal root-stage incremental value
        run: |
          PYTHONPATH=research:research/kalshi python research/ng_exhaustion_d0_focused_agents_20260819.py \
            --mode root-value \
            --v2-results "${V2_RESULTS}" \
            --out /tmp/NG_EXHAUSTION_D0_ROOT_VALUE_AGENT_20260819.json
      - name: Fail closed on boundaries
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/NG_EXHAUSTION_D0_ROOT_VALUE_AGENT_20260819.json'))
          assert d['status']=='D0_ROOT_INCREMENTAL_AUDIT_COMPLETE'
          assert d['realized_exact_d0_label_used_as_feature'] is False
          assert set(d['results'])=={'D1','D2','D3','D4','D5'}
          assert d['promotion_performed'] is False
          assert not any(d['protected_mutations'].values())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ng-exhaustion-d0-root-value-20260819
          path: /tmp/NG_EXHAUSTION_D0_ROOT_VALUE_AGENT_20260819.json
          if-no-files-found: error
      - name: Commit durable root-value audit and proposal addendum
        run: |
          set -euo pipefail
          OUT=research/generated/ng_exhaustion_d0_root_value_20260819
          mkdir -p "${OUT}"
          cp /tmp/NG_EXHAUSTION_D0_ROOT_VALUE_AGENT_20260819.json "${OUT}/"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/generated/ng_exhaustion_d0_root_value_20260819/NG_EXHAUSTION_D0_ROOT_VALUE_AGENT_20260819.json')
          d=json.loads(p.read_text())
          lines=['# NG Exhaustion D0 Root-Stage Incremental Value — 2026-08-19','',
                 'Status: **post-V2 paired root-ablation audit complete; standalone D0 prediction/trade remains independent.**','',
                 '## Results']
          for k in ['D1','D2','D3','D4','D5']:
              lines.append(f"- {k}: `{d['results'][k]['verdict']}`")
          lines += ['', '## Boundary','- Realized exact-D0 identity was never used to predict a deeper stage.',
                    '- This audit does not gate or supersede standalone D0 prediction/trading.',
                    '- D4/D5 remain preserved low-support case evidence.',
                    '- No protected component was modified and no play was promoted.']
          Path('research/generated/ng_exhaustion_d0_root_value_20260819/NG_EXHAUSTION_D0_ROOT_VALUE_ALL_FINDINGS_20260819.md').write_text('\n'.join(lines)+'\n')
          proposal={
            'name':'NG exhaustion D0 root-stage deeper-chain value proposal addendum',
            'date':'2026-08-19',
            'status':'PROPOSAL_ONLY_NOT_MERGED',
            'root_incremental_value':{k:v['verdict'] for k,v in d['results'].items()},
            'standalone_D0_dependency':False,
            'realized_exact_D0_label_used_for_deeper_prediction':False,
            'failed_or_mixed_results_preserved':True,
            'permanent_frankie_mutation':False,
            'promotion_performed':False,
          }
          Path('research/kalshi/knowledge/ng_brain_exhaustion_d0_root_value_addendum_20260819.json').write_text(json.dumps(proposal,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/generated/ng_exhaustion_d0_root_value_20260819 research/kalshi/knowledge/ng_brain_exhaustion_d0_root_value_addendum_20260819.json
          git diff --cached --quiet && exit 0
          git commit -m "Record D0 root-stage deeper-chain value audit"
          for i in 1 2 3; do
            git pull --rebase origin chatgpt/ng-exhaustion-entry-timing-revival-20260818 && \
            git push origin HEAD:chatgpt/ng-exhaustion-entry-timing-revival-20260818 && exit 0
            sleep $((i*5))
          done
          exit 1

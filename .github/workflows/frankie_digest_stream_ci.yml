name: Frankie streaming digest codec checks
on:
  push:
    branches: ['codex/trading-day-readiness-20260922']
    paths:
      - 'deploy/aws/box/frankie_box_digest_stream.py'
      - 'deploy/aws/box/frankie_box_digest_render.py'
      - 'tests/test_digest_stream.py'
      - 'tests/test_frankie_box_digest_render.py'
      - '.github/workflows/frankie_digest_stream_ci.yml'
permissions:
  contents: read
jobs:
  codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir pytest==9.1.1
      - name: Exact codec differential and streamed inverse checks
        working-directory: tests
        run: python -m pytest test_digest_stream.py test_frankie_box_digest_render.py -q --rootdir=. --confcutdir=. --noconftest -p no:cacheprovider

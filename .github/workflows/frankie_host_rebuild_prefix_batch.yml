name: Frankie rebuild the two-cycle prefix batch on the native host
# Moves aside (never deletes) the code-pinned files of the retained two-cycle prefix batch, re-runs
# the gold-standard prefix builder on the normalized tools checkout, rewrites only the
# prefix_manifest witness in the day configuration (dated backup kept) and writes one receipt into
# the day directory. Needed after frankie_host_normalize_eol: the batch pinned CRLF-era code hashes
# (2026-09-20). Stops when nothing is stale. Dispatch only. Inputs reach the shell through env.
on:
  workflow_dispatch:
    inputs:
      instance:
        description: 'Native host instance id'
        required: false
        default: 'i-0e90ee6110ef609aa'
      day:
        description: 'Day whose prefix batch is rebuilt'
        required: false
        default: '20211003'
      run_root:
        description: 'Day pipeline RunRoot on the host'
        required: false
        default: 'C:/Codex/Frankie-BOSS-20260919/days'
      tools_root:
        description: 'Host tools checkout'
        required: false
        default: 'C:/tools/Frankie-20260919/Markets'
      python:
        description: 'Host actual-run interpreter'
        required: false
        default: 'C:/Codex/Frankie-BOSS-20260919/actual-host-python/Scripts/python.exe'
permissions:
  contents: read
jobs:
  rebuild:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97
      - name: Rebuild the prefix batch over SSM
        env:
          INSTANCE: ${{ inputs.instance }}
          DAY: ${{ inputs.day }}
          RUN_ROOT: ${{ inputs.run_root }}
          TOOLS_ROOT: ${{ inputs.tools_root }}
          HOST_PYTHON: ${{ inputs.python }}
        run: |
          python deploy/aws/ssm_run_ps1.py \
            --instance "$INSTANCE" --region us-east-2 \
            --script deploy/aws/host/frankie_host_rebuild_prefix_batch.ps1 \
            --set "Day=$DAY" \
            --set "RunRoot=$RUN_ROOT" \
            --set "ToolsRoot=$TOOLS_ROOT" \
            --set "Python=$HOST_PYTHON" \
            --set "CycleLimit=2" \
            --timeout 7200 --comment "rebuild the two-cycle prefix batch for day $DAY"

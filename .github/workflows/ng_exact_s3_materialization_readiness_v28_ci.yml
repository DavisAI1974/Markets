name: NG exact S3 materialization readiness v28

on:
  push:
    paths:
      - "research/kalshi/ng_corpus_s3_exact_materializer.py"
      - "research/kalshi/ng_historical_refinement_readiness_v28.py"
      - "research/kalshi/ng_historical_refinement_executor_v24.py"
      - "research/kalshi/tests/test_ng_exact_s3_materialization_readiness_v28.py"
      - ".github/workflows/ng_exact_s3_materialization_readiness_v28_ci.yml"
  pull_request:
    paths:
      - "research/kalshi/ng_corpus_s3_exact_materializer.py"
      - "research/kalshi/ng_historical_refinement_readiness_v28.py"
      - "research/kalshi/ng_historical_refinement_executor_v24.py"
      - "research/kalshi/tests/test_ng_exact_s3_materialization_readiness_v28.py"
      - ".github/workflows/ng_exact_s3_materialization_readiness_v28_ci.yml"

jobs:
  exact-s3-materialization-v28:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile exact materialization chain
        run: |
          python -m py_compile \
            ng_corpus_s3_exact_materializer.py \
            ng_historical_refinement_readiness_v28.py \
            ng_historical_refinement_executor_v24.py \
            tests/test_ng_exact_s3_materialization_readiness_v28.py
      - name: Run exact materializer self-test
        run: python ng_corpus_s3_exact_materializer.py selftest
      - name: Run readiness-v28 self-test
        run: python ng_historical_refinement_readiness_v28.py --selftest
      - name: Run focused tests
        run: python -m pytest -q tests/test_ng_exact_s3_materialization_readiness_v28.py
      - name: Verify materialization boundary and authority wall
        run: |
          python - <<'PY'
          import ng_corpus_s3_exact_materializer as materializer
          import ng_historical_refinement_executor_v24 as executor
          import ng_historical_refinement_readiness_v28 as readiness

          keys = [spec.key for spec in readiness.STAGES]
          assert keys[:6] == [
              "corpus_expected_day_contract",
              "corpus_inventory_finalization_contract",
              "corpus_s3_latest_version_resolution",
              "corpus_s3_inventory_capture",
              "corpus_s3_materialization",
              "corpus_coverage",
          ]
          assert readiness.STAGES[4].filename == "ng_corpus_s3_exact_materializer_receipt.json"
          assert executor.SUGGESTED_ENTRYPOINTS["corpus_s3_materialization"] == (
              "python",
              "ng_corpus_s3_exact_materializer.py",
              "materialize",
          )
          receipt = materializer._authority_fields()
          materializer._authority(receipt, label="CI authority wall")
          assert receipt["random_shuffle_used"] is False
          assert receipt["blind_forecasts_immutable"] is True
          assert receipt["may_update_ng_brain"] is False
          assert receipt["execution_authority"] is False
          assert receipt["cme_event_contracts_mode"] == "SHADOW"
          assert receipt["brokerage_contract"] == "tastytrade_not_ibkr"
          assert receipt["options_lane_started"] is False
          PY

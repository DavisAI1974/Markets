name: S135 Frankie Date Session

on:
  push:
    branches:
      - chatgpt/burn-hh-12m-s125
    paths:
      - .github/workflows/frankie_s135_date_session.yml
      - research/kalshi/frankie_s135_date_session.py
      - research/kalshi/date_run_outputs/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  next-blind-step:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install existing Frankie staging dependencies
        run: python -m pip install --quiet numpy requests boto3 pandas databento

      - name: Restore canonical S3 substrate
        env:
          PYTHONPATH: research/kalshi
          MARKETS_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          MARKETS_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python research/kalshi/restore_substrate.py

      - name: Rebuild public positioning caches
        env:
          PYTHONPATH: research/kalshi
        run: |
          python research/kalshi/cot_feed.py --build
          python research/kalshi/cot_combined_feed.py --build

      - name: Advance S135 date-driven blind to next model request
        env:
          PYTHONPATH: research/kalshi
          MARKETS_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          MARKETS_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          rm -rf /tmp/frankie_s135_date_session
          python research/kalshi/frankie_s135_date_session.py \
            --days 20250922,20250923,20250924,20250925,20250926,20250929,20250930,20251001,20251002,20251003 \
            --anchor-date 20250919 \
            --anchor 2.918 \
            --anchor-lasthr-dir 1 \
            --seam 20250925 \
            --pre-leg ngv25 \
            --post-leg ngx25 \
            --eia 20250925,20251002 \
            --basis 'NGV25 through 2025-09-24; NGX25 from 2025-09-25; S131 scored-leg seam' \
            --namespace frankie_s135_date_20250922_20251003 \
            --outputs research/kalshi/date_run_outputs/20250922_20251003 \
            --out /tmp/frankie_s135_date_session

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankie-s135-date-session
          path: /tmp/frankie_s135_date_session
          retention-days: 14
          if-no-files-found: warn

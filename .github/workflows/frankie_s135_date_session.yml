name: S135 Frankie Date Session

on:
  push:
    branches:
      - chatgpt/burn-hh-12m-s125
    paths:
      - .github/workflows/frankie_s135_date_session.yml
      - research/kalshi/frankie_s135_date_driver.py
      - research/kalshi/frankie_s135_date_session.py
      - research/kalshi/frankie_s135_date_render.py
      - research/kalshi/frankie_s136_date_plan.py
      - research/kalshi/date_run_session.json
      - research/kalshi/date_run_outputs/**
  workflow_dispatch:
    inputs:
      start_date:
        description: Exact configured window start (YYYY-MM-DD)
        required: true
        default: "2026-04-13"
      end_date:
        description: Exact configured window end (YYYY-MM-DD)
        required: true
        default: "2026-04-24"

permissions:
  contents: read

jobs:
  next-blind-step:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install existing Frankie staging dependencies
        run: python -m pip install --quiet numpy requests boto3 pandas databento matplotlib pillow

      - name: Advance date-driven blind to next model request
        env:
          PYTHONPATH: research/kalshi
          MARKETS_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          MARKETS_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          rm -rf /tmp/frankie_s135_date_session
          extra=()
          if [[ -n "${START_DATE:-}" ]]; then
            extra+=(--start-date "$START_DATE")
          fi
          if [[ -n "${END_DATE:-}" ]]; then
            extra+=(--end-date "$END_DATE")
          fi
          python research/kalshi/frankie_s135_date_driver.py \
            --config research/kalshi/date_run_session.json \
            --out /tmp/frankie_s135_date_session \
            "${extra[@]}"

      - name: Render completed session
        env:
          PYTHONPATH: research/kalshi
        run: |
          rm -rf /tmp/frankie_s135_render
          if [[ -f /tmp/frankie_s135_date_session/complete.json ]]; then
            python research/kalshi/frankie_s135_date_render.py \
              --plan /tmp/frankie_s135_date_session/resolved_date_plan.json \
              --out /tmp/frankie_s135_render
          else
            echo "Session not complete; render deferred until all model outputs are frozen."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankie-s135-date-session
          path: |
            /tmp/frankie_s135_date_session
            /tmp/frankie_s135_render
          retention-days: 14
          if-no-files-found: warn

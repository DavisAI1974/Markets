name: Frankie Linux trading-day preparation checks
on:
  push:
    branches: ['codex/trading-day-readiness-20260922']
    paths:
      - 'deploy/aws/box/frankie_box_prepare_trading_day.py'
      - 'tests/test_box_trading_day_preparation.py'
      - '.github/workflows/frankie_linux_preparation_ci.yml'
permissions:
  contents: read
jobs:
  preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .:research/kalshi/frankie_boss:research/kalshi/frankie_boss/tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-cache-dir pytest==9.1.1 numpy==2.3.5 boto3==1.42.1 zstandard==0.25.0 cffi==2.0.0 databento-dbn==0.62.0
      - name: Exercise preparation against tiny recovered-source fixtures
        run: python -m pytest -q tests/test_box_trading_day_preparation.py --noconftest -p no:cacheprovider

name: Frankie critic knowledge loop tests
on:
  push:
    branches: ['codex/trading-day-readiness-20260922']
    paths:
      - 'research/kalshi/frankie_boss/critic_knowledge.py'
      - 'research/kalshi/frankie_boss/knowledge_calendar.py'
      - 'research/kalshi/frankie_boss/operations/run_actual_sunday_classroom.py'
      - 'research/kalshi/frankie_boss/tests/test_critic_replay_lineage.py'
      - 'research/kalshi/frankie_boss/granite_positive_priming.py'
      - 'research/kalshi/frankie_boss/granite_context_stacked_route.py'
      - 'research/kalshi/frankie_boss/granite_context_route.py'
      - 'research/kalshi/frankie_boss/frankie_controller.py'
      - 'research/kalshi/frankie_boss/controller_journal.py'
      - 'research/kalshi/frankie_boss/feedback_cycle.py'
      - 'research/kalshi/frankie_boss/sunday_native_runtime.py'
      - 'research/kalshi/frankie_boss/sunday_execution.py'
      - 'research/kalshi/frankie_boss/operations/run_actual_sunday.py'
      - 'research/kalshi/frankie_boss/tests/test_critic_knowledge_loop.py'
      - '.github/workflows/frankie_critic_knowledge_tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-cache-dir pytest==9.1.1 numpy==2.3.5 boto3==1.42.1 zstandard==0.25.0 cffi==2.0.0 databento-dbn==0.62.0
      - name: Knowledge loop regression
        run: python -m pytest -q research/kalshi/frankie_boss/tests/test_critic_knowledge_loop.py research/kalshi/frankie_boss/tests/test_critic_replay_lineage.py
      - name: Route and durable cycle preservation
        run: >-
          python -m pytest -q
          research/kalshi/frankie_boss/tests/test_granite_stacked_route_integration.py
          research/kalshi/frankie_boss/tests/test_frankie_controller.py
          research/kalshi/frankie_boss/tests/test_feedback_cycle.py
          research/kalshi/frankie_boss/tests/test_sunday_execution.py
          research/kalshi/frankie_boss/tests/test_granite_jobs_integration.py
          research/kalshi/frankie_boss/tests/test_granite_open_ended_service.py
          research/kalshi/frankie_boss/tests/test_retained_preparation_recovery.py
      - name: Verify retained positive priming provenance
        run: |
          python - <<'PY'
          import json
          from research.kalshi.frankie_boss.granite_positive_priming import load_retained_priming, MODE
          capsule=load_retained_priming('.',mode=MODE)
          print('HISTORICAL_PRIMING_CAPSULE '+json.dumps(capsule,sort_keys=True))
          PY

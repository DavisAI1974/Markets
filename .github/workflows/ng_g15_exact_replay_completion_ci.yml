name: G15 Exact Replay Completion CI

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - 'research/kalshi/ng_g15_exact_replay_completion.py'
      - 'research/kalshi/ng_g15_replay_manifest_bridge.py'
      - 'research/kalshi/ng_g15_anchor.py'
      - 'research/kalshi/ng_historical_manifest.py'
      - 'research/kalshi/ng_historical_prepare.py'
      - 'research/kalshi/ng_historical_replay.py'
      - 'research/kalshi/ng_historical_replay_prepared.py'
      - 'research/kalshi/ng_rt_feature_state.py'
      - 'research/kalshi/tests/test_ng_g15_exact_replay_completion.py'
      - '.github/workflows/ng_g15_exact_replay_completion_ci.yml'
  pull_request:
    paths:
      - 'research/kalshi/ng_g15_exact_replay_completion.py'
      - 'research/kalshi/ng_g15_replay_manifest_bridge.py'
      - 'research/kalshi/ng_g15_anchor.py'
      - 'research/kalshi/ng_historical_manifest.py'
      - 'research/kalshi/ng_historical_prepare.py'
      - 'research/kalshi/ng_historical_replay.py'
      - 'research/kalshi/ng_historical_replay_prepared.py'
      - 'research/kalshi/ng_rt_feature_state.py'
      - 'research/kalshi/tests/test_ng_g15_exact_replay_completion.py'
      - '.github/workflows/ng_g15_exact_replay_completion_ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: pip install --quiet databento boto3 numpy
      - name: Compile exact replay completion chain
        run: |
          python -m py_compile \
            research/kalshi/ng_g15_exact_replay_completion.py \
            research/kalshi/ng_g15_replay_manifest_bridge.py \
            research/kalshi/ng_g15_anchor.py \
            research/kalshi/ng_historical_manifest.py \
            research/kalshi/ng_historical_prepare.py \
            research/kalshi/ng_historical_replay.py \
            research/kalshi/ng_historical_replay_prepared.py \
            research/kalshi/ng_rt_feature_state.py \
            research/kalshi/tests/test_ng_g15_exact_replay_completion.py
      - name: Run exact replay completion self-test
        run: python research/kalshi/ng_g15_exact_replay_completion.py --selftest
      - name: Run exact replay completion tests
        run: python -m unittest -v research/kalshi/tests/test_ng_g15_exact_replay_completion.py

name: NG readiness v30 stable execution chain

on:
  push:
    paths:
      - "research/kalshi/ng_corpus_executor_plan_compiler_v25.py"
      - "research/kalshi/ng_corpus_executor_pipeline_arm_v25.py"
      - "research/kalshi/ng_historical_refinement_preflight_v26.py"
      - "research/kalshi/ng_historical_refinement_executor_v26.py"
      - "research/kalshi/ng_historical_refinement_readiness_v30.py"
      - "research/kalshi/ng_corpus_source_identity_attestation.py"
      - "research/kalshi/ng_corpus_source_identity_attestation_impl.py"
      - "research/kalshi/tests/test_ng_readiness_v30_execution_chain.py"
      - ".github/workflows/ng_readiness_v30_execution_chain_ci.yml"
  pull_request:
    paths:
      - "research/kalshi/ng_corpus_executor_plan_compiler_v25.py"
      - "research/kalshi/ng_corpus_executor_pipeline_arm_v25.py"
      - "research/kalshi/ng_historical_refinement_preflight_v26.py"
      - "research/kalshi/ng_historical_refinement_executor_v26.py"
      - "research/kalshi/ng_historical_refinement_readiness_v30.py"
      - "research/kalshi/ng_corpus_source_identity_attestation.py"
      - "research/kalshi/ng_corpus_source_identity_attestation_impl.py"
      - "research/kalshi/tests/test_ng_readiness_v30_execution_chain.py"
      - ".github/workflows/ng_readiness_v30_execution_chain_ci.yml"

jobs:
  stable-source-identity-execution:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile stable v30 execution chain
        run: |
          python -m py_compile \
            ng_corpus_executor_plan_compiler_v25.py \
            ng_corpus_executor_pipeline_arm_v25.py \
            ng_historical_refinement_preflight_v26.py \
            ng_historical_refinement_executor_v26.py \
            ng_historical_refinement_readiness_v30.py \
            ng_corpus_source_identity_attestation.py \
            ng_corpus_source_identity_attestation_impl.py \
            tests/test_ng_readiness_v30_execution_chain.py
      - name: Run source-native identity self-test
        run: python ng_corpus_source_identity_attestation.py selftest
      - name: Run readiness v30 self-test
        run: python ng_historical_refinement_readiness_v30.py --selftest
      - name: Run stable execution-chain tests
        run: python -m pytest -q tests/test_ng_readiness_v30_execution_chain.py
      - name: Verify source-identity boundary and permanent authority wall
        run: |
          python - <<'PY'
          import ng_corpus_executor_pipeline_arm_v25 as arm
          import ng_corpus_executor_plan_compiler_v25 as compiler
          import ng_corpus_source_identity_attestation as identity
          import ng_historical_refinement_preflight_v26 as preflight
          import ng_historical_refinement_readiness_v30 as readiness

          keys = [spec.key for spec in readiness.STAGES]
          assert keys.index("corpus_s3_materialization_provenance") < keys.index(
              "corpus_source_identity_attestation"
          ) < keys.index("corpus_coverage") < keys.index(
              "corpus_definition_byte_binding"
          )
          assert list(compiler.CONFIGURED_STAGES) == keys[: len(compiler.CONFIGURED_STAGES)]
          assert arm.ARMED_STAGES == compiler.CONFIGURED_STAGES
          assert preflight.READINESS_CONTRACT == readiness.SCHEMA
          assert preflight.EXECUTOR_CONTRACT == "ng_historical_refinement_executor_v26"
          authority = identity._authority_fields()
          assert authority["actual_outcomes_used"] is False
          assert authority["random_shuffle_used"] is False
          assert authority["blind_forecasts_immutable"] is True
          assert authority["may_update_ng_brain"] is False
          assert authority["execution_authority"] is False
          assert authority["cme_event_contracts_mode"] == "SHADOW"
          assert authority["brokerage_contract"] == "tastytrade_not_ibkr"
          assert authority["options_lane_started"] is False
          PY

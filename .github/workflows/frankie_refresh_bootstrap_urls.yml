name: Frankie refresh retained Pod bootstrap URLs
# Runbook GRANITE_OPEN_RUN_ROLLOUT.md step 5, URLs only: re-sign the exact staged bootstrap objects the
# retained Pod already references and patch RP_BOOTSTRAP_URLS, preserving every other environment
# value, then read back and compare. Starts nothing. Prints no URL, key or environment value.
on:
  workflow_dispatch:
    inputs:
      pod:
        description: 'Retained Pod id'
        required: false
        default: '8vqdacl5t61rjx'
      expires_seconds:
        description: 'Presign span in seconds (validator allows at most 604800)'
        required: false
        default: '518400'
permissions:
  contents: read
jobs:
  refresh:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: us-east-1
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97
      - name: Refresh the bootstrap URLs and read back
        run: python research/kalshi/frankie_boss/operations/refresh_bootstrap_urls.py --pod "${{ inputs.pod }}" --runtime-configuration research/kalshi/frankie_boss/runs/20260919/reviewed-bootstrap-image-defaults-runtime.json --expires-seconds "${{ inputs.expires_seconds }}"

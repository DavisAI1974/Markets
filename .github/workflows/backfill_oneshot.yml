name: Backfill (one-shot)

# Manually-triggered backfill of 1-second bins from FREE public historical
# sources, for all 5 coins x up to 4 venues, merged into the existing bins
# on each coin's data/<coin>-bins branch. Existing bins always win on
# conflict; backfill only fills gaps.
#
# Sources (all free, no auth):
#   - Bybit dumps   (public.bybit.com/trading) -> <coin>_bybit_perp_bins.json
#                   bulk daily CSV, fast, back to listing (BTC/ETH/DOGE/XRP
#                   reach 2021; SOL perp listed later).
#   - Binance Vision (data.binance.vision)      -> <coin>_binance_perp_bins.json
#                   bulk daily zips, years deep; capped at 10d/run for the
#                   100 MiB push limit.
#   - Coinbase /trades (REST)                   -> <coin>_coinbase_bins.json
#                   rate-limited; walks back from now, ~days per run.
#   - Kraken /Trades   (REST)                   -> <coin>_kraken_bins.json
#                   ~1 req/s; walks forward from now-days.
#
# Bins are stored GZIPPED (<f>.json.gz) on the data branches to stay under
# GitHub's 100 MiB/file push limit (raw btc_coinbase had grown to 103 MB and
# every push was rejected, stalling collection). We gunzip on restore and
# gzip on push; scripts read/write raw .json locally.
#
# NOT covered: Kraken Futures perps (no free tick history); Binance spot
# (api.binance.com geo-blocked from US/cloud IPs -- we use Binance perps).

on:
  workflow_dispatch:
    inputs:
      coins:
        description: 'Comma list of coins to backfill (btc,eth,sol,doge,xrp)'
        default: 'btc,eth,sol,doge,xrp'
        type: string
      days:
        description: 'Days back to backfill (Binance capped to 10 internally)'
        default: '21'
        type: string
      max_seconds_per_script:
        description: 'Wallclock budget per REST script (default 5400 = 90 min)'
        default: '5400'
        type: string

permissions:
  contents: write

concurrency:
  group: backfill-oneshot
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        coin: [btc, eth, sol, doge, xrp]
    steps:
      - name: Skip coins not requested
        id: gate
        run: |
          if echo "${{ github.event.inputs.coins }}" | tr ',' '\n' | grep -qx "${{ matrix.coin }}"; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "[skip] ${{ matrix.coin }} not in requested list"
          fi

      - name: Checkout code branch
        if: steps.gate.outputs.run == 'yes'
        uses: actions/checkout@v4
        with:
          ref: claude/crypto-backfill-validation-31tubb
          fetch-depth: 0

      - name: Set up Python
        if: steps.gate.outputs.run == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Map coin -> symbols/pairs
        if: steps.gate.outputs.run == 'yes'
        id: map
        run: |
          case "${{ matrix.coin }}" in
            btc)  BY=BTCUSDT;  BN=BTCUSDT;  CB=BTC-USD;  KR=XBTUSD ;;
            eth)  BY=ETHUSDT;  BN=ETHUSDT;  CB=ETH-USD;  KR=ETHUSD ;;
            sol)  BY=SOLUSDT;  BN=SOLUSDT;  CB=SOL-USD;  KR=SOLUSD ;;
            doge) BY=DOGEUSDT; BN=DOGEUSDT; CB=DOGE-USD; KR=DOGEUSD ;;
            xrp)  BY=XRPUSDT;  BN=XRPUSDT;  CB=XRP-USD;  KR=XRPUSD ;;
          esac
          echo "by=$BY" >> "$GITHUB_OUTPUT"
          echo "bn=$BN" >> "$GITHUB_OUTPUT"
          echo "cb=$CB" >> "$GITHUB_OUTPUT"
          echo "kr=$KR" >> "$GITHUB_OUTPUT"

      - name: Restore existing bins from data/${{ matrix.coin }}-bins (gunzip)
        if: steps.gate.outputs.run == 'yes'
        run: |
          C=${{ matrix.coin }}
          BR=data/${C}-bins
          if git ls-remote --exit-code --heads origin "$BR" > /dev/null 2>&1; then
            git fetch origin "$BR"
            for f in ${C}_coinbase_bins ${C}_kraken_bins ${C}_bybit_perp_bins ${C}_binance_perp_bins; do
              if git checkout origin/$BR -- "$f.json.gz" 2>/dev/null; then
                gunzip -f "$f.json.gz" && echo "[restore] $f from .gz"
              elif git checkout origin/$BR -- "$f.json" 2>/dev/null; then
                echo "[restore] $f from legacy raw .json"
              else
                echo "[restore] no prior $f on $BR"
              fi
            done
            git checkout origin/$BR -- ${C}_coinbase_bins.cursor.json 2>/dev/null || true
          else
            echo "[restore] $BR does not exist yet; starting fresh"
          fi
          ls -la ${C}_*_bins.json 2>&1 || echo "[restore] no bins yet"

      - name: Run backfills (bybit + binance dumps, then REST)
        if: steps.gate.outputs.run == 'yes'
        timeout-minutes: 340
        run: |
          C=${{ matrix.coin }}
          DAYS=${{ github.event.inputs.days }}
          MAX=${{ github.event.inputs.max_seconds_per_script }}
          BN_DAYS=$DAYS; if [ "$BN_DAYS" -gt 10 ]; then BN_DAYS=10; fi
          echo "[$C] days=$DAYS bn_days=$BN_DAYS max_seconds=$MAX"

          # Bulk dumps first (fast, the deep history) in parallel.
          python backfill_bybit.py --symbol ${{ steps.map.outputs.by }} --days $DAYS \
            --bins-path ${C}_bybit_perp_bins.json > /tmp/by.log 2>&1 &
          BY=$!
          python backfill_binance_vision.py --symbol ${{ steps.map.outputs.bn }} --days $BN_DAYS \
            --bins-path ${C}_binance_perp_bins.json > /tmp/bn.log 2>&1 &
          BN=$!
          # REST sources (rate-limited) in parallel.
          python backfill_coinbase_spot.py --product ${{ steps.map.outputs.cb }} --days $DAYS \
            --max-seconds $MAX --bins-path ${C}_coinbase_bins.json > /tmp/cb.log 2>&1 &
          CB=$!
          python backfill_kraken_spot.py --pair ${{ steps.map.outputs.kr }} --days $DAYS \
            --max-seconds $MAX --bins-path ${C}_kraken_bins.json > /tmp/kr.log 2>&1 &
          KR=$!

          wait $BY; echo "[$C] bybit exit=$?";   tail -20 /tmp/by.log
          wait $BN; echo "[$C] binance exit=$?"; tail -20 /tmp/bn.log
          wait $CB; echo "[$C] coinbase exit=$?";tail -20 /tmp/cb.log
          wait $KR; echo "[$C] kraken exit=$?";  tail -20 /tmp/kr.log

      - name: Bin file stats
        if: steps.gate.outputs.run == 'yes'
        run: |
          C=${{ matrix.coin }}
          for f in ${C}_coinbase_bins.json ${C}_kraken_bins.json ${C}_bybit_perp_bins.json ${C}_binance_perp_bins.json; do
            if [ -f "$f" ]; then
              N=$(python -c "import json,sys; print(len(json.load(open(sys.argv[1]))))" "$f" 2>/dev/null || echo "?")
              echo "$f: $(stat -c%s "$f") bytes, $N bins"
            fi
          done

      - name: Gzip + force-push to data/${{ matrix.coin }}-bins (guardrail)
        if: steps.gate.outputs.run == 'yes'
        run: |
          C=${{ matrix.coin }}
          BR=data/${C}-bins
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          mkdir -p /tmp/bins
          for f in ${C}_coinbase_bins ${C}_kraken_bins ${C}_bybit_perp_bins ${C}_binance_perp_bins; do
            cp "$f.json" /tmp/bins/ 2>/dev/null || true
          done
          cp ${C}_coinbase_bins.cursor.json /tmp/bins/ 2>/dev/null || true

          # Anti-clobber: backfill merges existing bins, so a healthy file is
          # always >= the data-branch copy. If a file regressed (script crashed
          # before merge), restore the data-branch copy so the force-push does
          # not wipe history.
          python - "$BR" "$C" <<'PY'
          import json, subprocess, os, gzip, sys
          BRANCH = "origin/" + sys.argv[1]; C = sys.argv[2]
          FILES = [f"{C}_coinbase_bins.json", f"{C}_kraken_bins.json",
                   f"{C}_bybit_perp_bins.json", f"{C}_binance_perp_bins.json"]
          def count_raw(p):
              try:
                  with open(p) as f: return len(json.load(f))
              except Exception: return 0
          def old_branch(fn):
              for ref in (fn + ".gz", fn):
                  try:
                      blob = subprocess.run(["git","show",f"{BRANCH}:{ref}"],
                                            capture_output=True, check=True).stdout
                  except subprocess.CalledProcessError:
                      continue
                  try:
                      data = gzip.decompress(blob) if ref.endswith(".gz") else blob
                      return len(json.loads(data)), data
                  except Exception:
                      continue
              return 0, None
          for fn in FILES:
              newp = os.path.join("/tmp/bins", fn)
              if not os.path.exists(newp): continue
              new = count_raw(newp); old, data = old_branch(fn)
              if old and new < old:
                  with open(newp, "wb") as f: f.write(data)
                  print(f"[guardrail] {fn}: {new} < {old} on branch -> RESTORED")
              else:
                  print(f"[guardrail] {fn}: {new} bins (>= {old}) -> keep")
          PY

          for f in ${C}_coinbase_bins ${C}_kraken_bins ${C}_bybit_perp_bins ${C}_binance_perp_bins; do
            [ -f "/tmp/bins/$f.json" ] && gzip -f "/tmp/bins/$f.json" && \
              echo "[gzip] $f.json.gz $(stat -c%s /tmp/bins/$f.json.gz) bytes"
          done

          git checkout --orphan ${BR}-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/bins/*.json.gz . 2>/dev/null || true
          cp /tmp/bins/${C}_coinbase_bins.cursor.json . 2>/dev/null || true

          if ls *.json.gz > /dev/null 2>&1; then
            git add -f *.json.gz ${C}_coinbase_bins.cursor.json 2>/dev/null || git add -f *.json.gz
            git commit -m "$C bins backfill $(date -u +%Y-%m-%dT%H:%M:%SZ)" -m "Run: ${{ github.run_id }}"
            git push -f origin ${BR}-tmp:${BR}
            echo "[commit] pushed gzipped $C bins to $BR"
          else
            echo "[commit] no bins to push"
          fi

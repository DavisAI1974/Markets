name: Backfill (one-shot)

# Manually-triggered job that backfills BTC + ETH bins from public
# historical sources, merging into the existing RT bins files on
# data/btc-bins and data/eth-bins. Existing RT bins always win on
# conflict; backfill only fills gaps.
#
# Targets 30 days where the source allows; falls back to whatever the
# wallclock budget per script can reach.
#
# Sources covered:
#   - Binance Vision (perps BTCUSDT + ETHUSDT, 30d clean)
#   - Kraken /Trades  (spot XBTUSD + ETHUSD, 30d clean within ~90 min/pair)
#   - Coinbase /trades (spot BTC-USD + ETH-USD, attempts 30d, may stop at
#                       ~7-15d when the rate-limited fetch hits the time
#                       budget)
#
# NOT covered:
#   - Kraken Futures perps (no free tick-level historical API exists).
#     KR perp cells start fresh from RT only.
#   - Binance spot (api.binance.com/stream geo-blocked from US/cloud IPs).
#     We only collect Binance perps.

on:
  workflow_dispatch:
    inputs:
      days_eth:
        description: 'Days back for ETH backfill (default 30)'
        default: '30'
        type: string
      days_btc:
        description: 'Days back for BTC backfill (default 30)'
        default: '30'
        type: string
      max_seconds_per_script:
        description: 'Wallclock budget per backfill script (default 18000 = 5h)'
        default: '18000'
        type: string

permissions:
  contents: write

concurrency:
  group: backfill-oneshot
  cancel-in-progress: false

jobs:
  backfill_eth:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout code branch
        uses: actions/checkout@v4
        with:
          ref: claude/continue-phase-2-pipeline-UFiGY
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore existing ETH RT bins from data/eth-bins
        run: |
          if git ls-remote --exit-code --heads origin data/eth-bins > /dev/null 2>&1; then
            git fetch origin data/eth-bins
            git checkout origin/data/eth-bins -- eth_coinbase_bins.json 2>/dev/null || true
            git checkout origin/data/eth-bins -- eth_kraken_bins.json 2>/dev/null || true
            git checkout origin/data/eth-bins -- eth_binance_perp_bins.json 2>/dev/null || true
            git checkout origin/data/eth-bins -- eth_kraken_perp_bins.json 2>/dev/null || true
          fi
          ls -la eth_*_bins.json 2>&1 || echo "[restore] no bins yet"

      - name: Run all 3 ETH backfills in parallel
        timeout-minutes: 350
        run: |
          DAYS=${{ github.event.inputs.days_eth }}
          MAX=${{ github.event.inputs.max_seconds_per_script }}
          # Binance Vision binned 1-sec is ~9MB/day for ETH/BTC perps;
          # 30d = ~270MB which exceeds GitHub's 100MB hard push limit.
          # Cap at 10d (~90MB) so the file pushes cleanly.
          BN_DAYS=$DAYS
          if [ "$BN_DAYS" -gt 10 ]; then BN_DAYS=10; fi
          echo "[backfill-eth] days=$DAYS bn_days=$BN_DAYS max_seconds=$MAX"

          python backfill_binance_vision.py --symbol ETHUSDT --days $BN_DAYS \
            --bins-path eth_binance_perp_bins.json > /tmp/bn.log 2>&1 &
          BN=$!
          python backfill_kraken_spot.py --pair ETHUSD --days $DAYS --max-seconds $MAX \
            --bins-path eth_kraken_bins.json > /tmp/kr.log 2>&1 &
          KR=$!
          python backfill_coinbase_spot.py --product ETH-USD --days $DAYS --max-seconds $MAX \
            --bins-path eth_coinbase_bins.json > /tmp/cb.log 2>&1 &
          CB=$!

          echo "[backfill-eth] PIDs: BN=$BN KR=$KR CB=$CB"
          wait $BN; BN_EXIT=$?
          wait $KR; KR_EXIT=$?
          wait $CB; CB_EXIT=$?
          echo "[backfill-eth] exits: BN=$BN_EXIT KR=$KR_EXIT CB=$CB_EXIT"
          echo ""
          echo "=== Binance Vision ETH log tail ==="
          tail -40 /tmp/bn.log
          echo ""
          echo "=== Kraken spot ETH log tail ==="
          tail -40 /tmp/kr.log
          echo ""
          echo "=== Coinbase spot ETH log tail ==="
          tail -40 /tmp/cb.log

      - name: Bin file stats
        if: always()
        run: |
          for f in eth_coinbase_bins.json eth_kraken_bins.json eth_binance_perp_bins.json eth_kraken_perp_bins.json; do
            if [ -f "$f" ]; then
              SIZE=$(stat -c%s "$f")
              N_BINS=$(python -c "import json,sys; print(len(json.load(open(sys.argv[1]))))" "$f" 2>/dev/null || echo "?")
              echo "$f: $SIZE bytes, $N_BINS bins"
            fi
          done

      - name: Force-push merged ETH bins to data/eth-bins
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          mkdir -p /tmp/bins
          cp eth_coinbase_bins.json /tmp/bins/ 2>/dev/null || true
          cp eth_kraken_bins.json /tmp/bins/ 2>/dev/null || true
          cp eth_binance_perp_bins.json /tmp/bins/ 2>/dev/null || true
          cp eth_kraken_perp_bins.json /tmp/bins/ 2>/dev/null || true

          git checkout --orphan data/eth-bins-tmp
          git rm -rf . > /dev/null 2>&1 || true

          cp /tmp/bins/eth_coinbase_bins.json . 2>/dev/null || true
          cp /tmp/bins/eth_kraken_bins.json . 2>/dev/null || true
          cp /tmp/bins/eth_binance_perp_bins.json . 2>/dev/null || true
          cp /tmp/bins/eth_kraken_perp_bins.json . 2>/dev/null || true

          if [ -f eth_coinbase_bins.json ] || [ -f eth_kraken_bins.json ] || [ -f eth_binance_perp_bins.json ]; then
            # -f bypasses .gitignore (eth_coinbase_bins.json + eth_kraken_bins.json
            # are listed there to keep RT collector outputs out of phase-2 commits;
            # the data branches intentionally commit them).
            git add -f eth_coinbase_bins.json eth_kraken_bins.json eth_binance_perp_bins.json eth_kraken_perp_bins.json 2>/dev/null || true
            git status --short
            git commit -m "ETH bins backfill $(date -u +%Y-%m-%dT%H:%M:%SZ)" -m "Run: ${{ github.run_id }}"
            git push -f origin data/eth-bins-tmp:data/eth-bins
            echo "[commit] pushed merged ETH bins to data/eth-bins"
          fi

  backfill_btc:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout code branch
        uses: actions/checkout@v4
        with:
          ref: claude/continue-phase-2-pipeline-UFiGY
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore existing BTC RT bins from data/btc-bins
        run: |
          if git ls-remote --exit-code --heads origin data/btc-bins > /dev/null 2>&1; then
            git fetch origin data/btc-bins
            git checkout origin/data/btc-bins -- btc_coinbase_bins.json 2>/dev/null || true
            git checkout origin/data/btc-bins -- btc_kraken_bins.json 2>/dev/null || true
            git checkout origin/data/btc-bins -- btc_binance_perp_bins.json 2>/dev/null || true
            git checkout origin/data/btc-bins -- btc_kraken_perp_bins.json 2>/dev/null || true
          else
            echo "[restore] data/btc-bins does not exist yet (first ever); starting fresh"
          fi
          ls -la btc_*_bins.json 2>&1 || echo "[restore] no bins yet"

      - name: Run all 3 BTC backfills in parallel
        timeout-minutes: 350
        run: |
          DAYS=${{ github.event.inputs.days_btc }}
          MAX=${{ github.event.inputs.max_seconds_per_script }}
          # Binance Vision binned 1-sec is ~9MB/day for BTC perps;
          # 30d = ~270MB which exceeds GitHub's 100MB hard push limit
          # (verified in run 25472326899). Cap at 10d (~90MB).
          BN_DAYS=$DAYS
          if [ "$BN_DAYS" -gt 10 ]; then BN_DAYS=10; fi
          echo "[backfill-btc] days=$DAYS bn_days=$BN_DAYS max_seconds=$MAX"

          python backfill_binance_vision.py --symbol BTCUSDT --days $BN_DAYS \
            --bins-path btc_binance_perp_bins.json > /tmp/bn.log 2>&1 &
          BN=$!
          python backfill_kraken_spot.py --pair XBTUSD --days $DAYS --max-seconds $MAX \
            --bins-path btc_kraken_bins.json > /tmp/kr.log 2>&1 &
          KR=$!
          python backfill_coinbase_spot.py --product BTC-USD --days $DAYS --max-seconds $MAX \
            --bins-path btc_coinbase_bins.json > /tmp/cb.log 2>&1 &
          CB=$!

          echo "[backfill-btc] PIDs: BN=$BN KR=$KR CB=$CB"
          wait $BN; BN_EXIT=$?
          wait $KR; KR_EXIT=$?
          wait $CB; CB_EXIT=$?
          echo "[backfill-btc] exits: BN=$BN_EXIT KR=$KR_EXIT CB=$CB_EXIT"
          echo ""
          echo "=== Binance Vision BTC log tail ==="
          tail -40 /tmp/bn.log
          echo ""
          echo "=== Kraken spot BTC log tail ==="
          tail -40 /tmp/kr.log
          echo ""
          echo "=== Coinbase spot BTC log tail ==="
          tail -40 /tmp/cb.log

      - name: Bin file stats
        if: always()
        run: |
          for f in btc_coinbase_bins.json btc_kraken_bins.json btc_binance_perp_bins.json btc_kraken_perp_bins.json; do
            if [ -f "$f" ]; then
              SIZE=$(stat -c%s "$f")
              N_BINS=$(python -c "import json,sys; print(len(json.load(open(sys.argv[1]))))" "$f" 2>/dev/null || echo "?")
              echo "$f: $SIZE bytes, $N_BINS bins"
            fi
          done

      - name: Force-push merged BTC bins to data/btc-bins
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          mkdir -p /tmp/bins
          cp btc_coinbase_bins.json /tmp/bins/ 2>/dev/null || true
          cp btc_kraken_bins.json /tmp/bins/ 2>/dev/null || true
          cp btc_binance_perp_bins.json /tmp/bins/ 2>/dev/null || true
          cp btc_kraken_perp_bins.json /tmp/bins/ 2>/dev/null || true

          git checkout --orphan data/btc-bins-tmp
          git rm -rf . > /dev/null 2>&1 || true

          cp /tmp/bins/btc_coinbase_bins.json . 2>/dev/null || true
          cp /tmp/bins/btc_kraken_bins.json . 2>/dev/null || true
          cp /tmp/bins/btc_binance_perp_bins.json . 2>/dev/null || true
          cp /tmp/bins/btc_kraken_perp_bins.json . 2>/dev/null || true

          if [ -f btc_coinbase_bins.json ] || [ -f btc_kraken_bins.json ] || [ -f btc_binance_perp_bins.json ]; then
            git add -f btc_coinbase_bins.json btc_kraken_bins.json btc_binance_perp_bins.json btc_kraken_perp_bins.json 2>/dev/null || true
            git status --short
            git commit -m "BTC bins backfill $(date -u +%Y-%m-%dT%H:%M:%SZ)" -m "Run: ${{ github.run_id }}"
            git push -f origin data/btc-bins-tmp:data/btc-bins
            echo "[commit] pushed merged BTC bins to data/btc-bins"
          fi

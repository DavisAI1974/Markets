name: NG readiness v37 attribution-bound G16 curve lock

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - research/kalshi/ng_g16_attribution_bound_curve_lock_gate.py
      - research/kalshi/ng_historical_refinement_readiness_v37.py
      - research/kalshi/ng_historical_refinement_executor_v33.py
      - research/kalshi/tests/test_ng_g16_attribution_bound_curve_lock_gate.py
      - research/kalshi/tests/test_ng_readiness_v37_attribution_bound_g16_lock.py
      - .github/workflows/ng_readiness_v37_attribution_bound_g16_lock_ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attribution-bound-g16-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kalshi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Compile exact lock chain
        run: |
          python -m py_compile \
            ng_g16_attribution_bound_curve_authorization_gate.py \
            ng_g16_counterfactual_publication_gate.py \
            ng_g16_attribution_bound_curve_lock_gate.py \
            ng_historical_refinement_readiness_v36.py \
            ng_historical_refinement_readiness_v37.py \
            ng_historical_refinement_executor_v32.py \
            ng_historical_refinement_executor_v33.py \
            tests/test_ng_g16_attribution_bound_curve_lock_gate.py \
            tests/test_ng_readiness_v37_attribution_bound_g16_lock.py
      - name: Run deterministic self-tests
        run: |
          python ng_g16_attribution_bound_curve_authorization_gate.py --selftest
          python ng_g16_attribution_bound_curve_lock_gate.py --selftest
          python ng_historical_refinement_readiness_v37.py --selftest
      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/test_ng_g16_attribution_bound_curve_authorization_gate.py \
            tests/test_ng_g16_attribution_bound_curve_lock_gate.py \
            tests/test_ng_readiness_v37_attribution_bound_g16_lock.py
      - name: Verify chronology and permanent authority wall
        run: |
          python - <<'PY'
          import ng_historical_refinement_readiness_v37 as readiness

          keys = [spec.key for spec in readiness.STAGES]
          start = keys.index("g16_attribution_bound_curve_authorization")
          assert keys[start:start + 4] == [
              "g16_attribution_bound_curve_authorization",
              "g16_counterfactual_curve_lock",
              "g16_attribution_bound_curve_lock",
              "g16_counterfactual_publication",
          ]
          by_key = {spec.key: spec for spec in readiness.STAGES}
          assert "attribution_bound_curve_authorization_fingerprint" not in by_key[
              "g16_counterfactual_curve_lock"
          ].required_fields
          assert by_key["g16_attribution_bound_curve_lock"].pre_outcome is False

          values = readiness._linked_fixture_chain()
          lock = values["g16_attribution_bound_curve_lock"]
          assert lock["blind_score_fingerprint"] != lock["refined_score_fingerprint"]
          assert lock["actual_g16_outcomes_used"] is False
          assert lock["random_shuffle_used"] is False
          assert lock["one_signal_authority_preserved"] is True
          assert lock["blind_forecasts_immutable"] is True
          assert lock["may_update_ng_brain"] is False
          assert lock["execution_authority"] is False
          assert lock["cme_event_contracts_mode"] == "SHADOW"
          assert lock["brokerage_contract"] == "tastytrade_not_ibkr"
          assert lock["options_lane_started"] is False
          PY

name: S126 Frankie Specialist Parity

on:
  push:
    branches:
      - chatgpt/burn-hh-12m-s125
    paths:
      - research/kalshi/frankie_specialist_parity_s126.py
      - research/kalshi/frankie_s121_curve_restore.py
      - research/kalshi/frankie_g24_run_s127.py
      - research/kalshi/frankie_g24_score_render_s127.py
      - research/kalshi/frankie_aws_stage_s126.py
      - research/kalshi/frankie_causal_capture_gate_s126.py
      - research/kalshi/tests/test_frankie_specialist_parity_s126.py
      - research/kalshi/tests/test_frankie_s121_curve_restore.py
      - research/kalshi/tests/test_frankie_g24_run_s127.py
      - research/kalshi/forecasts/frankie_g24_s127_chatgpt/**
      - research/kalshi/renders/ng_refine_s95/grp24_state.json
      - research/kalshi/renders/ng_refine_s95/g24_causal_slices/**
      - .github/workflows/frankie_specialists_s126_ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specialist-parity-and-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: pip install --quiet pytest boto3 matplotlib
      - name: Compile current Frankie specialist seam
        run: |
          python -m py_compile \
            research/kalshi/frankie_specialist_parity_s126.py \
            research/kalshi/frankie_s121_curve_restore.py \
            research/kalshi/frankie_g24_run_s127.py \
            research/kalshi/frankie_g24_score_render_s127.py \
            research/kalshi/frankie_s118_redo.py \
            research/kalshi/frankie_group_forecast_s118.py \
            research/kalshi/frankie_aws_stage_s126.py \
            research/kalshi/frankie_causal_capture_gate_s126.py
      - name: Run A-E parity and blind-wall tests
        run: python -m pytest -q research/kalshi/tests/test_frankie_specialist_parity_s126.py
      - name: Run S121 close-boundary and S127 manual-runner tests
        run: |
          python -m pytest -q \
            research/kalshi/tests/test_frankie_s121_curve_restore.py \
            research/kalshi/tests/test_frankie_g24_run_s127.py
      - name: Prove protected spawner and specialist roles were not rewritten
        run: |
          test "$(git hash-object research/kalshi/spawn.py)" = "2eb3ab8570be66bd9568bcd3ca2e6b9f19d6b33e"
          git diff --exit-code 6441a2772a19cb19a390bc5c81fab28f9d9fb2f1 HEAD -- \
            research/kalshi/spawn.py \
            research/kalshi/agents/mbo_refine_shared.md \
            research/kalshi/agents/mbo_specialist_A.md \
            research/kalshi/agents/mbo_specialist_B.md \
            research/kalshi/agents/mbo_specialist_C.md \
            research/kalshi/agents/mbo_specialist_D.md \
            research/kalshi/agents/mbo_specialist_E.md
      - name: Verify S114 implementation remains in the current serving path
        env:
          PYTHONPATH: research/kalshi
        run: |
          git merge-base --is-ancestor 62382e2872b823cedad10681ebdf002671d66927 HEAD
          git show -s --format=%B 62382e2872b823cedad10681ebdf002671d66927 | \
            grep -q 'Store built for all 11 sessions, 31/31 members each'
          git show -s --format=%B 62382e2872b823cedad10681ebdf002671d66927 | \
            grep -q 'Store pushed to S3 and wired into restore_substrate'
          python - <<'PY'
          import inspect
          import forecast_harness as fh
          import restore_substrate
          import state_health

          producer = inspect.getsource(fh._weather_forcing_block)
          serving = inspect.getsource(fh.decision_state)
          assert 'wind_cf_proxy' in producer
          assert 'solar_irradiance_proxy' in producer
          assert 'is_forecast_not_realized' in producer
          assert '"weather_forcing_forecast": _weather_forcing_block(d)' in serving
          assert 'weather_forcing_forecast' in state_health.REQUIRED_EVERY_DAY
          assert ('nymex/gefs_forcing/', 'data/gefs_forcing') in restore_substrate.PREFIXES
          print('PASS: S114 producer -> decision_state -> stage-health -> restore path remains intact')
          PY
      - name: Prove committed g24 state and slices pass the same S126 serving and causal gates
        env:
          PYTHONPATH: research/kalshi
        run: |
          python - <<'PY'
          import group_config as gc
          from frankie_aws_stage_s126 import validate_served_forcing
          from frankie_causal_capture_gate_s126 import validate as validate_capture

          days = list(gc.GROUPS['g24']['days'])
          serving = validate_served_forcing('g24')
          capture = validate_capture('g24')
          assert serving['days'] == len(days)
          assert serving['weather_forcing_forecast'] == 'PASS'
          assert serving['wind_solar_separate'] is True
          assert serving['causal_slices'] == 'PASS'
          assert capture['days'] == len(days)
          assert capture['future_capture_stamps'] == 0
          assert capture['causal_structure'] == 'PASS'
          print(f'PASS: committed g24 state + {len(days)} causal slices pass S114 separation and hard causal-capture gates')
          PY
      - name: Export lossless sanctioned g24 packets for ChatGPT operation
        env:
          PYTHONPATH: research/kalshi
        run: |
          python research/kalshi/frankie_g24_run_s127.py export \
            --namespace frankie_g24_s127_chatgpt \
            --out /tmp/frankie_g24_s127_packets \
            > /tmp/frankie_g24_s127_export_stdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/frankie_g24_s127_packets')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['group'] == 'g24'
          assert manifest['packet_count'] == 11
          assert manifest['model_api_invoked'] is False
          assert manifest['actuals_read'] is False
          assert all(p['invariants']['full_play_bodies_served'] == 90 for p in manifest['packets'])
          assert all(p['invariants']['realized_outcome_in_packet'] is False for p in manifest['packets'])
          print('PASS: exported 10 BLD-1 packets + one Friday-cutoff BLD-2 packet; no model, no outcomes')
          PY
      - name: Upload ChatGPT-operated g24 packets
        uses: actions/upload-artifact@v4
        with:
          name: frankie-g24-s127-chatgpt-packets
          path: /tmp/frankie_g24_s127_packets/
          retention-days: 7
      - name: Score only after the full blind group is frozen and render the reveal
        env:
          PYTHONPATH: research/kalshi
        run: |
          python research/kalshi/frankie_g24_score_render_s127.py \
            > /tmp/frankie_g24_s127_score_stdout.json
          cat /tmp/frankie_g24_s127_score_stdout.json
      - name: Upload S127 g24 score and render
        uses: actions/upload-artifact@v4
        with:
          name: frankie-g24-s127-score-render
          path: |
            research/kalshi/renders/ng_refine_s95/g24_frankie_s127_chatgpt_score.json
            research/kalshi/renders/ng_refine_s95/g24_frankie_s127_chatgpt_render.png
          retention-days: 14
      - name: Re-read existing S114 GEFS store when Actions AWS credentials are available
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
          PYTHONPATH: research/kalshi
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          if not os.environ.get('AWS_ACCESS_KEY_ID') or not os.environ.get('AWS_SECRET_ACCESS_KEY'):
              print('NOTICE: live S3 re-read skipped: this repository has no Actions AWS credentials configured')
              raise SystemExit(0)

          import boto3
          import group_config as gc
          import forecast_harness as fh
          from frankie_specialist_parity_s126 import SPECIALISTS, attach_specialist_access

          dest = Path('data/gefs_forcing/gefs_forcing.json')
          dest.parent.mkdir(parents=True, exist_ok=True)
          boto3.client('s3', region_name='us-east-2').download_file(
              'bento-568968024170-us-east-2-an',
              'nymex/gefs_forcing/gefs_forcing.json',
              str(dest),
          )
          assert dest.stat().st_size > 0
          fh._GEFS_CACHE = None
          days = list(gc.GROUPS['g24']['days'])
          checked = {}
          for day in days:
              rec = fh._weather_forcing_block(day)
              assert isinstance(rec, dict) and rec, (day, rec)
              assert rec.get('wind_cf_proxy') is not None, (day, rec)
              assert rec.get('solar_irradiance_proxy') is not None, (day, rec)
              assert rec.get('served_separately') is True, (day, rec)
              assert rec.get('is_forecast_not_realized') is True, (day, rec)
              assert rec.get('cycle_utc') and rec.get('knowable_from'), (day, rec)
              assert str(rec['knowable_from'])[:10] < f'{day[:4]}-{day[4:6]}-{day[6:]}', (day, rec)
              checked[day] = rec

          day = days[0]
          causal_slice = {day: {'weather_forcing_forecast': checked[day]}}
          brain = {
              'plays': {'sentinel': {'body': 'full-brain parity sentinel'}},
              '_frankie_serving': {'canonical_plays_total': 1, 'full_plays_served': 1},
          }
          for spec in SPECIALISTS:
              packet = attach_specialist_access({
                  'realized_outcome_in_packet': False,
                  'causal_slice': causal_slice,
                  'brain_view_served': brain,
              }, specialist=spec, phase='BLIND')
              assert packet['causal_slice'][day]['weather_forcing_forecast'] is checked[day]
              assert packet['specialist_access_contract']['coordinator'] == 'Frankie'
          print(f'PASS: live S3 re-read found non-null separate S114 wind+solar on {len(days)} g24 days; unchanged to A-E')
          PY
name: S122 Task B verify candidate
on:
  push:
    branches: [chatgpt/s122-item4-task-b-verify-20260903]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply B only, verify, and create candidate
        shell: bash
        run: |
          set -euo pipefail
          TARGET='chatgpt/frankie-raw-mbo-benchmark-20260828'
          CANDIDATE='chatgpt/s122-item4-task-b-candidate-20260903'
          BASE='e409a9e2180890ded98262ac098b7e714d4025f1'
          cp scripts/s122_patch_task_b_tests_20260903.py /home/runner/task_b_tests.py
          cp scripts/s122_patch_task_b_source_20260903.py /home/runner/task_b_source.py
          python3 -m pip install --quiet pytest databento matplotlib scipy scikit-learn
          git fetch origin "$TARGET" "$CANDIDATE"
          test "$(git rev-parse origin/$TARGET)" = "$BASE" || { echo 'STOP: target moved'; exit 41; }
          test "$(git rev-parse origin/$CANDIDATE)" = "$BASE" || { echo 'STOP: candidate moved'; exit 42; }
          git switch -C s122-task-b "origin/$TARGET"
          cp /home/runner/task_b_tests.py task_b_tests_patch.py
          cp /home/runner/task_b_source.py task_b_source_patch.py
          python3 task_b_tests_patch.py
          python3 task_b_source_patch.py
          rm task_b_tests_patch.py task_b_source_patch.py
          python3 -m py_compile \
            research/kalshi/frankie_raw_mbo_benchmark/native_replay_driver.py \
            research/kalshi/frankie_raw_mbo_benchmark/native_response.py \
            research/kalshi/frankie_raw_mbo_benchmark/native_a_arm_launch.py
          set +e
          python3 -m pytest \
            research/kalshi/frankie_raw_mbo_benchmark/tests/test_native_replay_driver.py::ChangePointsAreDrivenByEventsTest \
            research/kalshi/frankie_raw_mbo_benchmark/tests/test_native_replay_driver.py::ChangePointsActuallyFireTest \
            research/kalshi/frankie_raw_mbo_benchmark/tests/test_native_a_arm_launch.py::ChangePointDefaultCliS122Test \
            research/kalshi/frankie_raw_mbo_benchmark/tests/test_native_response.py \
            -q -p no:cacheprovider > data_s122_b_focused.log 2>&1
          focused=$?
          set -e
          echo "FOCUSED_EXIT $focused"
          tail -120 data_s122_b_focused.log
          test "$focused" -eq 0
          set +e
          python3 -m pytest research/kalshi/frankie_raw_mbo_benchmark/tests -q -p no:cacheprovider > data_s122_b_suite.log 2>&1
          suite=$?
          set -e
          echo "SUITE_EXIT $suite"
          tail -100 data_s122_b_suite.log
          test "$suite" -eq 0
          python3 research/kalshi/store.py check
          python3 research/kalshi/store.py docs
          if git diff --unified=0 | grep '^+' | grep -nE 'E:[/\\]|scratchpad|/tmp'; then
            echo 'forbidden local path text added' >&2
            exit 43
          fi
          git diff --quiet research/ng_exhaustion_mbo_v4_state_adapter_20260820.py
          echo LOCKED_OK
          if git diff --name-only | grep -E '(^|/)[^/]*_RENDER_[^/]*\.md$|(^|/)FRANKIE_FEED_RECORD_[^/]*\.md$'; then
            echo 'forbidden historical render/feed record changed' >&2
            exit 44
          fi
          if git diff --unified=0 research/kalshi/frankie_raw_mbo_benchmark/native_response.py | grep -E '^[+-].*HORIZON_SETS'; then
            echo 'Task B touched HORIZON_SETS' >&2
            exit 45
          fi
          git diff --check
          git add \
            research/kalshi/frankie_raw_mbo_benchmark/native_replay_driver.py \
            research/kalshi/frankie_raw_mbo_benchmark/native_response.py \
            research/kalshi/frankie_raw_mbo_benchmark/native_a_arm_launch.py \
            research/kalshi/frankie_raw_mbo_benchmark/tests/test_native_replay_driver.py \
            research/kalshi/frankie_raw_mbo_benchmark/tests/test_native_a_arm_launch.py
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git commit -m 'fix: enable change points by canonical default' \
            -m 'S122 Item 4 Task B makes the driver and launcher default 4.16 event-driven change points ON under D83/D88, replaces the opt-in flag with the explicit --no-change-points comparison switch, and records disabled versus enabled/no-event states in the section summary. HORIZON_SETS and the fixed response ladder are unchanged.' \
            -m 'Co-Authored-By: Codex <noreply@openai.com>'
          git push origin "HEAD:$CANDIDATE"

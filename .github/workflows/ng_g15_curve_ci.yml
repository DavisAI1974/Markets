name: G15 Causal Curve Adapter CI

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - 'research/kalshi/ng_g15_curve_adapter.py'
      - 'research/kalshi/ng_rt_refiner.py'
      - 'research/kalshi/ng_historical_manifest.py'
      - 'research/kalshi/tests/test_ng_g15_curve_adapter.py'
      - '.github/workflows/ng_g15_curve_ci.yml'
  pull_request:
    paths:
      - 'research/kalshi/ng_g15_curve_adapter.py'
      - 'research/kalshi/ng_rt_refiner.py'
      - 'research/kalshi/ng_historical_manifest.py'
      - 'research/kalshi/tests/test_ng_g15_curve_adapter.py'
      - '.github/workflows/ng_g15_curve_ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile causal curve adapter
        run: |
          python -m py_compile \
            research/kalshi/ng_g15_curve_adapter.py \
            research/kalshi/tests/test_ng_g15_curve_adapter.py
      - name: Run adapter self-test
        run: python research/kalshi/ng_g15_curve_adapter.py --selftest
      - name: Run adapter unit tests
        run: python -m unittest -v research/kalshi/tests/test_ng_g15_curve_adapter.py

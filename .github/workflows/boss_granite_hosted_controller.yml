name: BOSS Granite bounded hosted controller

on:
  push:
    branches: [codex/boss-full-evidence-20260907]
    paths: [.github/workflows/boss_granite_hosted_controller.yml]

permissions:
  contents: read

concurrency:
  group: boss-granite-one-hosted-endpoint
  cancel-in-progress: false

jobs:
  verified-controller:
    if: github.ref == 'refs/heads/codex/boss-full-evidence-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned CPU coordinator and tokenizer dependencies
        timeout-minutes: 12
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.8.0 tokenizers==0.22.2 boto3==1.42.23 pytest==8.3.5 numpy==2.4.3
      - name: Verify coordinator and existing lifecycle without credentials
        env:
          PYTHONPATH: .:research/kalshi/frankie_boss:research/kalshi/frankie_boss/tests
        run: |
          python -m pytest -q research/kalshi/frankie_boss/tests/test_granite_coordinator.py research/kalshi/frankie_boss/tests/test_granite_live_controller.py research/kalshi/frankie_boss/tests/test_granite_deployment.py research/kalshi/frankie_boss/tests/test_granite_startup.py research/kalshi/frankie_boss/tests/test_granite_run_artifacts.py
      - name: Verify staged bytes and tokenizer then run one bounded hosted controller
        timeout-minutes: 40
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: us-east-1
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
          RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
          PYTHONUNBUFFERED: '1'
        run: python -m research.kalshi.frankie_boss.granite_coordinator run --directory work/granite-hosted --run-id "$RUN_ID"
      - name: Independent cleanup and confirmed endpoint absence
        if: always()
        timeout-minutes: 20
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: us-east-1
        run: |
          if test -f work/granite-hosted/deployment-ledger.json; then
            python -m research.kalshi.frankie_boss.granite_coordinator cleanup --directory work/granite-hosted
          fi
      - name: Retain original inputs runtime provider output failures and cleanup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: granite-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/granite-hosted/
            !work/granite-hosted/tokenizer/
          retention-days: 30
          if-no-files-found: warn

name: BOSS Bedrock integration inventory

on:
  push:
    branches: [codex/boss-full-evidence-20260907]
    paths:
      - .github/workflows/boss_bedrock_integration.yml
      - research/kalshi/frankie_boss/bedrock_inventory.py
      - research/kalshi/frankie_boss/tests/test_bedrock_inventory.py
      - research/kalshi/frankie_boss/sagemaker_inventory.py
      - research/kalshi/frankie_boss/tests/test_sagemaker_inventory.py

permissions:
  contents: read

concurrency:
  group: boss-bedrock-inventory
  cancel-in-progress: false

jobs:
  read-only-inventory:
    if: github.ref == 'refs/heads/codex/boss-full-evidence-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install inventory SDK and test dependencies
        run: python -m pip install boto3==1.42.23 pytest==8.3.5
      - name: Verify inventory contract without credentials
        env:
          PYTHONPATH: ${{ github.workspace }}/research/kalshi/frankie_boss
        run: |
          mkdir -p work/inventory-tests
          cp research/kalshi/frankie_boss/tests/test_bedrock_inventory.py work/inventory-tests/
          cp research/kalshi/frankie_boss/tests/test_sagemaker_inventory.py work/inventory-tests/
          python -m pytest work/inventory-tests/ -q
      - name: Inventory exact Granite deployment prerequisites
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python research/kalshi/frankie_boss/sagemaker_inventory.py --regions us-east-1 us-east-2 --output work/sagemaker-inventory.json
      - name: Inventory model and endpoint metadata only
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python research/kalshi/frankie_boss/bedrock_inventory.py --regions us-east-2 us-east-1 --output work/bedrock-inventory.json
      - name: Preserve inventory and permission failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boss-bedrock-inventory-${{ github.run_id }}
          path: |
            work/bedrock-inventory.json
            work/sagemaker-inventory.json
          if-no-files-found: warn
          retention-days: 14

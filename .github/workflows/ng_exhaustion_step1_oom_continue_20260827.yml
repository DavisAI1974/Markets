name: ONE-SHOT APPROVED - NG Exhaustion Step-1 OOM Continue 20260827

on:
  push:
    branches:
      - chatgpt/frankie-october-aws-readonly-20260824
    paths:
      - .github/workflows/ng_exhaustion_step1_oom_continue_20260827.yml

permissions:
  contents: read

concurrency:
  group: ng-exhaustion-two-day-full-mbo-step1-oom-continue-20260827
  cancel-in-progress: false

jobs:
  continue-full-mbo-step1:
    if: ${{ contains(github.event.head_commit.message, '[APPROVED_FULL_MBO_STEP1_OOM_CONTINUE_20260827]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      AWS_DEFAULT_REGION: us-east-2
      BUCKET: bento-568968024170-us-east-2-an
      INSTANCE_ID: i-08cee7171c0a76a04
      CANDIDATE_SHA: 0d318335825b4a0e19a5a2881522f3da0374788e
      SOURCE_RUN_ROOT: /mnt/markets/ng_exhaustion_two_day_full_mbo_step1_20260825/33054308590-1
      RESUME_NATIVE_SECONDS: /mnt/markets/ng_exhaustion_two_day_full_mbo_step1_20260825/32819740234-1/results/V4_NATIVE_FULL_MBO_SECONDS.jsonl.gz
      RESUME_NATIVE_SECONDS_SHA256: 899cca3c03d0cd66ba97bbd798b6d000bc3cb12c34d165a6def50b9c6f091b77
      PRIOR_ARCHIVE_SHA256: 27cacc62681bc482e89eefcc3746f5d71958beab4e25816054e0c388a0346b33
      MANIFEST: research/kalshi/NG_EXHAUSTION_MBO_5Y_CANONICAL_OBJECT_MANIFEST_20260822.json
      WRAPPER: research/ng_exhaustion_mbo_2day_full_mbo_step1_20260825.py
      RESULT_PREFIX_ROOT: nymex/ng_mbo_5y_v0/step1_census/two_day_full_mbo_corrected/continuations
      SWAP_FILE: /mnt/markets/.ng_step1_swap_20260827
      SWAP_BYTES: 34359738368
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Validate preserved inputs, add swap, and launch detached continuation
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RESULT_PREFIX_ROOT/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export RESULT_PREFIX="$prefix"
          wrapper_sha="$(sha256sum "$WRAPPER" | cut -d' ' -f1)"
          export WRAPPER_SHA256="$wrapper_sha"

          python - <<'PY'
          import boto3, os
          from botocore.client import Config
          s3=boto3.client('s3',region_name='us-east-2',endpoint_url='https://s3.us-east-2.amazonaws.com',
              config=Config(signature_version='s3v4',s3={'addressing_style':'virtual'}))
          prefix=os.environ['RESULT_PREFIX']
          bucket=os.environ['BUCKET']
          open('/tmp/result-put-url','w').write(s3.generate_presigned_url('put_object',
              Params={'Bucket':bucket,'Key':prefix+'/transfer/results.tar.gz'},ExpiresIn=172800))
          open('/tmp/status-put-url','w').write(s3.generate_presigned_url('put_object',
              Params={'Bucket':bucket,'Key':prefix+'/status/worker.json'},ExpiresIn=172800))
          PY
          RESULT_PUT_URL="$(cat /tmp/result-put-url)"
          STATUS_PUT_URL="$(cat /tmp/status-put-url)"
          export RESULT_PUT_URL STATUS_PUT_URL

          python - <<'PY'
          import json, os, shlex
          source=os.environ['SOURCE_RUN_ROOT']
          native=os.environ['RESUME_NATIVE_SECONDS']
          native_sha=os.environ['RESUME_NATIVE_SECONDS_SHA256']
          prior_sha=os.environ['PRIOR_ARCHIVE_SHA256']
          wrapper=os.environ['WRAPPER']
          wrapper_sha=os.environ['WRAPPER_SHA256']
          swap_file=os.environ['SWAP_FILE']
          swap_bytes=int(os.environ['SWAP_BYTES'])
          base=f"/mnt/markets/ng_exhaustion_step1_5y_20260822/{os.environ['CANDIDATE_SHA']}"
          cont=f"/mnt/markets/ng_exhaustion_two_day_full_mbo_step1_20260825/oom_continue/{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          result_url=os.environ['RESULT_PUT_URL']
          status_url=os.environ['STATUS_PUT_URL']
          unit=f"ng-exhaustion-step1-oom-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          remote=f'''set -euo pipefail
          source={shlex.quote(source)}
          native={shlex.quote(native)}
          native_sha={shlex.quote(native_sha)}
          prior_sha={shlex.quote(prior_sha)}
          wrapper={shlex.quote(wrapper)}
          wrapper_sha={shlex.quote(wrapper_sha)}
          base={shlex.quote(base)}
          cont={shlex.quote(cont)}
          swap_file={shlex.quote(swap_file)}
          swap_bytes={swap_bytes}
          result_url={shlex.quote(result_url)}
          status_url={shlex.quote(status_url)}
          unit={shlex.quote(unit)}

          test -d "$source/repo"
          test -d "$source/baseline"
          test -d "$source/raw"
          test -f "$native"
          test "$(sha256sum "$native" | cut -d' ' -f1)" = "$native_sha"
          test -x "$base/venv/bin/python"
          test -f "$source/repo/$wrapper"
          test "$(sha256sum "$source/repo/$wrapper" | cut -d' ' -f1)" = "$wrapper_sha"
          test ! -e "$cont"

          SOURCE="$source" "$base/venv/bin/python" - <<'PYVERIFY'
          import hashlib,json,os
          from pathlib import Path
          source=Path(os.environ['SOURCE'])
          manifest=json.loads((source/'repo/research/kalshi/NG_EXHAUSTION_MBO_5Y_CANONICAL_OBJECT_MANIFEST_20260822.json').read_text())
          wanted={{'20211001','20211003','20211004','20211005'}}
          rows=[x for x in manifest['canonical_dbn_objects'] if x.get('segment')=='20211001_20211101' and Path(x['key']).name.split('-')[-1].split('.')[0] in wanted]
          if len(rows)!=4: raise SystemExit('CONTINUE_RAW_ROSTER_DRIFT')
          for row in rows:
              path=source/'raw'/Path(row['key']).name
              if not path.is_file() or path.stat().st_size!=int(row['bytes']): raise SystemExit('CONTINUE_RAW_SIZE_DRIFT='+path.name)
              if hashlib.sha256(path.read_bytes()).hexdigest()!=row['sha256']: raise SystemExit('CONTINUE_RAW_SHA_DRIFT='+path.name)
          print('CONTINUE_RAW_MBO_HASHES=PASS')
          PYVERIFY

          if ! swapon --show=NAME --noheadings 2>/dev/null | tr -d ' ' | grep -Fxq "$swap_file"; then
            available=$(df --output=avail -B1 /mnt/markets | tail -1 | tr -d ' ')
            required=$((swap_bytes + 8589934592))
            if [ "$available" -lt "$required" ]; then
              echo "CONTINUE_SWAP_DISK_INSUFFICIENT available=$available required=$required" >&2
              exit 1
            fi
            if [ ! -f "$swap_file" ]; then
              fallocate -l "$swap_bytes" "$swap_file"
              chmod 600 "$swap_file"
              mkswap "$swap_file" >/dev/null
            fi
            swapon "$swap_file"
          fi
          echo CONTINUE_SWAP_ACTIVE=PASS
          free -b
          swapon --show

          mkdir -p "$cont/repo" "$cont/results"
          cp -a --reflink=auto "$source/repo/." "$cont/repo/"
          cat > "$cont/worker.sh" <<'WORKER'
          #!/usr/bin/env bash
          set -euo pipefail
          status_file="$cont/WORKER_STATUS.json"
          finish() {
            rc=$?
            RC="$rc" CONT="$cont" "$base/venv/bin/python" - <<'PYSTATUS' || true
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['CONT']); rc=int(os.environ['RC'])
          body={{'schema':'NG_EXHAUSTION_STEP1_OOM_CONTINUE_WORKER_STATUS_V1_20260827',
                 'status':'SUCCESS' if rc==0 else 'FAILURE','exit_code':rc}}
          tar=root/'results.tar.gz'; manifest=root/'results/RESULT_FILE_MANIFEST.json'
          if tar.is_file(): body['results_tar_sha256']=hashlib.sha256(tar.read_bytes()).hexdigest()
          if manifest.is_file():
              data=json.loads(manifest.read_text()); body['result_file_manifest_sha256']=data.get('manifest_sha256')
          (root/'WORKER_STATUS.json').write_text(json.dumps(body,indent=2,sort_keys=True)+'\n')
          PYSTATUS
            curl --fail --silent --show-error --request PUT --upload-file "$status_file" "$status_url" || true
            exit "$rc"
          }
          trap finish EXIT
          cd "$cont/repo"
          MPLCONFIGDIR="$cont/matplotlib" PYTHONPATH=research \
            /usr/bin/time -v -o "$cont/resource.txt" \
            "$base/venv/bin/python" "$wrapper" \
              --parent-manifest research/kalshi/NG_EXHAUSTION_MBO_5Y_CANONICAL_OBJECT_MANIFEST_20260822.json \
              --baseline-results "$source/baseline" \
              --baseline-results-tar-sha256 "$prior_sha" \
              --raw-mbo "$source/raw/glbx-mdp3-20211001.mbo.dbn.zst" \
                        "$source/raw/glbx-mdp3-20211003.mbo.dbn.zst" \
                        "$source/raw/glbx-mdp3-20211004.mbo.dbn.zst" \
                        "$source/raw/glbx-mdp3-20211005.mbo.dbn.zst" \
              --resume-native-seconds "$native" \
              --out-dir "$cont/results" | tee "$cont/run.log"
          cp "$cont/resource.txt" "$cont/results/RESOURCE_USAGE.txt"
          cp "$cont/run.log" "$cont/results/RUN.log"
          "$base/venv/bin/python" - "$cont/results" <<'PYMANIFEST'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]); rows=[]
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rows.append({{'relative_path':path.relative_to(root).as_posix(),'bytes':path.stat().st_size,
                  'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}})
          manifest={{'schema':'NG_EXHAUSTION_TWO_DAY_FULL_MBO_RESULT_FILE_MANIFEST_V1_20260825','files':rows}}
          manifest['manifest_sha256']=hashlib.sha256(json.dumps(manifest,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'RESULT_FILE_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PYMANIFEST
          tar -C "$cont/results" -czf "$cont/results.tar.gz" .
          curl --fail --silent --show-error --request PUT --upload-file "$cont/results.tar.gz" "$result_url"
          WORKER
          chmod 700 "$cont/worker.sh"
          printf '%s\n' "$unit" > "$cont/SYSTEMD_UNIT"
          systemd-run --unit="$unit" --collect --property=Type=exec /bin/bash "$cont/worker.sh"
          sleep 2
          systemctl is-active --quiet "$unit"
          echo CONTINUE_SYSTEMD_UNIT="$unit"
          echo CONTINUE_ROOT="$cont"
          echo CONTINUE_LAUNCHED=PASS
          '''
          open('/tmp/continue-params.json','w').write(json.dumps({'commands':['/bin/bash -lc '+shlex.quote(remote)],'executionTimeout':['600']}))
          PY
          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment 'OOM-safe continuation of corrected full-MBO Step-1' --parameters file:///tmp/continue-params.json --timeout-seconds 600 --query 'Command.CommandId' --output text)"
          for poll in $(seq 1 120); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' --output json
          test "$status" = Success

      - name: Wait for detached worker result
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RESULT_PREFIX_ROOT/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          status_key="$prefix/status/worker.json"
          for poll in $(seq 1 340); do
            if aws s3api head-object --bucket "$BUCKET" --key "$status_key" >/dev/null 2>&1; then
              aws s3 cp "s3://$BUCKET/$status_key" /tmp/worker-status.json --only-show-errors
              cat /tmp/worker-status.json
              python - <<'PY'
          import json
          row=json.load(open('/tmp/worker-status.json'))
          if row.get('status')!='SUCCESS' or row.get('exit_code')!=0:
              raise SystemExit('DETACHED_FULL_MBO_WORKER_FAILED')
          for key in ('results_tar_sha256','result_file_manifest_sha256'):
              if len(str(row.get(key,'')))!=64: raise SystemExit('DETACHED_WORKER_BINDING_MISSING='+key)
          PY
              exit 0
            fi
            sleep 60
          done
          echo DETACHED_WORKER_STILL_RUNNING_AFTER_MONITOR_WINDOW >&2
          exit 1

      - name: Verify receipt and publish COMPLETE last
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RESULT_PREFIX_ROOT/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p /tmp/full-mbo-results
          aws s3 cp "s3://$BUCKET/$prefix/transfer/results.tar.gz" /tmp/full-mbo-results.tar.gz --only-show-errors
          tar -C /tmp/full-mbo-results -xzf /tmp/full-mbo-results.tar.gz
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/full-mbo-results').resolve(); archive=Path('/tmp/full-mbo-results.tar.gz')
          status=json.load(open('/tmp/worker-status.json'))
          archive_sha=hashlib.sha256(archive.read_bytes()).hexdigest()
          if archive_sha!=status['results_tar_sha256']: raise SystemExit('WORKER_DOWNLOADED_TAR_SHA_DRIFT')
          file_manifest=json.loads((root/'RESULT_FILE_MANIFEST.json').read_text())
          claimed_manifest_sha=file_manifest.pop('manifest_sha256')
          computed_manifest_sha=hashlib.sha256(json.dumps(file_manifest,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          if claimed_manifest_sha!=computed_manifest_sha or claimed_manifest_sha!=status['result_file_manifest_sha256']:
              raise SystemExit('RESULT_FILE_MANIFEST_SHA_DRIFT')
          listed={row['relative_path']:row for row in file_manifest['files']}
          actual={path.relative_to(root).as_posix():path for path in root.rglob('*') if path.is_file() and path.name!='RESULT_FILE_MANIFEST.json'}
          if set(listed)!=set(actual): raise SystemExit('RESULT_FILE_MANIFEST_COVERAGE_DRIFT')
          for rel,path in actual.items():
              row=listed[rel]; digest=hashlib.sha256(path.read_bytes()).hexdigest()
              if path.stat().st_size!=int(row['bytes']) or digest!=row['sha256']: raise SystemExit('RESULT_FILE_MANIFEST_IDENTITY_DRIFT='+rel)
          receipt=json.loads((root/'STEP1_DUAL_FULL_MBO_RECEIPT.json').read_text())
          claimed=receipt.pop('receipt_sha256'); got=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          if claimed!=got: raise SystemExit('FULL_MBO_RECEIPT_SELF_HASH_DRIFT')
          if receipt['source_window']!={'start':'2021-10-04T00:00:00Z','end_exclusive':'2021-10-06T00:00:00Z'}: raise SystemExit('FULL_MBO_WINDOW_DRIFT')
          if receipt['native_full_mbo']['vector_dimension']!=81 or not receipt['native_full_mbo']['raw_mbo_replayed']: raise SystemExit('FULL_MBO_VECTOR_CONTRACT_DRIFT')
          native=receipt['native_full_mbo']
          if native.get('proposal_count_cap') is not None or native.get('family_count_cap') is not None: raise SystemExit('UNCAPPED_MBO_DISCOVERY_WAS_CAPPED')
          if native.get('raw_bootstrap_dates')!=['20211001','20211003','20211004','20211005']: raise SystemExit('RAW_MBO_DATE_ROSTER_DRIFT')
          if receipt['legacy_control']['unchanged_from_receipt_sha256']!='140c6234b8e6f4216416290aa50f4070160e200a3e7025cbca3aa08d0ef42e52': raise SystemExit('LEGACY_BASELINE_DRIFT')
          verified={}
          def verify(value):
              if isinstance(value,dict):
                  if {'relative_path','bytes','sha256'} <= set(value):
                      rel=Path(str(value['relative_path'])); path=(root/rel).resolve()
                      if rel.is_absolute() or '..' in rel.parts or not path.is_relative_to(root) or not path.is_file(): raise SystemExit('FULL_MBO_ARTIFACT_MISSING='+str(rel))
                      digest=hashlib.sha256(path.read_bytes()).hexdigest()
                      if path.stat().st_size!=int(value['bytes']) or digest!=value['sha256']: raise SystemExit('FULL_MBO_ARTIFACT_IDENTITY_DRIFT='+str(rel))
                      verified[str(rel)]=digest
                  for child in value.values(): verify(child)
              elif isinstance(value,list):
                  for child in value: verify(child)
          verify(receipt)
          complete={'schema':'NG_EXHAUSTION_TWO_DAY_FULL_MBO_COMPLETION_V1_20260825','status':'COMPLETE',
              'github_run_id':os.environ['GITHUB_RUN_ID'],'github_sha':os.environ['GITHUB_SHA'],
              'continuation_from_run_id':33054308590,'continuation_reason':'OOM_RECOVERY_SAME_SCIENTIFIC_PROGRAM',
              'step1_receipt_sha256':claimed,'results_tar_sha256':archive_sha,
              'result_file_manifest_sha256':claimed_manifest_sha,'result_file_count':len(listed)+1,
              'native_vector_dimension':81,'uncapped_mbo_event_count':native['event_count'],
              'uncapped_mbo_family_counts':native['family_counts'],'proposal_count_cap':None,'family_count_cap':None,
              'raw_mbo_replayed':True,'provider_llm_called':False,'frankie_launched':False}
          complete['completion_sha256']=hashlib.sha256(json.dumps(complete,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path('/tmp/FULL_MBO_COMPLETE.json').write_text(json.dumps(complete,indent=2,sort_keys=True)+'\n')
          print('FULL_MBO_RECEIPT_AND_WINDOW=PASS')
          print('FULL_MBO_RECEIPT_SHA256='+claimed)
          print('FULL_MBO_VERIFIED_ARTIFACT_COUNT='+str(len(verified)))
          print('FULL_MBO_RESULTS_TAR_SHA256='+archive_sha)
          print('FULL_MBO_RESULT_FILE_MANIFEST_SHA256='+claimed_manifest_sha)
          PY
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          import boto3
          from botocore.client import Config
          bucket=os.environ['BUCKET']; prefix=f"{os.environ['RESULT_PREFIX_ROOT']}/{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          s3=boto3.client('s3',region_name='us-east-2',endpoint_url='https://s3.us-east-2.amazonaws.com',config=Config(signature_version='s3v4',s3={'addressing_style':'virtual'}))
          root=Path('/tmp/full-mbo-results'); published={}
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              key=f"{prefix}/artifacts/{path.relative_to(root).as_posix()}"; body=path.read_bytes(); digest=hashlib.sha256(body).hexdigest()
              s3.put_object(Bucket=bucket,Key=key,Body=body,Metadata={'sha256':digest}); published[key]=(len(body),digest)
          wrapper=Path(os.environ['WRAPPER']); body=wrapper.read_bytes(); digest=hashlib.sha256(body).hexdigest()
          key=f"{prefix}/input/{wrapper.name}"; s3.put_object(Bucket=bucket,Key=key,Body=body,Metadata={'sha256':digest}); published[key]=(len(body),digest)
          for key,(size,digest) in published.items():
              head=s3.head_object(Bucket=bucket,Key=key)
              if int(head['ContentLength'])!=size or head.get('Metadata',{}).get('sha256')!=digest: raise SystemExit('FINAL_PUBLICATION_IDENTITY_DRIFT='+key)
          complete_path=Path('/tmp/FULL_MBO_COMPLETE.json'); complete_body=complete_path.read_bytes(); complete_sha=hashlib.sha256(complete_body).hexdigest()
          complete_key=f"{prefix}/COMPLETE.json"; s3.put_object(Bucket=bucket,Key=complete_key,Body=complete_body,Metadata={'sha256':complete_sha})
          reread=s3.get_object(Bucket=bucket,Key=complete_key)['Body'].read()
          if reread!=complete_body: raise SystemExit('COMPLETE_REREAD_BYTE_DRIFT')
          complete=json.loads(reread); claimed=complete.pop('completion_sha256'); computed=hashlib.sha256(json.dumps(complete,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          if claimed!=computed: raise SystemExit('COMPLETE_REREAD_SELF_HASH_DRIFT')
          transfer_key=f"{prefix}/transfer/results.tar.gz"; status_key=f"{prefix}/status/worker.json"
          expected=set(published)|{complete_key,transfer_key,status_key}
          actual={row['Key'] for row in s3.list_objects_v2(Bucket=bucket,Prefix=prefix+'/').get('Contents',[])}
          if actual!=expected: raise SystemExit('FINAL_PUBLICATION_OBJECT_SET_DRIFT')
          print('FULL_MBO_COMPLETE_LAST_REREAD=PASS')
          print('FULL_MBO_FINAL_OBJECT_COUNT='+str(len(actual)))
          PY

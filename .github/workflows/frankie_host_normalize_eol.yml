name: Frankie normalize native host checkout line endings
# Sets core.autocrlf=false on the native host's tools checkout and rewrites the working tree from
# the index, so every source file equals its committed bytes and the host's byte-hashed identities
# match the observer's pins (line 843 refusal of run 35512638774, 2026-09-20). Refuses on a dirty
# tree, deletes nothing, moves no commit, writes one receipt into the day directory. Dispatch only.
# Inputs reach the shell through env, never by expression interpolation into run:.
on:
  workflow_dispatch:
    inputs:
      instance:
        description: 'Native host instance id'
        required: false
        default: 'i-0e90ee6110ef609aa'
      day:
        description: 'Day directory that receives the receipt'
        required: false
        default: '20211003'
      run_root:
        description: 'Day pipeline RunRoot on the host'
        required: false
        default: 'C:/Codex/Frankie-BOSS-20260919/days'
      tools_root:
        description: 'Host tools checkout'
        required: false
        default: 'C:/tools/Frankie-20260919/Markets'
permissions:
  contents: read
jobs:
  normalize:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97
      - name: Normalize the tools checkout over SSM
        env:
          INSTANCE: ${{ inputs.instance }}
          DAY: ${{ inputs.day }}
          RUN_ROOT: ${{ inputs.run_root }}
          TOOLS_ROOT: ${{ inputs.tools_root }}
        run: |
          python deploy/aws/ssm_run_ps1.py \
            --instance "$INSTANCE" --region us-east-2 \
            --script deploy/aws/host/frankie_host_normalize_eol.ps1 \
            --set "ToolsRoot=$TOOLS_ROOT" \
            --set "RunRoot=$RUN_ROOT" \
            --set "Day=$DAY" \
            --timeout 600 --comment "normalize tools checkout line endings for day $DAY"

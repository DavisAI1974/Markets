name: NG G15 exact replay windows

on:
  push:
    branches:
      - chatgpt/ng-forecaster-s103-audit
    paths:
      - research/kalshi/ng_g15_exact_replay_window_authorization.py
      - research/kalshi/ng_historical_refinement_readiness_v8.py
      - research/kalshi/tests/test_ng_g15_exact_replay_window_authorization.py
      - research/kalshi/tests/test_ng_historical_refinement_readiness_v8.py
      - .github/workflows/ng_g15_exact_replay_window_authorization_ci.yml
  pull_request:
    paths:
      - research/kalshi/ng_g15_exact_replay_window_authorization.py
      - research/kalshi/ng_historical_refinement_readiness_v8.py
      - research/kalshi/tests/test_ng_g15_exact_replay_window_authorization.py
      - research/kalshi/tests/test_ng_historical_refinement_readiness_v8.py
      - .github/workflows/ng_g15_exact_replay_window_authorization_ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile replay-window authority chain
        working-directory: research/kalshi
        run: |
          python -m py_compile \
            ng_broad_corpus_exact_overlap_gate.py \
            ng_broad_corpus_exact_partition_gate.py \
            ng_g15_exact_replay_completion.py \
            ng_g15_exact_replay_window_authorization.py \
            ng_historical_refinement_readiness.py \
            ng_historical_refinement_readiness_v4.py \
            ng_historical_refinement_readiness_v5.py \
            ng_historical_refinement_readiness_v6.py \
            ng_historical_refinement_readiness_v7.py \
            ng_historical_refinement_readiness_v8.py \
            tests/test_ng_g15_exact_replay_window_authorization.py \
            tests/test_ng_historical_refinement_readiness_v8.py
      - name: Run module self-tests
        working-directory: research/kalshi
        run: |
          python ng_g15_exact_replay_window_authorization.py --selftest
          python ng_historical_refinement_readiness_v8.py --selftest
      - name: Run focused replay-window tests
        working-directory: research/kalshi
        run: |
          python -m unittest discover -s tests -p 'test_ng_g15_exact_replay_window_authorization.py' -v
          python -m unittest discover -s tests -p 'test_ng_historical_refinement_readiness_v8.py' -v
      - name: Verify exact event-time boundary before refinement
        working-directory: research/kalshi
        run: |
          python - <<'PY'
          import ng_historical_refinement_readiness_v8 as readiness
          import ng_g15_exact_replay_window_authorization as window

          order = [spec.key for spec in readiness.STAGES]
          assert order.index('broad_corpus_exact_partition') < order.index('g15_exact_replay')
          assert order.index('g15_exact_replay') < order.index('g15_exact_replay_window_authorization')
          assert order.index('g15_exact_replay_window_authorization') < order.index('g15_exact_refinement')
          spec = next(spec for spec in readiness.STAGES if spec.key == 'g15_exact_replay_window_authorization')
          assert spec.pre_outcome is True
          assert window.READY_STATUS in spec.ready_statuses
          assert window.READY_WITH_STAND_DOWNS in spec.ready_statuses
          assert 'g15_counterfactual_scoring_lock' in order
          assert 'g16_counterfactual_curve_lock' in order
          print('G15 exact replay-window boundary PASS')
          PY

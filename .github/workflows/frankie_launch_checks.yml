name: Frankie launch checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boss:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .:research/kalshi/frankie_boss:research/kalshi/frankie_boss/tests
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.3.5 boto3==1.42.23 botocore==1.42.97 cffi databento-dbn==0.62.0 zstandard pytest cryptography==46.0.3 requests pyyaml
      - name: Complete scientific family and changed launch controls
        run: |
          python -m pytest -q research/kalshi/frankie_boss/tests/test_granite*.py research/kalshi/frankie_boss/tests/test_sunday*.py research/kalshi/frankie_boss/tests/test_run_actual*.py research/kalshi/frankie_boss/tests/test_frankie_controller.py research/kalshi/frankie_boss/tests/test_actual_host*.py research/kalshi/frankie_boss/tests/test_day_pipeline.py research/kalshi/frankie_boss/tests/test_classroom_recovery_reconciliation.py research/kalshi/frankie_boss/tests/test_stage_block_sources.py
      - name: Validate workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in (Path('.github/workflows/frankie_journal_stack.yml'), Path('.github/workflows/frankie_launch_checks.yml')):
              yaml.safe_load(path.read_text())
          PY
  receiver:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4e1f4f07
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Verify receiver proof production and rendering
        run: python -m pytest -q research/kalshi/frankie_raw_mbo_benchmark/tests/test_native_sealed_absence.py research/kalshi/frankie_raw_mbo_benchmark/tests/test_emit_frankie_spawn.py

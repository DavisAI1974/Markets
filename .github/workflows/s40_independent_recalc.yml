name: S40 Independent Dipole Recalc

on:
  push:
    branches:
      - chatgpt/s40-independent-recalc-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recalc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact S40 analysis branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependency
        run: python -m pip install --quiet numpy

      - name: Materialize cumulative Bybit bins
        run: |
          git fetch --force origin \
            data/btc-bins:refs/remotes/origin/data/btc-bins \
            data/eth-bins:refs/remotes/origin/data/eth-bins
          mkdir -p realbins
          git show origin/data/btc-bins:btc_bybit_perp_bins.json.gz | gzip -dc > realbins/btc_bybit_perp_bins.json
          git show origin/data/eth-bins:eth_bybit_perp_bins.json.gz | gzip -dc > realbins/eth_bybit_perp_bins.json
          ls -lh realbins/*_bybit_perp_bins.json

      - name: Recalculate S40 independently
        run: PYTHONPATH=. python research/s40_independent_recalc.py

      - name: Upload calculation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s40-independent-recalc
          path: s40_independent_recalc_results.json
          if-no-files-found: warn

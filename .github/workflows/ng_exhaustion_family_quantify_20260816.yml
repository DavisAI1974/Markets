name: NG Exhaustion Family Quantify 20260816

# Scratch-only price-blind family audit.
on:
  push:
    branches:
      - chatgpt/ng-exhaustion-frankie-blind-20260816
    paths:
      - research/ng_exhaustion_family_quantify_20260816.py
      - .github/workflows/ng_exhaustion_family_quantify_20260816.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quantify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install --quiet matplotlib numpy scipy scikit-learn
      - name: Download authoritative NG MBP-10 days
        run: |
          set -euo pipefail
          for d in 20250717 20250923 20250930 20251001; do
            aws s3 cp s3://bento-568968024170-us-east-2-an/nymex/nymex_cont/NG_${d}.jsonl.gz /tmp/NG_${d}.jsonl.gz --only-show-errors
            test -s /tmp/NG_${d}.jsonl.gz
          done
      - name: Quantify families without price
        run: |
          PYTHONPATH=research python research/ng_exhaustion_family_quantify_20260816.py \
            /tmp/NG_20250717.jsonl.gz \
            /tmp/NG_20250923.jsonl.gz \
            /tmp/NG_20250930.jsonl.gz \
            /tmp/NG_20251001.jsonl.gz
      - name: Upload family audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ng-exhaustion-family-quantify-20260816
          path: |
            ng_exhaustion_family_quantification.json
            ng_exhaustion_family_count_metrics.png
            ng_exhaustion_families_k3.png
            ng_exhaustion_families_k4.png
            ng_exhaustion_families_k5.png
          if-no-files-found: warn

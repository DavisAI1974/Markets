name: Frankie supersede code-bound retained state
# Moves (never deletes) the code/checkpoint-bound retained files of a run directory into a dated
# sibling folder so the runner re-mints them at the advanced host commit; receipt into the day
# directory. Greg's call 2026-09-20: get the two-cycle run running. Dispatch only.
# Inputs reach the shell through env, never by expression interpolation into run: (audit, Medium).
on:
  workflow_dispatch:
    inputs:
      instance:
        description: 'Native host instance id'
        required: false
        default: 'i-0e90ee6110ef609aa'
      day:
        description: 'Day whose run directory is superseded'
        required: false
        default: '20211003'
      run_root:
        description: 'Day pipeline RunRoot on the host'
        required: false
        default: 'C:/Codex/Frankie-BOSS-20260919/days'
      tools_root:
        description: 'Host tools checkout'
        required: false
        default: 'C:/tools/Frankie-20260919/Markets'
      python:
        description: 'Host actual-run interpreter'
        required: false
        default: 'C:/Codex/Frankie-BOSS-20260919/actual-host-python/Scripts/python.exe'
      cycle_index:
        description: 'Zero-padded cycle index whose preparation is superseded'
        required: false
        default: '00'
      old_commit:
        description: 'Only when both identity records are already gone: the 40-hex commit the stale records were written by'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  supersede:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97
      - name: Supersede code-bound retained state over SSM
        env:
          INSTANCE: ${{ inputs.instance }}
          DAY: ${{ inputs.day }}
          RUN_ROOT: ${{ inputs.run_root }}
          TOOLS_ROOT: ${{ inputs.tools_root }}
          HOST_PYTHON: ${{ inputs.python }}
          CYCLE_INDEX: ${{ inputs.cycle_index }}
          OLD_COMMIT: ${{ inputs.old_commit }}
        run: |
          python deploy/aws/ssm_run_ps1.py \
            --instance "$INSTANCE" --region us-east-2 \
            --script deploy/aws/host/frankie_host_supersede_code_bound_state.ps1 \
            --set "Day=$DAY" \
            --set "RunRoot=$RUN_ROOT" \
            --set "ToolsRoot=$TOOLS_ROOT" \
            --set "Python=$HOST_PYTHON" \
            --set "CycleIndex=$CYCLE_INDEX" \
            --set "OldCommit=$OLD_COMMIT" \
            --timeout 300 --comment "supersede code-bound retained state for day $DAY"

name: Kraken Candidate Book Collectors (16 LARGE majors, durable)

# S70: a SEPARATE, additive collector for the 16 S67-sweep LARGE candidate majors
# (>$1M/24h, from KRAKEN_MAJORS_SWEEP_S67.md). This deliberately does NOT touch
# kraken_book_collectors_durable.yml (the proven 5-major collector) — that file
# and its ~42h+ of accrued books keep running byte-for-byte unchanged. Each coin
# here is an independent matrix job persisting to its own data/<coin>-kraken-book
# branch (same loader/format as the majors), with the same anti-clobber + rotation
# guardrails. Cron is offset from the majors to stagger job starts.
#
# WHY (S70): the honest capital-model fill comes from the L2 BOOK queue (S69), and
# books take days to accrue. These 16 are ungraded candidate seats; starting their
# books now begins the clock so the honest queue-fill is available when each is
# graded on tape (grade_coin_kraken.py). Seating in the capital model waits on the
# per-cell grade — books are just the data prerequisite.
#
# Kraken v2 WS symbols are friendly names (verified S70 against Kraken AssetPairs:
# all 16 return the exact wsname used here, e.g. HYPE/USD, SUI/USD, XMR/USD).
#
# ACTIVATION NOTE: GitHub only fires `schedule:` (cron) triggers from a workflow
# file on the repository DEFAULT branch. Manual runs use the Run-workflow button
# (workflow_dispatch — the token 403s on API dispatch, Greg clicks). The job
# checks out the canonical 5c5vg9 branch for collector code regardless of which
# branch the run is dispatched from.
#
# Storage: ~6 MB gzipped per 5h50m run per coin at 100ms grid; the >85MB
# rotation guardrail freezes segments long before GitHub's 100 MiB cap.

on:
  schedule:
    - cron: '0 3,9,15,21 * * *'   # 03:00, 09:00, 15:00, 21:00 UTC — offset +3h from the
                                  # majors collector to stagger job starts (default-branch only)
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Collection duration in seconds (default 5h50m=21000)'
        default: '21000'
        type: string
      grid_ms:
        description: 'Snapshot grid in milliseconds'
        default: '100'
        type: string
      depth:
        description: 'Top-K levels per side'
        default: '10'
        type: string
  # NOTE: no `push:` trigger (the S44 duplicate-run lesson) — cron + manual only.

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # 5h55m, just under GitHub's 6hr hard limit
    strategy:
      fail-fast: false
      matrix:
        include:
          # The 16 S67-sweep LARGE-band candidate majors (>$1M/24h), HYPE->XPL.
          - coin: hype
            product: HYPE/USD
          - coin: sui
            product: SUI/USD
          - coin: ada
            product: ADA/USD
          - coin: zec
            product: ZEC/USD
          - coin: xmr
            product: XMR/USD
          - coin: avax
            product: AVAX/USD
          - coin: xlm
            product: XLM/USD
          - coin: aave
            product: AAVE/USD
          - coin: ltc
            product: LTC/USD
          - coin: near
            product: NEAR/USD
          - coin: tao
            product: TAO/USD
          - coin: link
            product: LINK/USD
          - coin: bch
            product: BCH/USD
          - coin: bnb
            product: BNB/USD
          - coin: ton
            product: TON/USD
          - coin: xpl
            product: XPL/USD
    concurrency:
      group: kraken-cand-book-collector-${{ matrix.coin }}
      cancel-in-progress: false

    steps:
      - name: Checkout code branch
        uses: actions/checkout@v4
        with:
          ref: claude/crypto-liquidity-signals-5c5vg9
          fetch-depth: 0   # need full history to access data branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet websockets numpy

      - name: Restore previous book file from data/${{ matrix.coin }}-kraken-book branch
        run: |
          COIN="${{ matrix.coin }}"
          FN="${COIN}_kraken_book.jsonl.gz"
          if git ls-remote --exit-code --heads origin "data/$COIN-kraken-book" > /dev/null 2>&1; then
            echo "[restore] data/$COIN-kraken-book exists; fetching"
            git fetch origin "data/$COIN-kraken-book"
            git checkout "origin/data/$COIN-kraken-book" -- . 2>/dev/null \
              || echo "[restore] nothing on data branch yet"
          else
            echo "[restore] data/$COIN-kraken-book does not exist; first run, starting fresh"
          fi
          ls -la "$FN" 2>&1 || echo "[restore] no book file present"

      - name: Connectivity check
        run: |
          curl -sS --max-time 5 -o /dev/null -w "Kraken REST: %{http_code}\n" \
            https://api.kraken.com/0/public/SystemStatus || true

      - name: Run ${{ matrix.coin }} Kraken book collector
        timeout-minutes: 350
        run: |
          COIN="${{ matrix.coin }}"
          FN="${COIN}_kraken_book.jsonl.gz"
          DURATION="${{ github.event.inputs.duration_seconds || '21000' }}"
          GRID="${{ github.event.inputs.grid_ms || '100' }}"
          DEPTH="${{ github.event.inputs.depth || '10' }}"
          echo "[run] $COIN kraken book collector ${DURATION}s grid=${GRID}ms depth=${DEPTH} on $(date -u)"
          python kraken_book_collector.py \
            --product "${{ matrix.product }}" --out "$FN" \
            --duration "$DURATION" --grid-ms "$GRID" --depth "$DEPTH" > /tmp/kr_book.log 2>&1 || true
          echo "=== kraken book collector log tail ==="
          tail -40 /tmp/kr_book.log

      - name: Book file stats
        if: always()
        run: |
          COIN="${{ matrix.coin }}"
          FN="${COIN}_kraken_book.jsonl.gz"
          if [ -f "$FN" ]; then
            SIZE=$(stat -c%s "$FN")
            N=$(python -c "import gzip,sys; print(sum(1 for l in gzip.open(sys.argv[1],'rt') if l.strip()))" \
                "$FN" 2>/dev/null || echo "?")
            echo "$FN: $SIZE bytes, $N rows"
          fi

      - name: Commit book to data/${{ matrix.coin }}-kraken-book branch (force-push, history-less)
        if: always()
        run: |
          COIN="${{ matrix.coin }}"
          FN="${COIN}_kraken_book.jsonl.gz"
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          mkdir -p /tmp/book
          cp ${COIN}_kraken_book*.jsonl.gz /tmp/book/ 2>/dev/null || true

          # Anti-clobber guardrail: this step is `if: always()` + force-push, so a
          # crashed/partial run must NOT overwrite good cumulative rows. The
          # append/resume pattern means a healthy file is always >= the data-branch
          # copy; if a fresh file regressed (fewer rows), restore the data-branch
          # copy so the push preserves history instead of wiping it.
          BRANCH="origin/data/$COIN-kraken-book" FN="$FN" python - <<'PY'
          import gzip, subprocess, os
          BRANCH = os.environ["BRANCH"]
          FN = os.environ["FN"]
          def count_path(path):
              try:
                  with gzip.open(path, "rt") as f:
                      return sum(1 for l in f if l.strip())
              except Exception:
                  return 0
          newp = os.path.join("/tmp/book", FN)
          new = count_path(newp)
          try:
              blob = subprocess.run(["git", "show", f"{BRANCH}:{FN}"],
                                    capture_output=True, check=True).stdout
          except subprocess.CalledProcessError:
              blob = None
          old = 0
          if blob:
              tmp = "/tmp/_old_book.jsonl.gz"
              with open(tmp, "wb") as f: f.write(blob)
              old = count_path(tmp)
          if old and new < old:
              with open(newp, "wb") as f: f.write(blob)
              print(f"[guardrail] {FN}: collected {new} rows < {old} on data branch "
                    f"-> RESTORED data-branch copy (no regression)")
          else:
              print(f"[guardrail] {FN}: {new} rows (>= {old} on data branch) -> keep")
          PY

          # Rotation guardrail (S58): GitHub rejects any file > 100 MiB (the S37 stall
          # bug). At >85MB freeze the live file as an archived segment on the same data
          # branch and let the next run start a fresh live file. Loaders keep reading
          # the live file; archived segments preserve the older history.
          LIVE="/tmp/book/$FN"
          if [ -f "$LIVE" ] && [ "$(stat -c%s "$LIVE")" -gt 85000000 ]; then
            STAMP=$(date -u +%Y%m%dT%H%M%S)
            mv "$LIVE" "/tmp/book/${COIN}_kraken_book_arch_${STAMP}.jsonl.gz"
            echo "[rotate] $FN >85MB -> frozen as arch_${STAMP}; fresh live file next run"
          fi

          git checkout --orphan "data/$COIN-kraken-book-tmp"
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/book/*.jsonl.gz . 2>/dev/null || true

          if ls *kraken_book*.jsonl.gz >/dev/null 2>&1; then
            git add *kraken_book*.jsonl.gz
            git commit -m "$COIN kraken book update $(date -u +%Y-%m-%dT%H:%M:%SZ)" -m "Run: ${{ github.run_id }}"
            git push -f origin "data/$COIN-kraken-book-tmp:data/$COIN-kraken-book"
            echo "[commit] pushed to data/$COIN-kraken-book"
          else
            echo "[commit] no book file to commit"
          fi

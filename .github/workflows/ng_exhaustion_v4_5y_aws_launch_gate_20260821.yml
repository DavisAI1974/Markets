name: NG Exhaustion V4 Five-Year AWS Launch Gate 20260821

on:
  push:
    branches:
      - chatgpt/ng-exhaustion-entry-timing-revival-20260818
    paths:
      - .github/workflows/ng_exhaustion_v4_5y_aws_launch_gate_20260821.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aws-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      INSTANCE_ID: i-08cee7171c0a76a04
      PINNED_SHA: 9e3e44f817738594a1815785e3d9f3e8e510a1c7
      RECEIPT_PATH: research/kalshi/NG_EXHAUSTION_V4_5Y_AWS_LAUNCH_GATE_20260821.json
      EC2_WORKDIR: /mnt/markets/ng_exhaustion_v4_5y_run_20260821/worktree
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ng-exhaustion-entry-timing-revival-20260818

      - name: Install AWS SDK
        run: python -m pip install --quiet boto3

      - name: Stage pinned V4 source and run source gate on durable EC2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, shlex, time, traceback
          from pathlib import Path
          import boto3

          region=os.environ['AWS_DEFAULT_REGION']
          instance_id=os.environ['INSTANCE_ID']
          pinned_sha=os.environ['PINNED_SHA']
          workdir=os.environ['EC2_WORKDIR']
          access_key=os.environ['AWS_ACCESS_KEY_ID']
          secret_key=os.environ['AWS_SECRET_ACCESS_KEY']
          out_path=Path('/tmp/ng_exhaustion_v4_5y_aws_launch_gate_20260821.json')
          files={
            'research/ng_exhaustion_mbo_5y_aws_source_20260820.py':'efb8ede9f7359e7c7ceeafa0e160b367ac48d89c',
            'research/ng_exhaustion_mbo_v4_full_state_replay_20260820.py':'2a2e248d04b25388db385309a5d459a72621514f',
            'research/ng_exhaustion_mbo_v4_state_adapter_20260820.py':'a125911193733016b77845708a956f26158c78a7',
          }
          receipt={'schema':'NG_EXHAUSTION_V4_5Y_AWS_LAUNCH_GATE_V5','instance_id':instance_id,'region':region,'pinned_sha':pinned_sha,'github_trigger_sha':os.environ.get('GITHUB_SHA'),'source_mode':'native_mbo_full_state','prefix_wide_enumeration_allowed':False,'empirical_census_launched':False,'pinned_blob_shas':files}
          try:
            commands=[
              'set -eu',
              'export AWS_ACCESS_KEY_ID='+shlex.quote(access_key),
              'export AWS_SECRET_ACCESS_KEY='+shlex.quote(secret_key),
              'export AWS_DEFAULT_REGION='+shlex.quote(region),
              'python3 -m pip install --quiet awscli',
              'command -v aws',
              'aws --version',
              "aws sts get-caller-identity --query Account --output text >/dev/null",
              f'rm -rf {workdir}',f'mkdir -p {workdir}/research'
            ]
            for rel,want in files.items():
              data=Path(rel).read_bytes()
              payload=base64.b64encode(data).decode()
              dest=f'{workdir}/{rel}'
              commands.append(f"echo '{payload}' | base64 -d > '{dest}'")
            commands += [
              f"cd '{workdir}'",
              "python3 - <<'PY2'\nfrom pathlib import Path\nimport hashlib\nexpected={\n'research/ng_exhaustion_mbo_5y_aws_source_20260820.py':'efb8ede9f7359e7c7ceeafa0e160b367ac48d89c',\n'research/ng_exhaustion_mbo_v4_full_state_replay_20260820.py':'2a2e248d04b25388db385309a5d459a72621514f',\n'research/ng_exhaustion_mbo_v4_state_adapter_20260820.py':'a125911193733016b77845708a956f26158c78a7',\n}\nfor p,want in expected.items():\n data=Path(p).read_bytes(); got=hashlib.sha1((f'blob {len(data)}\\0').encode()+data).hexdigest(); print(p,got); assert got==want,(p,got,want)\nprint('PINNED_V4_BLOBS_OK')\nPY2",
              f"mkdir -p '{workdir}/out'",
              f"python3 research/ng_exhaustion_mbo_5y_aws_source_20260820.py --inventory-only --receipt '{workdir}/out/SOURCE_RECEIPT.json' > '{workdir}/out/SOURCE_GATE_STDOUT.txt'",
              f"cat '{workdir}/out/SOURCE_RECEIPT.json'",
            ]
            ssm=boto3.client('ssm',region_name=region)
            sent=ssm.send_command(InstanceIds=[instance_id],DocumentName='AWS-RunShellScript',Comment=f'NG Exhaustion V4 five-year source gate staged from GitHub {pinned_sha}',Parameters={'commands':commands,'executionTimeout':['1200']},TimeoutSeconds=1200)
            command_id=sent['Command']['CommandId']; receipt['command_id']=command_id
            terminal={'Success','Cancelled','TimedOut','Failed','Cancelling','Undeliverable','Terminated','Delivery Timed Out','Execution Timed Out'}
            deadline=time.time()+1200; inv=None
            while time.time()<deadline:
              try: inv=ssm.get_command_invocation(CommandId=command_id,InstanceId=instance_id)
              except ssm.exceptions.InvocationDoesNotExist: time.sleep(2); continue
              if inv.get('Status') in terminal: break
              time.sleep(5)
            if inv is None or inv.get('Status') not in terminal: receipt['ssm_status']='CLIENT_WAIT_TIMEOUT'
            else:
              receipt['ssm_status']=inv.get('Status'); receipt['response_code']=inv.get('ResponseCode'); receipt['standard_output']=inv.get('StandardOutputContent',''); receipt['standard_error']=inv.get('StandardErrorContent','')
          except Exception as exc:
            receipt['ssm_status']='CONTROL_PLANE_ERROR'; receipt['control_plane_error']=f'{type(exc).__name__}: {exc}'; receipt['traceback_tail']=traceback.format_exc().splitlines()[-8:]
          out_path.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n'); print(out_path.read_text())
          PY

      - name: Commit launch-gate receipt safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch='chatgpt/ng-exhaustion-entry-timing-revival-20260818'
          path="$RECEIPT_PATH"
          for attempt in 1 2 3 4; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            cp /tmp/ng_exhaustion_v4_5y_aws_launch_gate_20260821.json "$path"
            git add "$path"
            if git diff --cached --quiet; then break; fi
            git commit -m 'research: record V4 five-year AWS launch gate'
            if git push origin HEAD:"$branch"; then break; fi
          done

      - name: Enforce source gate result
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ng_exhaustion_v4_5y_aws_launch_gate_20260821.json'))
          if d.get('ssm_status') != 'Success': raise SystemExit('V4 AWS source gate did not pass: '+str(d.get('ssm_status')))
          print('PASS: V4 AWS native-MBO source gate completed on durable EC2')
          PY

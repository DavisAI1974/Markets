name: Archive an existing Granite critic request
on:
  workflow_dispatch:
    inputs:
      request_sha256:
        required: true
        type: string
      cycle_index:
        required: true
        type: string
      instance:
        required: true
        type: string
      day:
        required: true
        type: string
      run_root:
        required: true
        type: string
      bucket:
        required: true
        type: string
      key_parameter:
        required: true
        type: string
  workflow_call:
    inputs:
      request_sha256:
        required: true
        type: string
      cycle_index:
        required: true
        type: string
      instance:
        required: true
        type: string
      day:
        required: true
        type: string
      run_root:
        required: true
        type: string
      bucket:
        required: true
        type: string
      key_parameter:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: false
    outputs:
      archive_commit:
        value: ${{ jobs.stage.outputs.archive_commit }}
      source_commit:
        value: ${{ github.sha }}
      request_sha256:
        value: ${{ inputs.request_sha256 }}
permissions:
  contents: read
concurrency:
  group: critic-request-archive-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Validate explicit archive bindings before credentials
        env:
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          CYCLE_INDEX: ${{ inputs.cycle_index }}
          INSTANCE: ${{ inputs.instance }}
          DAY: ${{ inputs.day }}
          RUN_ROOT: ${{ inputs.run_root }}
          BUCKET: ${{ inputs.bucket }}
          KEY_PARAMETER: ${{ inputs.key_parameter }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          python -I -S - <<'PY'
          import datetime, os, re
          e = os.environ
          valid = (
              re.fullmatch(r'[0-9a-f]{64}', e['REQUEST_SHA256']) is not None
              and re.fullmatch(r'[0-9]{2}', e['CYCLE_INDEX']) is not None
              and re.fullmatch(r'[0-9]{8}', e['DAY']) is not None
              and e['INSTANCE'] == 'i-0e90ee6110ef609aa'
              and e['BUCKET'] == 'frankie-granite42-568968024170-us-east-1'
              and re.fullmatch(r'/markets/frankie/request-transport/[A-Za-z0-9_-]{1,80}', e['KEY_PARAMETER']) is not None
              and re.fullmatch(r'[A-Za-z]:/[A-Za-z0-9_./ -]+', e['RUN_ROOT']) is not None
              and all(p not in ('', '.', '..') for p in e['RUN_ROOT'][3:].split('/'))
              and e['SOURCE_REF'].startswith('refs/heads/')
          )
          if not valid:
              raise SystemExit('explicit supported archive bindings required')
          try:
              datetime.datetime.strptime(e['DAY'], '%Y%m%d')
          except ValueError:
              raise SystemExit('valid trading day required') from None
          PY
  stage:
    needs: validate
    permissions:
      contents: write
    outputs:
      archive_commit: ${{ steps.publish.outputs.archive_commit }}
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97 cryptography==46.0.3
      - name: Sign one presigned PUT (masked, never printed)
        id: sign
        env:
          DAY: ${{ inputs.day }}
          CYCLE_INDEX: ${{ inputs.cycle_index }}
          BUCKET: ${{ inputs.bucket }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import boto3
          from botocore.config import Config
          s3 = boto3.client('s3', region_name='us-east-1', config=Config(signature_version='s3v4'))
          prefix = f"host-deliveries/{os.environ['DAY']}/critic-request/cycle-{os.environ['CYCLE_INDEX']}/{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          url = s3.generate_presigned_url('put_object', Params={'Bucket': os.environ['BUCKET'], 'Key': f'{prefix}/actual-critic-request.json'}, ExpiresIn=3600, HttpMethod='PUT')
          if "'" in url or '\n' in url:
              raise SystemExit('presigned URL carries a character ssm_run_ps1.py --set refuses')
          print('::add-mask::' + url)
          Path(os.environ['RUNNER_TEMP'], 'request.url').write_text(url)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'prefix={prefix}\n')
          print('staging prefix s3://' + os.environ['BUCKET'] + '/' + prefix)
          PY
      - name: Stage over SSM (read-only on the host, plus one receipt)
        env:
          INSTANCE: ${{ inputs.instance }}
          DAY: ${{ inputs.day }}
          RUN_ROOT: ${{ inputs.run_root }}
          CYCLE_INDEX: ${{ inputs.cycle_index }}
          EXPECTED_SHA256: ${{ inputs.request_sha256 }}
        run: |
          python deploy/aws/ssm_run_ps1.py \
            --instance "$INSTANCE" --region us-east-2 \
            --script deploy/aws/host/frankie_host_stage_critic_request.ps1 \
            --set "Day=$DAY" \
            --set "RunRoot=$RUN_ROOT" \
            --set "CycleIndex=$CYCLE_INDEX" \
            --set "ExpectedRequestSha256=$EXPECTED_SHA256" \
            --set "RequestUrl=$(cat "$RUNNER_TEMP/request.url")" \
            --timeout 600 --tail 0 --comment "stage the cycle $CYCLE_INDEX critic request for day $DAY" | tee "$RUNNER_TEMP/stage.log"
      - name: Verify, archive (encrypted exactly as the observer decrypts), round-trip, commit
        env:
          BUCKET: ${{ inputs.bucket }}
          PREFIX: ${{ steps.sign.outputs.prefix }}
          EXPECTED_SHA256: ${{ inputs.request_sha256 }}
          KEY_PARAMETER: ${{ inputs.key_parameter }}
          BRANCH: ${{ github.ref_name }}
          CYCLE_INDEX: ${{ inputs.cycle_index }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re, sys
          from pathlib import Path
          import boto3
          sys.path.insert(0, 'research/kalshi/frankie_boss')
          from git_request_archive import read_request_archive
          from git_request_archive_writer import write_request_archive
          expected = os.environ['EXPECTED_SHA256']
          if not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise SystemExit('request_sha256 must be 64 hex')
          log = Path(os.environ['RUNNER_TEMP'], 'stage.log').read_text()
          m = re.search(r'EXPORTED actual-critic-request\.json bytes=(\d+) sha256=([0-9a-f]{64})', log)
          if not m:
              raise SystemExit('the host printed no EXPORTED line')
          bytes_, printed = int(m.group(1)), m.group(2)
          if printed != expected:
              raise SystemExit(f'the host holds request {printed}, not the expected {expected}; nothing archived')
          body = boto3.client('s3', region_name='us-east-1').get_object(Bucket=os.environ['BUCKET'], Key=f"{os.environ['PREFIX']}/actual-critic-request.json")['Body'].read()
          if len(body) != bytes_ or hashlib.sha256(body).hexdigest() != expected:
              raise SystemExit('uploaded object differs from what the host printed')
          ssm = boto3.client('ssm', region_name='us-east-2')
          parameter = ssm.get_parameter(Name=os.environ['KEY_PARAMETER'], WithDecryption=True)['Parameter']
          if parameter['Type'] != 'SecureString':
              raise SystemExit('transport key parameter is not a SecureString')
          key = bytes.fromhex(parameter['Value'])
          if len(key) != 32:
              raise SystemExit('transport key is not 32 bytes')
          directory = Path('research/kalshi/frankie_boss/runs/request-archives') / expected
          directory.parent.mkdir(parents=True, exist_ok=True)
          receipt = write_request_archive(directory, body, expected, key=key, key_parameter=os.environ['KEY_PARAMETER'])
          back = read_request_archive(directory, expected, ssm)
          if back != body:
              raise SystemExit('round trip through read_request_archive differs')
          print(f'ARCHIVED runs/request-archives/{expected}/ bytes={bytes_} ciphertext_sha256={receipt["ciphertext_sha256"]} (round trip verified)')
          PY
      - name: Publish exact archive or reuse unchanged publication
        id: publish
        env:
          EXPECTED_SHA256: ${{ inputs.request_sha256 }}
          BRANCH: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          expected = os.environ['EXPECTED_SHA256']
          archive = 'research/kalshi/frankie_boss/runs/request-archives/' + expected
          intent = dict(schema='FRANKIE_ARCHIVE_PUBLICATION_INTENT_V1', request_sha256=expected,
                        source_commit=os.environ['SOURCE_COMMIT'], branch=os.environ['BRANCH'],
                        envelope_sha256=hashlib.sha256(Path(archive, 'envelope.json').read_bytes()).hexdigest())
          with Path(os.environ['RUNNER_TEMP'], 'archive-publication-intent.json').open('xb') as f:
              f.write(json.dumps(intent, sort_keys=True).encode() + b'\n')
              f.flush()
              os.fsync(f.fileno())
          git('fetch', '--no-tags', '--depth=1', 'origin', os.environ['BRANCH'])
          if git('rev-parse', 'FETCH_HEAD') != os.environ['SOURCE_COMMIT'] or git('rev-parse', 'HEAD') != os.environ['SOURCE_COMMIT']:
              raise SystemExit('source branch advanced; retained archive requires reviewed reconciliation')
          git('add', '--', archive)
          changed = git('diff', '--cached', '--name-only')
          if any(not p.startswith(archive + '/') for p in changed.splitlines()):
              raise SystemExit('unexpected staged path')
          if changed:
              git('config', 'user.name', 'github-actions[bot]')
              git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
              git('commit', '-m', 'archive(frankie): retain authenticated request ' + expected + '\n\nCo-Authored-By: Codex <noreply@openai.com>')
          commit = git('rev-parse', 'HEAD')
          if changed:
              subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + os.environ['BRANCH']], capture_output=True)
              remote = git('ls-remote', '--heads', 'origin', 'refs/heads/' + os.environ['BRANCH']).split()
              if not remote or remote[0] != commit:
                  raise SystemExit('publication not confirmed; encrypted archive and intent retained')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('archive_commit=' + commit + '\n')
          receipt = dict(schema='FRANKIE_ARCHIVE_PUBLICATION_V1', **{k: v for k,v in intent.items() if k != 'schema'},
                         archive_commit=commit, changed=bool(changed))
          with Path(os.environ['RUNNER_TEMP'], 'archive-publication.json').open('xb') as f:
              f.write(json.dumps(receipt, sort_keys=True).encode() + b'\n')
              f.flush()
              os.fsync(f.fileno())
          print('ARCHIVE_PUBLISHED ' + commit)
          PY
      - name: Retain encrypted archive and publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: critic-request-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/kalshi/frankie_boss/runs/request-archives/${{ inputs.request_sha256 }}/
            ${{ runner.temp }}/archive-publication*.json
          retention-days: 30
          if-no-files-found: warn

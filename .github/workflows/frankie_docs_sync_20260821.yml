is found semantic runtime-hook bindings intact; only two whole-file byte pins were stale. The P0 registry has now been hash-only rebound to cognitive runtime `1f33be3e86abb532035047a0456c8627b71dc220742ab5d89807bad312e53999` and standard group runner `b77a20ef634079fce592acc15e2f7ef3b1248b0ef3c5e2bab47be7a385b38d70`.\n- Do **not** yet call the combined V4 package provisionally ready. The committed readiness JSON is still pre-repair/stale until a fresh full exact-candidate rerun lands `PROVISIONAL_READY_FOR_EXACT_CANDIDATE`.\n- No release/virgin holdout consumed; no six P0 real receipts executed; no result-bearing V4 pilot launched; no model superiority/calibration/universal-D/trade-edge/D4-D5 population/permanent-Frankie claim; no promotion authority. Five-year archive jobs were not touched by this meta-loop/V4-preparation work. Preserve every chain/case and every negative, weak, sparse, losing, censored, inconclusive, or model-disagreement observation as evidence.\n'''
          docs=[
            'research/kalshi/FRANKIE_NEXT_CHAT_HANDOFF_20260820.md',
            'research/kalshi/FRANKIE_P0_GAP_CLOSURE_PROVISIONAL_20260820.md',

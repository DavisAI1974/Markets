name: Free NG Drivers (EIA + NOAA + NRC)

on:
  push:
    branches:
      - claude/kalshi-s79-kickoff-ij8t9o
      - chatgpt/daylight-load-shape
    paths:
      - research/kalshi/free_ng_data_collector.py
      - research/kalshi/nrc_reactor_collector.py
      - research/kalshi/daylight_load_shape.py
      - research/kalshi/enrich_free_ng_snapshot.py
      - research/kalshi/forecast_harness.py
      - .github/workflows/free_ng_collectors.yml
  pull_request:
    branches: [claude/kalshi-s79-kickoff-ij8t9o]
    paths:
      - research/kalshi/free_ng_data_collector.py
      - research/kalshi/nrc_reactor_collector.py
      - research/kalshi/daylight_load_shape.py
      - research/kalshi/enrich_free_ng_snapshot.py
      - research/kalshi/forecast_harness.py
      - .github/workflows/free_ng_collectors.yml
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: read

concurrency:
  group: free-ng-drivers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: pip install --quiet requests
      - name: Validate daylight/load-shape enrichment
        run: |
          python research/kalshi/daylight_load_shape.py --selftest
          python -m py_compile \
            research/kalshi/daylight_load_shape.py \
            research/kalshi/enrich_free_ng_snapshot.py \
            research/kalshi/forecast_harness.py
      - name: Collect free public NG drivers
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          NWS_USER_AGENT: DavisAI-Markets/1.0 (public-data research)
          NRC_USER_AGENT: DavisAI-Markets/1.0 (public-data research)
        run: |
          mkdir -p /tmp/free_ng
          python research/kalshi/free_ng_data_collector.py --out /tmp/free_ng/latest.json
          python research/kalshi/enrich_free_ng_snapshot.py --path /tmp/free_ng/latest.json
          python research/kalshi/nrc_reactor_collector.py --out /tmp/free_ng/nrc_latest.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/free_ng/latest.json'))
          n=json.load(open('/tmp/free_ng/nrc_latest.json'))
          print('status:',p.get('status'))
          print('sources:',sorted(p.get('sources',{})))
          print('errors:',p.get('errors'))
          eia=p.get('sources',{}).get('eia',{})
          nws=p.get('sources',{}).get('nws',{})
          shape=nws.get('load_shape',{})
          print('storage:',eia.get('storage',{}).get('latest'))
          print('weather:',nws.get('gas_weighted_next_24h'))
          print('alerts:',len(nws.get('alerts',[])))
          print('load_shape_phase:',shape.get('current_phase'))
          print('load_curve_regime:',shape.get('calendar_curve_regime'))
          print('sunrise_window:',shape.get('sunrise_native_load_window_utc'))
          print('evening_window:',shape.get('evening_net_load_ramp_window_utc'))
          print('nrc_report_date:',n.get('latest_report_date'))
          print('nrc_fleet:',n.get('latest'))
          print('nrc_changes:',n.get('day_over_day'))
          PY
      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-ng-drivers-${{ github.run_id }}
          path: /tmp/free_ng/
          retention-days: 90

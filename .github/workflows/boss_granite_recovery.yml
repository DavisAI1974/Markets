name: BOSS Granite historical read-only recovery

on:
  push:
    branches: [codex/boss-full-evidence-20260907]
    paths: [.github/workflows/boss_granite_recovery.yml]

permissions:
  contents: read

concurrency:
  group: boss-granite-read-only-recovery
  cancel-in-progress: false

jobs:
  recover-existing-evidence:
    if: github.ref == 'refs/heads/codex/boss-full-evidence-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install read-only SDK and fake test dependencies
        run: python -m pip install boto3==1.42.23 pytest==8.3.5
      - name: Test scoped recovery without credentials
        env:
          PYTHONPATH: ${{ github.workspace }}/research/kalshi/frankie_boss
        run: |
          mkdir -p work/recovery-tests
          cp research/kalshi/frankie_boss/tests/test_granite_recovery.py work/recovery-tests/
          python -m pytest work/recovery-tests/ -q
      - name: Collect existing event history and current inventory only
        timeout-minutes: 6
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: us-east-1
        run: python research/kalshi/frankie_boss/granite_recovery.py --directory work/granite-recovery
      - name: Retain sanitized events and explicit permission gaps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: granite-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/granite-recovery/
          retention-days: 30
          if-no-files-found: warn

name: Frankie A-memory Real-Time native raw-MBO launch 20260828

on:
  push:
    branches:
      - chatgpt/frankie-raw-mbo-benchmark-20260828
    paths:
      - '.github/workflows/frankie_a_memory_rt_native_launch_20260828.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          canary = a bounded slice of the real roster on the runner (prelaunch section 0
          item 9). full = the whole roster on the box over SSM, which is a spend and needs
          Greg. The default is canary on purpose: a push can never reach full.
        type: choice
        default: canary
        options:
          - canary
          - full
      canary_records:
        description: >-
          Native MBO records the canary traverses. The default is deliberately small. D60
          retains every legacy row, member row and lifecycle row IN MEMORY, and no one has
          measured what sixteen fed sections cost per record - so the first slice is sized
          to find that out cheaply rather than to be impressive. Raise it once there is a
          measured curve.
        type: string
        default: '50000'

permissions:
  contents: read

concurrency:
  group: frankie-a-memory-rt-native-20260828
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: us-east-2
  AWS_REGION: us-east-2
  S3_ENDPOINT_URL: https://s3.us-east-2.amazonaws.com
  BUCKET: bento-568968024170-us-east-2-an
  LAUNCH_BRANCH: chatgpt/frankie-raw-mbo-benchmark-20260828
  REQUIRED_STARTING_TIP: 82e140598b03bb38a7761c19d0ac47017c3908d0
  SOURCE_PREFIX: nymex/ng_mbo_5y_v0/native/20211001_20211101
  ARM_ID: A_MEMORY
  CANARY_RECORDS: ${{ github.event_name == 'workflow_dispatch' && inputs.canary_records || '50000' }}
  PRIOR_RUN_ID: workmode-32851909748-1
  PRIOR_MEMORY_DIR: research/kalshi/frankie_raw_mbo_benchmark/prior_memory/workmode-32851909748-1
  EXPECTED_PRIOR_MEMBER_MANIFEST_SHA256: b487acfbbea8ac8a82f42ceb555e8334057e4004740af91b9127cd2ba71e1cf8

jobs:
  launch-a-memory-real-time:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - name: Checkout exact launch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact branch and required starting base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/$LAUNCH_BRANCH"
          git merge-base --is-ancestor "$REQUIRED_STARTING_TIP" "$GITHUB_SHA"
          test -s research/kalshi/frankie_raw_mbo_benchmark/chat_packet_seam.py
          test -s research/kalshi/frankie_raw_mbo_benchmark/raw_mbo_source_manifest.py
          test -s research/kalshi/frankie_raw_mbo_benchmark/mbo_resume_state.py
          test -s research/kalshi/frankie_raw_mbo_benchmark/benchmark_checkpoint.py
          test -s research/kalshi/frankie_raw_mbo_benchmark/native_evidence_bundle.py
          test -s research/ng_exhaustion_mbo_v4_full_state_replay_20260820.py
          test -s research/ng_exhaustion_mbo_v4_state_adapter_20260820.py

      - name: Verify and hash-bind frozen prior learned-output package
        shell: bash
        run: |
          set -euo pipefail
          memory_dir="$PRIOR_MEMORY_DIR"
          test -d "$memory_dir"
          test "$(git rev-parse HEAD:$memory_dir/FORECASTER_OUTPUT.json)" != ""

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PRIOR_MEMORY_DIR"])
          required = [
              "RT_OUTPUT.json", "RT_CONTEXT_MANIFEST.json", "RT_AGENT_RECEIPT.json",
              "RT_FIRST_LOCK.json", "RT_FROZEN_STATE.json", "ONEWAY_HANDOFF.json",
              "RT_FREEZE_COMPLETE.json", "RT_FREEZE_EXTERNAL_ANCHOR.json",
              "FORECASTER_OUTPUT.json", "FORECASTER_CONTEXT_MANIFEST.json",
              "FORECASTER_AGENT_RECEIPT.json", "FORECASTER_FIRST_LOCK.json",
              "EXECUTION_USAGE.json", "ARTIFACT_MANIFEST.json", "COMPLETE.json",
          ]

          def read(name):
              return json.loads((root / name).read_text(encoding="utf-8"))

          def file_hash(name):
              return hashlib.sha256((root / name).read_bytes()).hexdigest()

          def json_hash(value):
              body = json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
                  allow_nan=False,
              ).encode("utf-8")
              return hashlib.sha256(body).hexdigest()

          def receipt(name):
              value = read(name)
              assert value.get("receipt_hash") == json_hash(
                  {key: item for key, item in value.items() if key != "receipt_hash"}
              ), name
              return value

          present = sorted(path.name for path in root.glob("*.json"))
          assert present == sorted(required + ["REPOSITORY_FREEZE.json"]), present

          proof = read("REPOSITORY_FREEZE.json")
          assert proof.get("source_run_id") == os.environ["PRIOR_RUN_ID"]
          assert proof.get("source_surface_label") == "PRIOR_REDUCED_NON_FULL_MBO_SURFACE"
          assert proof.get("proof_chain_verification") == "PASS"
          assert proof.get("required_artifact_count") == len(required)
          assert proof.get("model_outputs_changed") is False
          assert proof.get("rt_output_semantically_equal_to_original_agent_output") is True
          assert proof.get("forecaster_output_byte_identical_to_original_agent_output") is True
          assert proof.get("step1_or_post_reveal_content_included") is False
          assert proof.get("current_raw_mbo_arm_output_included") is False
          assert proof.get("old_reduced_market_rows_included") is False

          proof_rows = {row["name"]: row for row in proof["artifacts"]}
          assert set(proof_rows) == set(required)
          for name in required:
              path = root / name
              assert proof_rows[name]["bytes"] == path.stat().st_size, name
              assert proof_rows[name]["sha256"] == file_hash(name), name

          rt_output = read("RT_OUTPUT.json")
          forecaster_output = read("FORECASTER_OUTPUT.json")
          rt_context = receipt("RT_CONTEXT_MANIFEST.json")
          forecaster_context = receipt("FORECASTER_CONTEXT_MANIFEST.json")
          rt_agent = receipt("RT_AGENT_RECEIPT.json")
          forecaster_agent = receipt("FORECASTER_AGENT_RECEIPT.json")
          rt_lock = receipt("RT_FIRST_LOCK.json")
          frozen = read("RT_FROZEN_STATE.json")
          handoff = receipt("ONEWAY_HANDOFF.json")
          freeze = receipt("RT_FREEZE_COMPLETE.json")
          anchor = receipt("RT_FREEZE_EXTERNAL_ANCHOR.json")
          forecaster_lock = receipt("FORECASTER_FIRST_LOCK.json")
          usage = receipt("EXECUTION_USAGE.json")
          manifest = receipt("ARTIFACT_MANIFEST.json")
          complete = receipt("COMPLETE.json")

          assert rt_context.get("answer_wall") == "SEALED"
          assert forecaster_context.get("answer_wall") == "SEALED"
          assert rt_agent.get("output_sha256") == file_hash("RT_OUTPUT.json")
          assert forecaster_agent.get("output_sha256") == file_hash("FORECASTER_OUTPUT.json")
          assert rt_agent.get("accepted_output_hash") == json_hash(rt_output)
          assert forecaster_agent.get("accepted_output_hash") == json_hash(forecaster_output)
          assert rt_lock.get("rt_output_hash") == json_hash(rt_output)
          assert frozen.get("rt_output_hash") == json_hash(rt_output)
          assert frozen.get("full_validated_rt_output") == rt_output
          assert handoff.get("full_validated_rt_output_hash") == json_hash(rt_output)
          assert handoff.get("rt_frozen_before_forecaster") is True
          assert handoff.get("forecaster_may_modify_rt_state") is False
          assert forecaster_lock.get("forecaster_output_hash") == json_hash(forecaster_output)

          frozen_hash = frozen.get("frozen_rt_state_hash")
          assert frozen_hash
          assert handoff.get("frozen_rt_state_hash") == frozen_hash
          assert anchor.get("frozen_rt_state_hash") == frozen_hash
          assert forecaster_lock.get("frozen_rt_state_hash") == frozen_hash
          assert complete.get("frozen_rt_state_hash") == frozen_hash
          assert complete.get("manifest_receipt_hash") == manifest.get("receipt_hash")
          assert complete.get("status") == "COMPLETE"
          assert complete.get("published_last") is True
          assert complete.get("answer_key_or_step1_results_exposed") is False
          assert complete.get("principal_role_call_order") == [
              "REAL_TIME_FRANKIE", "FORECASTER_FRANKIE"
          ]
          assert complete.get("external_provider_api_called") is False
          assert complete.get("receipt_hash") == proof.get("complete_receipt_hash")
          assert file_hash("FORECASTER_OUTPUT.json") == (
              "32131d948790faa56ed130f901bad71b10075919a2e23a78d1ff2c3939de25af"
          )
          assert file_hash("FORECASTER_OUTPUT.json") == proof.get(
              "forecaster_output_scoring_receipt_sha256"
          )

          manifest_rows = {row["path"]: row for row in manifest["artifacts"]}
          for name in required:
              if name in manifest_rows:
                  assert manifest_rows[name]["bytes"] == (root / name).stat().st_size, name
                  assert manifest_rows[name]["sha256"] == file_hash(name), name

          recovery = {
              "schema": "FRANKIE_PRIOR_MEMORY_REPOSITORY_VERIFICATION_V1",
              "source_run_id": proof["source_run_id"],
              "source_surface_label": proof["source_surface_label"],
              "source_launch_commit": proof["source_launch_commit"],
              "recovery_proof_sha256": file_hash("REPOSITORY_FREEZE.json"),
              "required_artifact_count": len(required),
              "rt_output_sha256": file_hash("RT_OUTPUT.json"),
              "forecaster_output_sha256": file_hash("FORECASTER_OUTPUT.json"),
              "complete_receipt_hash": complete["receipt_hash"],
              "proof_chain_verification": "PASS",
              "step1_or_post_reveal_content": False,
              "current_raw_mbo_arm_output_content": False,
              "old_reduced_market_rows_in_package": False,
          }
          recovery["receipt_hash"] = json_hash(recovery)
          output = Path(os.environ["RUNNER_TEMP"]) / "prior-memory-repository-verification.json"
          output.write_text(json.dumps(recovery, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          source_launch_commit="$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["PRIOR_MEMORY_DIR"],"REPOSITORY_FREEZE.json")))["source_launch_commit"])')"
          git merge-base --is-ancestor "$source_launch_commit" "$REQUIRED_STARTING_TIP"

          stage="$RUNNER_TEMP/a-memory-prior-learned-stage"
          package_dir="$RUNNER_TEMP/a-memory-prior-learned"
          install -d -m 0700 "$stage" "$package_dir"
          for name in \
            RT_OUTPUT.json RT_CONTEXT_MANIFEST.json RT_AGENT_RECEIPT.json \
            RT_FIRST_LOCK.json RT_FROZEN_STATE.json ONEWAY_HANDOFF.json \
            RT_FREEZE_COMPLETE.json RT_FREEZE_EXTERNAL_ANCHOR.json \
            FORECASTER_OUTPUT.json FORECASTER_CONTEXT_MANIFEST.json \
            FORECASTER_AGENT_RECEIPT.json FORECASTER_FIRST_LOCK.json \
            EXECUTION_USAGE.json ARTIFACT_MANIFEST.json COMPLETE.json; do
            cp "$memory_dir/$name" "$stage/$name"
          done

          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf - -C "$stage" . | gzip -n > "$package_dir/prior-learned-package.tgz"
          package_sha="$(sha256sum "$package_dir/prior-learned-package.tgz" | awk '{print $1}')"
          test "$package_sha" = "$EXPECTED_PRIOR_MEMBER_MANIFEST_SHA256"

          python - "$stage" "$package_sha" "$package_dir/prior-learned-package-receipt.json" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          package_sha = sys.argv[2]
          output = Path(sys.argv[3])
          proof_path = Path(os.environ["PRIOR_MEMORY_DIR"]) / "REPOSITORY_FREEZE.json"
          files = [
              {
                  "name": path.name,
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
              for path in sorted(root.iterdir())
          ]
          value = {
              "schema": "FRANKIE_PREEXISTING_UNREVEALED_OCT45_MEMORY_PROOF_V2",
              "prior_run_id": os.environ["PRIOR_RUN_ID"],
              "source_surface_label": "PRIOR_REDUCED_NON_FULL_MBO_SURFACE",
              "package_sha256": package_sha,
              "repository_recovery_proof_sha256": hashlib.sha256(proof_path.read_bytes()).hexdigest(),
              "pre_existing_before_current_benchmark": True,
              "proof_chain_verification": "PASS",
              "step1_or_post_reveal_content": False,
              "current_benchmark_arm_output_content": False,
              "old_reduced_rows_in_package": False,
              "files": files,
          }
          body = json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode()
          value["receipt_hash"] = hashlib.sha256(body).hexdigest()
          output.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          cp "$RUNNER_TEMP/prior-memory-repository-verification.json" "$package_dir/"
          echo "PRIOR_PACKAGE_DIR=$package_dir" >> "$GITHUB_ENV"
          echo "PRIOR_PACKAGE_SHA256=$package_sha" >> "$GITHUB_ENV"

      - name: Install native DBN reader
        run: python -m pip install --quiet databento==0.81.0

      - name: Fetch and hash-bind exact native DBN roster
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/a-memory-native-sources"
          packet_dir="$RUNNER_TEMP/a-memory-rt-packet"
          install -d -m 0700 \
            "$source_dir" "$packet_dir/sources" "$packet_dir/checkpoints" "$packet_dir/memory"

          while read -r name expected_bytes expected_sha; do
            source_uri="s3://${BUCKET}/${SOURCE_PREFIX}/${name}"
            target="$source_dir/$name"
            aws s3 cp "$source_uri" "$target" \
              --endpoint-url "$S3_ENDPOINT_URL" --only-show-errors
            test "$(stat -c %s "$target")" = "$expected_bytes"
            test "$(sha256sum "$target" | awk '{print $1}')" = "$expected_sha"
            cp --reflink=auto "$target" "$packet_dir/sources/$name"
          done <<'ROSTER'
          glbx-mdp3-20211001.mbo.dbn.zst 25628861 e6b4ec01bd9b34d57cb22c770b5d49c756e7f41a658f081823d923004a0121b2
          glbx-mdp3-20211003.mbo.dbn.zst 973355 4380bd9ba83a5badc4839e12785aa464817b87e3fac11176b951e7b474446d88
          glbx-mdp3-20211004.mbo.dbn.zst 34300424 8ed47cc0a68cf40cae9fde45e158142978076e60d3f9fc7cf940196babfddc0a
          glbx-mdp3-20211005.mbo.dbn.zst 36192430 a4a12f9578da762412884e7f559a123361eaa3a153bec0db59dfb3ba6224a874
          ROSTER

          python -m research.kalshi.frankie_raw_mbo_benchmark.raw_mbo_source_manifest \
            --output "$packet_dir/source_manifest.json" \
            "$source_dir/glbx-mdp3-20211001.mbo.dbn.zst" \
            "$source_dir/glbx-mdp3-20211003.mbo.dbn.zst" \
            "$source_dir/glbx-mdp3-20211004.mbo.dbn.zst" \
            "$source_dir/glbx-mdp3-20211005.mbo.dbn.zst"

          test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_identity_hash"])' "$packet_dir/source_manifest.json")" = \
            4d02dae63163a43fe0dc093ad0bda9a6d055a455cbc946a59d5b9008dad190ac
          cp "$PRIOR_PACKAGE_DIR/prior-learned-package.tgz" "$packet_dir/memory/"
          cp "$PRIOR_PACKAGE_DIR/prior-learned-package-receipt.json" "$packet_dir/memory/"
          cp "$PRIOR_PACKAGE_DIR/prior-memory-repository-verification.json" "$packet_dir/memory/"

          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
          echo "PACKET_DIR=$packet_dir" >> "$GITHUB_ENV"

      - name: Seal A-memory RT packet and pre-call checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from research.kalshi.frankie_raw_mbo_benchmark.benchmark_checkpoint import (
              build_checkpoint,
              write_checkpoint_atomic,
          )
          from research.kalshi.frankie_raw_mbo_benchmark.chat_packet_seam import (
              build_chat_packet_contract,
          )
          from research.kalshi.frankie_raw_mbo_benchmark.mbo_resume_state import (
              export_adapter_state,
          )
          from research.ng_exhaustion_mbo_v4_state_adapter_20260820 import V4MboAdapter

          packet_dir = Path(os.environ["PACKET_DIR"])
          manifest = json.loads((packet_dir / "source_manifest.json").read_text(encoding="utf-8"))
          memory_proof = json.loads(
              (packet_dir / "memory" / "prior-learned-package-receipt.json").read_text(
                  encoding="utf-8"
              )
          )
          memory_package = {
              "schema": "FRANKIE_PREEXISTING_UNREVEALED_OCT45_MEMORY_V1",
              "source_surface_label": memory_proof["source_surface_label"],
              "package_sha256": memory_proof["package_sha256"],
              "pre_existing_before_current_benchmark": memory_proof[
                  "pre_existing_before_current_benchmark"
              ],
              "step1_or_post_reveal_content": memory_proof[
                  "step1_or_post_reveal_content"
              ],
              "current_benchmark_arm_output_content": memory_proof[
                  "current_benchmark_arm_output_content"
              ],
          }
          contract = build_chat_packet_contract(
              arm="A-memory",
              source_manifest=manifest,
              memory_package=memory_package,
          )
          (packet_dir / "chat_packet_contract.json").write_text(
              json.dumps(contract, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          run_id = f"frankie-a-memory-rt-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          empty_state = export_adapter_state(V4MboAdapter())
          state_path = packet_dir / "checkpoints" / "adapter-state-000000.json"
          state_path.write_text(json.dumps(empty_state, sort_keys=True) + "\n", encoding="utf-8")
          checkpoint = build_checkpoint(
              run_id=run_id,
              controller="A_CHATGPT",
              memory_mode="MEMORY_ASSISTED",
              sequence=0,
              source_manifest_hash=manifest["manifest_hash"],
              completed_mbo_records=0,
              total_mbo_records=manifest["total_mbo_records"],
              event_group_open=False,
              adapter_state_hash=empty_state["state_hash"],
              controller_state_hash=contract["contract_hash"],
              previous_checkpoint_hash=None,
              phase="PRE_CALL_RT_NATIVE",
              locked=False,
          )
          checkpoint_path = packet_dir / "checkpoints" / "checkpoint-000000.json"
          write_checkpoint_atomic(checkpoint_path, checkpoint)

          packet_id = "amemory-rtpkt-" + contract["contract_hash"][:20]
          receipt = {
              "schema": "FRANKIE_A_MEMORY_RT_NATIVE_LAUNCH_V1",
              "run_id": run_id,
              "lane": "REAL_TIME_FRANKIE",
              "arm": "A-memory",
              "memory_mode": "MEMORY_ASSISTED",
              "packet_id": packet_id,
              "checkpoint_id": checkpoint["checkpoint_hash"],
              "source_manifest_hash": manifest["manifest_hash"],
              "prior_memory_package_sha256": memory_proof["package_sha256"],
              "prior_memory_proof_receipt_hash": memory_proof["receipt_hash"],
              "required_starting_tip": os.environ["REQUIRED_STARTING_TIP"],
              "launch_commit": os.environ["GITHUB_SHA"],
              "completed_native_mbo_records": 0,
              "total_native_mbo_records": manifest["total_mbo_records"],
              "progress_percent": 0.0,
              "rt_lane_status": "RUNNING_PRE_CALL",
              "forecaster_lane_started": False,
              "first_lock_frozen": False,
              "prior_frankie_memory_present": True,
              "native_raw_mbo_only": True,
              "causal_clock": "ts_recv_ns",
              "full_depth_fifo_required": True,
              "receipt_hash": "",
          }
          body = json.dumps(
              {key: value for key, value in receipt.items() if key != "receipt_hash"},
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=True,
              allow_nan=False,
          ).encode("utf-8")
          receipt["receipt_hash"] = hashlib.sha256(body).hexdigest()
          (packet_dir / "launch_receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          for key, value in receipt.items():
              if key in {"run_id", "packet_id", "checkpoint_id", "source_manifest_hash"}:
                  with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
                      handle.write(f"{key.upper()}={value}\n")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"TOTAL_NATIVE_MBO_RECORDS={manifest['total_mbo_records']}\n")
          PY

          find "$PACKET_DIR" -type f ! -name FILE_SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > "$PACKET_DIR/FILE_SHA256SUMS"


      - name: Run bounded canary traversal (real roster, on the runner)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'canary' }}
        shell: bash
        run: |
          set -euo pipefail
          # Prelaunch section 0 item 9: a dry run over a small slice, with the calculation
          # contract's eight section 6 gates passing, BEFORE anything touches the full
          # roster. This is that run. It reads the real hash-bound DBN objects fetched
          # above, bounded to CANARY_RECORDS native records, on the runner - no box, no
          # SSM, no spend beyond runner minutes.
          #
          # The launcher exits non-zero on any verdict but ACCEPTED, so this step cannot go
          # green over a refused calculation.
          out_dir="$PACKET_DIR/canary"
          install -d -m 0700 "$out_dir"
          python -m research.kalshi.frankie_raw_mbo_benchmark.native_a_arm_launch \
            --arm A_MEMORY \
            --run-id "${RUN_ID}-canary" \
            --code-commit "$GITHUB_SHA" \
            --source-manifest "$PACKET_DIR/source_manifest.json" \
            --out-dir "$out_dir" \
            --limit-records "$CANARY_RECORDS" \
            --checkpoint-every-records 20000 \
            --cadence-groups 5000 \
            --source "$SOURCE_DIR/glbx-mdp3-20211001.mbo.dbn.zst" \
            --source "$SOURCE_DIR/glbx-mdp3-20211003.mbo.dbn.zst" \
            --source "$SOURCE_DIR/glbx-mdp3-20211004.mbo.dbn.zst" \
            --source "$SOURCE_DIR/glbx-mdp3-20211005.mbo.dbn.zst"
          echo "CANARY_OUT_DIR=$out_dir" >> "$GITHUB_ENV"

      - name: Dispatch full-roster traversal to the box
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' }}
        shell: bash
        env:
          INSTANCE_ID: i-08cee7171c0a76a04
          DURABLE_PREFIX_FULL: >-
            nymex/ng_mbo_5y_v0/frankie/raw_mbo_benchmark/a-memory/full/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # THE FULL ROSTER RUNS ON THE BOX, NOT ON THE RUNNER. D55/D56: 4.26M groups over
          # sixteen sections against a member-first run that covered five and nearly
          # exhausted 61.8 GiB. ubuntu-latest is smaller again, and a GitHub job is hard
          # capped at 360 minutes whatever the timeout says.
          #
          # This mode is reachable ONLY by an explicit workflow_dispatch with mode=full. A
          # push never reaches it, and the default input is canary, because starting the
          # box is a spend and D58 leaves the sizing decision with Greg.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          sha = os.environ["GITHUB_SHA"]
          run_id = os.environ["RUN_ID"]
          arm = os.environ["A_MEMORY"]
          prefix = os.environ["DURABLE_PREFIX_FULL"]
          bucket = os.environ["BUCKET"]
          command = "; ".join(
              [
                  "set -eu",
                  "cd /opt/frankie-a-arm",
                  f"git fetch --depth 1 origin {sha}",
                  f"git checkout --detach {sha}",
                  f'test "$(git rev-parse HEAD)" = "{sha}"',
                  "install -d -m 0700 /opt/frankie-a-arm-run",
                  (
                      "python3 -m research.kalshi.frankie_raw_mbo_benchmark.native_a_arm_launch"
                      f" --arm {arm}"
                      f" --run-id {run_id}"
                      f" --code-commit {sha}"
                      " --source-manifest /opt/frankie-a-arm-run/source_manifest.json"
                      " --out-dir /opt/frankie-a-arm-run"
                      " $(printf ' --source /opt/frankie-a-arm-run/sources/%s'"
                      " glbx-mdp3-20211001.mbo.dbn.zst glbx-mdp3-20211003.mbo.dbn.zst"
                      " glbx-mdp3-20211004.mbo.dbn.zst glbx-mdp3-20211005.mbo.dbn.zst)"
                  ),
                  (
                      "aws s3 cp /opt/frankie-a-arm-run"
                      f" s3://{bucket}/{prefix} --recursive --only-show-errors"
                  ),
                  f"echo A_ARM_TRAVERSAL_COMPLETE={run_id}",
              ]
          )
          Path("/tmp/a-arm-traversal-params.json").write_text(
              json.dumps({"commands": [command]}), encoding="utf-8"
          )
          PY
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "A-arm full-roster native traversal" \
            --parameters file:///tmp/a-arm-traversal-params.json \
            --timeout-seconds 3600 \
            --query 'Command.CommandId' \
            --output text)"
          echo "SSM_COMMAND_ID=$command_id" >> "$GITHUB_ENV"
          status=Pending
          for _ in $(seq 1 2400); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|TimedOut|Cancelled) break ;;
            esac
            sleep 5
          done
          result="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json)"
          printf '%s\n' "$result"
          test "$status" = Success
          grep -F "A_ARM_TRAVERSAL_COMPLETE=${RUN_ID}" <<<"$result"

      - name: Persist exact keyless A-memory RT packet
        shell: bash
        run: |
          set -euo pipefail
          durable_prefix="nymex/ng_mbo_5y_v0/frankie/raw_mbo_benchmark/a-memory/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws s3 cp "$PACKET_DIR" "s3://${BUCKET}/${durable_prefix}" --recursive \
            --endpoint-url "$S3_ENDPOINT_URL" --only-show-errors
          echo "DURABLE_PREFIX=$durable_prefix" >> "$GITHUB_ENV"

      - name: Publish private A-memory RT work packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frankie-a-memory-rt-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a-memory-rt-packet
          if-no-files-found: error
          retention-days: 7

      - name: Report canary verdict from its own artifact
        if: ${{ env.CANARY_OUT_DIR != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # Its OWN step, because a heredoc nested inside the summary block put `PY` at a
          # non-zero column and bash never saw the terminator - the exact D57 defect, caught
          # here by `bash -n` before it could produce a jobless startup-failure run.
          python3 - <<'PY'
          import json
          import os

          body = json.loads(
              (open(os.environ["CANARY_OUT_DIR"] + "/calculation_result.json")).read()
          )
          traversal = body["traversal"]
          lines = [
              "### A-memory canary traversal",
              f"- Verdict: {body['verdict']} (failed gates: {body['failed_gates'] or 'none'})",
              f"- Completion: {body.get('completion_status')}",
              f"- Groups / records: {traversal['groups_seen']} / {traversal['records_seen']}",
              f"- Save points: {traversal['save_points']}",
              f"- Sections fed: {json.dumps(traversal['sections_fed'], sort_keys=True)}",
              f"- Slice: {json.dumps(body['slice'], sort_keys=True)}",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Report concrete A-memory RT launch
        shell: bash
        run: |
          {
            echo '### A-memory Real-Time Frankie native raw-MBO lane'
            echo "- Run: ${RUN_ID}"
            echo "- Packet: ${PACKET_ID}"
            echo "- Checkpoint: ${CHECKPOINT_ID}"
            echo "- Source manifest: ${SOURCE_MANIFEST_HASH}"
            echo "- Prior learned package: ${PRIOR_PACKAGE_SHA256}"
            echo "- Native MBO progress: 0 / ${TOTAL_NATIVE_MBO_RECORDS} (0.0%)"
            echo "- Durable prefix: s3://${BUCKET}/${DURABLE_PREFIX}"
            echo '- Status: RUNNING_PRE_CALL; Forecaster not started'
          } >> "$GITHUB_STEP_SUMMARY"

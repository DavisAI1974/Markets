name: Frankie host diagnostic (read-only)
# Reads day-cycles.log, the sealed host configuration, the cycle-00 execution trigger and the host
# role's ability to read the Pod SSM parameter on the native host. Starts, stops, writes and
# re-dispatches nothing. The parameter value is never printed. Dispatch only.
on:
  workflow_dispatch:
    inputs:
      instance:
        description: 'Native host instance id'
        required: false
        default: 'i-0e90ee6110ef609aa'
permissions:
  contents: read
jobs:
  diag:
    if: github.repository == 'DavisAI1974/Markets'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir boto3==1.42.23 botocore==1.42.97
      - name: Native host state (read-only)
        env:
          INSTANCE: ${{ inputs.instance }}
        run: |
          python - <<'PY'
          import boto3, os
          iid = os.environ['INSTANCE']
          r = boto3.client('ec2', region_name='us-east-2').describe_instances(InstanceIds=[iid])
          print('EC2 state:', [i['State']['Name'] for res in r['Reservations'] for i in res['Instances']])
          s = boto3.client('ssm', region_name='us-east-2').describe_instance_information(Filters=[{'Key':'InstanceIds','Values':[iid]}])
          print('SSM ping:', [(i['PingStatus'], i.get('PlatformName','')) for i in s.get('InstanceInformationList',[])] or 'not registered')
          PY
      - name: Read-only host diagnostic over SSM
        run: python deploy/aws/ssm_run_ps1.py --instance "${{ inputs.instance }}" --region us-east-2 --script deploy/aws/host/frankie_host_diag.ps1 --timeout 300 --comment "read-only diagnostic run 35498663360"

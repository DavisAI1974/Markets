name: Adaptive locality isolated tests
on:
  push:
    branches:
      - feat/adaptive-locality-engine-20261108
  pull_request:
    paths:
      - 'adaptive_locality/**'
      - 'tests/test_adaptive_locality*.py'
      - '.github/workflows/adaptive-locality.yml'
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m compileall -q adaptive_locality tests/test_adaptive_locality.py
      - name: Isolated unit tests
        run: python -m unittest discover -s tests -p test_adaptive_locality*.py -v

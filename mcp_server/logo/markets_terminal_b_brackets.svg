<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Markets Terminal">
  <title>Markets Terminal - bracketed read</title>
  <defs>
    <linearGradient id="b_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1A2B"/>
      <stop offset="1" stop-color="#060A11"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#b_bg)"/>

  <!-- Brackets: the terminal half of the name, and the read-only half at once. The curve is
       held INSIDE a frame it cannot write past. -->
  <path d="M150 118 L96 118 L96 394 L150 394"
        fill="none" stroke="#42C2C6" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M362 118 L416 118 L416 394 L362 394"
        fill="none" stroke="#42C2C6" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- week one -->
  <path d="M150 322 L196 292 L242 304 L286 244"
        fill="none" stroke="#F2F5F9" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- THE GAP -->
  <!-- week two -->
  <path d="M330 262 L362 190"
        fill="none" stroke="#F2F5F9" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the cursor: a terminal waiting for the next print -->
  <rect x="348" y="150" width="28" height="28" rx="6" fill="#F2B441"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Markets Terminal">
  <title>Markets Terminal - the gap</title>
  <defs>
    <linearGradient id="c_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B4A6B"/>
      <stop offset="1" stop-color="#0A1B2A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#c_bg)"/>

  <!-- Reduced to the one thing that is ours: a curve with the untraded hours left OUT of it.
       Two strokes and a hole. Survives being 16 pixels wide, which the other two do not. -->
  <path d="M112 350 L232 214"
        fill="none" stroke="#FFFFFF" stroke-width="42" stroke-linecap="round"/>
  <path d="M300 286 L400 152"
        fill="none" stroke="#FFFFFF" stroke-width="42" stroke-linecap="round"/>

  <circle cx="400" cy="152" r="27" fill="#F2B441"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Markets Terminal">
  <title>Markets Terminal - forward curve</title>
  <defs>
    <linearGradient id="a_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132033"/>
      <stop offset="1" stop-color="#080D16"/>
    </linearGradient>
    <linearGradient id="a_curve" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"   stop-color="#3E7FB8"/>
      <stop offset="0.55" stop-color="#42C2C6"/>
      <stop offset="1"   stop-color="#F2B441"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#a_bg)"/>

  <!-- the anchor line: every curve in this system accumulates from a declared anchor -->
  <line x1="88" y1="344" x2="424" y2="344" stroke="#2A3A4F" stroke-width="4" stroke-linecap="round"/>

  <!-- week one: rise, shallow give-back, rise -->
  <path d="M104 336 L152 300 L200 314 L248 252 L288 228"
        fill="none" stroke="url(#a_curve)" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- THE GAP. The weekend is not traded, so no line is drawn through it. -->

  <!-- week two -->
  <path d="M336 258 L384 186 L416 136"
        fill="none" stroke="url(#a_curve)" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the anchor, hollow: a level we start from, not a level we called -->
  <circle cx="104" cy="336" r="17" fill="#080D16" stroke="#3E7FB8" stroke-width="10"/>
  <!-- the print -->
  <circle cx="416" cy="136" r="19" fill="#F2B441"/>
</svg>
